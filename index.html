<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="description" content="警備員指導教育責任者講習（1号・2号）の修了考査に備える5肢択一の問題集。模擬試験つき。"><meta property="og:title" content="指導教育責任者 修了考査ドリル"><meta property="og:description" content="警備員指導教育責任者講習（1号・2号）の修了考査に備える5肢択一の問題集。模擬試験つき。"><meta property="og:type" content="website"><title>指導教育責任者 修了考査ドリル</title><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one study column (max 760px) under a navy "uniform" band edged with a reflective-tape stripe; exam mode adds a sticky timer bar. */
:root{
  --bg:#eef1f6;
  --surface:#ffffff;
  --surface-2:#f5f7fb;
  --ink:#16213a;
  --muted:#566178;
  --line:#d4dae5;
  --navy:#17264a;
  --navy-ink:#f3f6fc;
  --navy-muted:#b8c3dc;
  --tape:#c9d1de;
  --signal:#f0b400;
  --signal-ink:#1d1600;
  --signal-soft:#fff2c7;
  --ok:#137a45;
  --ok-soft:#e1f3e8;
  --ng:#bf3328;
  --ng-soft:#fbe5e2;
  --focus:#2f6fe4;
  --font-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --font-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1322; --surface:#151d31; --surface-2:#1b2540; --ink:#e7ecf6; --muted:#9ca8c0; --line:#2b3756;
    --navy:#0a1122; --navy-ink:#eef2fa; --navy-muted:#9fb0d0; --tape:#7d889c;
    --signal:#ffc928; --signal-ink:#1d1600; --signal-soft:#3a3112;
    --ok:#52c487; --ok-soft:#12301e; --ng:#ff7b6c; --ng-soft:#3c1a17; --focus:#80a9ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1322; --surface:#151d31; --surface-2:#1b2540; --ink:#e7ecf6; --muted:#9ca8c0; --line:#2b3756;
  --navy:#0a1122; --navy-ink:#eef2fa; --navy-muted:#9fb0d0; --tape:#7d889c;
  --signal:#ffc928; --signal-ink:#1d1600; --signal-soft:#3a3112;
  --ok:#52c487; --ok-soft:#12301e; --ng:#ff7b6c; --ng-soft:#3c1a17; --focus:#80a9ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);line-height:1.35;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* band */
.band{background:var(--navy);color:var(--navy-ink);margin-top:calc(-1*env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:22px;position:relative}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(var(--signal) 0 3px,var(--tape) 3px 6px,var(--signal) 6px 9px)}
.band-in{display:grid;gap:10px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{background:none;border:0;padding:4px 0;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--navy-ink);letter-spacing:.02em;text-align:left}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--navy-muted);letter-spacing:.04em}
.kseg{display:inline-flex;border:1px solid var(--navy-muted);border-radius:999px;padding:3px;gap:3px}
.kseg button{border:0;border-radius:999px;background:transparent;color:var(--navy-ink);padding:5px 12px;cursor:pointer;font-size:13px;line-height:1.3;text-align:center}
.kseg button span{display:block;font-size:10.5px;color:var(--navy-muted)}
.kseg button[aria-pressed="true"]{background:var(--signal);color:var(--signal-ink);font-weight:700}
.kseg button[aria-pressed="true"] span{color:var(--signal-ink)}
.kseg button:disabled{cursor:not-allowed;opacity:.55}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--navy-muted)}
.band h1{font-size:clamp(28px,7vw,40px);font-weight:900;letter-spacing:.04em}
.lede{color:var(--navy-muted);max-width:34em;font-size:14.5px}

/* main */
main{padding-block:22px 48px;display:grid;gap:22px}
.sub{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 20px;border-radius:8px;border:1px solid transparent;background:var(--signal);color:var(--signal-ink);font-weight:700;cursor:pointer;text-align:center}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;color:var(--muted);cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.notice{background:var(--signal-soft);border:1px solid var(--signal);border-radius:8px;padding:10px 14px;font-size:14px}
.err{background:var(--ng-soft);border:1px solid var(--ng);border-radius:8px;padding:12px 14px}

/* spec */
.spec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.spec h2{font-size:17px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.facts div{border-left:3px solid var(--signal);padding:2px 0 2px 10px}
.facts dt{font-size:12px;color:var(--muted);letter-spacing:.06em}
.facts dd{margin:0;font-size:15px;font-variant-numeric:tabular-nums}
.facts b{font-family:var(--font-display);font-size:24px;font-weight:900;margin-right:2px}
.facts small{font-size:12px;color:var(--muted)}
.dist{display:flex;border-radius:6px;overflow:hidden;font-size:12px;min-height:44px}
.dist span{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4px 2px;color:var(--ink);background:var(--surface-2);border-right:2px solid var(--surface);line-height:1.25;text-align:center;min-width:58px;flex-basis:0;overflow:hidden}
.dist span:last-child{border-right:0}
.dist b{font-family:var(--font-display);font-size:16px}
.dist .d-hourei,.dist .d-senmon{background:var(--signal-soft)}
.dist small{font-size:10.5px;white-space:nowrap}
.cite{font-size:12px;color:var(--muted)}

/* modes */
.mode{display:grid;gap:12px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.mode h2{font-size:19px}
.exam-mode{border:2px solid var(--signal)}
.catlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.catlist button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.catlist button:hover{border-color:var(--signal)}
.cname{font-weight:700}
.cmeta{grid-column:1;font-size:13px;color:var(--muted)}
.acc{grid-column:2;grid-row:1/3;font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.acc b{display:block;font-family:var(--font-display);font-size:18px;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:grid;gap:2px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer}
.tile b{font-family:var(--font-display);font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:13.5px;color:var(--muted)}
.tile:disabled{cursor:default;opacity:.6}
.foot{font-size:12.5px;color:var(--muted);display:grid;gap:6px;border-top:1px solid var(--line);padding-top:16px}

/* setup */
.chips{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips legend{font-size:13px;color:var(--muted);margin-bottom:6px;padding:0;width:100%}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chips button small{color:var(--muted);font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button[aria-pressed="true"] small{color:var(--bg)}

/* question */
.qbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums}
.tag{font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.qbar .push{margin-left:auto}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.stem{font-size:16.5px;line-height:1.85;font-weight:700}
.choices{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.choice{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;text-align:left;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.7}
.choice:hover{border-color:var(--muted)}
.num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);font-family:var(--font-display);font-weight:700;font-size:14px;margin-top:1px}
.choice.sel{border:2px solid var(--focus);background:var(--surface-2);padding:10px 11px}
.choice.sel .num{background:var(--focus);border-color:var(--focus);color:var(--surface)}
.choice.right{border:2px solid var(--ok);background:var(--ok-soft);padding:10px 11px}
.choice.right .num{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.choice.wrong{border:2px solid var(--ng);background:var(--ng-soft);padding:10px 11px}
.choice.wrong .num{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.choice.locked{cursor:default}
.mark{display:inline-block;font-size:11.5px;font-weight:700;padding:0 7px;border-radius:4px;margin-left:6px;vertical-align:1px}
.mark.m-right{background:var(--ok);color:var(--surface)}
.mark.m-you{background:var(--ng);color:var(--surface)}
.note{font-size:14px;color:var(--muted);padding:6px 4px 2px 40px;line-height:1.7}
.note.is-key{color:var(--ink)}
.verdict{display:flex;align-items:baseline;gap:12px;font-family:var(--font-display);font-size:22px;font-weight:900}
.verdict.ok{color:var(--ok)}
.verdict.ng{color:var(--ng)}
.verdict span{font-size:14px;font-weight:700;color:var(--muted)}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.ref{font-size:12.5px;padding:2px 9px;border-radius:4px;border:1px solid var(--line);background:var(--surface-2)}
.refs-h{font-size:12px;color:var(--muted);width:100%}
a.ref{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.pager{display:flex;justify-content:space-between;gap:10px}
.flag{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.flag[aria-pressed="true"]{background:var(--signal-soft);border-color:var(--signal);font-weight:700}

/* exam bar */
.exambar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.exambar-in{display:flex;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap}
.clock{font-family:var(--font-display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;min-width:4.2em}
.clock.low{color:var(--ng)}
.answered{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.exambar-in .btns{margin-left:auto;display:flex;gap:8px}
.panel{background:var(--surface);border:2px solid var(--signal);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.panel h3{font-size:17px}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.cell{min-height:40px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-variant-numeric:tabular-nums;font-weight:700;position:relative}
.cell.a{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cell.f::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--signal)}
.cell.cur{outline:2px solid var(--focus);outline-offset:1px}
.legend{font-size:12.5px;color:var(--muted)}

/* result */
.result{border-radius:var(--r);padding:20px;display:grid;gap:6px;background:var(--surface);border:2px solid var(--line)}
.result.pass{border-color:var(--ok)}
.result.fail{border-color:var(--ng)}
.score{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.score b{font-family:var(--font-display);font-size:56px;font-weight:900;line-height:1}
.score span{font-size:18px;color:var(--muted)}
.badge{font-family:var(--font-display);font-weight:900;font-size:20px}
.result.pass .badge{color:var(--ok)}
.result.fail .badge{color:var(--ng)}
.meta{font-size:14px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12.5px;color:var(--muted);font-weight:400}
td.n{text-align:right;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--signal)}
.review{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.review details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.review summary{cursor:pointer;line-height:1.6}
.review summary .tag{margin-right:6px}
.review .qcard{border:0;padding:12px 0 4px}
.empty{color:var(--muted);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:560px){
  .facts{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}
  .dist small{font-size:9.5px}
  .stem{font-size:16px}
  .note{padding-left:8px}
  .clock{font-size:20px}
}
@media (prefers-reduced-motion:no-preference){
  .choice,.catlist button,.btn{transition:border-color .15s,background-color .15s,filter .15s}
}
</style>

{"id":"KH-001","cat":"kihon","sub":"基本原則","kubun":null,"stem":"警備業務実施の基本原則（警備業法第15条）の趣旨に関する次の記述のうち、正しいものはどれか。","choices":["警備業務は、営利を目的として特定人の依頼に基づいて特定人のためにのみ行うものであり、その実施は、飽くまでも私人のいわゆる管理権等の範囲内で行われるべきものである。","警備業法第15条は警備員の業務実施上の心構えを定めた規定であり、警備業者には適用されない。","警備業務は、他人の身体、財産等の保護を行うものであるから、公共の安全と秩序の維持に当たる警察業務と本質を同じくするものである。","警備員は、警備業務を行うに当たっては、警備業法により、警察官に準じて不審者を停止させて質問する権限を与えられている。","警備員が現行犯人を逮捕することができるのは、警備業法により警備員に特別に与えられた権限に基づくものである。"],"answer":0,"notes":["正しい。警備業務は営利を目的として特定人の依頼に基づき特定人のためにのみ行うもので、私人のいわゆる管理権等の範囲内で行われるべきものであることを注意的に規定したのが法第15条前段である（解釈運用基準第14の1）。","誤り。法第15条は「警備業者及び警備員は」と定めており、警備業者にも警備員にも適用される（警備業法第15条）。","誤り。警備業務は一見警察業務と類似性を有するが、公共の安全と秩序の維持に当たる警察業務とは本質を異にするものである（解釈運用基準第14の1）。","誤り。警備業者及び警備員は、警備業法により特別に権限を与えられているものではない（警備業法第15条）。不審者を停止させて質問すること（職務質問）は警察官職務執行法第2条に基づく警察官の権限であり、警備員にはない。","誤り。現行犯人は何人でも逮捕状なくして逮捕することができ（刑事訴訟法第213条）、警備員も私人としてこの規定により逮捕できるにすぎない。警備業法は警備員に特別の権限を与えていない（警備業法第15条）。"],"ref":["警備業法第15条","解釈運用基準 第14の1","刑事訴訟法第213条"],"src":[]},
{"id":"KH-002","cat":"kihon","sub":"基本原則","kubun":null,"stem":"警備業法第15条が禁止する権利・自由の侵害及び正当な活動への干渉に関する次の記述のうち、誤っているものはどれか。","choices":["同条後段は、刑罰法令等に抵触する行為はもとより、必ずしも明白な権利侵害に当たらない場合であっても、個人又は団体の正当な活動に不当な影響を及ぼす行為を禁止する趣旨である。","正当な活動への干渉に当たる場合の一般的基準は、相手の行為が合法的な活動であって、これに対し警備員等が威圧的言動その他の積極的行為を行い、その行為が周囲の諸状況から判断して相当性を欠くと認められる場合である。","相手の行為が違法なものである場合には、これに対して干渉行為があっても、正当な活動への干渉が行われたことにはならない。","相手の行為が違法なものである場合には、これに対する警備員等の行為が過剰防衛等に該当するに至っても、他人の権利及び自由の侵害には当たらない。","依頼者の店頭に違法駐車をした者に対し、長時間の説教をし、又は始末書の提出を求めることは、同条に違反する行為の例とされている。"],"answer":3,"notes":["正しい。解釈運用基準第14の2のとおりである（警備業法第15条）。","正しい。解釈運用基準第14の2に示された一般的基準のとおりである。","正しい。相手の行為が違法なものである場合には、干渉行為があっても正当な活動への干渉が行われたことにはならない（解釈運用基準第14の2）。","誤り。相手の行為が違法であっても、警備員等の行為が限度を超え過剰防衛等に該当するに至った場合には、他人の権利自由の侵害に当たる（解釈運用基準第14の2）。","正しい。法第15条違反となる具体例として示されている（解釈運用基準第14の2）。相手が違法駐車をしていても、長時間の説教や始末書の要求は許されない。"],"ref":["警備業法第15条","解釈運用基準 第14の2"],"src":[]},
{"id":"KH-003","cat":"kihon","sub":"基本原則","kubun":null,"stem":"次の警備員の行為のうち、警備業法第15条に違反する行為の例として解釈運用基準に示されているものはどれか。","choices":["施設の出入管理業務において、施設管理者が定めた手続に従い、来訪者に入館者名簿への記帳を求めた。","巡回中に窃盗の現行犯人を逮捕し、直ちに警察官に引き渡した。","デパートの保安業務において、買物中の客に対し、疑うべき具体的な理由がないのに携帯品の提出を求め、窃取したものでないことの証明を求めた。","道路工事現場の交通誘導業務において、歩行者に対し、工事区域を避けて通行するよう協力を求めた。","警備業務対象施設内で出血して倒れている負傷者を発見し、救出するとともに消防機関に通報した。"],"answer":2,"notes":["誤り。施設管理者が定めた手続に従って記帳を求めることは、施設管理者の管理権の範囲内で行う出入管理であり、違反の例には当たらない（解釈運用基準第14の1）。","誤り。現行犯人は何人でも逮捕でき（刑事訴訟法第213条）、私人が逮捕したときは直ちに検察官又は司法警察職員に引き渡さなければならない（同法第214条）。適法な行為である。","正しい。デパートで買物中の客に対し、疑うべき具体的な理由がないにもかかわらず携帯品の提出を求め、窃取したものでないことの証明を求めることは、法第15条違反の具体例として示されている（解釈運用基準第14の2）。","誤り。歩行者に協力を求めることは強制を伴わない措置であり、違反の例には当たらない。警備員には特別の権限がないため、誘導は相手の協力を求める形で行う（警備業法第15条）。","誤り。施設内で出血して倒れている負傷者を救出する行為は「警戒し、防止する」業務に含まれる（解釈運用基準第2の1(5)）。違反には当たらない。"],"ref":["警備業法第15条","解釈運用基準 第14の2","刑事訴訟法第213条・第214条"],"src":[]},
{"id":"KH-004","cat":"kihon","sub":"基本原則","kubun":null,"stem":"警備業法第16条の服装に関する次の記述のうち、正しいものはどれか。","choices":["警備員の服装が明確に識別できるものでなければならない制服として内閣府令で定められているのは、警察官、海上保安官及び消防吏員の制服である。","「明確に識別することができる服装」に当たるためには、色彩と型式の両方が警察官等の制服と明らかに異なっていなければならない。","「明確に識別することができる服装」とは、警察官等の制服に精通した者が見て区別できる程度に異なっている服装をいう。","服装の届出において、当該服装を用いて行う警備業務が船舶を利用して海上に及ぶ場合であっても、その旨を記載する必要はない。","標章によって識別させる場合には、警備業者の名称を表示した60平方センチメートル以上の標章を、上衣の胸部及び上腕部に付けるよう指導することとされている。"],"answer":4,"notes":["誤り。内閣府令で定める公務員は警察官及び海上保安官であり、消防吏員は含まれない（警備業法施行規則第27条）。","誤り。①色彩が明らかに異なる、②型式（詰襟など）が明らかに異なる、③警備員であることを示す相当程度の大きさの標章を見やすい場所に付けている、のいずれかに該当すれば足りる（解釈運用基準第15の1）。","誤り。一般通常人が一見して警察官等と誤認しない程度に異なっている服装をいう（解釈運用基準第15の1）。","誤り。届出事項の「当該服装を用いて行う警備業務の内容」には、警備業務が海上に及ぶ場合にはその旨を記載することとされ、海上保安官の制服と明確に識別できるかを慎重に判断する（警備業法施行規則第29条、解釈運用基準第15の2(2)）。","正しい。解釈運用基準第15の1なお書きのとおりである。"],"ref":["警備業法第16条第1項・第2項","警備業法施行規則第27条・第29条","解釈運用基準 第15"],"src":[]},
{"id":"KH-005","cat":"kihon","sub":"基本原則","kubun":null,"stem":"服装及び護身用具の届出に関する次の記述のうち、誤っているものはどれか。","choices":["服装の届出書は、所轄警察署長を経由して、警備業務を行おうとする都道府県の区域を管轄する公安委員会に提出する。","届け出た服装を変更したときは、変更後の服装の使用を開始した日から10日以内に変更の届出書を提出すればよい。","服装の届出書は、当該警備業務の開始の日の前日までに提出しなければならない。","護身用具の届出書には、護身用具の種類及び規格のほか、その機能、使用基準及び当該護身用具を携帯して行う警備業務の内容を記載する。","当該都道府県の区域内において継続して行う期間が30日以内で、かつ、従事させる警備員の数が1日につき5人以内である警備業務については、服装の届出を要しない。"],"answer":1,"notes":["正しい。届出先は警備業務を行おうとする都道府県の区域を管轄する公安委員会であり（警備業法第16条第2項）、府令第3条第2項又は第11条第2項により経由すべき警察署長を経由して提出する（警備業法施行規則第28条第2項）。","誤り。服装等の変更の届出書は、当該変更に係る服装の使用（護身用具の場合は携帯）の開始の日の前日までに提出しなければならない（警備業法第16条第3項、警備業法施行規則第32条第2項、解釈運用基準第15の2(3)）。","正しい。警備業法施行規則第28条第2項。","正しい。種類・規格は法第17条第2項で読み替えて準用する法第16条第2項、機能・使用基準・警備業務の内容は警備業法施行規則第29条による。","正しい。法第16条第2項の内閣府令で定める警備業務は府令第14条各号の警備業務であり、これらは届出を要しない（警備業法施行規則第31条・第14条第1号）。"],"ref":["警備業法第16条第2項・第3項","警備業法第17条第2項","警備業法施行規則第14条・第28条〜第32条","解釈運用基準 第15の2(3)・第16の4(2)"],"src":[]},
{"id":"KH-006","cat":"kihon","sub":"基本原則","kubun":null,"stem":"護身用具（警備業法第17条）に関する次の記述のうち、誤っているものはどれか。","choices":["公安委員会は、公共の安全を維持するため必要があると認めるときは、都道府県公安委員会規則を定めて、警備業者及び警備員に対し、護身用具の携帯を禁止し、又は制限することができる。","護身用具の携帯の禁止又は制限を都道府県公安委員会規則で定めることとしたのは、地域の実情によりその内容を異にする必要があることを考慮したものである。","都道府県公安委員会規則により携帯が制限されていない護身用具であっても、昼間、携帯する必要性の乏しい場合等には携帯しないよう指導することとされている。","都道府県公安委員会規則で携帯を禁止していない護身用具については、警備員がそれを用いて法第15条に違反する行為を行った場合であっても、公安委員会が警備業者に対しその使用を禁止する指示をすることはできない。","護身用具届出書の「使用基準」欄には、例えば「不審者に襲撃された場合に、専ら防御のために使用する」のように記載させることとされている。"],"answer":3,"notes":["正しい。警備業法第17条第1項。","正しい。解釈運用基準第16の1。","正しい。解釈運用基準第16の3(1)。","誤り。携帯を禁止していない護身用具であっても、特定の警備業者の警備員がそれを用いて法第15条に違反する行為を行ったような場合には、法第48条の規定により、その警備業者に対しその護身用具の使用を一定期間禁止するなどの指示を行うこととされている（解釈運用基準第16の3(6)）。","正しい。解釈運用基準第16の4(1)。ほかに「夜間の巡回時に携帯する」などの記載例がある。"],"ref":["警備業法第17条","解釈運用基準 第16"],"src":[]},
{"id":"KH-007","cat":"kihon","sub":"基本原則","kubun":null,"stem":"護身用具の携帯に関する都道府県公安委員会規則の基準（警察庁通達）で携帯できるとされる護身用具について、次の記述のうち誤っているものはどれか。","choices":["携帯できる護身用具は鋭利な部位がないものに限られ、刺股に付けられた棘はこの「鋭利な部位」に当たる。","警戒棒は、形状が円棒であって、長さが30センチメートルを超え90センチメートル以下であり、かつ、長さの区分に応じて定められた重量以下のものに限られる。","警戒じょうは、形状が円棒であって、長さが90センチメートルを超え130センチメートル以下であり、かつ、長さの区分に応じて定められた重量以下のものに限られる。","基準に個別に掲げられたもの以外でも、携帯することにより人に著しく不安を覚えさせるおそれがなく、かつ、人の身体に重大な害を加えるおそれがないものは携帯できる。","楯は、金属製のものに限り携帯できるものとされている。"],"answer":4,"notes":["正しい。基準第1柱書き。「鋭利な部位」には、相手に危害を加えるために警戒棒・警戒じょうに付けられた鋭利なつばや刺股に付けられた棘等が該当する（解釈運用基準第16の3(2)）。","正しい。基準第1の1・別表1（例：30cm超40cm以下は160g以下、80cm超90cm以下は460g以下）。","正しい。基準第1の2・別表2（例：90cm超100cm以下は510g以下、120cm超130cm以下は690g以下）。","正しい。基準第1の5。","誤り。携帯できるのは「非金属製の楯」である（基準第1の4）。"],"ref":["警備業法第17条第1項","護身用具の基準（令和6年3月29日警察庁乙生発第6号）第1","解釈運用基準 第16の2・第16の3(2)"],"src":[]},
{"id":"KH-008","cat":"kihon","sub":"基本原則","kubun":null,"stem":"護身用具の携帯に関する都道府県公安委員会規則の基準（警察庁通達）に関する次の記述のうち、正しいものはどれか。","choices":["競輪場等の公営競技場において、部隊を編成するなど集団の力を用いて警備業務を行う場合には、警戒棒を携帯することができる。","部隊を編成するなど集団の力を用いて警備業務を行う場合であっても、警戒じょうは携帯することができる。","交通誘導警備業務を行う場合には、警戒じょうを携帯することができる。","機械警備業務のうち、警備業務対象施設からの情報を受信し、指令、通報等の措置を行う指令業務を行う場合には、警戒じょうを携帯することができる。","警戒じょうの携帯が認められる施設警備業務の対象となる「警察官が現に警戒を行っている施設」には、警察官が警らの途中に立ち寄ることとされているにすぎない施設も含まれる。"],"answer":0,"notes":["正しい。集団の力を用いて警備業務を行う場合は警戒棒及び警戒じょうを携帯してはならないが、競輪場等の公営競技場で警備業務を行う場合は警戒棒を携帯できる（基準第2ただし書）。","誤り。部隊を編成するなど集団の力を用いて警備業務を行う場合は、警戒棒及び警戒じょうを携帯してはならない（基準第2）。","誤り。警戒じょうを携帯できるのは、機械警備業務（指令業務を除く）、警察官が現に警戒を行っている空港・原子力関係施設等における施設警備業務、核燃料物質等危険物運搬警備業務及び貴重品運搬警備業務に限られ、交通誘導警備業務は含まれない（基準第3）。","誤り。警戒じょうを携帯できる機械警備業務からは指令業務が除かれている（基準第3の1、解釈運用基準第16の3(3)）。","誤り。警察官が当該施設又はその周辺にとどまって警戒を実施することとされている施設をいい、警らの途中に立ち寄ることとされているにすぎない施設は含まれない（解釈運用基準第16の3(4)）。"],"ref":["警備業法第17条第1項","護身用具の基準（令和6年3月29日警察庁乙生発第6号）第2・第3","解釈運用基準 第16の3(3)(4)"],"src":[]},
{"id":"KH-009","cat":"kihon","sub":"基本原則","kubun":null,"stem":"警備業法第15条から第17条までの規定及びその解釈に関する次の記述のうち、正しいものはどれか。","choices":["法第16条第1項にいう警察官の制服は、警察法の規定に基づき、各都道府県の公安委員会規則で定められている。","服装の型式が詰襟であるものは、警察官等の制服の型式と明らかに異なるものには当たらないとされている。","労働組合の適法な集会やデモ行進の周辺で、大勢で長時間罵声を浴びせるなどの嫌がらせをすることは、法第15条違反の例とされている。","警備業務が船舶を利用して海上に及ぶ場合には、服装が警察官の制服と明確に識別できるものかどうかを特に慎重に判断することとされている。","警戒棒や警戒じょうに付けられた鋭利なつばは、護身用具の基準にいう「鋭利な部位」には当たらないとされている。"],"answer":2,"notes":["誤り。警察官の制服は、警察法第70条の規定に基づき、警察官の服制に関する規則（国家公安委員会規則）に定められている（解釈運用基準第15の2(1)）。なお、法第16条第1項の「内閣府令で定める公務員」は警察官及び海上保安官である（警備業法施行規則第27条）。","誤り。「明確に識別することができる服装」の一つとして、型式が詰襟その他警察官等の制服の型式と明らかに異なるものが示されており、詰襟はその例である（警備業法第16条第1項、解釈運用基準第15の1(2)）。","正しい。法第15条違反となる具体例として示されている（警備業法第15条、解釈運用基準第14の2）。このほか、デパートの客に疑うべき具体的な理由なく携帯品の提出を求めること、違法駐車をした者に長時間の説教をすること、現行犯逮捕した窃盗犯人の所持品や身元を長時間調べることが示されている。","誤り。警備業務が船舶を利用して海上に及ぶ場合に慎重に判断することとされているのは、海上保安官の制服と明確に識別できるものであるか否かである（解釈運用基準第15の2(2)）。服装の届出書の警備業務の内容にも、海上に及ぶ旨を記載する（警備業法施行規則第29条）。","誤り。基準第1柱書きの「鋭利な部位」には、相手に危害を加えるために警戒棒又は警戒じょうに付けられた鋭利なつばや、刺股に付けられた棘等が該当する（解釈運用基準第16の3(2)）。"],"ref":["警備業法第15条〜第17条","警備業法施行規則第27条・第29条","解釈運用基準 第14の2・第15・第16の3(2)","護身用具の基準（令和6年3月29日警察庁乙生発第6号）第1"],"src":[]},
{"id":"KH-010","cat":"kihon","sub":"基本原則","kubun":null,"stem":"服装の届出（警備業法第16条第2項・第3項）に関する次の記述のうち、誤っているものはどれか。","choices":["服装の届出書には、服装の色及び型式のほか、当該服装に付ける標章の位置及び型式並びに当該服装を用いて行う警備業務の内容を記載する。","届出書に記載する警備業務の内容は、「道路工事現場における車両の誘導」、「高層ビルにおける常駐警備」のように具体的に記載する。","制服でない服装で標章を付けないものについては、届出書に当該服装を用いた警備員の写真を添付することを要しない。","届け出た服装を変更する場合の届出書には、変更年月日、変更事項及び変更の事由を記載する。","届出書には、服装の種類ごとに、当該服装を用いた警備員の正面の全身を写した写真1枚を添付すれば足りる。"],"answer":4,"notes":["正しい。色及び型式は警備業法第16条第2項、標章の位置及び型式並びに当該服装を用いて行う警備業務の内容は警備業法施行規則第29条による。","正しい。当該警備業務の具体的な内容を記載し、警備業務が船舶を利用して海上に及ぶ場合にはその旨も記載する（解釈運用基準第15の2(2)）。","正しい。写真の添付を要するのは、制服及び標章を付ける制服でない服装である（警備業法施行規則第30条括弧書き）。","正しい。警備業法第16条第3項で準用する第11条第1項、警備業法施行規則第32条第3項。なお、変更の届出は、変更に係る服装の使用の開始の日の前日までに行う（同条第2項）。","誤り。服装の種類ごとに、当該服装を用いた警備員の正面及び側面の全身の写真（縦12センチメートル、横8センチメートル、無背景で色彩を識別できるもの）を各1枚添付する（警備業法施行規則第30条）。"],"ref":["警備業法第16条第2項・第3項","警備業法施行規則第29条・第30条・第32条","解釈運用基準 第15の2(2)"],"src":[]},
{"id":"KH-011","cat":"kihon","sub":"基本原則","kubun":null,"stem":"護身用具の携帯に関する都道府県公安委員会規則の基準（警察庁通達）における警戒じょうの取扱いに関する次の記述のうち、正しいものはどれか。","choices":["警察官が現に警戒を行っている施設であれば、施設の種類を問わず、その施設警備業務において警戒じょうを携帯することができる。","貴重品運搬警備業務は、警戒じょうを携帯することができる警備業務の一つとされている。","雑踏警備業務は、部隊を編成せずに個々の警備員が行う場合であれば、警戒じょうを携帯して行うことができる。","空港の施設警備業務であれば、警察官が現に警戒を行っていない場合であっても、警戒じょうを携帯することができる。","火薬、毒物又は劇物の製造又は貯蔵に係る施設が掲げられているのは、多数の者の円滑な生活に重要な役割を果たす施設だからである。"],"answer":1,"notes":["誤り。警戒じょうを携帯できる施設警備業務は、警察官が現に警戒を行っている施設のうち、空港、原子力関係施設、外交関係施設、国会関係施設・政府関係施設、石油・電力・ガス・水道・交通関係施設等、火薬・毒物・劇物の製造・貯蔵施設等で行われるものに限られる（基準第3の2）。","正しい。基準第3の3。核燃料物質等危険物運搬警備業務及び貴重品運搬警備業務では、警戒じょうを携帯することができる。","誤り。警戒じょうを携帯できるのは、機械警備業務（指令業務を除く。）、基準第3の2の施設で行う施設警備業務、核燃料物質等危険物運搬警備業務及び貴重品運搬警備業務に限られ、雑踏警備業務は含まれない（基準第3）。なお、部隊を編成するなど集団の力を用いる場合は、警戒棒及び警戒じょうを携帯できない（基準第2）。","誤り。警戒じょうを携帯できる施設警備業務は、警察官が現に警戒を行っている施設のうち基準第3の2(1)〜(6)に掲げるものにおいて行われるものに限られ、空港であっても、警察官が現に警戒を行っていなければ携帯できない（基準第3の2）。「警察官が現に警戒を行っている施設」とは、警察官が当該施設又はその周辺にとどまって警戒を実施することとされている施設をいう（解釈運用基準第16の3(4)）。","誤り。火薬・毒物・劇物の製造・貯蔵施設等（基準第3の2(6)）が掲げられているのは、施設内にある物に高い危険性があるためである。多数の者が円滑に生活を営むに当たり重要な役割を果たしていることを趣旨とするのは、石油・電力・ガス・水道・交通関係施設等（同(5)）である（解釈運用基準第16の3(5)）。"],"ref":["警備業法第17条第1項","護身用具の基準（令和6年3月29日警察庁乙生発第6号）第2・第3","解釈運用基準 第16の3(4)・(5)"],"src":[]},
{"id":"KH-012","cat":"kihon","sub":"基本原則","kubun":null,"stem":"護身用具の携帯の制限及び届出に関する次の記述のうち、誤っているものはどれか。","choices":["護身用具の携帯の禁止及び制限に関する都道府県公安委員会規則の基準は、都道府県相互間の統一を図るため、警察庁の通達で示されている。","都道府県公安委員会規則に、基準に掲げる施設以外の施設の施設警備業務にも警戒じょうの携帯を認める定めを置こうとするときは、あらかじめ警察庁と協議することとされている。","護身用具届出書の「使用基準」欄には、例えば「夜間の巡回時に携帯する」のように記載させることとされている。","基準によれば、刺股は、警戒じょうと同様に、長さが130センチメートル以下のものに限り携帯することができる。","護身用具の届出書には、護身用具の種類ごとに、色彩を識別することのできる当該護身用具の写真1枚を添付する。"],"answer":3,"notes":["正しい。基準は、都道府県相互間の統一を図るため依命通達で示されたもので（令和6年3月29日警察庁乙生発第6号）、各都道府県警察は、地域的特殊性を考慮しなければならない等特別の理由がある場合を除き、これを参考とする（解釈運用基準第16の2）。","正しい。都道府県ごとの地域的特殊性を踏まえ、基準第3の2(1)〜(6)以外の施設の施設警備業務について警戒じょうの携帯を認める定めを置こうとする場合は、警察庁生活安全局生活安全企画課とあらかじめ協議する（解釈運用基準第16の3(5)）。","正しい。解釈運用基準第16の4(1)。このほか「不審者に襲撃された場合に、専ら防御のために使用する」のような記載例も示されている。","誤り。基準第1の3は「刺股」とのみ定め、長さや重量の制限はない（鋭利な部位がないものに限られる点は他の護身用具と同じ。基準第1柱書き）。長さ90センチメートルを超え130センチメートル以下とされているのは警戒じょうである（基準第1の2）。","正しい。護身用具の種類ごとに、縦12センチメートル、横8センチメートルの写真（色彩を識別できるもの）1枚を添付する（警備業法第17条第2項で準用する第16条第2項、警備業法施行規則第30条）。"],"ref":["警備業法第17条","警備業法施行規則第28条〜第30条","護身用具の基準（令和6年3月29日警察庁乙生発第6号）第1","解釈運用基準 第16の2・第16の3(5)・第16の4(1)"],"src":[]},
{"id":"KH-013","cat":"kihon","sub":"基本原則","kubun":null,"stem":"護身用具の携帯に関する都道府県公安委員会規則の基準（警察庁通達）に照らし、次の記述のうち正しいものはどれか。","choices":["部隊を編成するなど集団の力を用いて警備業務を行う場合であっても、刺股の携帯は禁止されていない。","機械警備業務のうち指令業務を行う場合には、警戒じょうだけでなく警戒棒も携帯してはならないとされている。","非金属製の楯は、施設警備業務を行う場合に限り携帯することができるとされている。","警戒棒は、長さが30センチメートルを超え90センチメートル以下であれば、重量の制限は設けられていない。","長さが100センチメートルの円棒は、重量の制限内であれば、警戒棒として交通誘導警備業務で携帯することができる。"],"answer":0,"notes":["正しい。集団の力を用いて警備業務を行う場合に携帯が禁止されるのは警戒棒及び警戒じょうである（基準第2）。刺股は、鋭利な部位がないものであれば携帯できる護身用具とされている（基準第1の3）。","誤り。指令業務（警備業務対象施設からの情報を受信し、指令、通報等の措置を行う業務）を行う場合に携帯が制限されるのは警戒じょうであり（基準第3の1、解釈運用基準第16の3(3)）、警戒棒の携帯を禁止する定めはない。なお、携帯する必要性の乏しい場合には携帯しないよう指導することとされている（解釈運用基準第16の3(1)）。","誤り。基準第1の4は「非金属製の楯」と定めており、携帯できる警備業務の種類を限っていない。","誤り。警戒棒は、長さの区分に応じて別表1に定める重量以下のものに限られる（基準第1の1。例：30センチメートル超40センチメートル以下は160グラム以下、50センチメートル超60センチメートル以下は280グラム以下）。","誤り。長さが90センチメートルを超え130センチメートル以下の円棒は警戒じょうの区分となり（基準第1の1・第1の2）、交通誘導警備業務は警戒じょうを携帯できる警備業務に含まれない（基準第3）。"],"ref":["警備業法第17条第1項","護身用具の基準（令和6年3月29日警察庁乙生発第6号）第1〜第3","解釈運用基準 第16の3(1)・(3)"],"src":[]},
{"id":"KH-014","cat":"kihon","sub":"基本原則","kubun":null,"stem":"警備業法第15条から第17条までの規定を踏まえた警備業者の対応として、適当でないものはどれか。","choices":["依頼者から警察官に似た制服で警備してほしいと求められても、警察官等の制服と明確に識別できる服装を用いさせる。","業務開始前に、制服に付けた標章が外れたり見えにくくなったりしていないかを警備員に確認させる。","夏季の暑さ対策として、届出をしていない色のポロシャツを現場の判断で着用させて警備業務に従事させる。","護身用具は、届け出た種類及び規格のものを携帯させ、届け出ていない物を現場の判断で携帯させない。","不審者への対応に当たっては、警察官と誤認させるような言動をとらないよう警備員を指導する。"],"answer":2,"notes":["正しい。警備業者及び警備員は、警備業務を行うに当たっては、警察官及び海上保安官の制服と、色、型式又は標章により明確に識別することができる服装を用いなければならず（警備業法第16条第1項、警備業法施行規則第27条）、依頼者の要望によってこの義務が変わることはない。","正しい。標章の位置及び型式は服装の届出事項であり（警備業法施行規則第29条）、標章によって識別させる場合は、警備員であることを示す相当程度の大きさの標章を見やすい場所に付けている必要がある（解釈運用基準第15の1(3)）。","誤り。警備業務を行うに当たって用いる服装は公安委員会に届け出なければならず、届け出た服装を変更するときは、変更に係る服装の使用の開始の日の前日までに変更の届出をしなければならない（警備業法第16条第2項・第3項、警備業法施行規則第32条第2項）。","正しい。携帯しようとする護身用具は、種類、規格等を届け出なければならず、変更するときは、変更に係る護身用具の携帯の開始の日の前日までに変更の届出をする（警備業法第17条第2項、警備業法施行規則第29条・第32条第2項）。","正しい。警備業者及び警備員は、警備業法により特別に権限を与えられているものではない（警備業法第15条）。なお、官公職を詐称することは軽犯罪法第1条第15号に当たる。"],"ref":["警備業法第15条〜第17条","警備業法施行規則第27条・第29条・第32条","解釈運用基準 第15の1","軽犯罪法第1条第15号"],"src":[]},
{"id":"KA-001","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法の目的及び警備業務の定義に関する次の記述のうち、正しいものはどれか。","choices":["警備業法は、警備業について必要な規制を定め、もって警備業の健全な発展を図ることを目的とする。","「警備業務」とは、法第2条第1項各号のいずれかに該当する業務であって、他人の需要に応じて行うものをいう。","法第2条第1項第1号の「事務所、住宅、興行場、駐車場、遊園地等」は限定列挙であり、工場や学校における盗難等の事故の警戒・防止は同号の警備業務に当たらない。","人の身体に対する危害の発生を、その身辺において警戒し、防止する業務は、法第2条第1項第3号の警備業務である。","法第2条第1項第3号の「現金、貴金属、美術品等」には有価証券等の貴重品は含まれるが、核燃料物質等の危険物は含まれない。"],"answer":1,"notes":["誤り。目的は「警備業務の実施の適正を図ること」である（警備業法第1条）。すなわち、警備業務の実施に伴う違法又は不当な事態の発生を防止し、あわせて警備業務の適切な実施を促進することにある（解釈運用基準第1）。","正しい。警備業法第2条第1項柱書き。","誤り。施設の例示であり、工場、学校等のほか海水浴場、湖等に設けられた施設等も警備業務対象施設に当たる（解釈運用基準第2の1(2)）。","誤り。身辺警備は第4号の警備業務である（警備業法第2条第1項第4号）。第3号は運搬中の現金、貴金属、美術品等に係る盗難等の事故の発生を警戒し、防止する業務である。","誤り。有価証券等の貴重品のほか、核燃料物質等の危険物、危険な動物等も含まれる（解釈運用基準第2の1(3)）。"],"ref":["警備業法第1条・第2条第1項","解釈運用基準 第1・第2の1"],"src":[]},
{"id":"KA-002","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業務への該当性に関する次の記述のうち、誤っているものはどれか。","choices":["「他人の需要に応じて行う」とは、他人との契約に基づき、他人のために行うことをいう。","建設業者が、通常の建設業の業務の内容として必要とされる範囲で自己の従業員を配置して建設工事に伴う事故の防止を行う程度の業務は、警備業務に該当しない。","貸ビル業者が、賃借人との契約に基づいて、その所有建物において事故の発生を警戒し、防止する業務は、警備業務に該当しない。","飛行場において行う航空機の誘導業務は、警備業務に該当しない。","ある業務が警備業務以外の業務に付随して行われるからといって、直ちに「他人の需要に応じて行う」ものでないとはいえない。"],"answer":2,"notes":["正しい。「他人」とは、当該業務を行う者以外の個人、法人等をいう（解釈運用基準第2の1(1)）。","正しい。警備業務に該当しない業務として示されている（解釈運用基準第2の1(1)）。","誤り。貸ビル業者が通常必要とされる範囲で自己の所有建物の保全管理を行う業務は警備業務に該当しないが、賃借人との契約に基づいて事故の発生を警戒し、防止する業務は警備業務に該当する（解釈運用基準第2の1(1)）。","正しい。警備業務に該当しない業務として示されている（解釈運用基準第2の1(1)）。","正しい。「他人の需要に応じて行う」ものでない他の業務に包摂される場合は警備業務に該当しないが、警備業務以外の業務に付随して行われるというだけで直ちにそうとはいえない（解釈運用基準第2の1(1)）。"],"ref":["警備業法第2条第1項","解釈運用基準 第2の1(1)"],"src":[]},
{"id":"KA-003","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業務の範囲に関する次の記述のうち、誤っているものはどれか。","choices":["法第2条第1項第1号の「盗難等の事故」には、施設における活動の正常な運行を妨げ、又は施設の正常な状態を損なうような、市民生活の安全と平穏に関する緊急の対処の必要な事象全般が含まれる。","警備業務対象施設内において、出血して倒れている負傷者を救出する行為は、「警戒し、防止する」業務に含まれる。","法第2条第1項第4号の「人の身体に対する危害」には、人の身体の安全と平穏に関する緊急の対処が必要な事象全般が含まれる。","警備業務に該当する緊急通報サービスのうち、対象者が所持する携帯型発信器から直接、警備業務対象施設以外の施設に設置する機器に情報を送信して行うものは、法第2条第1項第4号の警備業務に該当し、機械警備業務には該当しない。","列車、航空機その他の交通機関に乗務し、乗客等による粗暴行為等の事故の発生を警戒し、防止する業務は、警備業務に該当しない。"],"answer":4,"notes":["正しい。盗難は代表的な例示であり、緊急の対処の必要な事象全般を含む（解釈運用基準第2の1(2)）。","正しい。「警戒し、防止する」には、事故が発生した場合にその被害の拡大を防止するために必要な措置を執ることも含まれる（解釈運用基準第2の1(5)）。","正しい。法第2条第1項第4号の業務は、人の生命又は身体に危険を及ぼすおそれのある犯罪、事故その他の危険な事態の発生を、その身辺において警戒し、防止する業務と解され、「人の身体に対する危害」には、人の身体の安全と平穏に関する緊急の対処が必要な事象全般が含まれる（解釈運用基準 第2の1(4)）。","正しい。一方、高齢者宅等に設置する機器を通じて施設外の機器に送信・受信する装置を使用して行う場合は、機械警備業務に該当する（解釈運用基準第2の4）。","誤り。交通機関に乗務し、乗客等による粗暴行為等の事故の発生を警戒し、防止する業務は、法第2条第1項第1号及び第4号の業務に該当する（解釈運用基準第2の1(6)）。"],"ref":["警備業法第2条第1項・第5項","解釈運用基準 第2の1(2)(4)(5)(6)・第2の4"],"src":[]},
{"id":"KA-004","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法上の用語の定義に関する次の記述のうち、正しいものはどれか。","choices":["「警備員」とは警備業者の使用人その他の従業者で警備業務に従事するものをいい、この「従業者」には、雇用契約以外の契約に基づき警備業務に従事する者も含まれる。","「警備業者」とは、警備業を営む者をいい、公安委員会の認定を受けているかどうかを問わない。","「営業」とは営利の目的で同種の行為を反復継続して行うことをいうから、公益法人が行う業務が警備業に当たることはない。","「機械警備業務」とは、警備業務用機械装置を使用して行う法第2条第1項第2号の警備業務をいう。","センサー等で感知した情報の受信機器が警備業務対象施設と同一の建造物の内部に設置され、その内部で完結している装置も、警備業務用機械装置に当たる。"],"answer":0,"notes":["正しい。警備業法第2条第4項。警備業務に従事しているか否かは、警備業者の指揮監督の下で労務を提供した事実、対価の受領の有無等を総合的に判断する（解釈運用基準第2の3）。","誤り。「警備業者」とは、第4条の認定を受けて警備業を営む者をいう（警備業法第2条第3項）。","誤り。業務実施者が公益法人である場合であっても、営利の目的がある場合があることに留意するとされている（警備業法第2条第2項、解釈運用基準第2の2）。","誤り。機械警備業務は、警備業務用機械装置を使用して行う第2条第1項第1号の警備業務をいう（警備業法第2条第5項）。","誤り。警備業務用機械装置は受信機器が警備業務対象施設以外の施設に設置されている場合に限られるため、同一建造物の内部で完結している装置は当たらない（警備業法第2条第5項、解釈運用基準第2の4）。なお、電話その他送信者の音声を送受信する装置も除かれる（警備業法施行規則第2条）。"],"ref":["警備業法第2条第2項〜第5項","警備業法施行規則第2条","解釈運用基準 第2の2〜第2の4"],"src":[]},
{"id":"KA-005","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法第3条の警備業の要件（欠格事由）に関する次の記述のうち、誤っているものはどれか。","choices":["破産手続開始の決定を受けて復権を得ない者は、警備業を営んではならない。","拘禁刑以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなった日から起算して5年を経過しない者は、警備業を営んではならない。","暴力団員による不当な行為の防止等に関する法律第12条若しくは第12条の6の規定による命令又は同法第12条の4第2項の規定による指示を受けた者であって、当該命令又は指示を受けた日から起算して3年を経過しないものは、警備業を営んではならない。","警備業法の規定に違反して罰金の刑に処せられた者は、その執行を終わった日から起算して3年を経過すれば、同条第2号の欠格事由に該当しなくなる。","アルコール、麻薬、大麻、あへん又は覚醒剤の中毒者は、警備業を営んではならない。"],"answer":3,"notes":["正しい。警備業法第3条第1号。","正しい。警備業法第3条第2号。懲役・禁錮は令和7年6月1日に拘禁刑に一本化されている。","正しい。警備業法第3条第5号。","誤り。警備業法の規定に違反して罰金の刑に処せられた者も、その執行を終わり、又は執行を受けることがなくなった日から起算して5年を経過しない間は欠格事由に該当する（警備業法第3条第2号）。","正しい。警備業法第3条第6号。"],"ref":["警備業法第3条"],"src":[]},
{"id":"KA-006","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業の要件（欠格事由）の解釈に関する次の記述のうち、正しいものはどれか。","choices":["拘禁刑に処せられ、刑の全部の執行猶予の言渡しを取り消されることなく猶予の期間を経過した者は、その日から起算して5年を経過しない間は、警備業を営んではならない。","精神病者であれば一律に欠格となるものではなく、警備業務を適正に遂行する能力を有するかどうかという観点から判断される。","最近5年間に警備業務に関し他の法令の規定に違反する重大な不正行為をした者の欠格期間は、その行為が検挙された日から起算する。","営業に関し成年者と同一の行為能力を有しない未成年者は、警備業者の相続人であって、その法定代理人が法第3条第1号から第7号まで及び第10号のいずれにも該当しない場合であっても、警備業を営んではならない。","法人の役員には、相談役又は顧問の名称を有する者は、法人に対し取締役等と同等以上の支配力を有すると認められる場合であっても含まれない。"],"answer":1,"notes":["誤り。刑の執行猶予の言渡しを受けてその期間が経過した場合（大赦・特赦があった場合も同じ）には、法第3条第2号の適用はない（解釈運用基準第3の2(2)）。猶予期間を経過すると刑の言渡しは効力を失う（刑法第27条）。","正しい。法第3条第7号の者は、精神機能の障害により警備業務を適正に行うに当たって必要な認知、判断及び意思疎通を適切に行うことができない者であり（警備業の要件に関する規則第3条第1項）、例えば軽度のうつ病と診断されていても適正に業務を行い得ると認められる者は該当しない（解釈運用基準第3の7(1)）。","誤り。欠格期間の起算日は、検挙の日ではなく、当該重大な不正行為をした日である（解釈運用基準第3の3(5)）。","誤り。警備業者の相続人であって、その法定代理人が第1号から第7号まで及び第10号のいずれにも該当しない場合は、欠格事由から除かれる（警備業法第3条第8号ただし書）。","誤り。役員には、相談役、顧問その他いかなる名称を有する者であるかを問わず、業務を執行する社員、取締役、執行役又はこれらに準ずる者と同等以上の支配力を有するものと認められる者が含まれる（警備業法第3条第10号）。"],"ref":["警備業法第3条","警備業の要件に関する規則第3条第1項","解釈運用基準 第3","刑法第27条"],"src":[]},
{"id":"KA-007","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業の認定の手続に関する次の記述のうち、正しいものはどれか。","choices":["警備業を営もうとする者は、国家公安委員会の認定を受けなければならない。","外国に本社を有する外国の警備会社が日本国内で警備業務を行う場合は、その期間が限られているときであれば、認定を受ける必要はない。","認定申請書は、主たる営業所の所在地を管轄する公安委員会に、当該所在地の所轄警察署長を経由して提出しなければならない。","認定の有効期間は、認定を受けた日から起算して3年である。","公安委員会は、認定申請書を提出した者が欠格事由に該当すると認めたときは、理由を付さずにその旨を通知すれば足りる。"],"answer":2,"notes":["誤り。都道府県公安委員会の認定を受けなければならない（警備業法第4条）。申請先は主たる営業所の所在地を管轄する公安委員会である（同法第5条第1項）。","誤り。外国の警備会社が日本国内で警備業務を行う場合は、その期間が限られているときであっても、法第4条の認定を受けなければならない（解釈運用基準第4）。","正しい。警備業法第5条第1項、警備業法施行規則第3条第2項。","誤り。認定の有効期間は、認定を受けた日から起算して5年である（警備業法第5条第4項）。なお、認定証は令和6年4月1日に廃止された。","誤り。欠格事由に該当する旨の通知は、理由を付した通知書を交付して行う（警備業法第5条第3項、警備業法施行規則第5条）。理由付記は具体的な事実を摘示して行う（解釈運用基準第5の4(1)）。"],"ref":["警備業法第4条・第5条","警備業法施行規則第3条第2項・第5条","解釈運用基準 第4・第5"],"src":[]},
{"id":"KA-008","cat":"hourei","sub":"警備業法","kubun":null,"stem":"認定の有効期間の更新に関する次の記述のうち、誤っているものはどれか。","choices":["認定の有効期間の満了後も引き続き警備業を営もうとする警備業者は、主たる営業所の所在地を管轄する公安委員会に、有効期間の更新を申請しなければならない。","有効期間の更新の申請は、認定の有効期間の満了の日の30日前までに行わなければならない。","公安委員会は、認定の有効期間の更新を申請した者が欠格事由のいずれにも該当しないと認めたときは、認定の有効期間を更新しなければならない。","認定の有効期間が満了したときは、認定は、その効力を失う。","更新された認定の有効期間は、更新を受けた日から起算して5年である。"],"answer":4,"notes":["正しい。警備業法第7条第1項。","正しい。警備業法施行規則第8条。","正しい。警備業法第7条第2項。欠格事由のいずれかに該当すると認めたときは、理由を付した通知書を交付して、認定の有効期間を更新しない旨を通知する（同条第3項、警備業法施行規則第10条）。","正しい。警備業法第7条第5項。","誤り。更新された認定の有効期間は、更新前の認定の有効期間が満了した日の翌日から起算して5年である（警備業法第5条第4項）。"],"ref":["警備業法第5条第4項・第7条","警備業法施行規則第8条・第10条"],"src":[]},
{"id":"KA-009","cat":"hourei","sub":"警備業法","kubun":null,"stem":"認定を受けたことを示す標識に関する次の記述のうち、正しいものはどれか。","choices":["常時使用する従業者の数が5人以下の警備業者は、自社のウェブサイトを有している場合であっても、標識をウェブサイトに掲載する義務はない。","警備業者は、標識を、主たる営業所のほか、その他の各営業所の見やすい場所にも掲示しなければならない。","「常時使用する従業者」には、会社役員及び個人事業主も含まれる。","標識は日本産業規格A4の用紙を縦向きにして作成しなければならず、横向きで作成したものは掲示義務を果たしたことにならない。","警備業者以外の者であっても、警備業者の標識に類似する標識であれば、掲示することができる。"],"answer":0,"notes":["正しい。常時使用する従業者の数が5人以下の場合はウェブサイトへの掲載義務が一律に除外される（警備業法施行規則第7条第1項第1号、解釈運用基準第6(4)）。警備業者が管理するウェブサイトを有していない場合も掲載は不要である（同項第2号）。","誤り。標識を掲示しなければならないのは主たる営業所の見やすい場所である（警備業法第6条第1項）。","誤り。「常時使用する従業者」とは労働基準法第20条の「予め解雇の予告を必要とする者」であり、会社役員及び個人事業主は該当しない（解釈運用基準第6(3)）。","誤り。用紙の大きさはA4とされているが向きは指定されておらず、縦横どちらで作成しても掲示義務に違反しない（解釈運用基準第6(1)）。","誤り。警備業者以外の者は、標識又はこれに類似する標識を掲示し、又はウェブサイト等で公衆の閲覧に供してはならない（警備業法第6条第2項）。"],"ref":["警備業法第6条","警備業法施行規則第6条・第7条","解釈運用基準 第6"],"src":[]},
{"id":"KA-010","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法第8条の認定の取消しに関する次の記述のうち、誤っているものはどれか。","choices":["偽りその他不正の手段により認定又は認定の有効期間の更新を受けたことが判明したときは、公安委員会は、その認定を取り消すことができる。","正当な事由がないのに、認定を受けてから6月以内に営業を開始せず、現に営業を営んでいないことが判明したときは、公安委員会は、その認定を取り消すことができる。","3月以上所在不明であることが判明したときは、公安委員会は、その認定を取り消すことができる。","経営不振や資金繰りの見込み違いにより営業を休止している場合は、認定の取消し事由における「正当な事由」に当たる。","警備員指導教育責任者を選任すると認められないことについて相当な理由がある者（法第3条第9号）に該当することは、法第8条第2号の取消し事由から除かれている。"],"answer":3,"notes":["正しい。警備業法第8条第1号。","正しい。警備業法第8条第3号。引き続き6月以上営業を休止し、現に営業を営んでいない場合も同様である。","正しい。警備業法第8条第4号。","誤り。「正当な事由」とは、自然災害の発生、病気等認定を受ける時点では予測し得なかった事態の発生等の合理的な理由に限られ、単に経営不振、資金繰りの見込み違い等による場合は当たらない（解釈運用基準第8の3(1)）。","正しい。法第8条第2号は「第3条各号（第9号を除く。）」に該当していることを取消し事由としている（警備業法第8条第2号）。"],"ref":["警備業法第8条","解釈運用基準 第8の3"],"src":[]},
{"id":"KA-011","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法第9条の届出（主たる営業所のある都道府県以外での営業所の設置等）に関する次の記述のうち、正しいものはどれか。","choices":["届出書は、主たる営業所の所在地を管轄する公安委員会に提出しなければならない。","当該都道府県の区域内において継続して行う期間が30日以内で、かつ、従事させる警備員の数が1日につき5人以内である警備業務を行う場合には、届出を要しない。","届出書は、営業所を設け、又は警備業務を行おうとする日から10日以内に提出すればよい。","個々の契約の期間がそれぞれ30日に満たなければ、当該都道府県の区域内で行われる警備業務が全体として30日を超える場合であっても、届出を要しない。","法第2条第1項第3号の警備業務は、当該都道府県の区域内に運搬物の発送場所又は到達場所がある場合であっても、届出を要しない。"],"answer":1,"notes":["誤り。当該都道府県の区域を管轄する公安委員会に提出する（警備業法第9条）。","正しい。警備業法施行規則第14条第1号。なお、日曜日、祝日等に業務を休むことがあっても「継続して行う」ものといえる（解釈運用基準第9の2(1)）。","誤り。営業所を設け、又は警備業務を行おうとする日の前日までに、所轄警察署長を経由して提出しなければならない（警備業法施行規則第11条第2項）。","誤り。個々の契約が30日に満たなくても、当該都道府県の区域内で行われる警備業務が全体として30日を超える場合は「30日以内」とはいえない（解釈運用基準第9の2(2)）。","誤り。届出が不要なのは、第3号の警備業務で当該都道府県の区域内に運搬物の発送場所及び到達場所がないものである（警備業法施行規則第14条第2号）。"],"ref":["警備業法第9条","警備業法施行規則第11条・第14条","解釈運用基準 第9"],"src":[]},
{"id":"KA-012","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業の廃止・変更・死亡等の届出に関する次の記述のうち、誤っているものはどれか。","choices":["警備業者は、警備業を廃止したときは、廃止した日から10日以内に、公安委員会に廃止の届出書を提出しなければならない。","廃止の届出書の提出があったときは、認定は、その効力を失う。","警備業者は、法第5条第1項各号に掲げる事項に変更があったときは、変更の日から10日（登記事項証明書を添付すべき場合は20日）以内に、主たる営業所の所在地を管轄する公安委員会に届出書を提出しなければならない。","認定を受けた個人が死亡したときは、同居の親族又は法定代理人が、遅滞なく、主たる営業所の所在地を管轄する公安委員会に届出書を提出しなければならない。","認定を受けた法人が合併により消滅したときは、消滅した法人の代表者であった者が届出書を提出しなければならない。"],"answer":4,"notes":["正しい。警備業法第10条第1項、警備業法施行規則第15条第2項（主たる営業所の所在地の所轄警察署長経由）。","正しい。警備業法第10条第2項。","正しい。警備業法第11条第1項、警備業法施行規則第17条第2項（主たる営業所の所在地の所轄警察署長経由）。","正しい。警備業法第12条第1項第1号。府令では当該事由の発生の日から10日以内とされている（警備業法施行規則第25条第2項）。法第9条の届出をしている場合は、その公安委員会にも提出する。","誤り。合併後存続し、又は合併により設立された法人の代表者が届出書を提出する（警備業法第12条第1項第2号）。"],"ref":["警備業法第10条〜第12条","警備業法施行規則第15条・第17条・第25条"],"src":[]},
{"id":"KA-013","cat":"hourei","sub":"警備業法","kubun":null,"stem":"名義貸しの禁止及び警備員の制限に関する次の記述のうち、正しいものはどれか。","choices":["名義貸しの禁止は、認定を受けていない者に名義を貸すことを禁じたものであり、認定を受けている他の警備業者に名義を貸すことは禁じられていない。","20歳未満の者は、警備員となってはならない。","警備業者は、自己の名義をもって、他人に警備業を営ませてはならない。","警備業者は、警備員を採用する際、本人から欠格事由に該当しない旨の誓約書の提出を受けていれば、それ以上の調査を行う必要はない。","法第3条第8号から第11号までのいずれかに該当する者も、警備員となってはならない。"],"answer":2,"notes":["誤り。法第13条は、認定を受けていない者に名義を貸すことのみならず、認定を受けている者に名義を貸すことも禁じている（警備業法第13条、解釈運用基準第12）。","誤り。警備員となってはならないのは18歳未満の者である（警備業法第14条第1項）。","正しい。警備業法第13条のとおり。認定を受けていない者に名義を貸すことだけでなく、認定を受けている者に名義を貸すことも禁じられている。また、委託を受けた警備業務を他の警備業者に再委託する場合も、その態様によっては名義貸しの禁止を潜脱するような形態となり、依頼者の信頼を損なうおそれがあることに留意する（解釈運用基準 第12）。","誤り。警備業者は一般私人として可能な範囲内で必要な調査をしなければならず、誓約書に加え、履歴書・診断書等の提出、面接調査、本人の承諾を得た前の職場への問合せなどの十分な措置を執るよう指導することとされている（警備業法第14条第2項、解釈運用基準第13）。","誤り。警備員となってはならないのは、18歳未満の者と法第3条第1号から第7号までのいずれかに該当する者である（警備業法第14条第1項）。"],"ref":["警備業法第13条・第14条","解釈運用基準 第12・第13"],"src":[]},
{"id":"KA-014","cat":"hourei","sub":"警備業法","kubun":null,"stem":"認定申請書の記載事項及び営業所に関する次の記述のうち、誤っているものはどれか。","choices":["「営業所」とは、所属する警備員に対する日常の配置運用又は日常の業務の指揮統轄が行われている場所をいい、一定以上の規模を有するものに限られる。","認定申請書には、営業所ごと及び当該営業所において取り扱う警備業務の区分ごとに、選任する警備員指導教育責任者の氏名及び住所を記載する。","法人が認定を申請する場合は、認定申請書にその役員の氏名及び住所を記載する。","主たる営業所は原則として会社法上の本店と一致するが、警備業に係る営業の中心となる営業所が会社法上の支店であるときは、一致しない場合もあり得る。","認定申請書に記載する「その他の営業所」には、主たる営業所の所在する都道府県の区域外に所在する営業所も含まれる。"],"answer":0,"notes":["誤り。「営業所」とは営業の拠点となるものをいい、その規模の大小を問わない（解釈運用基準第5の1(1)）。","正しい。警備業法第5条第1項第3号。","正しい。警備業法第5条第1項第4号。","正しい。解釈運用基準第5の1(2)。","正しい。「その他の営業所」とは、主たる営業所の所在する都道府県の区域内に所在するものだけでなく、当該警備業者の有する全ての営業所をいう（警備業法第5条第1項第2号、解釈運用基準第5の1(4)）。"],"ref":["警備業法第5条第1項","解釈運用基準 第5の1"],"src":[]},
{"id":"KA-015","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法第18条の特定の種別の警備業務に関する次の記述のうち、正しいものはどれか。","choices":["特定の種別の警備業務には、法第2条第1項第4号の警備業務（身辺警備）も含まれる。","特定の種別は、都道府県公安委員会規則で定められている。","機械警備業務は、特定の種別の警備業務の一つとされている。","警備業者は、特定の種別の警備業務を行うときは、国家公安委員会規則で定めるところにより、その種別ごとに合格証明書の交付を受けている警備員に、当該種別に係る警備業務を実施させなければならない。","検定合格警備員に特定の種別の警備業務を実施させる場合、業務の開始時に検定合格警備員が配置されていれば、その後は検定合格警備員が当該警備業務を実施していなくてもよい。"],"answer":3,"notes":["誤り。法第18条の警備業務は、第2条第1項第1号から第3号までのいずれかに該当するものに限られ、第4号は含まれない（警備業法第18条）。","誤り。国家公安委員会規則（警備員等の検定等に関する規則）で定められている（警備業法第18条、警備員等の検定等に関する規則第1条）。","誤り。種別は、空港保安警備業務、施設警備業務、雑踏警備業務、交通誘導警備業務、核燃料物質等危険物運搬警備業務及び貴重品運搬警備業務の6つであり、施設警備業務からは機械警備業務が除かれている（警備員等の検定等に関する規則第1条）。","正しい。警備業法第18条。","誤り。当該警備業務を行っている間は常時、検定合格警備員が実施していなければならない。ただし、業務上の必要のため短時間その場所を離れるなど、社会通念上継続して実施しているといえる場合は、この限りでない（解釈運用基準第17の2(1)）。"],"ref":["警備業法第18条","警備員等の検定等に関する規則第1条","解釈運用基準 第17"],"src":[]},
{"id":"KA-016","cat":"hourei","sub":"警備業法","kubun":null,"stem":"契約前書面（警備業法第19条第1項）に関する次の記述のうち、誤っているものはどれか。","choices":["警備業者は、警備業務の依頼者と警備業務を行う契約を締結しようとするときは、当該契約を締結するまでに、契約の概要について記載した書面を交付しなければならない。","依頼者と契約を締結した警備業者から警備業務の一部の再委託を受ける他の警備業者は、元請の警備業者に対して契約前書面を交付する必要はない。","契約前書面は、一の書面であることを要さず、契約書、警備計画書、パンフレット等の複数の書面によることも差し支えない。","府令で記載すべきとされている事項のうち、締結しようとする契約に含まれないものについては、その旨を記載すれば足りる。","法第2条第1項第1号の警備業務（機械警備業務を除く。）を行う契約の契約前書面には、警備業務に係る苦情を受け付けるための窓口を記載しなければならない。"],"answer":1,"notes":["正しい。警備業法第19条第1項。","誤り。再委託を受ける他の警備業者は、当該警備業務を行う契約を締結した者（元請の警備業者）に対して契約前書面及び契約後書面を交付する必要がある（解釈運用基準第18の1(3)）。","正しい。解釈運用基準第18の1(1)。","正しい。解釈運用基準第18の1(2)。","正しい。警備業法施行規則第33条第1号ネ。窓口とは、苦情の受付を担当する部署名、住所、電話番号等をいう（解釈運用基準第18の2(9)）。"],"ref":["警備業法第19条第1項","警備業法施行規則第33条","解釈運用基準 第18"],"src":[]},
{"id":"KA-017","cat":"hourei","sub":"警備業法","kubun":null,"stem":"契約後書面（警備業法第19条第2項）に関する次の記述のうち、正しいものはどれか。","choices":["警備業者は、警備業務を行う契約を締結したときは、契約締結の日から30日以内に契約後書面を交付しなければならない。","契約後書面の内容が契約前書面と同一である場合には、契約後書面を交付する必要はない。","契約後書面には、契約の締結年月日を記載する必要はない。","契約後書面は、依頼者に手渡せば足り、書面を十分に読むべき旨を告げるなど依頼者が確実に記載内容を了知する方法による必要はない。","契約後書面には、警備業務の対価その他依頼者が支払わなければならない金銭の額、その支払の時期及び方法、警備業務を行う期間並びに契約の解除に関する事項を記載しなければならない。"],"answer":4,"notes":["誤り。契約を締結したときは「遅滞なく」交付しなければならない（警備業法第19条第2項）。","誤り。同一内容であっても契約後書面を交付しなければならない。ただし、契約前書面を複写したものを契約後書面として交付することは差し支えない（解釈運用基準第18の1(4)）。","誤り。契約の締結年月日は記載事項である（警備業法第19条第2項第6号、警備業法施行規則第34条第2項第1号）。","誤り。依頼者に当該書面を十分に読むべき旨を告げて交付する方法その他の依頼者が確実に記載内容を了知する方法により交付しなければならない（警備業法施行規則第35条）。","正しい。警備業法第19条第2項第2号から第5号まで。"],"ref":["警備業法第19条第2項","警備業法施行規則第34条・第35条","解釈運用基準 第18の1(4)"],"src":[]},
{"id":"KA-018","cat":"hourei","sub":"警備業法","kubun":null,"stem":"書面の交付に代わる電磁的方法による提供及び苦情の解決に関する次の記述のうち、誤っているものはどれか。","choices":["警備業者は、依頼者の承諾を得て、書面に記載すべき事項を電磁的方法により提供することができ、この場合には書面を交付したものとみなされる。","電磁的方法により提供しようとするときは、あらかじめ、依頼者に対し、用いる電磁的方法の種類及び内容を示し、書面又は電磁的方法による承諾を得なければならない。","依頼者から一度承諾を得た場合には、その後に依頼者から電磁的方法による提供を受けない旨の申出があっても、電磁的方法により提供することができる。","電磁的方法は、依頼者がファイルへの記録を出力することにより書面を作成することができるものでなければならない。","警備業者は、常に、その行う警備業務について、依頼者等からの苦情の適切な解決に努めなければならず、この「依頼者等」には、警備業務実施場所の周辺住民や通行者等も含まれる。"],"answer":2,"notes":["正しい。警備業法第19条第3項。電子メールを利用する方法等がある（警備業法施行規則第36条第1項第1号イ、解釈運用基準第18の2(15)）。","正しい。警備業法施行令第1条第1項。示す事項は、府令第36条第1項の方法のうち警備業者が使用するもの及びファイルへの記録の方式である（警備業法施行規則第37条）。","誤り。電磁的方法による提供を受けない旨の申出があったときは、電磁的方法によって提供してはならない。ただし、依頼者が再び承諾をした場合はこの限りでない（警備業法施行令第1条第2項）。","正しい。警備業法施行規則第36条第2項。","正しい。警備業法第20条、解釈運用基準第19。"],"ref":["警備業法第19条第3項・第20条","警備業法施行令第1条","警備業法施行規則第36条・第37条","解釈運用基準 第18の2(15)・第19"],"src":[]},
{"id":"KA-019","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法第2条第1項の警備業務の範囲に関する次の記述のうち、正しいものはどれか。","choices":["事業者が労働安全衛生法の規定によりその従業員を使用して行う労働災害防止の業務は、法第2条第1項第2号の警備業務に該当する。","法第2条第1項第1号の警備業務対象施設は建物に限られ、海水浴場や湖等に設けられた施設はこれに当たらない。","緊急通報サービスの契約書等で「警戒し、防止する」対象を病気やけが等による緊急事態に限定している場合は、その業務が警備業務に当たることはない。","倉庫業者が通常の倉庫業の業務として必要な範囲で、自己の従業員を倉庫に配置して受託品の盗難等を防止する程度の業務は、警備業務に該当しない。","「他人の需要に応じて行う」にいう「他人」とは、当該業務を行う者以外の個人をいい、会社などの法人はこれに含まれない。"],"answer":3,"notes":["誤り。事業者が労働安全衛生法の規定によりその従業員を使用して行う労働災害防止の業務は、警備業務に該当しない業務として示されている（解釈運用基準第2の1(1)）。","誤り。「事務所、住宅、興行場、駐車場、遊園地等」は施設の例示であり、工場、学校等のほか、海水浴場、湖等に設けられた施設等も警備業務対象施設に該当する（解釈運用基準第2の1(2)）。","誤り。対象を病気、けが等による緊急事態に限定していても、そこに「盗難等の事故」や「危害」によるものが含まれる可能性があるので、契約書等の内容、当事者の意思及び業務の実態に照らし、法第2条第1項第1号又は第4号の業務を含む場合がある（解釈運用基準第2の1(6)）。","正しい。運送業者、倉庫業者、建設業者がそれぞれ通常の業務の内容として必要とされる範囲で自己の従業員を用いて行う事故防止の業務等は、警備業務に該当しない業務として示されている（解釈運用基準第2の1(1)）。","誤り。「他人」とは、当該業務を行う者以外の個人、法人等をいう（解釈運用基準第2の1(1)）。"],"ref":["警備業法第2条第1項","解釈運用基準 第2の1(1)・(2)・(6)"],"src":[]},
{"id":"KA-020","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法の目的及び用語の解釈に関する次の記述のうち、誤っているものはどれか。","choices":["電話その他送信者の音声を送信し、及び受信するための装置も、法第2条第5項の警備業務用機械装置に当たる。","法の目的である「警備業務の実施の適正を図る」とは、警備業務の実施に伴う違法又は不当な事態の発生を防止し、あわせて警備業務の適切な実施を促進することをいう。","警備業務に従事しているか否かは、警備業者の指揮監督の下に労務を提供した事実の有無や、労務に対する対価の受領の有無等の事情を総合的に判断する。","警備業務に該当する緊急通報サービスで、緊急通報装置で感知した情報を高齢者宅等に設置する機器を通じて施設外の機器に送受信して行うものは、機械警備業務に当たる。","法第2条第5項の「警備業務用機械装置」とは、各種センサー、非常通報装置等を用いた機器の全体をいう。"],"answer":0,"notes":["誤り。法第2条第5項の内閣府令で定める装置（警備業務用機械装置）は、電話その他送信者の音声を送信し、及び受信するための装置以外の装置とされている（警備業法施行規則第2条）。","正しい。解釈運用基準第1。警備業者等に対する指導及び監督は、このような法の目的に資するものでなければならないとされている。","正しい。「警備員」の「従業者」には、雇用契約以外の契約に基づき警備業務に従事する者も含まれ、警備業務に従事しているか否かは、指揮監督の下での労務の提供、対価の受領の有無等の事情を総合的に判断して、当該業務への関与の度合いを評価して判断する（解釈運用基準第2の3）。","正しい。警備業務用機械装置を使用して法第2条第1項第1号の警備業務を行うと解されるので、機械警備業務に該当する（解釈運用基準第2の4）。なお、携帯型発信器から直接施設外の機器に送信するものは、同項第4号の警備業務に当たり、機械警備業務には当たらない。","正しい。解釈運用基準第2の4。受信機器が当該警備業務対象施設以外の施設に設置されている場合に限られるので、同一建造物の内部で完結している装置は警備業務用機械装置ではない。"],"ref":["警備業法第1条・第2条第4項・第5項","警備業法施行規則第2条","解釈運用基準 第1・第2の3・第2の4"],"src":[]},
{"id":"KA-021","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業の要件（警備業法第3条）の該当性の判断に関する次の記述のうち、正しいものはどれか。","choices":["法第3条第2号に該当するかどうかは、申請者の住所地を管轄する警察署長への照会により判断する。","法第3条第3号の「警備業務に関し」には、勤務時間外の行為は、警備員の立場を利用して行われたものであっても含まれない。","警備業の要件に関する規則第1条第2号の「違法な行為」に当たるためには、違法性のほか、責任要素も必要である。","認定の判断時点で指導教育責任者として選任しようとする者を具体的に決めていなくても、営業開始までに選任する予定であれば、法第3条第9号には該当しない。","検察庁又は裁判所の処分結果が不起訴（起訴猶予を除く。）又は無罪の場合は、原則として、法第3条第3号に該当しないものとして取り扱う。"],"answer":4,"notes":["誤り。法第3条第2号該当の有無は、申請者の本籍地の市区町村長に対する前科照会により判断する（解釈運用基準第3の2(1)）。","誤り。「警備業務に関し」とは、警備業務を行うに当たって違反が行われた場合、警備業者又は警備員の立場を利用して違反が行われた場合等をいい、勤務時間中の行為でも全く私行上のものは含まれず、勤務時間外の行為でもその立場を利用して行われたものは含まれる（解釈運用基準第3の3(3)）。","誤り。「違法な行為」とは、列挙された罪に当たる行為で違法性阻却事由のないものをいい、違法性は必要であるが、責任要素までは必要としない（解釈運用基準第3の3(4)）。","誤り。警備業を営もうとする者は、認定を受けて営業を始めようとする時点で指導教育責任者を選任していなければならず、認定の判断時点で選任しようとする者を具体的に決めていない場合は第9号に該当する（解釈運用基準第3の9(2)）。","正しい。解釈運用基準第3の3(2)。第3号該当の有無は、公安委員会が既存の資料や調査結果に基づいて判断する。"],"ref":["警備業法第3条","警備業の要件に関する規則第1条","解釈運用基準 第3の2・第3の3・第3の9"],"src":[]},
{"id":"KA-022","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法第3条第4号、第5号及び第11号の欠格事由に関する次の記述のうち、誤っているものはどれか。","choices":["暴力団員でなくなった日から5年を経過しない者は、法第3条第4号に該当しないと認める特段の事情がある者を除き、同号に該当する。","法第3条第11号の欠格事由は、法人である事業者に限って適用され、個人で警備業を営む者には適用されない。","過去10年間に暴力的不法行為等を行ったことがあり、その動機、背景、手段、日常の素行等から見て強いぐ犯性が認められる者は、法第3条第4号に該当する。","指定暴力団等に所属しない者が、その名刺やバッジを借りて威力を示し不当な要求をしたため中止命令を受けたときは、その日から3年を経過しない間、法第3条第5号に該当する。","法第3条第11号の欠格事由は、暴力団員等から脅迫その他の不当な行為を受けて事業活動に支配的な影響力を受けることとなった被害者を含む趣旨ではない。"],"answer":1,"notes":["正しい。解釈運用基準第3の4(1)イ。暴力団員（同ア）も第4号に該当する。","誤り。第11号は、法人のみに適用される第10号と異なり、個人事業者にも適用される欠格事由である（解釈運用基準第3の11(1)）。","正しい。解釈運用基準第3の4(1)エ。暴力的不法行為等は、警備業の要件に関する規則第2条に定められている。","正しい。指定暴力団等に所属していない者による準暴力的要求行為（暴力団員による不当な行為の防止等に関する法律第2条第8号・第12条の5）について同法第12条の6の規定による命令を受けた者は、その命令を受けた日から起算して3年を経過しない間、第5号に該当する（警備業法第3条第5号、解釈運用基準第3の5(3)）。","正しい。解釈運用基準第3の11(1)なお書き。典型的には、暴力団員等が多額の出資や融資、取引関係を背景として事業活動に支配的な影響力を有している場合が該当する（同(2)）。"],"ref":["警備業法第3条第4号・第5号・第11号","警備業の要件に関する規則第2条","解釈運用基準 第3の4・第3の5・第3の11"],"src":[]},
{"id":"KA-023","cat":"hourei","sub":"警備業法","kubun":null,"stem":"認定申請書に添付する書類（警備業法施行規則第4条）に関する次の記述のうち、正しいものはどれか。","choices":["申請者が法人である場合は、定款及び登記事項証明書を添付すれば足り、その役員に係る履歴書や診断書等の書類を添付する必要はない。","個人の申請者が添付する市町村長の証明書は、拘禁刑以上の刑に処せられたことがない旨を証明するものである。","申請者が個人である場合は、アルコール、麻薬、大麻、あへん又は覚醒剤の中毒者に該当しない旨の医師の診断書を添付する。","精神機能の障害に関する医師の診断書は、精神科を専門とする医師が作成したものでなければならない。","選任する指導教育責任者に係る添付書類は、指導教育責任者資格者証の写しに限られる。"],"answer":2,"notes":["誤り。法人の場合は、定款及び登記事項証明書のほか、役員に係る履歴書、住民票の写し、市町村長の証明書及び医師の診断書並びに法人が法第3条第1号から第3号まで、第10号及び第11号に該当しないことを誓約する書面を添付する（警備業法施行規則第4条第1項第2号）。","誤り。市町村長の証明書は、準禁治産者又は破産手続開始の決定を受けて復権を得ない者に該当しない旨の証明書である（警備業法施行規則第4条第1項第1号ハ）。法第3条第2号該当の有無は、公安委員会が前科照会により判断する（解釈運用基準第3の2(1)）。","正しい。警備業法施行規則第4条第1項第1号ニ（法第3条第6号に掲げる者に該当しない旨の医師の診断書）。このほか、精神機能の障害に関する医師の診断書（同号ホ）も添付する。","誤り。診断書を作成する医師の専門分野は問わない。ただし、法第3条第7号に該当しないことが明らかではない旨記載された診断書が提出された場合は、必要に応じ、公安委員会が指定する医師の診断を受けることが求められる（警備業法施行規則第4条第2項、解釈運用基準第3の7(2)）。","誤り。資格者証の写しのほか、誠実に業務を行うことを誓約する書面、履歴書及び住民票の写し、市町村長の証明書、中毒者に該当しない旨の医師の診断書、法第22条第4項各号に該当しないことを誓約する書面を添付する（警備業法施行規則第4条第1項第3号）。"],"ref":["警備業法第5条第1項","警備業法施行規則第4条","解釈運用基準 第3の2(1)・第3の7(2)"],"src":[]},
{"id":"KA-024","cat":"hourei","sub":"警備業法","kubun":null,"stem":"認定及び認定の有効期間の更新の手続に関する次の記述のうち、誤っているものはどれか。","choices":["警備業法及び同法施行規則の規定により公安委員会に提出すべき申請書又は届出書の通数は、1通とされている。","認定申請書の提出を受けた所轄警察署では、記載漏れの有無や添付書類の有無等の形式的要件を確認する。","公安委員会は、認定の有効期間を更新したときは、更新を申請した者にその旨を通知する。","認定の有効期間の更新の際に、更新をする公安委員会が変わった場合は、新たな認定の番号が付される。","法人が提出する認定申請書に記載する「住所」とは、会社にあっては本店の所在地をいう。"],"answer":3,"notes":["正しい。警備業法施行規則第1条。","正しい。解釈運用基準第5の2。認定更新申請書の形式審査も同様である（同第7(1)）。","正しい。警備業法施行規則第9条。なお、更新しない旨の通知は、理由を付した通知書を交付して行う（同規則第10条）。","誤り。主たる営業所の移転等により、認定の有効期間を更新する公安委員会が変更される場合であっても、認定の番号は変更しない（解釈運用基準第5の3・第7(2)）。","正しい。法第5条第1項第1号の「住所」とは、申請者が法人の場合には主たる事務所の所在地をいい、特に会社については本店の所在地をいう（解釈運用基準第5の1(3)）。"],"ref":["警備業法第5条・第7条","警備業法施行規則第1条・第9条・第10条","解釈運用基準 第5・第7"],"src":[]},
{"id":"KA-025","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法第8条の認定の取消しに関する次の記述のうち、正しいものはどれか。","choices":["法第8条第3号の「現に営業を営んでいない」かの認定では、警備業務や契約の有無のほか、入札参加、広告宣伝、警備員教育等の有無も確認する。","偽りその他不正の手段により認定を受けたことを理由とする取消しは、取消しの時点で主たる営業所の所在地を管轄する公安委員会が行う。","ある区分の警備業務について6月以上営業を休止していれば、他の区分の警備業務を行っていても、認定の取消し事由に該当する。","法人業者が「所在不明」であるとは、代表者の所在が不明であれば足り、本店や支店の実態、収支、財産、使用人等の有無は問わない。","複数の都道府県で警備業務を行う警備業者について法第8条第3号又は第4号に基づく取消しを行おうとする公安委員会は、自らの管轄区域内の営業の実態のみで判断する。"],"answer":0,"notes":["正しい。警備業務を行っていないこと及び警備業務契約を締結していないことに加え、契約の締結を目的とする入札への参加や広告宣伝活動、契約を締結した場合に備えた警備員教育等を行っていないことを確認する（解釈運用基準第8の3(2)）。","誤り。第1号に基づく取消しは、行政行為の成立そのものに瑕疵がある場合の取消しであるから、認定をした公安委員会（認定の有効期間が更新された場合には、当該更新をした公安委員会）が行う（解釈運用基準第8の1）。","誤り。他の区分の警備業務が行われている場合には認定の取消し事由に該当しないので、変更の届出を求め、これが行われないときは指示又は営業停止命令を行う（解釈運用基準第8の3(3)）。","誤り。法人業者の「所在不明」とは、代表者その他の役員、株主等の所在が不明で法人の機関が機能し得ないことのほか、本店及び支店の実態、収支、財産、使用人等が存在しないこと等を総合的に勘案し、事業活動が存在し得ないと判断される場合をいう（解釈運用基準第8の3(4)）。","誤り。複数の都道府県で警備業務を行う警備業者について第3号又は第4号に基づく取消しを行おうとする公安委員会は、他の公安委員会の管轄区域内における営業の実態も把握して取消しの可否及び要否を総合的に判断する必要があり、関係する公安委員会は相互に協力する（解釈運用基準第8の2）。"],"ref":["警備業法第8条","解釈運用基準 第8"],"src":[]},
{"id":"KA-026","cat":"hourei","sub":"警備業法","kubun":null,"stem":"主たる営業所のある都道府県以外の都道府県で、営業所を設けずに警備業務を行う場合の届出（警備業法第9条）に関する次の記述のうち、正しいものはどれか。","choices":["届出書は、主たる営業所の所在地の所轄警察署長を経由して、警備業務を行おうとする日の前日までに提出する。","届出書には、当該警備業務に係る営業所の指導教育責任者の資格者証の写しを添付しなければならない。","既に同条の届出書を提出している都道府県の区域内で新たな警備業務を行おうとするときも、改めて同条の届出書を提出する。","届出を要しない警備業務の要件である「継続して行う」とは、休日を含めて毎日業務が行われることをいい、日曜日や祝日に業務を休むものは含まれない。","届出書には、当該区域内で行おうとする警備業務に係る営業所の名称及び所在地並びにその営業所において取り扱う警備業務の区分を記載する。"],"answer":4,"notes":["誤り。営業所を設けずに警備業務を行う場合は、当該警備業務を行おうとする場所（2以上あるときは、そのいずれか一の場所）の所轄警察署長を経由して提出する（警備業法施行規則第11条第2項）。前日までに提出する点は正しい。","誤り。法第9条の届出書に添付する書類は、当該都道府県の区域内に設けようとする営業所について選任する指導教育責任者に係る書類とされており（警備業法施行規則第13条）、営業所を設けずに警備業務のみを行う場合には、これらの書類の添付は要しない。","誤り。同条の届出書は、その都道府県の区域内で初めて営業所を設け、又は警備業務を行おうとするときに提出するもので、既に届出をしている区域内で新たな警備業務を行おうとするときは、法第11条第3項の規定による変更届出書を提出する（解釈運用基準第9の1）。","誤り。「継続して行う」とは、契約の相手方、業務実施場所、業務実施の方法等が一定しているなど、業務が続けて行われることが合理的に推測される場合をいい、日曜日、祝日等に業務を休むことがあっても継続して行うものといえる（解釈運用基準第9の2(1)）。","正しい。警備業法第9条第3号、警備業法施行規則第12条第2号。このほか、認定をした公安委員会の名称及び認定の番号、区分ごとに選任する指導教育責任者の氏名及び住所なども記載する（同条第1号・第3号）。"],"ref":["警備業法第9条","警備業法施行規則第11条〜第14条","解釈運用基準 第9"],"src":[]},
{"id":"KA-027","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法令に定める届出の期限に関する次の記述のうち、誤っているものはどれか。","choices":["認定を受けた法人が合併により消滅したときの届出書は、その事由の発生の日から10日以内に提出しなければならない。","主たる営業所のある都道府県以外の都道府県にある営業所の指導教育責任者を変更したときは、その都道府県の公安委員会に20日以内に届け出ればよい。","護身用具を変更するときの届出書は、変更に係る護身用具の携帯の開始の日の前日までに提出しなければならない。","法第9条の届出をした者の認定の有効期間が満了したときは、事由の発生の日から10日以内に、当該届出をした公安委員会に届出書を提出しなければならない。","法第9条の届出をした都道府県の区域内で警備業務を行わないこととなったときは、その日から10日以内に当該区域の公安委員会に届出書を提出しなければならない。"],"answer":1,"notes":["正しい。法第12条第1項の届出書は、当該事由の発生の日から10日以内に提出する（警備業法施行規則第25条第2項）。届出をするのは、合併後存続し、又は合併により設立された法人の代表者である（警備業法第12条第1項第2号）。","誤り。法第9条第3号に掲げる事項（当該区域内の営業所において選任する指導教育責任者の氏名及び住所等）の変更の届出書は、変更の日から10日以内に、当該変更に係る公安委員会に提出する（警備業法第11条第3項、警備業法施行規則第12条第3号・第21条第2項）。法第5条第1項第3号の事項の変更として、主たる営業所の所在地を管轄する公安委員会にも10日以内に届け出る（同規則第17条第2項）。","正しい。警備業法第17条第2項で準用する第11条第1項、警備業法施行規則第32条第2項。","正しい。警備業法第12条第2項、警備業法施行規則第25条第2項。認定が取り消されたときも同様である。","正しい。都道府県内廃止届出書（別記様式第8号）は、警備業務を行わないこととなった日から10日以内に提出する（警備業法第11条第3項、警備業法施行規則第21条第1項ただし書・第3項）。"],"ref":["警備業法第11条・第12条・第17条第2項","警備業法施行規則第17条・第21条・第25条・第32条"],"src":[]},
{"id":"KA-028","cat":"hourei","sub":"警備業法","kubun":null,"stem":"変更の届出（警備業法第11条）に関する次の記述のうち、正しいものはどれか。","choices":["主たる営業所のある都道府県以外の都道府県にある営業所の名称を変更したときは、主たる営業所の所在地を管轄する公安委員会に届け出れば足りる。","警備業者の名称の変更の届出を受けた公安委員会は、その内容を、当該警備業者が営業所を設けている他の都道府県の公安委員会に通知することとはされていない。","指導教育責任者を変更したときの変更届出書には、新たに選任した指導教育責任者に係る資格者証の写し等の書類を添付する。","法第9条の届出をした都道府県の区域内での警備業務を縮小し、府令第14条の警備業務（継続して30日以内かつ1日5人以内のもの等）のみを行うこととなったときは、届出を要しない。","それまで警備業務を行っていなかった都道府県の区域内に新たに営業所を設け、これを主たる営業所とするときは、変更届出書を提出すれば足り、営業所設置等届出書は要しない。"],"answer":2,"notes":["誤り。その営業所の名称は、法第5条第1項第2号の事項であると同時に法第9条第3号の事項（警備業法施行規則第12条第2号）でもあるので、主たる営業所の所在地を管轄する公安委員会（法第11条第1項）のほか、当該変更に係る公安委員会にも届け出る（法第11条第3項、解釈運用基準第10の2(2)イ）。","誤り。法第5条第1項第1号（氏名又は名称等）、第2号（主たる営業所に係る部分に限る。）又は第4号（役員）の事項の変更の届出を受けた公安委員会は、その内容を、当該警備業者が営業所を設け、又は法第9条の警備業務を行っている都道府県の公安委員会に通知する（警備業法第11条第2項）。","正しい。変更届出書には、警備業法施行規則第4条第1項各号の書類のうち当該変更事項に係る書類を添付する（同規則第19条第1号）。公安委員会は、新たに選任する指導教育責任者が法第22条第7項各号のいずれかに該当するか否かを添付書類等により確認する（解釈運用基準第10の3）。","誤り。当該区域内における警備業務の規模を順次縮小すること等により府令第14条の警備業務のみを行うこととなった場合も、都道府県内廃止届出書の提出を要する（解釈運用基準第10の2(2)ア）。","誤り。それ以前には警備業務が行われていなかった都道府県の区域内に新たに営業所を設け、その営業所を主たる営業所とする場合は、法第11条第1項の変更届出書に加え、営業所設置等届出書（法第9条）も併せて提出する（解釈運用基準第10の5）。"],"ref":["警備業法第9条・第11条","警備業法施行規則第12条・第19条","解釈運用基準 第10"],"src":[]},
{"id":"KA-029","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備員の制限（警備業法第14条）に関する次の記述のうち、誤っているものはどれか。","choices":["精神機能の障害により、警備業務を適正に行うに当たって必要な認知、判断及び意思疎通を適切に行うことができない者は、警備員となってはならない。","警備業法以外の法律の規定に違反して罰金の刑に処せられたことは、法第3条第2号の欠格事由には当たらない。","警備業者は、警備員の欠格事由の該当の有無を確認するため、一般私人として可能な範囲内で必要な調査をしなければならない。","最近5年間に警備業務に関し重大な不正行為をした者であっても、その行為により刑に処せられていなければ、警備員となることができる。","警備員の採用に当たり、事前に本人の承諾を得て前の警備業務に係る職場に問い合わせることは、欠格事由を確認する措置の一つとされている。"],"answer":3,"notes":["正しい。法第3条第7号に該当する者は警備員となってはならない（警備業法第14条第1項）。同号の者は、精神機能の障害により警備業務を適正に行うに当たって必要な認知、判断及び意思疎通を適切に行うことができない者である（警備業の要件に関する規則第3条第1項）。","正しい。法第3条第2号の対象は、拘禁刑以上の刑に処せられた者及び警備業法の規定に違反して罰金の刑に処せられた者で、その執行を終わり、又は執行を受けることがなくなった日から起算して5年を経過しないものである。","正しい。法第14条第2項により欠格事由に該当する者を警備業務に従事させてはならないことに伴い、警備業者は、警備員の欠格事由該当の有無を確認するため、一般私人として可能な範囲内で必要な調査をしなければならない（解釈運用基準第13）。","誤り。法第3条第3号に該当する者（最近5年間に、警備業法令の規定・処分に違反し、又は警備業務に関し他の法令の規定に違反する重大な不正行為で警備業の要件に関する規則第1条に定めるものをした者）は、警備員となってはならない（警備業法第14条第1項）。同号は、刑に処せられたことを要件としていない。","正しい。本人から欠格事由に該当しない旨の誓約書の提出を受けることに加えて、履歴書、診断書等の提出を受けたり、面接調査を行ったり、事前に本人の承諾を得て前の警備業務に係る職場に問い合わせるなどの十分な措置を執るよう指導することとされている（解釈運用基準第13）。"],"ref":["警備業法第3条・第14条","警備業の要件に関する規則第1条・第3条","解釈運用基準 第13"],"src":[]},
{"id":"KA-030","cat":"hourei","sub":"警備業法","kubun":null,"stem":"次の行為のうち、警備業法第3条第3号の「重大な不正行為」として警備業の要件に関する規則に定められていないものはどれか。ただし、警備業法以外の法令に違反する行為は、警備業務に関して行われたものとする。","choices":["警備業法第49条第1項の規定により公安委員会から受けた営業停止命令に違反する行為","労働者派遣法第4条第1項の規定に違反し、警備業務について労働者派遣事業を行う行為","職業安定法第44条の規定に違反して労働者供給事業を行う行為","警備員が業務中に通行人を殴打して負傷させるなど、刑法第204条の傷害罪に当たる違法な行為","労働基準法第32条の規定に違反し、法定労働時間を超えて警備員を労働させる行為"],"answer":4,"notes":["誤り。法第49条の規定に基づく処分に違反する行為は、重大な不正行為として定められている（警備業の要件に関する規則第1条第1号）。","誤り。労働者派遣事業の適正な運営の確保及び派遣労働者の保護等に関する法律第4条第1項（警備業務について労働者派遣事業を行うことの禁止）の規定に違反する行為は、重大な不正行為として定められている（警備業の要件に関する規則第1条第3号）。","誤り。職業安定法第44条（労働者供給事業の禁止）の規定に違反する行為は、重大な不正行為として定められている（警備業の要件に関する規則第1条第3号）。","誤り。刑法第204条（傷害）の罪に当たる違法な行為は、重大な不正行為として定められている（警備業の要件に関する規則第1条第2号ア）。","正しい。労働基準法については、第5条（強制労働の禁止）の規定に違反する行為が重大な不正行為として定められているが、第32条（労働時間）の規定に違反する行為は定められていない（警備業の要件に関する規則第1条第3号）。"],"ref":["警備業法第3条第3号","警備業の要件に関する規則第1条"],"src":[]},
{"id":"KA-031","cat":"hourei","sub":"警備業法","kubun":null,"stem":"契約前書面の記載事項（警備業法施行規則第33条）に関する次の記述のうち、正しいものはどれか。","choices":["法第2条第1項第3号の警備業務を2以上の車両を使用して行う契約の契約前書面には、これらの車両の車列の編成を記載しなければならない。","法第2条第1項第2号の警備業務を行う契約の契約前書面には、警備業務対象施設の鍵の管理に関する事項を記載しなければならない。","法第2条第1項第4号の警備業務を行う契約の契約前書面には、警備業務の対象となる者の氏名を記載するが、その住所又は居所の記載は要しない。","機械警備業務を行う契約の契約前書面に記載すべき事項は、基地局及び待機所の所在地並びに警備業務用機械装置の概要に限られる。","警備業務の再委託に関する事項は、契約後書面には記載するが、契約前書面には記載を要しない。"],"answer":0,"notes":["正しい。警備業法施行規則第33条第3号ハ。第3号の警備業務の契約では、このほか、運搬物、路程、運搬物の管理に関する事項、盗難等の事故発生時の措置等を記載する（同号イ・ロ・ニ・ホ・ヘ）。","誤り。第2号の警備業務の契約前書面には、警備業務を行うこととする場所及びその場所における負傷等の事故発生時の措置等を記載するが、警備業務対象施設の名称・所在地、鍵の管理に関する事項及び施設における盗難等の事故発生時の措置は記載事項とされていない（警備業法施行規則第33条第2号）。","誤り。警備業務の対象となる者の氏名及び住所又は居所を記載する（警備業法施行規則第33条第4号イ）。危害が発生するおそれがあり、又は発生したときの措置も記載する（同号ロ）。","誤り。機械警備業務の契約前書面には、基地局及び待機所の所在地、感知機器の設置場所・種類その他警備業務用機械装置の概要のほか、待機所から警備業務対象施設までの路程、送信機器の維持管理の方法、第1号イからナまでに掲げる事項も記載する（警備業法施行規則第33条第5号）。","誤り。警備業務の再委託に関する事項は、契約前書面の記載事項であり（警備業法施行規則第33条第1号カ等）、契約後書面にも記載する（同規則第34条第2項第2号）。"],"ref":["警備業法第19条第1項","警備業法施行規則第33条・第34条"],"src":[]},
{"id":"KA-032","cat":"hourei","sub":"警備業法","kubun":null,"stem":"契約前書面及び契約後書面の記載等に関する次の記述のうち、誤っているものはどれか。","choices":["「警備業務を行う日及び時間帯」は、契約の内容に応じ、「警備業務を実施するときまでに決める。」と記載して差し支えない。","府令第33条第3号ロの「警備業務を行う路程」は、想定し得る全ての路程を記載しなければならず、地図によって示すことはできない。","「警備業務に従事させる警備員が有する知識及び技能」とは、例えば、合格証明書の交付を受けていることや、語学検定に合格していること等をいう。","契約後書面が契約前書面と同一の内容である場合には、契約前書面を複写したものを契約後書面として交付して差し支えない。","機械警備業務の契約前書面に記載する、警備員が現場に到着するまでに「通常要する時間」は、「おおむね20分程度」のような記載で差し支えない。"],"answer":1,"notes":["正しい。日及び時間帯、場所、路程等は、契約前書面にあっては締結しようとする契約の内容に応じ、契約後書面にあっては締結した契約の内容に応じ、「警備業務を実施するときまでに決める。」「天候、交通事情等によって変更があり得る。」等と記載し、又は選択し得る複数のものを記載して差し支えない（解釈運用基準第18の2(1)）。","誤り。「路程」とは経路及び経路上の距離をいい、想定し得る全ての路程を記載する必要はなく、地図によって示すことも可能であり、交通事情等を勘案して警備業者が適宜必要と認める路程等の記載でも差し支えない（解釈運用基準第18の2(11)）。","正しい。このほか、武道の段級位を有していること等も例示されている（警備業法施行規則第33条第1号ホ、解釈運用基準第18の2(3)）。","正しい。契約後書面が契約前書面と同一の内容であっても契約後書面は交付しなければならないが、契約前書面を複写したものを契約後書面として交付することは差し支えない（解釈運用基準第18の1(4)）。","正しい。路程を記載することが困難な事情があるときは、情報の受信の時から警備員が現場に到着する時までに通常要する時間を記載する（警備業法施行規則第33条第5号ハ）。幅のない所要時間は必ずしも要さず、「おおむね20分程度」「25分以内の予定」等の記載で差し支えない（解釈運用基準第18の2(12)）。"],"ref":["警備業法第19条第1項・第2項","警備業法施行規則第33条","解釈運用基準 第18の1(4)・第18の2"],"src":[]},
{"id":"KA-033","cat":"hourei","sub":"警備業法","kubun":null,"stem":"契約前書面及び契約後書面の交付の方法並びに電磁的方法による提供に関する次の記述のうち、正しいものはどれか。","choices":["書面の交付に代えて電磁的方法により提供できるのは契約後書面に限られ、契約前書面は書面で交付しなければならない。","電磁的方法による提供の承諾を得る際に示す事項は、警備業者が使用する方法に限られ、ファイルへの記録の方式を示す必要はない。","警備業者のウェブサイトに記載事項を掲載し、依頼者にダウンロードさせる方法は、書面の交付に代わる方法として認められていない。","府令第35条の「依頼者が確実に当該書面の記載内容を了知する方法」には、警備業者が依頼者に書面を読み聞かせる方法も含まれる。","府令第37条第2号の「ファイルへの記録の方式」とは、ファイルを記録する電磁的記録媒体の種類をいう。"],"answer":3,"notes":["誤り。法第19条第3項は「前二項の規定による書面の交付に代えて」と定めており、依頼者の承諾を得れば、契約前書面及び契約後書面のいずれについても、記載すべき事項を電磁的方法により提供することができる。","誤り。あらかじめ示すべき電磁的方法の種類及び内容は、警備業者が使用する方法及びファイルへの記録の方式である（警備業法施行令第1条第1項、警備業法施行規則第37条）。","誤り。警備業者がウェブサイトで依頼者の閲覧に供し、依頼者がダウンロードする方法は、警備業法施行規則第36条第1項第1号ロの方法に当たる（解釈運用基準第18の2(16)）。このほか、電子メールを利用する方法（同号イ）、電磁的記録媒体に記録したものを交付する方法（同項第2号）がある。","正しい。依頼者に書面を十分に読むべき旨を告げて交付する方法のほか、書面を読み聞かせる方法、依頼者が書面を十分に読んだ場合にその旨の記述及び署名を求める方法等をいう（警備業法施行規則第35条、解釈運用基準第18の2(14)）。","誤り。「ファイルへの記録の方式」とは、使用ソフトウェアの形式及びバージョン等をいう（解釈運用基準第18の2(17)）。"],"ref":["警備業法第19条","警備業法施行令第1条","警備業法施行規則第35条〜第37条","解釈運用基準 第18の2(14)〜(17)"],"src":[]},
{"id":"KA-034","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法第3条第10号の法人の役員に関する次の記述のうち、正しいものはどれか。","choices":["役員のうちに、営業に関し成年者と同一の行為能力を有しない未成年者がいる法人は、同号に該当する。","一般社団法人の理事は、同号の役員のうち「取締役」に当たる。","同号の「執行役」とは、監査役会設置会社に置かれ、その会社の業務執行を行う者をいう。","法人に対し取締役等と同等以上の支配力を有するかどうかは、出資の割合のみによって形式的に判断する。","株式会社の監査役は、同号の役員のうち「これらに準ずる者」に当たる。"],"answer":4,"notes":["誤り。第10号は、役員のうちに第1号から第7号までのいずれかに該当する者がある法人を欠格とするもので、第8号（営業に関し成年者と同一の行為能力を有しない未成年者）は含まれない（警備業法第3条第10号）。","誤り。同号の「取締役」とは、株式会社におけるものである（解釈運用基準第3の10(1)）。一般社団法人・一般財団法人及び公益法人の理事及び監事は、「これらに準ずる者」に当たる（同(3)）。","誤り。「執行役」とは、会社法第402条に規定する、指名委員会等設置会社に置かれ、その業務執行を行うものである（解釈運用基準第3の10(2)）。","誤り。その者が自己の地位や権限などに基づいて法人の意思決定に関しどの程度実質的な影響力を及ぼし得るかについて、個別具体的に検証する（解釈運用基準第3の10(4)）。相談役又は顧問の名称を有する者、発行済株式の総数の100分の5以上の株式を所有する株主、出資の総額の100分の5以上を出資している者等は、これに該当することが多いとされている。","正しい。「これらに準ずる者」には、株式会社の監査役、一般社団法人・一般財団法人及び公益法人の理事及び監事等が該当する（解釈運用基準第3の10(3)）。"],"ref":["警備業法第3条第10号","解釈運用基準 第3の10"],"src":[]},
{"id":"KB-001","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業者等の責務（警備業法第21条）に関する次の記述のうち、誤っているものはどれか。","choices":["警備業者及び警備員は、警備業務を適正に行うようにするため、警備業務に関する知識及び能力の向上に努めなければならない。","警備業者は、自己が使用する警備員に対して他の警備業者が既に教育を行っていた場合には、そのことをもって当該警備員に対する教育の義務を免れる。","警備業者は、その警備員に対し、内閣府令で定めるところにより教育を行うとともに、必要な指導及び監督をしなければならない。","警備業務は、労働者派遣事業の形態で行うことも禁じられている。","警備業者又はその従業者以外の者が行う教育（部外実施教育）のうち、実地教育の方法による業務別教育は、警備員教育の教育時間数に算入することができない。"],"answer":1,"notes":["正しい。警備業法第21条第1項。知識及び能力の向上に努める義務は、警備業者だけでなく警備員にも課されている。","誤り。警備業者は、自己が使用して警備業務に従事させる警備員に対し、自らの責任において教育等を行わなければならず、他の警備業者が既に教育等を行っていたとしても、そのことをもって教育等の義務を免れることにはならない（解釈運用基準第20の1(2)）。","正しい。警備業法第21条第2項。教育を行うことに加え、必要な指導及び監督をすることも警備業者の義務である。","正しい。警備業務は、労働者供給事業的形態で行うことはもとより、労働者派遣事業的形態で行うことも禁じられている（解釈運用基準第20の1(2)、労働者派遣法第4条第1項第3号）。","正しい。部外実施教育のうち教育時間数に算入できるのは講義又は実技訓練の方法による基本教育及び業務別教育であり、現場でマン・ツー・マン方式で行う実地教育は、警備業者又はその従業者以外の者が行うことは適当でないため、算入の対象から除かれている（解釈運用基準第20の3(1)）。"],"ref":["警備業法第21条","解釈運用基準 第20"],"src":[]},
{"id":"KB-002","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法施行規則に定める警備員教育に関する次の記述のうち、正しいものはどれか。","choices":["警備員教育は、基本教育及び業務別教育の2種類に限られる。","基本教育も、その一部を、2年以上継続して警備業務に従事している警備員が行う実地教育の方法により行うことができる。","基本教育は、指導教育責任者でなければ行うことができない。","新任教育の業務別教育は、その一部を、2年以上継続して当該警備業務に従事している警備員が行う実地教育の方法により行うことができる。","現に警備業務に従事させている警備員に対する基本教育の教育事項には、警備業法その他警備業務の適正な実施に必要な法令に関することは含まれない。"],"answer":3,"notes":["誤り。警備員教育は、基本教育、業務別教育並びに必要に応じて行う警備業務に関する知識及び技能の向上のための教育とされている（警備業法施行規則第38条第1項）。","誤り。実地教育の方法（教育を受ける警備員1人に対して、1人以上の指導教育責任者、これと同等の知識経験がある者として国家公安委員会が定める者又は2年以上継続して当該警備業務に従事している警備員が行うもの）によることができるのは、新たに警備業務に従事させようとする警備員に係る業務別教育の一部に限られる（警備業法施行規則第38条第3項の表の備考）。基本教育は、指導教育責任者又はこれと同等の知識経験がある者として国家公安委員会が定める者が行い（同条第2項の表の備考第1号）、その方法は教育事項に応じて講義の方法又は実技訓練の方法とされている（同備考第2号）。","誤り。基本教育は、指導教育責任者又は当該教育についてこれと同等の知識経験がある者として国家公安委員会が定める者が行う（施行規則第38条第2項の表の備考第1号）。","正しい。新任の警備員に係る業務別教育は、一定の時間数まで、教育を受ける警備員1人に対して1人以上の指導教育責任者、これと同等の知識経験がある者として国家公安委員会が定める者又は2年以上継続して当該警備業務に従事している警備員が行う実地教育の方法によることができる（施行規則第38条第3項の表の備考）。","誤り。現任の警備員に対する基本教育の教育事項は、警備業務実施の基本原則、警備業法その他警備業務の適正な実施に必要な法令、事故の発生時における警察機関への連絡その他応急の措置に関することである（施行規則第38条第2項の表の二の項）。"],"ref":["警備業法施行規則第38条第1項〜第3項"],"src":[]},
{"id":"KB-003","cat":"hourei","sub":"警備業法","kubun":null,"stem":"新たに警備業務に従事させようとする警備員に対する教育（新任教育）に関する次の記述のうち、誤っているものはどれか。","choices":["新任教育を20時間以上行うべき警備員について業務別教育の時間数を8時間とした場合、そのうち6時間までは実地教育の方法により行うことができる。","警備業務に従事した経験も警察官の職にあった経験もなく、合格証明書や資格者証の交付も受けていない者に対する新任教育は、基本教育及び業務別教育を合わせて20時間以上である。","施設警備業務に係る合格証明書の交付を受けている警備員を施設警備業務に従事させようとするときは、新任教育を行うことを要しない。","合格証明書や資格者証の交付を受けていない警備員で、最近3年間にある警備業務の区分の警備業務に従事した期間が通算して1年以上であるものを、その区分の警備業務に従事させようとするときの新任教育は、基本教育及び業務別教育を合わせて7時間以上である。","警備業務に従事した経験がなく、合格証明書や資格者証の交付も受けていない者で、警察官の職にあった期間が通算して1年以上であるものに対する新任教育は、基本教育及び業務別教育を合わせて13時間以上である。"],"answer":0,"notes":["誤り。20時間の新任教育（警備業法施行規則第38条第4項の表の一の項）の対象者について実地教育の方法によることができるのは、業務別教育の時間数を2で除した時間数又は5時間のいずれか少ない時間数までである。業務別教育が8時間なら4時間までとなる（施行規則第38条第3項の表の備考第1号）。","正しい。施行規則第38条第4項の表の一の項。基本教育及び業務別教育を合わせて20時間以上行う。","正しい。合格証明書の交付を受けている警備員で当該合格証明書に係る種別の警備業務に従事させようとするものは、新任教育の対象から除かれている（施行規則第38条第4項、解釈運用基準第20の2(15)）。","正しい。施行規則第38条第4項の表の六の項。","正しい。施行規則第38条第4項の表の七の項。警察官の職にあった期間が通算して1年以上である者は13時間以上となる。"],"ref":["警備業法施行規則第38条第3項・第4項","解釈運用基準 第20"],"src":[]},
{"id":"KB-004","cat":"hourei","sub":"警備業法","kubun":null,"stem":"現に警備業務に従事させている警備員に対する教育（現任教育）に関する次の記述のうち、正しいものはどれか。","choices":["指導教育責任者資格者証の交付を受けている警備員を、当該資格者証に係る警備業務の区分の警備業務に従事させているときも、毎年度、基本教育を行わなければならない。","1級の合格証明書の交付を受けている警備員を、当該合格証明書に係る種別の警備業務に従事させているときは、毎年度、業務別教育を6時間以上行わなければならない。","2級の合格証明書の交付を受けている警備員を、当該合格証明書に係る種別の警備業務に従事させているときは、現任教育を行うことを要しない。","新任教育として基本教育を行った日の属する年度であっても、その警備員に対し、現任教育としての基本教育を改めて行わなければならない。","合格証明書や資格者証の交付を受けていない警備員に対する現任教育は、毎年度、基本教育及び業務別教育を合わせて10時間以上行わなければならない。"],"answer":4,"notes":["誤り。指導教育責任者資格者証の交付を受けている警備員で、当該資格者証に係る警備業務の区分の警備業務に従事させているものは、現任教育の対象から除かれている（警備業法施行規則第38条第5項、解釈運用基準第20の2(16)）。","誤り。1級の合格証明書の交付を受けている警備員で、当該合格証明書に係る種別の警備業務に従事させているものは、現任教育を行わなくてよい（施行規則第38条第5項、解釈運用基準第20の2(16)）。","誤り。施行規則第38条第5項の「国家公安委員会が定める」合格証明書は1級の検定に係る合格証明書に限られる（警備員教育を行う者等を定める規程第3条）。このため、2級の合格証明書の交付を受けている警備員を当該合格証明書に係る種別の警備業務に従事させている場合は、毎年度、業務別教育を6時間以上行う（施行規則第38条第5項の表の二の項）。合格証明書によって現任教育が不要となるのは1級の場合である。","誤り。新任教育として基本教育を行った日の属する年度は、現任教育としての基本教育を行わなくてもよい（施行規則第38条第5項の表の備考第1号）。業務別教育も同様である（同備考第2号）。","正しい。施行規則第38条第5項の表の一の項。現任教育は毎年度行う。"],"ref":["警備業法施行規則第38条第5項","警備員教育を行う者等を定める規程（平成8年国家公安委員会告示第21号）第3条","解釈運用基準 第20"],"src":["https://www.pref.aichi.jp/police/shinsei/keibi/documents/2019kyouikujikannkaisei.pdf"]},
{"id":"KB-005","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備員教育の講義を電気通信回線を使用して行う方法（いわゆるオンライン教育）に関する次の記述のうち、誤っているものはどれか。","choices":["電気通信回線を使用して行う講義は、受講者の本人確認、受講の状況の確認及び知識の習得の状況の確認ができ、かつ、質疑応答の機会が確保されているものに限られる。","受講者の本人確認は、受講開始前に、ID・パスワード、生体認証等を用いて行う必要がある。","電気通信回線を使用して行う講義の方法は、基本教育には用いることができるが、業務別教育には用いることができない。","電気通信回線を使用して行う講義に用いる教材は、初回の視聴時にスキップできないものである必要がある。","要件を満たす教材であれば、制作者に限定はなく、その視聴時間（設問の回答に必要な時間を含む。）を教育時間数に算入することができる。"],"answer":2,"notes":["正しい。警備業法施行規則第38条第2項の表の備考第3号イ〜ニ。","正しい。解釈運用基準第20の2(10)。","誤り。電気通信回線を使用して行うものを含む講義の方法は、基本教育だけでなく業務別教育の講義にも用いることができる（施行規則第38条第2項の表の備考第3号「前号及び次項の講義の方法」、同条第3項）。","正しい。解釈運用基準第20の2(9)ただし書。","正しい。解釈運用基準第20の2(9)。"],"ref":["警備業法施行規則第38条第2項の表の備考第3号","解釈運用基準 第20"],"src":[]},
{"id":"KB-006","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備員指導教育責任者（以下「指導教育責任者」という。）の選任に関する次の記述のうち、誤っているものはどれか。","choices":["警備業者は、営業所（警備員の属しないものを除く。）ごと及び当該営業所において取り扱う警備業務の区分ごとに、指導教育責任者を選任しなければならない。","営業所の指導教育責任者として選任した者が欠けるに至ったときは、その日から14日間は、指導教育責任者を選任しておかなくてもよい。","専任の指導教育責任者とは、その営業所に常勤して指導教育責任者の業務に従事し得る状態にある者をいい、業務に支障のない範囲で警備業務に従事することも妨げられない。","専任の指導教育責任者が置かれている営業所に近接する営業所で、その属する警備員の数が10人以下であるものについては、公安委員会の承認を得て、当該指導教育責任者に兼任させることができる。","2以上の警備業務の区分を取り扱う営業所において、それらの全ての区分に係る指導教育責任者資格者証の交付を受けている者が置かれる場合は、区分ごとに専任の指導教育責任者をそれぞれ選任することを要しない。"],"answer":3,"notes":["正しい。警備業法第22条第1項。警備員の属しない本社等の営業所は除かれる（解釈運用基準第21の1）。","正しい。警備業法第22条第1項ただし書。","正しい。解釈運用基準第21の2(1)。他の営業所と掛け持ちしている場合や、他に職業を持っていて通常の営業時間に勤務できない場合は、専任とはいえない。","誤り。兼任が認められるのは、近接する営業所でその属する警備員の数が5人以下であるものについて、当該指導教育責任者が当該区分の資格者証の交付を受けており、公安委員会の承認を得た場合である（警備業法施行規則第39条第3項）。「近接」はおおむね片道1時間以内で、兼任により3以上の営業所を兼ねることとなる場合は認められない（解釈運用基準第21の2(3)(5)）。","正しい。施行規則第39条第2項。ただし、区分ごとに属する警備員が相当数となる営業所では、区分ごとに選任することが望ましい（解釈運用基準第21の2(2)）。"],"ref":["警備業法第22条第1項","警備業法施行規則第39条","解釈運用基準 第21"],"src":[]},
{"id":"KB-007","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備員指導教育責任者資格者証（以下「資格者証」という。）の交付に関する次の記述のうち、誤っているものはどれか。","choices":["資格者証の交付は、警備業務の区分ごとに行われる。","公安委員会は、20歳未満の者には資格者証を交付しない。","資格者証は、警備員指導教育責任者講習の課程を修了した者のほか、公安委員会が講習修了者と同等以上の知識及び能力を有すると認める者にも交付される。","偽りその他不正の手段により資格者証の交付を受けたことを理由に返納を命ぜられ、その日から起算して3年を経過しない者には、資格者証は交付されない。","アルコール、麻薬、大麻、あへん又は覚醒剤の中毒者には、資格者証は交付されない。"],"answer":1,"notes":["正しい。警備業法第22条第3項。","誤り。資格者証を交付しないのは「未成年者」である（警備業法第22条第4項第1号）。成年年齢は18歳であるから、18歳以上であれば年齢を理由に不交付とはならない。","正しい。警備業法第22条第2項第1号・第2号。同等以上の認定の基準は講習規則第8条に定められており、この認定は資格者証の交付申請を受けた公安委員会が行う（解釈運用基準第21の5(3)）。","正しい。警備業法第22条第4項第3号（同条第7項第2号又は第3号により返納を命ぜられた者）。","正しい。警備業法第22条第4項第2号、第3条第6号。"],"ref":["警備業法第22条第2項〜第4項","警備員指導教育責任者及び機械警備業務管理者に係る講習等に関する規則第8条","解釈運用基準 第21"],"src":[]},
{"id":"KB-008","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備員指導教育責任者資格者証（以下「資格者証」という。）の書換え、再交付及び返納に関する次の記述のうち、正しいものはどれか。","choices":["資格者証の記載事項に変更を生じたときは、その者が選任されている営業所の警備業者が、公安委員会に届け出て書換えを受けなければならない。","資格者証を亡失したときは、公安委員会に届け出て、再交付を受けなければならない。","返納命令書の交付を受けた者は、その交付の日から10日以内に、資格者証を当該返納命令書を交付した公安委員会に返納しなければならない。","資格者証の返納の命令は、口頭で行うことができる。","公安委員会が資格者証の返納を命ずることができるのは、交付を受けた者が警備業法第3条第1号から第6号までのいずれかに該当するに至ったときに限られる。"],"answer":2,"notes":["誤り。書換えを受けなければならないのは、資格者証の交付を受けた者本人である。記載事項に変更を生じたときは、速やかにその旨を公安委員会に届け出て書換えを受ける（警備業法第22条第5項、同法施行規則第43条第1項）。","誤り。亡失・滅失のときは、届け出て再交付を「受けることができる」とされている（警備業法第22条第6項）。","正しい。警備業法施行規則第44条第2項。","誤り。返納の命令は、理由を付した返納命令書を交付して行う（施行規則第44条第1項）。","誤り。第3条第1号から第6号までに該当するに至ったときのほか、偽りその他不正の手段により交付を受けたとき、警備業法等に違反しその情状が指導教育責任者として不適当と認められるときも、返納を命ずることができる（警備業法第22条第7項）。"],"ref":["警備業法第22条第5項〜第7項","警備業法施行規則第43条・第44条"],"src":[]},
{"id":"KB-009","cat":"hourei","sub":"警備業法","kubun":null,"stem":"現任指導教育責任者講習（警備業法第22条第8項の講習）に関する次の記述のうち、誤っているものはどれか。","choices":["警備業者は、指導教育責任者に選任した者に、3年ごとに現任指導教育責任者講習を受けさせなければならない。","3年ごとの期間の起算点は、個々の指導教育責任者の受講時ではなく、当該営業所が前回の受講者を出した時点である。","1つの営業所で複数の警備業務の区分の指導教育責任者を1人が兼任しているときは、区分ごとに行われる講習をそれぞれ受講することになる。","現任指導教育責任者講習は、対面で行う方法のほか、電気通信回線を使用して行う方法によることもできる。","公安委員会は、講習の実施予定期日の30日前までに、受講すべき指導教育責任者本人に対して講習の通知を行う。"],"answer":4,"notes":["正しい。警備業法第22条第8項、講習規則第9条第1項。受講させる義務は警備業者にある。","正しい。現任指導教育責任者講習の運用通達1。指導教育責任者の選任替えがあっても受講の頻度は変わらない。","正しい。現任指導教育責任者講習の運用通達2。なお、2か所の営業所の指導教育責任者を兼任する者は、同一の区分の講習を3年の間に2回受講することを要しない。","正しい。講習規則第9条第3項の表の備考第1号。受講者は対面講習とオンライン講習のいずれかを選択する（現任指導教育責任者講習の運用通達3(1)）。","誤り。通知は、現任指導教育責任者講習通知書により、当該指導教育責任者に係る警備業者に対して行う（講習規則第10条）。受講させる義務は警備業者にあるため名宛人は警備業者とし、送付先は指導教育責任者が選任された営業所とする（現任指導教育責任者講習の運用通達3(1)）。"],"ref":["警備業法第22条第8項","警備員指導教育責任者及び機械警備業務管理者に係る講習等に関する規則第9条・第10条","現任指導教育責任者講習の運用通達（令和7年12月9日）"],"src":[]},
{"id":"KB-010","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備員指導教育責任者講習（新規取得講習）の受講資格等に関する次の記述のうち、正しいものはどれか。","choices":["受講しようとする警備業務の区分に係る1級の検定の合格証明書の交付を受けている者は、受講することができる。","最近3年間に当該警備業務の区分に係る警備業務に従事した期間が通算して2年以上である者は、受講することができる。","受講しようとする警備業務の区分に係る2級の検定の合格証明書の交付を受けている者は、交付後の警備業務への従事期間にかかわらず、受講することができる。","警備業者の使用人として営業や会計の事務に従事していた期間も、受講資格の「警備業務に従事した期間」に算入される。","指導教育責任者講習の講習時間の1時限は、60分とされている。"],"answer":0,"notes":["正しい。講習規則第3条第2号。","誤り。最近5年間に当該警備業務の区分に係る警備業務に従事した期間が通算して3年以上である者である（講習規則第3条第1号）。この期間は同一の警備業者の下でのものでなくてもよい（指導教育責任者講習の運用通達7(1)ア）。","誤り。2級の合格証明書の交付を受けている警備員は、交付を受けた後、継続して1年以上当該警備業務の区分に係る警備業務に従事していることが必要である（講習規則第3条第3号）。","誤り。警備業者の使用人であっても、営業、会計等の事務に従事している場合は「警備業務に従事し」ているとはいえない（指導教育責任者講習の運用通達7(1)イ）。","誤り。1時限は50分である（講習規則第5条第1項の表の備考第2号）。例えば、警備業法その他の法令に関する講習時間は10時限とされている。"],"ref":["警備員指導教育責任者及び機械警備業務管理者に係る講習等に関する規則第3条・第5条","指導教育責任者講習の運用通達（令和6年6月27日）7"],"src":[]},
{"id":"KB-011","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備員指導教育責任者講習（新規取得講習）の修了考査に関する次の記述のうち、正しいものはどれか。","choices":["修了考査は、5肢択一式の問題30問により行われる。","修了考査に不合格となった者は、再考査を受けることができる。","講習を電気通信回線を使用して受講した者は、修了考査も自宅等から受けることができる。","修了考査は、80パーセント以上の成績を合格とする。","病気等のやむを得ない事情により講習の一部を受講できなかった者は、講習の3分の2以上を受講していれば、修了考査を受けることができる。"],"answer":3,"notes":["誤り。新規取得講習の修了考査は、5肢択一式40問の筆記試験又は電子計算機その他の機器を使用して行う試験で、時間は100分である（指導教育責任者講習の運用通達 別添3(2)ア・4(1)）。","誤り。修了考査が不合格であった者に対して再考査は行わない（同通達 別添3(1)）。","誤り。修了考査は、電子計算機その他の機器を使用して行う場合であっても、講習とは異なり、自宅等から受験させることはできない（同通達 別添3(2)）。","正しい。同通達 別添6(1)。配点は1問1点であり（同別添3(5)）、40問中32問以上の正解で合格となる。","誤り。修了考査は講習の全ての課程を受講した者について行うのが原則であり、例外は、講習の5分の4以上を受講し、残りの課程を受講できなかったことについて病気、交通途絶その他やむを得ない事情がある者である（同通達 別添2）。"],"ref":["警備員指導教育責任者及び機械警備業務管理者に係る講習等に関する規則第5条第2項・第3項","指導教育責任者講習の運用通達（令和6年6月27日）別添"],"src":[]},
{"id":"KB-012","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備員等の検定に関する次の記述のうち、正しいものはどれか。","choices":["検定は、国家公安委員会が行う。","学科試験に合格しなかった者に対しては、実技試験は行われない。","学科試験及び実技試験の合格基準は、いずれも80パーセント以上の成績である。","登録講習機関が行う講習会の課程を修了した者は、学科試験は免除されるが、実技試験は免除されない。","検定は、警備員として警備業務に従事している者でなければ受けることができない。"],"answer":1,"notes":["誤り。検定は、都道府県公安委員会が、警備業務の種別に応じて行う（警備業法第23条第1項）。","正しい。検定においては、学科試験を実技試験の前に行い、学科試験に合格しなかった者に対しては、実技試験を行わない（検定規則第6条第5項）。","誤り。学科試験・実技試験とも、合格基準は90パーセント以上の成績である（検定規則第6条第2項・第4項）。","誤り。講習会の課程を修了した者は、当該種別の学科試験及び実技試験の全部が免除され、検定に合格した者とみなされる（警備業法第23条第3項、検定規則第5条）。","誤り。検定は、警備員のほか、警備員になろうとする者も受けることができる（警備業法第23条第1項）。なお、1級の検定を受けることができるのは、当該種別の2級の検定に係る合格証明書の交付を受けた後、当該種別の警備業務に従事した期間が1年以上である者等である（検定規則第8条）。"],"ref":["警備業法第23条第1項〜第3項","警備員等の検定等に関する規則第4条〜第6条・第8条"],"src":[],"avoid":["S2-035"]},
{"id":"KB-013","cat":"hourei","sub":"警備業法","kubun":null,"stem":"検定の合格証明書に関する次の記述のうち、誤っているものはどれか。","choices":["合格証明書は、警備業務の種別ごとに交付される。","公安委員会は、18歳未満の者には合格証明書を交付しない。","合格証明書の交付を受けた者は、その記載事項に変更を生じても、書換えを受ける必要はない。","警備員の名簿には、合格証明書の交付を受けている警備員について、その合格証明書に係る警備業務の種別、交付した公安委員会の名称、交付年月日及び番号を記載する。","合格証明書の交付を受けた者がアルコール、麻薬、大麻、あへん又は覚醒剤の中毒者に該当するに至ったときは、公安委員会はその返納を命ずることができる。"],"answer":2,"notes":["正しい。警備業法第23条第4項。","正しい。警備業法第23条第5項で準用する第22条第4項第1号の読替え（「未成年者」を「18歳未満の者」と読み替える）。","誤り。合格証明書の書換えには資格者証の規定が準用され、記載事項に変更を生じたときは、速やかに公安委員会に届け出て書換えを受けなければならない（警備業法第23条第5項・第22条第5項、検定規則第15条）。","正しい。警備業法施行規則第66条第1項第1号ニ。警備員の名簿は、警備業者が営業所ごとに備えて置く書類である（警備業法第45条）。","正しい。警備業法第23条第5項で準用する第22条第7項第1号（合格証明書については第3条第1号から第7号までと読み替える）。"],"ref":["警備業法第23条第4項・第5項","警備業法第45条","警備業法施行規則第66条第1項第1号","警備員等の検定等に関する規則第15条"],"src":[]},
{"id":"KB-014","cat":"hourei","sub":"警備業法","kubun":null,"stem":"機械警備業務に関する次の記述のうち、正しいものはどれか。","choices":["一の機械警備業者の2以上の基地局に係る警備業務対象施設の数の合計が5,000以下であり、業務の適正な実施に支障がないものとして公安委員会の承認を受けたときは、これらの基地局を通じて1人の機械警備業務管理者を置くことができる。","機械警備業務の届出書は、当該機械警備業務を開始した日から10日以内に提出しなければならない。","機械警備業務管理者は、営業所ごとに選任しなければならない。","機械警備業者は、国家公安委員会規則で定める基準に従い、必要な数の警備員、待機所及び車両その他の装備を適正に配置しておかなければならない。","基地局に備える書類のうち、盗難等の事故の発生に関する情報を受信した日時やその情報に応じて講じた措置等を記載したものは、受信の日から3年間備えておかなければならない。"],"answer":0,"notes":["正しい。警備業法施行規則第60条ただし書。原則は、基地局ごとに専任の機械警備業務管理者を置く。","誤り。届出書は、所轄警察署長を経由して、当該機械警備業務の開始の日の前日までに提出しなければならない（警備業法第40条、施行規則第53条第2項）。基地局の廃止等の届出は、事由の発生の日から10日以内である（施行規則第56条第2項）。","誤り。機械警備業務管理者は、基地局ごとに選任する（警備業法第42条第1項、施行規則第60条）。","誤り。即応体制の整備は、都道府県公安委員会規則で定める基準に従って行う（警備業法第43条）。","誤り。受信の日時、講じた措置及びその結果等を記載した書類は、受信の日から1年間備えておかなければならない（施行規則第64条第1項第5号・第2項）。"],"ref":["警備業法第40条〜第44条","警備業法施行規則第53条・第56条・第60条・第64条"],"src":[],"avoid":["S1-018","S1-019","S1-020","S1-021","S1-022"]},
{"id":"KB-015","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業者が営業所ごとに備える警備員の名簿等の書類に関する次の記述のうち、誤っているものはどれか。","choices":["警備員の名簿は、当該警備員が退職した後も、その退職の日から1年間備えておかなければならない。","指導計画書を作成し、その計画書に基づき警備員を実地に指導し、その記録を作成することは、指導教育責任者の業務である。","教育計画書及び警備員教育の実施を記録した書類は、当該年度の終了の日から2年間備えておかなければならない。","警備業者は、警備員ごとに、警備員となってはならない者に該当しないことを確認するために講じた措置を記載した書類を備えて置かなければならない。","年度ごとの教育計画書は、当該年度の開始の日までに備えておけばよい。"],"answer":4,"notes":["正しい。警備業法第45条、同法施行規則第66条第2項。","正しい。施行規則第40条第1号。指導計画書は、実地に指導した日から2年間備えておく（施行規則第66条第2項）。","正しい。施行規則第66条第1項第5号・第6号、同条第2項。","正しい。警備業法施行規則第66条第1項第2号。警備員ごとに、法第14条第1項に規定する者に該当しないことを誓約する書面の提出を受けた旨その他確認のために講じた措置を記載し、提出を受けた誓約書を添付して備える。","誤り。教育計画書は、当該年度の開始の日の30日前までに備えておかなければならない（施行規則第66条第3項）。"],"ref":["警備業法第45条","警備業法施行規則第40条・第66条"],"src":[]},
{"id":"KB-016","cat":"hourei","sub":"警備業法","kubun":null,"stem":"公安委員会による報告の徴収及び立入検査に関する次の記述のうち、正しいものはどれか。","choices":["警備業者に対する報告又は資料の提出の要求は、原則として口頭で行う。","立入検査の対象は警備業者の営業所に限られ、基地局や待機所は対象とならない。","立入検査をする警察職員は、その身分を示す証明書を携帯し、関係者に提示しなければならない。","立入検査の権限は、犯罪捜査のために行使することもできる。","公安委員会は、他の都道府県の区域内に所在する警備業者の営業所に対しては、立入検査をすることができない。"],"answer":2,"notes":["誤り。報告又は資料の提出の要求は、要求の理由を記載した書面により行う（警備業法第46条、同法施行規則第69条）。緊急を要し書面により行ういとまがない特別の事情がある場合に限り、口頭で行うことも許される（解釈運用基準第32の2）。","誤り。警察職員に、警備業者の営業所、基地局又は待機所に立ち入らせることができる（警備業法第47条第1項）。待機所には一般の警備員詰所等も含まれる（解釈運用基準第32の3(1)）。","正しい。警備業法第47条第2項で準用する第38条第2項。","誤り。立入検査の権限は、犯罪捜査のために認められたものと解釈してはならない（警備業法第47条第2項で準用する第38条第3項）。","誤り。当該公安委員会の管轄区域内における警備業務の実施の適正を図るため必要があるときは、他の公安委員会の管轄区域内に所在する営業所等についても立入検査ができる（解釈運用基準第32の3(2)）。"],"ref":["警備業法第46条・第47条","警備業法施行規則第69条","解釈運用基準 第32"],"src":[]},
{"id":"KB-017","cat":"hourei","sub":"警備業法","kubun":null,"stem":"公安委員会による指示、営業停止命令等に関する次の記述のうち、誤っているものはどれか。","choices":["警備業法第48条の指示として、違反行為をした警備員の解雇を指示することはできない。","公安委員会は、一定の場合に、警備業者に対し、1年以内の期間を定めて営業の全部又は一部の停止を命ずることができる。","営業停止命令は、命令をする公安委員会の管轄区域内における警備業務に係る営業について行われる。","営業の廃止の命令は、認定を受けないで警備業を営んでいる者等に対して行われる処分である。","営業停止命令に係る聴聞の期日における審理は、公開により行わなければならない。"],"answer":1,"notes":["正しい。指示の内容は、当該警備員を警備員以外の職に配置換えすることが上限であり、役員の解任や警備員の解雇は含まれない（解釈運用基準第33の3）。","誤り。営業停止の期間は6月以内である（警備業法第49条第1項）。警備業者が指示に違反したときも、営業停止を命ずることができる。","正しい。警備業法第49条第1項（「当該公安委員会の管轄区域内における警備業務に係る営業」）。一方、営業の廃止の命令の効力は全国に及ぶ（解釈運用基準第34の2(2)）。","正しい。警備業法第49条第2項、解釈運用基準第34の2(3)。","正しい。警備業法第50条第4項。なお、聴聞を行うに当たっては、その期日の1週間前までに通知をし、期日及び場所を公示しなければならない（同条第2項）。"],"ref":["警備業法第48条〜第50条","解釈運用基準 第33・第34"],"src":[]},
{"id":"KB-018","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法の罰則に関する次の記述のうち、正しいものはどれか。","choices":["公安委員会の指示に違反した者は、100万円以下の罰金に処せられる。","警備員指導教育責任者を選任しなかった者は、30万円以下の罰金に処せられる。","営業停止命令に違反した者は、罰金に処せられることはあるが、拘禁刑に処せられることはない。","警備員の名簿を備え付けなかった者は、20万円以下の過料に処せられる。","法人の従業者が、その法人の業務に関し、警備業法第56条から第58条までの違反行為をしたときは、行為者が罰せられるのみで、法人が罰金刑を科されることはない。"],"answer":0,"notes":["正しい。警備業法第57条第7号。","誤り。警備員指導教育責任者を選任しなかった者は、100万円以下の罰金である（警備業法第57条第5号）。30万円以下の罰金となるのは、機械警備業務管理者を選任しなかった者である（同法第58条第8号）。","誤り。営業停止命令又は営業の廃止の命令に違反した者は、1年以下の拘禁刑若しくは100万円以下の罰金に処し、又はこれを併科する（警備業法第56条第2号）。","誤り。警備員の名簿等の書類を備え付けなかった者は、30万円以下の罰金である（警備業法第58条第9号）。20万円以下の過料は、死亡等の届出書を提出しなかった者などである（同法第60条）。","誤り。両罰規定により、行為者を罰するほか、その法人又は人に対しても各本条の罰金刑を科する（警備業法第59条）。"],"ref":["警備業法第56条〜第60条"],"src":[]},
{"id":"KB-019","cat":"hourei","sub":"警備業法","kubun":null,"stem":"新たに警備業務に従事させようとする警備員に対する教育（新任教育）に関する次の記述のうち、正しいものはどれか。なお、各記述の警備員は、記述中に示したもののほかに、合格証明書や資格者証の交付、警備業務に従事した経験及び警察官の職にあった経験を有しないものとする。","choices":["法第2条第1項第2号の警備業務の区分に係る指導教育責任者資格者証の交付を受けている警備員を雑踏警備業務に従事させようとするときは、業務別教育を3時間以上行わなければならない。","施設警備業務に係る2級の合格証明書の交付を受け、最近3年間に交通誘導警備業務に従事した期間が通算して1年以上である警備員を交通誘導警備業務に従事させようとするときは、業務別教育を10時間以上行わなければならない。","機械警備業務管理者資格者証の交付を受けている警備員を機械警備業務に従事させようとするときは、基本教育を10時間以上行わなければならない。","最近3年間に法第2条第1項第2号の警備業務に従事した期間が通算して1年以上である警備員を、同項第1号の警備業務に従事させようとするときは、基本教育及び業務別教育を合わせて7時間以上行えば足りる。","交通誘導警備業務に係る2級の合格証明書の交付を受けている警備員を施設警備業務に従事させようとするときは、基本教育及び業務別教育を合わせて20時間以上行わなければならない。"],"answer":2,"notes":["誤り。指導教育責任者資格者証の交付を受けている警備員で、当該資格者証に係る警備業務の区分の警備業務に従事させようとするものは、新任教育の対象から除かれている（警備業法施行規則第38条第4項柱書き、解釈運用基準第20の2(15)）。雑踏警備業務は法第2条第1項第2号の警備業務であるから、新任教育を行う必要はない。","誤り。合格証明書に係る種別以外の警備業務に従事させようとする警備員のうち、最近3年間に当該警備業務に従事した期間が通算して1年以上であるものに対する新任教育は、業務別教育3時間以上である（警備業法施行規則第38条第4項の表の三の項）。そのような経験がなければ、業務別教育10時間以上となる（同表の二の項）。","正しい。機械警備業務管理者資格者証の交付を受けている警備員を機械警備業務に従事させようとするときは、基本教育10時間以上である（警備業法施行規則第38条第4項の表の四の項）。最近3年間に警備業務に従事した期間又は警察官の職にあった期間が通算して1年以上であれば、基本教育3時間以上となる（同表の五の項）。","誤り。最近3年間にある区分の警備業務に従事した期間が通算して1年以上である警備員を、当該区分以外の区分の警備業務に従事させようとするときは、基本教育及び業務別教育を合わせて13時間以上行わなければならず、7時間では足りない（警備業法施行規則第38条第4項の表の七の項）。7時間以上で足りるのは、経験のある区分と同じ区分の警備業務に従事させる場合である（同表の六の項）。","誤り。合格証明書の交付を受けている警備員を当該合格証明書に係る種別以外の警備業務に従事させようとするとき（同表の三の項・六の項に当たる場合を除く。）の新任教育は、業務別教育10時間以上であり、基本教育は要しない（警備業法施行規則第38条第4項の表の二の項）。"],"ref":["警備業法施行規則第38条第4項","解釈運用基準 第20の2(15)"],"src":[]},
{"id":"KB-020","cat":"hourei","sub":"警備業法","kubun":null,"stem":"業務別教育を実地教育の方法により行う場合に関する次の記述のうち、誤っているものはどれか。","choices":["現に警備業務に従事させている警備員に対する業務別教育も、一定の時間数までは実地教育の方法により行うことができる。","実地教育は、教育を受けるべき警備員1人に対して、警備業務の区分に応じた1人以上の者が行う方法である。","新任教育が業務別教育10時間以上とされる警備員については、その10時間のうち5時間までを実地教育の方法によることができる。","実地教育は、指導教育責任者のほか、これと同等の知識経験がある者として国家公安委員会が定める者も行うことができる。","基本教育及び業務別教育を合わせて13時間以上行うべき警備員について業務別教育を6時間とした場合、実地教育によることができるのは3時間までである。"],"answer":0,"notes":["誤り。実地教育の方法によることができるのは、新任教育の表（警備業法施行規則第38条第4項の表）の一の項、二の項、三の項、六の項及び七の項に掲げる警備員に係る業務別教育に限られる（同条第3項の表の備考）。現任教育の業務別教育は、講義の方法及び実技訓練の方法により行う。","正しい。実地教育は、教育を受けるべき警備員1人に対して、警備業務の区分に応じた1人以上の指導教育責任者等が行う（警備業法施行規則第38条第3項の表の備考）。警備業務の実施の現場においてマン・ツー・マン方式で行われる教育である（解釈運用基準第20の3(1)）。","正しい。新任教育の表の二の項の警備員（合格証明書又は資格者証に係る種別・区分以外の警備業務に従事させる者。業務別教育10時間）は、そのうち5時間を超えない時間数を実地教育の方法によることができる（警備業法施行規則第38条第3項の表の備考第2号）。","正しい。実地教育を行うことができるのは、指導教育責任者、これと同等の知識経験がある者として国家公安委員会が定める者又は2年以上継続して当該警備業務に従事している警備員である（警備業法施行規則第38条第3項の表の備考）。","正しい。新任教育の表の七の項の警備員（合わせて13時間）は、業務別教育の時間数を2で除した時間数又は5時間のいずれか少ない時間数を超えない時間数を実地教育の方法によることができる（警備業法施行規則第38条第3項の表の備考第1号）。業務別教育を6時間とすれば3時間までとなる。"],"ref":["警備業法施行規則第38条第3項・第4項","解釈運用基準 第20の3(1)"],"src":[]},
