{"id":"CS-022","cat":"chishiki","sub":"現場保存","kubun":null,"stem":"現場保存のための立入りの制限に関する次の記述のうち、適当なものはどれか。","choices":["やむを得ず設備の担当者を保存の範囲内に入れるときは、同行して、その者の氏名、時刻及び行動の範囲を記録する。","現場の中を移動する必要があるときは、痕跡を探しながら、その都度通りやすい経路を選んで移動する。","ロープなどを張ることができない場所では、範囲を表示できないので、立入りの制限は行わずに警察官の到着を待つ。","立入りの制限を始める前に現場に出入りした者は、制限の対象外であるから、その行動を記録する必要はない。","保存の範囲内にいる者は、立ち退かせることが適当でない者も含め、例外なく範囲の外へ出す。"],"answer":0,"notes":["正しい。現場保存の範囲内では、施設内の関係者であっても立入りを制限するが、二次災害の防止のためやむを得ず立ち入らせる場合は、その者に同行して現場での行動に注意するとともに、氏名、時間、行動範囲等を正確に記録する（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。","誤り。自分の行動する経路は一定にし、不必要に現場内で行動しない（厚生労働省の同マニュアル）。経路を変えて歩き回ると、足跡などの痕跡を踏み荒らし、犯人の足跡との区別も難しくなる。","誤り。範囲の明確化にはロープなどで立入制限線を設定するが、通行止めができない場所でも、できる限り通行を制限する（厚生労働省の同マニュアル）。警察も、保存すべき現場の範囲を定めたときは、直ちにこれを表示する等適切な処置をとり、みだりに出入する者のないようにすることとされている（犯罪捜査規範第88条第1項）。","誤り。立入制限の前後を通じて、現場で行動した者の氏名、時間、行動範囲等を正確に記録する（厚生労働省の同マニュアル）。制限の前に出入りした者の足跡や指紋も現場に残っており、犯人のものと区別するために必要である。","誤り。現場保存の範囲からは人を速やかに立ち退かせるが、立ち退かせることが適当でない者は、範囲内の1か所に集めるか、その場を動かないようにする（厚生労働省の同マニュアル）。"],"ref":["犯罪捜査規範第88条第1項"],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://laws.e-gov.go.jp/law/332M50400000002"]},
{"id":"CS-023","cat":"chishiki","sub":"現場保存","kubun":null,"stem":"現場保存の際に現場の状況を記録する要領として、適当でないものはどれか。","choices":["侵入口と思われる窓や扉について、開閉や施錠の状態、破損の有無を記録する。","においや物音、天候など、時間がたつと変わったり消えたりする状況も、気付いた時刻とともに記録する。","物の位置関係が分かるよう、保存の範囲の外から見た見取図を書いておく。","暗い室内の様子を正確に記録するため、室内の照明のスイッチを入れて明るくする。","現場の写真を撮るときは、保存の範囲に立ち入らず、範囲の外から撮影する。"],"answer":3,"notes":["正しい。侵入口や逃走経路の状況は、犯行の過程を明らかにする重要な資料である。警察も、侵入及び逃走の経路や現場における物品の状況などを明らかにするよう努めることとされている（犯罪捜査規範第90条）。","正しい。においや物音、気象の状況などは時間の経過とともに変わり、後から確かめることができない。警察も、犯行当時における気象の状況などを明らかにするよう努めることとされている（犯罪捜査規範第90条第1号ハ）。","正しい。写真、見取図、記録などは、現場の原状を明らかにする方法である（犯罪捜査規範第89条参照）。物の位置関係を見取図に残しておくと、警察官への説明に役立つ。","誤り。現場のすべての物に手を触れず、位置や状態を変えない（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。照明のスイッチにも犯人の指紋が残っているおそれがあり、照明の点灯・消灯の状態も現場の状況の一つである。暗い所は懐中電灯で照らして確かめる。","正しい。負傷者の救護などやむを得ない事情がある場合を除き、警察官であってもみだりに現場に入ってはならないとされている（犯罪捜査規範第86条第2項）。警備員も、撮影のために保存の範囲に立ち入らない。"],"ref":["犯罪捜査規範第86条第2項","犯罪捜査規範第89条","犯罪捜査規範第90条"],"src":["https://laws.e-gov.go.jp/law/332M50400000002","https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"CS-024","cat":"chishiki","sub":"現場保存","kubun":null,"stem":"屋外の事件・事故の現場保存に関する次の記述のうち、適当でないものはどれか。","choices":["交通事故の現場で迂回路がないときは、通行に必要な最小限の部分を開放し、その他の部分の通行を制限する。","足跡やタイヤの跡は、写真に撮っておけば、その上を人や車両が通っても差し支えない。","強い日差しや風で変質したり飛ばされたりするおそれのある遺留品は、覆いをかけるなどして原状を保つ。","路面に落ちている車両の部品や塗料の破片は、拾い集めずに、落ちている位置のまま保存する。","夜間は、踏み荒らしや二次事故を防ぐため、照明器具などで保存の範囲が周りから分かるようにする。"],"answer":1,"notes":["正しい。交通事故の現場の場合は、迂回道路があれば迂回させるが、なければ通行に必要な最小限の道路部分を開放する（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。","誤り。写真に撮っても、足跡やタイヤの跡そのものを保存したことにはならず、人や車両が通れば痕跡は失われる。現場のすべての物に手を触れず、位置を変更しないことが原則であり、通行止めができない場所でも、できる限り通行を制限する（厚生労働省の同マニュアル）。警察も、現場はできる限り犯罪の行われた際の状況のまま保存するよう努め（犯罪捜査規範第86条第1項）、やむを得ない理由で現場を変更する必要があるときに、写真、見取図、記録などにより原状を明らかにする処置をとることとされている（同規範第89条）。写真は、痕跡そのものの保存に代わるものではない。","正しい。屋外の現場では、雨などで流出・変形するおそれがあるため、ビニールで覆うなどの必要な措置を講じる（厚生労働省の同マニュアル）。警察も、光線、雨水等により変質、変形又は消失するおそれのある捜査資料は、覆いをする等適当な方法によりその原状を保存するよう努めることとされている（犯罪捜査規範第88条第2項）。","正しい。現場のすべての物に手を触れず、位置を変更しない（厚生労働省の同マニュアル）。車両の部品や塗料の破片は、逃走した車両を割り出す手掛かりとなる。","正しい。夜間の屋外の現場は周りから見えにくく、通行人や車両が範囲に入り込んで痕跡を踏み荒らしたり、二次事故が起きたりするおそれがある。照明器具などで範囲を明らかにして、立入りを防ぐ。"],"ref":["犯罪捜査規範第86条第1項","犯罪捜査規範第88条第2項","犯罪捜査規範第89条"],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://laws.e-gov.go.jp/law/332M50400000002"]},
{"id":"CS-025","cat":"chishiki","sub":"現場保存","kubun":null,"stem":"死傷者がいる事件・事故の現場における措置として、適当なものはどれか。","choices":["呼びかけに反応がない人を警備員が死亡していると判断したときは、現場保存を優先して救命の処置は行わない。","死亡していることが明らかな人は、周囲の人の目に触れないよう、人のいない場所へ移しておく。","死亡していると思われる人が周囲の目にさらされていても、現場の状態を変えないよう、覆いはかけない。","身元を確かめるため、死亡していると思われる人の着衣のポケットを調べ、所持品を確認する。","警察官より先に救急隊が到着したときは、負傷者が倒れていた位置や着衣の状況を記録し、警察官に伝える。"],"answer":4,"notes":["誤り。生死の判断は救急隊員や医療従事者に任せ、警備員は、蘇生するかもしれないとの判断に基づき、必要な救命活動を行う（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。人命の救護は現場保存に優先する。","誤り。死体は警察による鑑識活動の対象であるため、位置や着衣などを変更しない（厚生労働省の同マニュアル）。なお、正当な理由がなくて変死体の現場を変えた者は、軽犯罪法による処罰の対象となる（軽犯罪法第1条第19号）。","誤り。礼を失しないよう注意し、周囲の好奇の目にさらされることがないよう、毛布やシーツなどで覆うなどの処置を行う（厚生労働省の同マニュアル）。","誤り。死体の位置や着衣などは変更しない（厚生労働省の同マニュアル）。着衣に触れると痕跡を損なうおそれがあり、所持品の確認は警察が行う。","正しい。警察官より救急隊が先に到着した場合は、負傷者の倒れていた位置や着衣の状況、凶器の有無などについて観察・記録し、到着した警察官に報告する（厚生労働省の同マニュアル）。負傷者が搬送されると、元の状況は記録によってしか分からなくなる。"],"ref":["軽犯罪法第1条第19号"],"src":["https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"CS-026","cat":"chishiki","sub":"避難誘導","kubun":null,"stem":"避難誘導に備えて事前に確かめておく事項に関する次の記述のうち、適当でないものはどれか。","choices":["避難場所が、多数の人が安全に集まることのできる場所であるかを確かめる。","防犯上の理由で施錠している非常口について、解錠の方法とその取決めを確かめておく。","避難経路は、混乱を避けるため、最も近い一つの経路だけを確かめて全員に周知しておく。","非常口の扉が錆びるなどして、開けにくくなっていないかを確かめる。","非常放送設備や拡声器、誘導用の照明器具などが使えるかを、その使い方とともに確かめておく。"],"answer":2,"notes":["正しい。避難場所については、多数の人が安全に集合できる場所かどうか、機材や荷物などが置かれていないかを確認する（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。","正しい。非常口が防犯上の理由で施錠されている場合は、解錠方法やそのルールが適切かどうかを確認する（厚生労働省の同マニュアル）。いざというときに解錠できなければ、非常口として使えない。","誤り。避難経路が2箇所（2方向）確保されているかどうかを確認する。避難経路が1箇所しかないと、煙の充満や荷崩れなどでふさがれた場合に避難できなくなる（厚生労働省の同マニュアル）。","正しい。ドアのノブやドア自体が錆びて動かなくなっていないか、ドアの外に機材や荷物などが置かれていないかを確認する（厚生労働省の同マニュアル）。","正しい。非常放送設備の有無と使用方法、稼働状況のほか、拡声器、誘導用照明器具、避難誘導用の旗、ヘルメットなど避難誘導に必要な設備・備品の有無と使用可能かどうかを確認する（厚生労働省の同マニュアル）。"],"ref":[],"src":["https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"CS-027","cat":"chishiki","sub":"避難誘導","kubun":null,"stem":"避難誘導の実施要領として、適当なものはどれか。","choices":["誘導員は全員、避難の妨げにならないよう避難場所で待機し、到着した避難者を整列させる。","危険なため避難経路として使わないことにした階段も、避難者が自由に選べるよう、進入を制限しない。","大勢の人がいるときは、混乱を防ぐため、最も広い一つの階段に全員を集めて避難させる。","救助袋や緩降機などの避難器具は、階段など、ほかに安全な避難の手段がない場合に使用する。","避難者の人員の確認は消防隊が行うので、誘導員は避難場所での確認を省いて、次の誘導に向かう。"],"answer":3,"notes":["誤り。通路の角、階段入口など避難する人が迷い込みやすい場所に先着して、正しく誘導する（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。東京消防庁の資料も、誘導員はエレベーター、曲がり角、分かれ道などに配置するとしている。","誤り。避難経路として使用しない階段などには、避難者が誤って進入しないよう措置する。例えば、国土交通省の地下街等の避難確保・浸水防止計画作成の手引きでは、避難経路として使用しない階段の昇り口にコーン等を用いて進入禁止の措置を講じる例が示されている。","誤り。大勢の人がいる場合は、人数を分散させて混乱を避けるとともに、危険な場所にいる者が早く避難できるようにする（厚生労働省の同マニュアル）。一つの階段に集中させると、滞留や転倒が起きやすい。","正しい。非常階段など、安全かつ確実に大勢の人を避難させることができる経路を優先し、救助袋や緩降機などの避難器具は、他に手段がない場合に使用する（厚生労働省の同マニュアル）。","誤り。施設からの退出がおおむね完了した時点で、未避難者の有無を確認する（国土交通省の同手引き）。誘導員は退避の際に逃げ遅れた者がいないかを確認し（厚生労働省の同マニュアル）、避難場所で所在の分からない者がいれば、その情報を消防隊に伝える。"],"ref":[],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://www.tfd.metro.tokyo.lg.jp/learning/contents/jiei/chapter/step-38.html","https://www.mlit.go.jp/river/bousai/main/saigai/jouhou/jieisuibou/pdf/chikagai_hinan_tebiki202605.pdf"]},
{"id":"CS-028","cat":"chishiki","sub":"避難誘導","kubun":null,"stem":"避難誘導の際に群集のパニックを防ぐための対応として、適当でないものはどれか。","choices":["避難者を落ち着かせるため、建物の安全を確かめる前でも、「この建物は安全です」と繰り返し伝える。","放送では、落ち着いた声で、何が起きているかと、避難の方法や方向を分かりやすく伝える。","拡声器による呼びかけと、表示板などで示す内容とが食い違わないようにする。","現場で直接誘導するときは、誘導員が先頭に立って、「私の方に来てください」と呼びかけて誘導する。","方向を示すときは、「あっちへ逃げろ」などと言わずに、はっきりとした目標物を示して伝える。"],"answer":0,"notes":["誤り。放送では、落ち着いた声で正確な危険の状態を告知する（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。建物の安全に関する情報はパニックの防止に有効とされるが（消防庁「外国人来訪者や障害者等が利用する施設における災害情報の伝達及び避難誘導に関するガイドライン」）、確かめていない情報を伝えると、避難の遅れや、後に情報が覆ったときの混乱を招く。","正しい。非常放送設備を使用する場合は、落ち着いた声で正確な危険の状態を告知し、避難方法、避難方向を分かりやすく伝える。非常放送設備がない場合も、大声で怒鳴ることは避け、拡声器などを使って落ち着いた声で指示する（厚生労働省の同マニュアル）。","正しい。放送や拡声器、デジタルサイネージ等でそれぞれ情報が異なると、施設利用者の混乱を招くおそれがあるので、音声情報と視覚情報の内容の整合を図る（消防庁の同ガイドライン）。","正しい。現場で直接誘導する場合は、先頭に立って「私の方に来てください」と誘導する方法が最善とされている（厚生労働省の同マニュアル）。","正しい。「右に逃げろ」「あっちに逃げろ」といった指示は現場を混乱させることがあるため、はっきりとした目標物を指示して誘導する（厚生労働省の同マニュアル）。"],"ref":[],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://www.fdma.go.jp/mission/prevention/items/guideline04.pdf"]},
{"id":"CS-029","cat":"chishiki","sub":"避難誘導","kubun":null,"stem":"外国人や障害のある人などを避難誘導する際の対応として、適当なものはどれか。","choices":["日本語が通じにくい外国人には、英語であれば誰にでも伝わるので、英語だけで呼びかける。","補助犬を連れた人には、補助犬に直接指示したり触ったりせず、必要な支援を本人に確かめる。","知的障害のある人には、全体の状況が分かるよう、とるべき複数の行動をまとめて一度に説明する。","発達障害などのある人がパニック状態になったときは、指示が届くよう、大きな声で繰り返し呼びかける。","高齢者を誘導するときは、逃げ遅れることのないよう、若い人の歩く速さに合わせて急がせる。"],"answer":1,"notes":["誤り。日本を訪れる外国人の母語は英語とは限らず、英語のみに依存すると、母語が英語でない外国人に避難情報が的確に伝わらなくなる。簡単な語彙と短い文による「やさしい日本語」や、多言語の定型文、案内用図記号（ピクトグラム）などを活用する（消防庁「外国人来訪者や障害者等が利用する施設における災害情報の伝達及び避難誘導に関するガイドライン」の手引き）。","正しい。盲導犬、聴導犬及び介助犬をあわせて補助犬という。ハーネスや胴着で補助犬であることを確認した上で、必要なサポートを本人に確認し、補助犬に直接指示したり、触ったり、注意を引いたりしない（消防庁の同手引き）。","誤り。知的障害のある人は、一度にたくさんのことを言われたり、2つ以上の行動を同時に説明されたりすると混乱することがあるので、伝えたい内容は簡潔に、ひとつずつ伝える（消防庁の同手引き）。","誤り。大声で説明するとパニック状態になることもある。パニック状態となったときは、刺激せずに安全を確保し、近くに安全で落ち着ける場所があれば、そちらに誘導する（消防庁の同手引き）。","誤り。高齢者のペースに合わせ、ゆっくり、はっきりと対応する。若い人のペースで案内しようと急がせると、心理的にあせって思わぬ事故につながりかねない（消防庁の同手引き）。"],"ref":[],"src":["https://www.fdma.go.jp/mission/prevention/items/guideline04.pdf"]},
{"id":"CS-030","cat":"chishiki","sub":"避難誘導","kubun":null,"stem":"津波や浸水のおそれがある場合の避難の考え方として、適当なものはどれか。","choices":["海岸付近で長くゆっくりした揺れを感じても、揺れが弱ければ、津波警報などが発表されてから避難を始めればよい。","津波の第一波が到達して引いた後は、潮位が元に戻ったことを確かめれば、海岸付近に戻ってよい。","川をさかのぼる津波もあるので、海から離れた場所でも、川沿いを避けて高い所へ避難させる。","地下街から避難させるときは、早く地上に出られるよう、エレベーターやエスカレーターを使わせる。","地下では地上の様子が分からないので、館内に水が流れ込んできたことを確かめてから避難を始める。"],"answer":2,"notes":["誤り。津波警報・注意報を見聞きしたとき、海辺で強い揺れを感じたとき、又は長くゆっくりした揺れを感じたときは、直ちに海辺から離れ、より高い安全な場所へ避難する（気象庁「津波から身を守るために」）。津波は伝わる速さが非常に速く、見てから逃げたのでは間に合わない。","誤り。津波は繰り返し襲ってきて、後から来る波の方が高くなることもあり、潮位の変化が始まってから最大波まで数時間以上かかることもある。津波到達後も警報・注意報が解除されるまで避難を続け、津波警報が出ている間は絶対に戻ってはならない（気象庁の同ページ）。","正しい。海から離れていても、川に沿って津波が襲ってくることがある（気象庁の同ページ）。川沿いを避け、より高い安全な場所へ避難する。","誤り。エレベーターやエスカレーターは停電により途中で停止する可能性があるため、避難には使用せず、避難に先立って停止させる（国土交通省「地下街等に係る避難確保・浸水防止計画作成の手引き（洪水・雨水出水・高潮編）」）。","誤り。地下からは地上の状況が分かりにくいため、雨の降り方や施設周辺の地上部の状況を直接確認して浸水が始まりそうかどうかを確かめ、早めに避難を開始する（国土交通省の同手引き）。"],"ref":[],"src":["https://www.jma.go.jp/jma/kishou/know/jishin/tsunami_bosai/index.html","https://www.mlit.go.jp/river/bousai/main/saigai/jouhou/jieisuibou/pdf/chikagai_hinan_tebiki202605.pdf"]},
{"id":"S1-001","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設警備業務における報告や記録に関する次の記述のうち、適当でないものはどれか。","choices":["警備報告書は、依頼者との契約で定めた報告の方法、頻度及び時期に従って作成し、提出する。","報告書には、確認した事実と自分の推測や意見とを区別して記載する。","巡回で異常が認められなかったときは、巡回を実施した時刻や点検の結果を記録する必要はない。","盗難の被害や設備の異常など依頼者に関係する事案を認めたときは、定期の報告を待たずに速やかに依頼者に連絡する。","警備日誌等の記録は、後日、事故等の事実関係を確認する資料にもなるので、時刻や場所を含めて正確に記載する。"],"answer":2,"notes":["正しい。報告の方法、頻度及び時期その他の依頼者への報告に関する事項は契約前書面の記載事項であり（府令第33条第1号ヌ）、警備報告書の作成及び提出に関する事項等をいう（解釈運用基準 第18の2(7)）。契約で定めたとおりに報告する。","正しい。事実と推測が混在すると、依頼者や警察等が判断を誤るおそれがある。確認した事実を正確に記載し、推測や意見はそれと分かるように区別する。","誤り。異常がなかった場合も、巡回の実施時刻や点検箇所ごとの異常の有無を記録し、報告する。異常がなかったという記録も、後に事実関係を確認する資料となる。","正しい。盗難等の事故の発生時の措置は契約前書面の記載事項でもあり（府令第33条第1号リ）、依頼者に関係する事案は速やかに連絡する。","正しい。記録は事後の確認や警察への説明の資料にもなるので、時刻や場所を含めて正確に記載する。"],"ref":["警備業法施行規則第33条第1号","解釈運用基準 第18の2(7)"],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://www.soumu.go.jp/main_content/000452708.pdf"]},
{"id":"S1-002","cat":"senmon","sub":"施設警備","kubun":"1","stem":"警備業法施行規則に定める業務別教育のうち、1号警備業務（機械警備業務を除く。）の教育事項として、誤っているものはどれか。","choices":["人又は車両の雑踏する場所における雑踏の整理の方法に関すること。","警備業務対象施設における人又は車両等の出入の管理の方法に関すること。","巡回の方法に関すること。","警報装置その他当該警備業務を実施するために使用する機器の使用方法に関すること。","不審者又は不審な物件を発見した場合にとるべき措置に関すること。"],"answer":0,"notes":["誤り。雑踏の整理の方法に関することは、法第2条第1項第2号の警備業務の業務別教育の教育事項である（府令第38条第3項の表）。1号警備業務（機械警備業務を除く。）の教育事項には含まれていない。","正しい。府令第38条第3項の表の1号警備業務（機械警備業務を除く。）の欄のイに定められている。","正しい。同欄のロに定められている。","正しい。同欄のハに定められている。","正しい。同欄のニに定められている。このほか、ホとして「その他当該警備業務を適正に実施するため必要な知識及び技能に関すること」が定められている。"],"ref":["警備業法施行規則第38条第3項"],"src":[]},
{"id":"S1-003","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設警備業務における検定合格警備員の配置に関する次の記述のうち、正しいものはどれか。","choices":["施設警備業務を行うときは、警備業務対象施設の種類にかかわらず、施設警備業務に係る検定合格警備員を配置しなければならない。","空港に係る施設警備業務では、施設警備業務を行う空港ごとに、施設警備業務に係る2級検定合格警備員を1人配置しなければならない。","空港に係る施設警備業務では、滑走路、管制塔、駐機場、貨物ターミナル施設等をそれぞれ別の配置単位として、検定合格警備員を配置しなければならない。","防護対象特定核燃料物質取扱施設に係る施設警備業務では、敷地内に防護対象特定核燃料物質取扱施設が複数あっても、1級又は2級の検定合格警備員は敷地全体で1人配置すれば足りる。","防護対象特定核燃料物質取扱施設に係る施設警備業務では、施設警備業務を行う敷地ごとに、施設警備業務に係る1級検定合格警備員を1人配置しなければならない。"],"answer":4,"notes":["誤り。検定合格警備員の配置が義務付けられている施設警備業務は、防護対象特定核燃料物質取扱施設に係るもの及び空港に係るものに限られる（検定規則第2条の表の二の項・三の項）。","誤り。空港に係る施設警備業務では、施設警備業務を行う空港ごとに、施設警備業務に係る1級検定合格警備員を1人配置しなければならない（検定規則第2条の表の三の項）。このほか、旅客ターミナル施設又はそれ以外の空港の部分ごとに、1級又は2級の検定合格警備員を1人以上配置する。","誤り。「当該施設以外の当該空港の部分」とは、滑走路、管制塔、駐機場、貨物ターミナル施設等、旅客ターミナル施設を除いた空港の敷地全体を一の部分とするものである（解釈運用基準 第17の2(5)）。","誤り。施設警備業務を行う敷地内の一の防護対象特定核燃料物質取扱施設ごとに、1級又は2級の検定合格警備員を1人以上配置しなければならない（検定規則第2条の表の二の項）。","正しい。検定規則第2条の表の二の項のとおりである。なお、「1級検定合格警備員」と「1級又は2級検定合格警備員」の両方の配置が求められる場合、1人の1級検定合格警備員が両者を兼ねることはできない（解釈運用基準 第17の2(2)）。"],"ref":["警備員等の検定等に関する規則第2条","解釈運用基準 第17の2"],"src":[]},
{"id":"S1-004","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設警備業務における車両や物品の出入管理に関する次の記述のうち、適当でないものはどれか。","choices":["入構する車両については、入構許可証や事前の届出の有無を確認し、入構の時刻や車両番号等を記録する。","持出許可証を提示した者が持ち出そうとする物品が許可証の記載と異なっていても、許可証があれば持出しを認めてよい。","工事や清掃の業者については、事前に提出された工事・作業届の内容と、人数や作業場所を照合する。","入構車両の荷台や積荷の確認は、依頼者との取決めに基づき、運転者の承諾を得て行う。","出入管理で知り得た来訪者の氏名や用件などの情報は、業務以外の目的に使用したり、他に漏らしたりしない。"],"answer":1,"notes":["正しい。人又は車両等の出入の管理の方法は、1号警備業務の業務別教育の教育事項である（府令第38条第3項の表）。入構の可否を確認し、出入りを記録する。","誤り。持出許可証の記載内容と実際の物品が一致しているかを確認し、一致しないときは持出しを保留して依頼者の責任者に連絡し、指示を受ける。","正しい。工事・作業届を確認し、届出の人数や作業内容と照合したうえで入構させる。","正しい。警備員は特別な権限を有しないので（法第15条）、積荷等の確認は依頼者との取決めの範囲内で、相手の承諾を得て行う。","正しい。業務上知り得た情報は適正に取り扱い、目的外に使用したり漏らしたりしない。"],"ref":["警備業法第15条","警備業法施行規則第38条第3項"],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://www.soumu.go.jp/main_content/000452708.pdf"]},
{"id":"S1-005","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設警備業務における出入管理に関する次の記述のうち、適当でないものはどれか。","choices":["出入管理は、施設の管理権者（依頼者）が定めた入退館の規程や警備指令書に基づいて行う。","予定にない来訪者については、氏名、所属、用件等を確認したうえで訪問先に連絡し、入館の可否を確かめる。","来訪者に入館証を交付したときは、着用を求めるとともに、退館時に返却を受けて回収を確認する。","施設の職員を名乗る者については、身分証による確認や記録を行わずに入館させてよい。","入退館の規程の解釈や適用に疑義が生じたときは、警備員の独断で処理せず、依頼者の責任者に連絡して協議する。"],"answer":3,"notes":["正しい。警備員は施設の管理権者から委ねられた範囲で出入管理を行う（法第15条）。出入管理の方法は、1号警備業務の業務別教育の教育事項でもある（府令第38条第3項の表）。","正しい。予定にない来訪者は、用件等を確認し、訪問先に入館の可否を問い合わせてから入館させる。","正しい。入館証は着用させ、退館時に返却を受けて未回収がないか確認する。回収しないと、不正な入館に悪用されるおそれがある。","誤り。職員を名乗る者でも、社員証等で本人であることを確認し、時間外や休館日の出入りを記録するなど、定められた手続で確認する。確認を省くと、なりすましによる侵入を許すおそれがある。","正しい。規程の解釈や具体的な適用に疑義が生じたときは、依頼者の責任者に連絡して協議し、不明な点は警備責任者の指示を受ける。"],"ref":["警備業法第15条","警備業法施行規則第38条第3項"],"src":["https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S1-006","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設警備業務で行う所持品検査に関する次の記述のうち、適当なものはどれか。","choices":["所持品検査は、施設の安全のために必要であれば、相手の承諾がなくても強制的に行うことができる。","相手が所持品検査を拒んだときは、警備員がかばんを取り上げて中身を確認してよい。","所持品検査を行うときは、検査の目的を説明して承諾を得る手間を省き、直ちに相手の身体に触れて検査するのがよい。","所持品検査は相手の承諾を得て行う任意のものであり、拒まれた場合は、施設の管理権者の定めるところに従い入場を断るなどの措置にとどめる。","所持品検査で刃物を発見したときは、警備員は、所有者の意思にかかわらず、これを没収することができる。"],"answer":3,"notes":["誤り。警備員は法律上特別の権限を有しないので（法第15条）、所持品検査は相手の承諾を得て行う任意のものである。","誤り。承諾なくかばんを取り上げて中身を調べることは、他人の権利及び自由の侵害に当たる（法第15条）。","誤り。検査の目的や方法を説明し、承諾を得てから行う。承諾なく身体に触れることは許されない（法第15条）。","正しい。所持品検査は承諾に基づく任意のものであり、拒まれた場合は、管理権の範囲内の措置（入場を断る等）にとどめ、必要に応じて責任者に報告する（法第15条、解釈運用基準 第14の1）。","誤り。没収は裁判で科される刑罰（付加刑）であり（刑法第9条）、警備員に物を取り上げる権限はない。銃砲刀剣類等を提出させて一時保管できるのは警察官である（銃砲刀剣類所持等取締法第24条の2）。危険があれば警察に通報する。"],"ref":["警備業法第15条","解釈運用基準 第14","刑法第9条","銃砲刀剣類所持等取締法第24条の2"],"src":[]},
{"id":"S1-007","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設警備業務における巡回に関する次の記述のうち、適当でないものはどれか。","choices":["巡回では、施錠すべき箇所の施錠の有無や、ガラス、シャッター等の破損の有無を確認する。","巡回は、毎回同じ時刻に行って規則正しく実施することが、侵入を企てる者に対する抑止として最も効果的である。","巡回中に観察した事項、行った処置その他の特異事項は、責任者に報告するとともに、次の巡回者に申し送る。","巡回点検簿に示された重要箇所については、点検時刻と異常の有無を記録する。","夜間の巡回では、懐中電灯を使用するなど、定められたルールを守って安全に巡回する。"],"answer":1,"notes":["正しい。出入口の門扉、窓、倉庫等の施錠の有無や、ガラス・シャッター等の破損の有無は、巡回の基本的な点検事項である。","誤り。巡回の時刻を毎回同じにすると、侵入を企てる者に巡回の時間帯を把握されやすい。巡回の時間帯が毎回同じにならないようにするなど、変化を持たせる。","正しい。観察事項、行った処置、特異事項は責任者に報告し、次回の巡回者に申し送る。","正しい。重要箇所の点検時刻と異常の有無を記録し、報告する。","正しい。夜間や暗がりでは足元を懐中電灯で照らすなど、定められた経路とルールを守って巡回する。"],"ref":["警備業法施行規則第38条第3項"],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://www.soumu.go.jp/main_content/000452708.pdf"]},
{"id":"S1-008","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設警備業務の巡回で確認する事項に関する次の記述のうち、適当なものはどれか。","choices":["廊下、階段、避難口などの避難経路や防火戸の周辺に、避難や防火戸の閉鎖の支障となる物が置かれていないかを確認する。","漏水やガス漏れの有無は設備担当者が確認する事項であり、巡回で確認する必要はない。","不要な照明の消灯や必要な照明の点灯の状況は、防犯や防火と関係がないので確認しなくてよい。","フェンスの破損など侵入に利用されるおそれのある箇所を見つけても、巡回の目的は施錠の確認なので報告しなくてよい。","暖房器具や灰皿など火気の使用状況や後始末は、防火管理者が確認する事項であり、巡回の対象ではない。"],"answer":0,"notes":["正しい。避難経路や避難口、防火戸の周辺の状況は巡回の点検事項である。消防法も、避難上必要な施設に避難の支障になる物件が放置されず、防火戸の閉鎖の支障になる物件が放置されないように管理することを、管理について権原を有する者に義務付けている（消防法第8条の2の4）。","誤り。漏電、ガス漏れ、漏水等の有無も巡回で確認する事項である。異常を認めたときは責任者や関係者に連絡する。","誤り。不要灯の消灯と必要灯の点灯の確認も巡回の点検事項である。","誤り。フェンスの損傷など侵入に利用されるおそれのある箇所の点検も巡回の目的であり、発見したときは責任者に報告する。","誤り。暖房機、灰皿、火気の使用状況や後始末の適否は、火災予防のため巡回で確認する事項である。"],"ref":["消防法第8条の2の4","警備業法施行規則第38条第3項"],"src":["https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S1-009","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設警備業務における鍵の管理に関する次の記述のうち、適当でないものはどれか。","choices":["鍵の貸出しは、あらかじめ定められた担当者に対してのみ行う。","鍵を貸し出すときは、その都度、授受簿に記入して記録を残す。","鍵の授受は、相手に直接手渡して確実に行う。","勤務の交代時には、保管している鍵の数や未返却の鍵の有無を確認し、次の勤務者に申し送る。","鍵の紛失に気付いても、後で見つかる可能性があるときは、見つかるまで依頼者への報告を控える。"],"answer":4,"notes":["正しい。鍵は、依頼者との取決めで定められた担当者にのみ貸し出す。","正しい。貸出し・返却のたびに授受簿へ記入し、だれが、いつ、どの鍵を使用しているかを把握できるようにする。","正しい。鍵は手から手へ確実に手渡して授受する。","正しい。交代時に鍵の数や未返却の有無を確認して申し送ることで、紛失や不正使用を早く発見できる。","誤り。紛失した鍵は悪用されるおそれがあるので、直ちに責任者と依頼者に報告し、錠の交換など必要な措置を協議する。なお、鍵の管理方法や貸出し方法は、契約の際に依頼者に交付する書面の記載事項でもある（府令第33条第1号チ、解釈運用基準 第18の2(6)）。"],"ref":["警備業法施行規則第33条第1号チ","解釈運用基準 第18の2(6)"],"src":["https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S1-010","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設警備業務において不審者を発見した場合の措置に関する次の記述のうち、適当なものはどれか。","choices":["不審者が逃走したときは、見失わないよう、単独でどこまでも追跡して取り押さえる。","不審者に声をかけるときは、相手を威圧するため、大声で詰問する。","警察に通報する際に伝えられるよう、性別、服装、背格好、立ち去った方向などの特徴を観察しておく。","不審者を発見したときは、責任者への連絡や応援の要請をせず、まず単独で対処する。","用件を尋ねたところ正当な理由が確認できた者であっても、念のため施設の外へ強制的に連れ出す。"],"answer":2,"notes":["誤り。警備員は法律上特別の権限を有しないので（法第15条）、不審者というだけで取り押さえることはできない（私人が逮捕できるのは現行犯人に限られる。刑事訴訟法第213条）。また、無理に追いかけたり捕まえようとしたりすると、警備員自身や周囲の人が危険にさらされる。特徴や逃走方向を確認して、責任者に連絡し、警察に通報する。","誤り。威圧的な言動は相手を刺激して事態を悪化させるおそれがあり、相当性を欠けば法第15条に違反する（解釈運用基準 第14の2）。丁寧に声をかけて用件を尋ねる。","正しい。通報に役立つよう、年齢（見た目）、性別、服装、所持品、髪型、背格好、態度、立ち去った方向、車両の車種・色・ナンバー等の特徴を観察しておく。","誤り。不審者を発見したときは、責任者に連絡し、必要に応じて応援を求め、複数で対応する。","誤り。正当な理由がある者を強制的に退去させることは、他人の権利及び自由の侵害に当たる（法第15条）。"],"ref":["警備業法第15条","解釈運用基準 第14","警備業法施行規則第38条第3項","刑事訴訟法第213条"],"src":["https://www.keishicho.metro.tokyo.lg.jp/kurashi/heion/antep_mpd.files/partnership2.pdf","https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S1-011","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設内で不審物を発見した場合の措置に関する次の記述のうち、適当なものはどれか。","choices":["中身を確認するため、慎重に開封してから警察に通報する。","人の少ない場所に移動させてから、警察に通報する。","異臭がするときは、においをかいで正体を確かめてから報告する。","持ち主の分からない荷物は、厳重に包装されていたり機械音がしたりしていても、遺失物として事務所へ運んで保管する。","物には触れずに周囲の安全を確保し、種類、色、形、大きさ、置いてある場所、発見した時間などを警察に通報する。"],"answer":4,"notes":["誤り。不審物には触れない。爆発物の場合は「さわるな、ふむな、けとばすな」が原則とされている。","誤り。不審物は動かさない。化学剤等の場合は「さわるな、かぐな、うごかすな」が原則とされている。","誤り。においをかぐと化学剤等による被害を受けるおそれがあり、行ってはならない。","誤り。持ち主が分からず、必要以上に厳重な包装や機械音、火薬・薬品の臭いなどがあるものは不審物の特徴に当たる。動かさずに周囲の安全を確保し、警察に通報する。","正しい。触れずに周囲の安全を確保し、種類、色、模様、形、大きさ、置いてある場所、発見した時間などを警察に伝える。施設の管理権者や責任者にも速やかに報告する。"],"ref":["警備業法施行規則第38条第3項"],"src":["https://www.keishicho.metro.tokyo.lg.jp/kurashi/heion/antep_mpd.files/partnership2.pdf"]},
{"id":"S1-012","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設警備業務中に火災を発見した場合の措置に関する次の記述のうち、適当なものはどれか。","choices":["周囲に知らせると混乱を招くので、まず一人で消火を試み、消えなかったときに知らせる。","初期消火は、炎が天井に届いた後も、消火器がある限り続ける。","大声で周囲に知らせて119番通報し、出口を確保したうえで、できる範囲で初期消火を行う。","避難するときは、燃えている部屋のドアは開けたままにしておく。","いったん屋外に避難した後でも、残された物品を取りに建物内へ戻ってよい。"],"answer":2,"notes":["誤り。火災を発見したら、まず大声などで周囲に知らせる。一人で消火しようとしたり、知らせずにいたりすると被害が広がるおそれがある。","誤り。炎が天井まで届いたら初期消火の限界であり、消火をあきらめて速やかに避難する。","正しい。周囲に知らせて119番通報し、逃げ道を確保したうえで初期消火を行う。火災を発見した者は、遅滞なく消防署等に通報しなければならない（消防法第24条第1項）。","誤り。燃えている部屋のドアは閉めて延焼を防ぐ。","誤り。外に出たら、建物内に戻ってはならない。"],"ref":["消防法第24条第1項"],"src":["https://www.city.fukuoka.lg.jp/syobo/yobo/anzen-anshin/shodoutaiou.html","https://www.tfd.metro.tokyo.lg.jp/ts/bfc_manual/instructor/cp9.html"]},
{"id":"S1-013","cat":"senmon","sub":"施設警備","kubun":"1","stem":"1号警備業務（機械警備業務を除く。）の契約前書面の記載事項に関する次の記述のうち、正しいものはどれか。","choices":["「警備業務に従事させる警備員が用いる服装」については、制服の色や型式まで詳細に記載しなければならない。","「警備業務対象施設の鍵の管理に関する事項」とは、鍵の管理方法、貸出し方法等をいう。","「警備業務を実施するために使用する機器又は各種資機材」については、具体的な型式や性能まで記載しなければならない。","「警備業務に従事させる警備員の人数及び担当業務」の「担当業務」とは、警備員の氏名と勤務日をいう。","「警備業務対象施設における盗難等の事故発生時の措置」は、契約前書面の記載事項とされていない。"],"answer":1,"notes":["誤り。「服装」とは、制服、私服の別をいう（府令第33条第1号ヘ、解釈運用基準 第18の2(4)）。","正しい。府令第33条第1号チの「鍵の管理に関する事項」とは、鍵の管理方法、貸出し方法等をいう（解釈運用基準 第18の2(6)）。","誤り。連絡用の無線装置、危険物発見用の金属探知機、エックス線透視装置等の種類を記載すればよく、具体的な型式や性能まで記載する必要はない（府令第33条第1号ト、解釈運用基準 第18の2(5)）。","誤り。1号警備業務（機械警備業務を除く。）の「担当業務」とは、防犯監視、出入監視、巡回監視等をいう（府令第33条第1号ニ、解釈運用基準 第18の2(2)）。","誤り。警備業務対象施設における盗難等の事故発生時の措置は、契約前書面の記載事項である（府令第33条第1号リ）。"],"ref":["警備業法第19条第1項","警備業法施行規則第33条第1号","解釈運用基準 第18の2"],"src":[]},
{"id":"S1-014","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設警備業務の計画と実施の準備に関する次の記述のうち、適当でないものはどれか。","choices":["警備業務対象施設の構造や周囲の状況など、業務の実施に必要な事情を事前に調査し、警備計画に反映させる。","警備指令書には、警備の内容や手順、巡回ルート、緊急時の対応方法などを明記し、警備員に十分説明して理解させる。","昇降機、防火シャッター、防火扉などの設備や電子錠、鍵の取扱い方法は、あらかじめ警備員に確認させておく。","依頼者から現場で警備実施要領の急な変更を求められたときは、警備員の判断で直ちに変更して対応させる。","巡回経路にある転倒や転落のおそれのある箇所は、警備開始前に警備員の間で情報を共有しておく。"],"answer":3,"notes":["正しい。警備業務対象施設の構造、周囲の状況その他施設警備業務の実施に必要な事情に関する事前調査は、施設警備業務の管理に関する事項とされている（検定規則別表第一の施設警備業務「施設警備業務の管理に関すること」）。","正しい。警備指令書は警備計画書に基づいて作成され、警備の内容や手順、巡回ルート、緊急時の対応方法などが明記される。内容を十分に説明し、順守させる。","正しい。設備や電子錠・鍵の取扱い方法と管理方法を事前に確認させておく。","誤り。警備実施要領の急な変更を打診されたときは、警備員の独断で変更させず、警備員指導教育責任者等に相談して助言や指示を受けさせる。","正しい。重い扉や滑りやすい床など、巡回経路の危険箇所は警備開始前に情報を共有しておく。"],"ref":["警備員等の検定等に関する規則 別表第一"],"src":["https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S1-015","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設警備業務に従事する警備員の労働災害の防止に関する次の記述のうち、適当なものはどれか。","choices":["巡回中の転倒は施設警備で多い労働災害の一つであり、降雨が予想されるときは耐滑性のある靴を着用させるなどの対策をとる。","暗い場所の巡回では、足元よりも高い位置にある窓の施錠状況に意識を集中させて歩く。","強風の日でも、巡回後すぐに出る予定であれば、重い鉄扉は開放したままにしておいてよい。","夜勤を伴う業務では、集中力の低下は対策により防げるので、休憩時間（仮眠時間）を考慮する必要はない。","巡回経路に転倒のおそれがある箇所を見つけても、施設側の問題なので責任者に報告する必要はない。"],"answer":0,"notes":["正しい。1号警備業務の労働災害では巡回中の転倒が多いとされ、降雨が予想される日は耐滑安全靴を着用するなどの対策が示されている。","誤り。一点のみに意識を集中させず、特に周囲が暗いときは足元に注意し、懐中電灯で照らして歩く。","誤り。扉を開放するときは、周囲の環境や状況を十分考慮する。強風で鉄扉が急に閉まり、手などをはさまれるおそれがある。","誤り。夜勤では集中力の低下が避けられないことを前提に、適正な人数の警備員を確保し、休憩時間（仮眠時間）を確保した計画を作成する。","誤り。転倒の危険のある箇所は、改善してもらうよう現場責任者や警備責任者に相談・報告する。"],"ref":["指導教育責任者講習の運用 別表第1（1号 施設警備業務の講義：出入管理、巡回、所持品検査、不審者又は不審物件発見時の措置等）"],"src":["https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S1-016","cat":"senmon","sub":"施設警備","kubun":"1","stem":"防災センター等で自動火災報知設備が作動した場合の対応に関する次の記述のうち、適当でないものはどれか。","choices":["受信機の音響が鳴ったときは、現場を確認する前に、まず受信機の復旧ボタンを操作して監視状態に戻す。","受信機の地区表示窓で作動した区域を確認し、現地に向かって原因を確かめる。","原因を取り除いて受信機を復旧させても再び音響が鳴るときは、設備の管理会社などに連絡して点検を依頼する。","火災でないことを確認できたときは、受信機の主音響と地区音響を停止し、現地で原因を取り除いてから受信機を復旧させる。","受信機を復旧させた後は、本当の火災に備えて、停止させた音響のボタンを元に戻しておく。"],"answer":0,"notes":["誤り。まず受信機の地区表示窓で作動した区域を確認して現地に向かい、火災かどうかと原因を確かめる。原因を取り除いてから復旧操作を行う。確認前に復旧させると、実際の火災を見逃すおそれがある。","正しい。地区表示窓で作動した区域を確認し、現地で火災の有無や原因（発信機が押されたのか、感知器が作動したのか等）を確かめる。","正しい。原因を取り除いた後に復旧しても再び音響が鳴動する場合は、管理会社に連絡して点検を依頼する（東京消防庁の資料）。連動している放送設備、消火栓ポンプ、排煙機等がある場合は、作動した設備自体の復旧が必要なこともある。","正しい。非火災であることを確認してから音響を停止する。音響を停止しただけでは復旧しないことに注意し、原因を取り除いてから復旧ボタンを操作する。","正しい。停止させた音響のボタンを戻し忘れると、次に火災が起きたときに音響が鳴らないおそれがある。"],"ref":["消防法施行令第7条第3項"],"src":["https://www.tfd.metro.tokyo.lg.jp/content/000071327.pdf"]},
{"id":"S1-017","cat":"senmon","sub":"機械警備","kubun":"1","stem":"警備業法施行規則に定める機械警備業務の業務別教育の教育事項に関する次の記述のうち、正しいものはどれか。","choices":["警備業務対象施設における人又は車両等の出入の管理の方法に関することは、機械警備業務の業務別教育の教育事項として定められている。","当該機械警備業務を実施するために使用する警備業務用機械装置の機能に関することは、機械警備業務の業務別教育の教育事項として定められていない。","車両及び歩行者の誘導の方法に関することは、機械警備業務の業務別教育の教育事項として定められている。","指令業務に従事する警備員と現場に向かう警備員との間の連絡の方法に関することは、機械警備業務の業務別教育の教育事項として定められている。","基地局において盗難等の事故の発生に関する情報を受信した場合における現場での事実の確認の方法に関することは、機械警備業務の業務別教育の教育事項として定められていない。"],"answer":3,"notes":["誤り。人又は車両等の出入の管理の方法に関することは、1号警備業務（機械警備業務を除く。）の業務別教育の教育事項である（府令第38条第3項の表）。","誤り。警備業務用機械装置の機能に関することは、機械警備業務の業務別教育の教育事項（イ）として定められている（府令第38条第3項の表）。","誤り。車両及び歩行者の誘導の方法に関することは、法第2条第1項第2号の警備業務の業務別教育の教育事項である（府令第38条第3項の表）。","正しい。府令第38条第3項の表の機械警備業務の欄のハに定められている。このほか、警備業務用機械装置による警戒及び指令の方法に関すること（ロ）などが定められている。","誤り。基地局において盗難等の事故の発生に関する情報を受信した場合における不審者又は不審な物件の発見その他現場における事実の確認の方法に関することは、機械警備業務の業務別教育の教育事項（ニ）として定められている（府令第38条第3項の表）。"],"ref":["警備業法施行規則第38条第3項"],"src":[]},
{"id":"S1-018","cat":"senmon","sub":"機械警備","kubun":"1","stem":"機械警備業務の届出に関する次の記述のうち、誤っているものはどれか。","choices":["機械警備業者は、機械警備業務を行おうとするときは、基地局又は送信機器を設置する警備業務対象施設の所在する都道府県の区域ごとに、当該区域を管轄する公安委員会に届出書を提出しなければならない。","当該都道府県の区域内に、基地局又は警備業務対象施設のいずれか一方のみが所在する場合にも、届出をしなければならない。","基地局を廃止したとき、又は基地局の名称・所在地若しくは機械警備業務管理者の氏名・住所に変更があったときの届出書は、その事由の発生の日から30日以内に提出すればよい。","機械警備業務開始の届出書は、当該機械警備業務の開始の日の前日までに提出しなければならない。","都道府県の区域内に基地局を設ける場合、機械警備業務開始の届出書は、当該基地局の所在地の所轄警察署長を経由して提出する。"],"answer":2,"notes":["正しい。法第40条のとおりである。","正しい。届出は、当該都道府県の区域内に基地局又は警備業務対象施設のいずれか一方のみが所在する場合にも行わなければならない（解釈運用基準 第26の2）。","誤り。基地局の廃止等や、法第40条第2号又は第3号に掲げる事項の変更の届出書（法第41条）は、その事由の発生の日から10日以内に提出しなければならない（府令第56条第2項）。","正しい。府令第53条第2項のとおりである。","正しい。基地局が二以上あるときは、そのいずれか一の基地局の所在地の所轄警察署長を経由する（府令第53条第2項）。"],"ref":["警備業法第40条","警備業法第41条","警備業法施行規則第53条","警備業法施行規則第56条","解釈運用基準 第26"],"src":[]},
{"id":"S1-019","cat":"senmon","sub":"機械警備","kubun":"1","stem":"機械警備業務管理者に関する次の記述のうち、正しいものはどれか。","choices":["機械警備業務管理者資格者証は、国家公安委員会が交付する。","機械警備業務管理者は、警備員指導教育責任者資格者証の交付を受けている者のうちから選任しなければならない。","機械警備業務管理者として選任した者が欠けるに至ったときは、その日から30日間は、機械警備業務管理者を選任しておかなくてもよい。","二以上の基地局を通じて1人の機械警備業務管理者を置くことについての承認は、それらの基地局が別の都道府県の区域内に所在するときでも、いずれか一の公安委員会から受ければ足りる。","「基地局ごとに専任」とは、その基地局に常勤して機械警備業務管理者の業務に従事し得る状態にあることをいい、業務に支障のない範囲で他の業務に従事してもよい。"],"answer":4,"notes":["誤り。機械警備業務管理者資格者証は、公安委員会（都道府県公安委員会）が、公安委員会の行う機械警備業務管理者講習の課程を修了した者等に交付する（法第42条第2項）。","誤り。機械警備業務管理者資格者証の交付を受けている者のうちから、基地局ごとに選任しなければならない（法第42条第1項）。","誤り。選任した者が欠けるに至ったときに選任しておかなくてもよい期間は、その日から14日間である（法第42条第3項で準用する第22条第1項ただし書）。","誤り。二以上の基地局に係る警備業務対象施設の数の合計数が5,000以下であり、かつ、業務の適正な実施に支障がないものとして、当該二以上の基地局の所在する都道府県の区域を管轄する公安委員会（二以上あるときは、当該二以上の公安委員会）の承認を受けなければならない（府令第60条）。この場合、それぞれの公安委員会が互いの意見を聴いて承認を行う（解釈運用基準 第28の2(4)）。","正しい。「基地局ごとに専任」とは、その基地局に常勤して業務に従事し得る状態にあることをいい、機械警備業務管理者の業務に支障のない範囲で、警備業務や基地局の他の業務に従事してもよい（解釈運用基準 第28の2(1)）。"],"ref":["警備業法第42条","警備業法施行規則第60条","解釈運用基準 第28の2"],"src":[]},
{"id":"S1-020","cat":"senmon","sub":"機械警備","kubun":"1","stem":"警備業法施行規則に定める機械警備業務管理者の業務として、誤っているものはどれか。","choices":["警備業務用機械装置による警備業務対象施設の警戒、警備業務用機械装置の維持管理その他の運用を円滑に行うための計画を作成し、その計画に基づき運用を行うように警備員その他の者を監督すること。","教育計画書を作成し、それに基づく警備員教育の実施を管理すること。","指令業務に関する基準を作成し、その基準により指令業務を統制するため指令業務に従事する警備員を指導すること。","警備員に対し、警察機関への連絡について指導を行うこと。","基地局に備え付ける書類（警備業法第44条に規定する書類）の記載について監督すること。"],"answer":1,"notes":["正しい。府令第61条第1号のとおりである。「維持管理」には日常的な維持管理のほか軽易な故障の際の応急的な修理等が含まれ、「計画」とは指令業務に従事する警備員の勤務予定、定期的な点検の予定、故障の際に執るべき措置の定め等をいう（解釈運用基準 第28の1）。","誤り。教育計画書を作成し、それに基づく警備員教育の実施を管理することは、警備員指導教育責任者の業務である（府令第40条第2号）。機械警備業務管理者の業務としては定められていない（府令第61条）。","正しい。府令第61条第2号のとおりである。","正しい。府令第61条第3号のとおりである。","正しい。府令第61条第4号のとおりである。このほか、機械警備業務の管理について機械警備業者に必要な助言をすること（同条第5号）が定められている。"],"ref":["警備業法第42条第1項","警備業法施行規則第61条","警備業法施行規則第40条","解釈運用基準 第28の1"],"src":[]},
{"id":"S1-021","cat":"senmon","sub":"機械警備","kubun":"1","stem":"機械警備業務における即応体制の整備（警備業法第43条）に関する次の記述のうち、正しいものはどれか。","choices":["法第43条は、待機所や車両その他の装備の配置を求めているが、配置する警備員の数については求めていない。","待機所には、駐車場の一画を継続的に使用する場合のように、建造物でないものも含まれる。","警備員が車両を路上に駐車して待機する場合のように、場所の定まらないものも待機所に含まれる。","法第43条の「その他の装備」には、護身用具が含まれる。","即応体制の整備は、基地局において盗難等の事故の発生に関する情報を受信した場合に、速やかに警察官が現場に到着できるようにするためのものである。"],"answer":1,"notes":["誤り。機械警備業者は、都道府県公安委員会規則で定める基準に従い、必要な数の警備員、待機所及び車両その他の装備を適正に配置しておかなければならない（法第43条）。受信から現場到着までの時間などの具体的な基準は、各都道府県公安委員会規則で定められている。","正しい。「待機所」とは警備員の待機する施設をいい、駐車場の一画を継続的に使用する場合等、建造物でない場合も含まれる（解釈運用基準 第29の2）。","誤り。路上に駐車して待機する場合等、場所の定まらない場合は待機所に含まれない（解釈運用基準 第29の2）。","誤り。「その他の装備」とは無線機、懐中電灯等をいい（解釈運用基準 第29の3）、護身用具は含まれない（同 第30の3）。","誤り。即応体制の整備は、基地局において盗難等の事故の発生に関する情報を受信した場合に、速やかに、現場における警備員による事実の確認その他の必要な措置が講じられるようにするためのものである（法第43条）。"],"ref":["警備業法第43条","解釈運用基準 第29","解釈運用基準 第30の3"],"src":["https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00001079.html","https://www.pref.tochigi.lg.jp/reiki/reiki_honbun/e101RG00001051.html"]},
{"id":"S1-022","cat":"senmon","sub":"機械警備","kubun":"1","stem":"機械警備業者が基地局ごとに備え付ける書類に関する次の記述のうち、誤っているものはどれか。","choices":["待機所ごとに、配置する警備員の氏名を記載する。","警備業務対象施設ごとに、待機所からの路程と、情報を受信した時から警備員が現場に到着するまでに通常要する時間を記載する。","基地局及び待機所の位置と、待機所ごとの警備業務対象施設の所在する地域を地図上に記載する。","盗難等の事故の発生に関する情報を受信した日時、その情報に応じて講じた措置及びその結果等を記載した書類は、受信の日から1年間備えておかなければならない。","記載すべき事項を電磁的方法により記録し、必要に応じ直ちに表示できるようにしていても、その記録をもって書類に代えることはできない。"],"answer":4,"notes":["正しい。法第44条第1号のとおりである。","正しい。府令第64条第1項第3号のとおりである。警備業務対象施設の名称及び所在地（法第44条第2号）と同一の書類中に記載するよう指導するものとされている（解釈運用基準 第30の1）。","正しい。府令第64条第1項第1号のとおりである。","正しい。府令第64条第2項のとおりである。「その結果」には、事故の内容、警察官への引継ぎの状況、誤発報であったこと等が含まれる（解釈運用基準 第30の4）。","誤り。法第44条各号に掲げる事項が電磁的方法により記録され、必要に応じ電子計算機その他の機器を用いて直ちに表示されることができるときは、その記録をもって書類に代えることができる（府令第65条）。"],"ref":["警備業法第44条","警備業法施行規則第64条","警備業法施行規則第65条","解釈運用基準 第30"],"src":[]},
{"id":"S1-023","cat":"senmon","sub":"機械警備","kubun":"1","stem":"侵入を監視するための感知器（センサー）に関する次の記述のうち、誤っているものはどれか。","choices":["マグネットセンサー（マグネットスイッチ）は、窓やドアに取り付けて、その開閉を検知する。","赤外線センサー（遮断型）は、投光器と受光器の間の赤外光線が遮られたことを検知するもので、物体による遮断にも反応する。","ガラス破壊センサーは、窓ガラスに貼り付けて、ガラスが破壊される際の振動を検知する。","パッシブセンサー（熱線センサー）は、人体から出る熱線（遠赤外線）を検知するもので、小動物の侵入には反応しない。","柵に設置したワイヤーの振動を検知するセンサーは、長い距離のフェンスに対応できるが、風や雪にも反応することがある。"],"answer":3,"notes":["正しい。窓枠等に取り付けて開閉を検知する。安価で設置が容易だが、窓の隙間が多いと風などで反応することがある。","正しい。投光器と受光器で構成され、赤外光線の遮断を検知する。人以外の物体による遮断にも反応する。","正しい。ガラスが破壊される際の振動を検知する。ガラスを強くたたくなどの衝撃にも反応することがある。","誤り。パッシブセンサー（熱線センサー）は人体から出る熱線（遠赤外線）を検知するが、小動物の侵入にも反応することがある。誤報の原因となるため、設置場所等に注意する。","正しい。フェンスなど長い距離に対応できるが、風、雪、いたずらにも反応することがある。"],"ref":["警備業法施行規則第38条第3項"],"src":["https://www.mext.go.jp/a_menu/shisetu/shuppan/04091401/020.htm"]},
{"id":"S1-024","cat":"senmon","sub":"機械警備","kubun":"1","stem":"機械警備業務において、基地局が盗難等の事故の発生に関する情報を受信した場合の対応に関する次の記述のうち、適当なものはどれか。","choices":["指令業務に従事する警備員は、現場に向かう警備員に対し、警備業務対象施設の名称、所在地、受信した異常の内容など必要な情報を的確に伝える。","現場に向かう警備業者の車両は、道路交通法上の緊急自動車として、赤色の警光灯をつけサイレンを鳴らして走行することができる。","現場に到着した警備員は、外周の状況を確認することなく、直ちに建物内に立ち入る。","侵入の痕跡を発見したときは、警察官が到着するまでの間に、遺留品を拾い集めて基地局へ持ち帰る。","誤報であったことが判明した場合は、受信の日時や講じた措置を記録する必要はない。"],"answer":0,"notes":["正しい。指令業務に従事する警備員と現場に向かう警備員との間の連絡の方法は、機械警備業務の業務別教育の教育事項とされている（府令第38条第3項の表）。必要な情報を的確に伝え、現場の状況の報告を受ける。","誤り。緊急自動車は、道路交通法施行令第13条に掲げる自動車で公安委員会の指定を受けたもの等に限られ、警備業者の車両は含まれない。現場へ向かうときも交通法規を守り、安全運転に努める。","誤り。現場に到着したら、侵入の痕跡の有無など警備業務対象施設の外周を確認し、安全に配慮して対応する。外周の検索の要領は、機械警備業務管理者講習で説明する初動措置の事項とされている（指導教育責任者講習の運用 別表第3）。","誤り。侵入の痕跡を発見したときは、警察機関や基地局に連絡し、警察官が到着するまで現場保存に努める（解釈運用基準 第29の1）。遺留品を動かしてはならない。","誤り。基地局の備付書類には、情報を受信した日時、講じた措置及びその結果を記載しなければならず、「その結果」には誤発報であったことも含まれる（府令第64条第1項第5号、解釈運用基準 第30の4）。"],"ref":["警備業法施行規則第38条第3項","警備業法施行規則第64条第1項第5号","解釈運用基準 第29の1","解釈運用基準 第30の4","道路交通法施行令第13条","指導教育責任者講習の運用 別表第3"],"src":[]},
{"id":"S1-025","cat":"senmon","sub":"空港保安","kubun":"1","stem":"空港保安警備業務に関する次の記述のうち、誤っているものはどれか。","choices":["空港保安警備業務とは、1号警備業務のうち、空港において航空機の強取等の事故の発生を警戒し、防止する業務で、航空機に持ち込まれる物件の検査に係るものをいう。","「航空機に持ち込まれる物件の検査」には、旅客が機内に携行する手荷物の検査のほか、航空会社に預けて航空機で運搬される手荷物の検査も含まれる。","専ら回転翼航空機（いわゆるヘリコプター）の離発着の用に供する施設も、空港保安警備業務の対象となる「飛行場」に含まれる。","空港保安警備業務に係る検定の学科試験では、航空法、航空機の強取等の処罰に関する法律、外交関係に関するウィーン条約などの法令に関する知識が問われる。","空港保安警備業務は、警備員等の検定等に関する規則にいう施設警備業務からは除かれている。"],"answer":2,"notes":["正しい。検定規則第1条第1号のとおりである。","正しい。解釈運用基準 第17の1(2)のとおりである。","誤り。「飛行場」には、設置者・管理者や公共用・非公共用の別を問わず、人が乗ることができる飛行機の離発着の用に供する施設が含まれるが、専ら回転翼航空機、滑空機又は飛行船のみの離発着の用に供する施設は含まれない（解釈運用基準 第17の1(1)）。","正しい。検定規則別表第一及び別表第二の空港保安警備業務の学科試験の科目「法令に関すること」に掲げられている。","正しい。検定規則第1条第2号は、施設警備業務を「法第2条第1項第1号に規定する警備業務（機械警備業務及び空港保安警備業務を除く。）のうち、警備業務対象施設の破壊等の事故の発生を警戒し、防止する業務」と定めているので、空港保安警備業務は施設警備業務に含まれない。"],"ref":["警備員等の検定等に関する規則第1条","警備員等の検定等に関する規則 別表第一","警備員等の検定等に関する規則 別表第二","解釈運用基準 第17の1"],"src":[]},
{"id":"S1-026","cat":"senmon","sub":"空港保安","kubun":"1","stem":"空港保安警備業務における検定合格警備員の配置に関する次の記述のうち、正しいものはどれか。","choices":["空港保安警備業務を行う場所ごとに、空港保安警備業務に係る2級検定合格警備員を1人配置しなければならない。","エックス線透視装置が設置される場所ごとに、空港保安警備業務に係る1級又は2級の検定合格警備員を2人以上配置しなければならない。","旅客が機内に携行する手荷物の検査の場合、「空港保安警備業務を行う場所ごと」とは、原則として、いわゆる検査ゲートごとをいう。","空港保安警備業務を行う場所の範囲を特定する際に勘案する「その他の機械器具」には、ボディスキャナーは含まれない。","空港保安警備業務を行う場所の範囲を特定するに当たっては、手荷物等検査用機械器具の性能や情報通信技術の利用の状況は勘案しないものとされている。"],"answer":2,"notes":["誤り。空港保安警備業務を行う場所ごとに配置しなければならないのは、空港保安警備業務に係る1級検定合格警備員1人である（検定規則第2条の表の一の項）。","誤り。エックス線透視装置が設置される場所ごとに、1級又は2級の検定合格警備員を1人以上配置する（検定規則第2条の表の一の項）。","正しい。手荷物等の一連の検査業務が行われる場所ごとをいい、旅客の機内持込手荷物の検査では原則として検査ゲートごとである。ただし、ボディスキャナー等の技術の活用により、1級検定合格警備員1人を隣接した2つの検査ゲートごとに配置できる場合もある（解釈運用基準 第17の2(4)）。","誤り。検定規則第2条の表の備考一の「その他の機械器具」（金属探知機、エックス線透視装置以外の手荷物等検査用機械器具）とは、例えばボディスキャナーをいう（解釈運用基準 第17の2(8)）。","誤り。空港保安警備業務を行う場所の範囲を特定するに当たっては、金属探知機、エックス線透視装置その他の手荷物等検査用機械器具の性能、情報通信技術の利用の状況その他の事情を勘案するものとされている（検定規則第2条の表の備考一）。「情報通信技術の利用の状況」とは、例えば防犯カメラやＡＩ等の利用の状況をいう（解釈運用基準 第17の2(9)）。"],"ref":["警備員等の検定等に関する規則第2条","解釈運用基準 第17の2"],"src":[]},
{"id":"S1-027","cat":"senmon","sub":"空港保安","kubun":"1","stem":"航空法に定める保安検査等に関する次の記述のうち、正しいものはどれか。","choices":["何人も、航空機強取行為等を行うおそれがないものとして国土交通省令で定める者を除き、保安検査を受けた後でなければ、危険物等所持制限区域内に立ち入ってはならない。","危険物等所持制限区域は、航空運送事業を経営する者が指定する。","保安検査を受けずに航空機に搭乗した者に対する罰則は設けられていない。","保安検査を行う者は、保安検査に関する業務を他の者に委託することができない。","爆発性又は易燃性を有する物件等で国土交通省令で定めるものを航空機内に持ち込んだ者に対する罰則は、過料にとどまる。"],"answer":0,"notes":["正しい。航空法第131条の2の5第4項のとおりである。保安検査の受検の義務付けは令和4年3月10日から施行されている。","誤り。危険物等所持制限区域は、空港等の設置者が、国土交通大臣に協議しその同意を得て指定する（航空法第131条の2の5第1項・第2項）。","誤り。保安検査を受けずに航空機に搭乗した者は、1年以下の拘禁刑又は50万円以下の罰金に処せられる（航空法第131条の2の5第6項、第157条の5第2号）。","誤り。保安検査を行う者は、国土交通省令で定める基準に従って必要な措置を講じたうえで、保安検査に関する業務を他の者に委託することができる（航空法第131条の2の5第7項）。委託を受けた保安検査業務受託者も、基準に従い必要な措置を講じなければならない（同条第8項）。","誤り。何人も、国土交通省令で定める爆発物等を航空機内に持ち込んではならず（航空法第86条第2項）、違反した者は2年以下の拘禁刑又は100万円以下の罰金に処せられる（同法第149条の3）。"],"ref":["航空法第86条","航空法第131条の2の5","航空法第149条の3","航空法第157条の5"],"src":["https://www.mlit.go.jp/koku/15_bf_000007.html","https://www.mlit.go.jp/report/press/kouku02_hh_000185.html"]},
{"id":"S1-028","cat":"senmon","sub":"空港保安","kubun":"1","stem":"国土交通省の危害行為防止基本方針に示された保安検査に関する次の記述のうち、誤っているものはどれか。","choices":["保安検査は、身体及び機内持込手荷物を含む携行品を検査し、爆発物、凶器等の危険物等を所持していないかを確認するものである。","保安検査は、航空機内での航空機強取行為等を未然に防止するために必要不可欠な措置であり、国家安全保障上の観点からも重要な意義を有するとされている。","保安検査は機器による検査を基本とし、危険物等の所持が疑われる場合や機器が故障して使用できない場合などに、開披検査又は接触検査を行う。","保安検査で危険物等が発見された場合は、放棄や預入手荷物への変更を求め、必要な場合には警察への引渡し等の毅然とした対応をとる。","保安検査を受けた者と受けていない者との間で接触や混在があったことが分かっても、再検査などの対応をとる必要はないとされている。"],"answer":4,"notes":["正しい。保安検査は、危険物等所持制限区域に立ち入る者等の身体及び携行品（機内持込手荷物）を検査し、爆発物、凶器等の危険物等を所持していないか確認するものとされている。","正しい。保安検査は航空機強取行為等の未然防止に必要不可欠な措置であり、国家安全保障上も重要な意義を有するとされ、航空法で受検が義務付けられている（航空法第131条の2の5第4項・第6項）。","正しい。X線検査装置、ボディスキャナー、金属探知器等の機器による検査を基本とし、危険物等の所持が疑われる場合や機器の故障時等に開披検査又は接触検査を行うとされている。","正しい。あらかじめ定める手順により、放棄や預入手荷物への変更を求め、必要な場合は警察への引渡し等を含む毅然とした対応をとるとされている。","誤り。保安検査を受けた者と未受検の者との間で接触や混在がないことを確実にするための措置が講じられなければならず、接触や混在が発覚した場合には、再検査等の必要な対応をとるものとされている（危害行為防止基本方針 三の5）。なお、保安検査の対象となる危険物等所持制限区域に立ち入る者には、航空機に搭乗する旅客のみならず、空港関係者等旅客以外の者も含まれる（同 三の2）。"],"ref":["航空法第131条の2の2","航空法第131条の2の5","危害行為防止基本方針（令和8年2月27日変更）"],"src":["https://www.mlit.go.jp/koku/content/001993118.pdf"]},
{"id":"S1-029","cat":"senmon","sub":"消防法","kubun":"1","stem":"火災の通報及び消火等に関する消防法の規定についての次の記述のうち、正しいものはどれか。","choices":["火災を発見した者の通報義務は、その消防対象物の関係者に限って課されている。","火災が発生したときは、当該消防対象物の関係者その他総務省令で定める者は、消防隊が火災の現場に到着するまで、消火若しくは延焼の防止又は人命の救助を行わなければならない。","火災の現場においては、消防吏員又は消防団員は、当該消防対象物の関係者等に対し、当該消防対象物の構造や救助を要する者の存否などの情報の提供を求めることはできない。","火災が発生したときに消防隊の到着まで消火等を行わなければならない者には、その火災を発生させた者は含まれない。","正当な理由がなく消防署に火災発生の虚偽の通報をしても、実害が生じなければ処罰されない。"],"answer":1,"notes":["誤り。「火災を発見した者」は、だれであっても、遅滞なく消防署又は市町村長の指定した場所に通報しなければならない（消防法第24条第1項）。関係者に限られない。","正しい。消防法第25条第1項のとおりである。","誤り。火災の現場においては、消防吏員又は消防団員は、当該消防対象物の関係者その他総務省令で定める者に対して、当該消防対象物の構造、救助を要する者の存否その他消火若しくは延焼の防止又は人命の救助のため必要な事項につき情報の提供を求めることができる（消防法第25条第3項）。","誤り。消防法第25条第1項の総務省令で定める者には、火災の現場にいる、火災を発生させた者、火災の発生に直接関係がある者、火災が発生した消防対象物の居住者又は勤務者が含まれる（消防法施行規則第46条）。","誤り。正当な理由がなく消防署等に火災発生の虚偽の通報をした者は、30万円以下の罰金又は拘留に処せられる（消防法第44条第20号）。実害の発生は要件とされていない。"],"ref":["消防法第24条","消防法第25条","消防法第44条第20号","消防法施行規則第46条"],"src":[]},
{"id":"S1-030","cat":"senmon","sub":"消防法","kubun":"1","stem":"消防法に定める防火管理者に関する次の記述のうち、誤っているものはどれか。","choices":["学校、病院、百貨店その他多数の者が出入し、勤務し、又は居住する防火対象物で政令で定めるものの管理について権原を有する者は、政令で定める資格を有する者のうちから防火管理者を定めなければならない。","防火管理者を定めた権原を有する者は、遅滞なくその旨を所轄消防長又は消防署長に届け出なければならず、解任したときも同様である。","防火管理者は、防火対象物についての防火管理に係る消防計画を作成し、所轄消防長又は消防署長に届け出なければならない。","防火管理者は、所轄消防長又は消防署長が選任する。","防火管理者が行う防火管理上必要な業務には、消火、通報及び避難の訓練の実施や、収容人員の管理が含まれる。"],"answer":3,"notes":["正しい。消防法第8条第1項のとおりである。","正しい。消防法第8条第2項のとおりである。","正しい。消防法施行令第3条の2第1項のとおりである。","誤り。防火管理者は、防火対象物の管理について権原を有する者が、政令で定める資格を有する者のうちから定める（消防法第8条第1項）。消防長又は消防署長は、防火管理者が定められていないと認めるときに、権原を有する者に対して定めるべきことを命ずることができる（同条第3項）。","正しい。消防計画に基づく消火、通報及び避難の訓練の実施、消防用設備等の点検及び整備、火気の使用又は取扱いに関する監督、避難又は防火上必要な構造及び設備の維持管理並びに収容人員の管理などである（消防法第8条第1項、消防法施行令第3条の2第2項）。"],"ref":["消防法第8条","消防法施行令第3条の2"],"src":[]},
{"id":"S1-031","cat":"senmon","sub":"消防法","kubun":"1","stem":"消防法施行令に定める消防用設備等の種類に関する次の記述のうち、誤っているものはどれか。","choices":["屋内消火栓設備、スプリンクラー設備及び屋外消火栓設備は、消火設備に当たる。","自動火災報知設備、漏電火災警報器及び消防機関へ通報する火災報知設備は、警報設備に当たる。","すべり台、避難はしご、救助袋、緩降機及び誘導灯は、避難設備に当たる。","非常ベル、自動式サイレン及び放送設備は、避難設備に当たる。","排煙設備、連結送水管及び非常コンセント設備は、消火活動上必要な施設に当たる。"],"answer":3,"notes":["正しい。消防法施行令第7条第2項のとおりである。","正しい。消防法施行令第7条第3項のとおりである。","正しい。避難器具（すべり台、避難はしご、救助袋、緩降機、避難橋等）と誘導灯・誘導標識は避難設備である（消防法施行令第7条第4項）。","誤り。非常ベル、自動式サイレン及び放送設備は非常警報設備であり、警報設備に当たる（消防法施行令第7条第3項第4号）。","正しい。消火活動上必要な施設は、排煙設備、連結散水設備、連結送水管、非常コンセント設備及び無線通信補助設備である（消防法施行令第7条第6項）。"],"ref":["消防法第17条第1項","消防法施行令第7条"],"src":[]},
{"id":"S1-032","cat":"senmon","sub":"消防法","kubun":"1","stem":"消防用設備等の設置、維持及び点検に関する次の記述のうち、正しいものはどれか。","choices":["消防用設備等を設置し、及び維持する義務を負うのは、防火対象物の関係者ではなく市町村である。","防火対象物（政令で定めるものを除く。）の関係者は、消防用設備等を定期に点検し、その結果を消防長又は消防署長に報告しなければならない。","消防用設備等の点検結果の報告は、防火対象物の用途にかかわらず、3年に1回行えばよい。","延べ面積1,000平方メートル以上の百貨店や病院であっても、消防用設備等の点検は関係者が自ら行えば足りる。","消防用設備等の点検結果の報告先は、都道府県知事である。"],"answer":1,"notes":["誤り。防火対象物の関係者が、政令で定める技術上の基準に従って消防用設備等を設置し、及び維持しなければならない（消防法第17条第1項）。","正しい。消防法第17条の3の3のとおりである。点検は、設備の種類及び点検内容に応じ、1年以内で消防庁長官が定める期間ごとに行う（消防法施行規則第31条の6第1項）。","誤り。報告は、百貨店、旅館・ホテル、病院等の防火対象物（令別表第一(1)項から(4)項まで、(5)項イ、(6)項、(9)項イ、(16)項イ、(16の2)項及び(16の3)項）は1年に1回、その他の防火対象物は3年に1回である（消防法施行規則第31条の6第3項）。","誤り。百貨店、病院等で延べ面積が1,000平方メートル以上の防火対象物などは、消防設備士又は消防設備点検資格者に点検させなければならない（消防法第17条の3の3、消防法施行令第36条第2項）。","誤り。点検結果の報告先は、消防長又は消防署長である（消防法第17条の3の3）。"],"ref":["消防法第17条第1項","消防法第17条の3の3","消防法施行令第36条","消防法施行規則第31条の6"],"src":[]},
{"id":"S1-033","cat":"senmon","sub":"消防法","kubun":"1","stem":"防火対象物の管理等に関する消防法の規定についての次の記述のうち、正しいものはどれか。","choices":["学校、病院、百貨店等の防火対象物で政令で定めるものの管理について権原を有する者は、廊下、階段、避難口等に避難の支障になる物件が放置され、又はみだりに存置されないように管理しなければならない。","防火戸の閉鎖の支障になる物件は、避難上必要な施設に置かれたものではないので、管理の対象とされていない。","何人も、みだりに火災報知機や消火栓を使用し、損壊し、又は撤去してはならないが、その正当な使用を妨げることまでは禁止されていない。","消防法上の高層建築物とは、高さ60メートルを超える建築物をいう。","消防法上の「関係者」とは、防火対象物又は消防対象物の所有者に限られる。"],"answer":0,"notes":["正しい。消防法第8条の2の4のとおりである（対象となる防火対象物は消防法施行令第4条の2の3）。","誤り。権原を有する者は、防火戸についても、その閉鎖の支障になる物件が放置され、又はみだりに存置されないように管理しなければならない（消防法第8条の2の4）。","誤り。何人も、みだりに火災報知機、消火栓、消防の用に供する貯水施設等を使用し、損壊し、撤去し、又はその正当な使用を妨げてはならない（消防法第18条第1項）。","誤り。高層建築物とは、高さ31メートルを超える建築物をいう（消防法第8条の2第1項）。","誤り。「関係者」とは、防火対象物又は消防対象物の所有者、管理者又は占有者をいう（消防法第2条第4項）。"],"ref":["消防法第2条第4項","消防法第8条の2第1項","消防法第8条の2の4","消防法第18条第1項"],"src":[]},
{"id":"S1-034","cat":"senmon","sub":"消防法","kubun":"1","stem":"消火器の設置や表示に関する次の記述のうち、誤っているものはどれか。","choices":["消火器具は、通行又は避難に支障がなく、かつ、使用に際して容易に持ち出すことができる箇所に設置する。","消火器具は、床面からの高さが1.5メートル以下の箇所に設ける。","消火器具は、防火対象物の階ごとに、その各部分から一の消火器具に至る歩行距離が20メートル以下となるように配置する。","普通火災に適応する消火器の絵表示は、炎を赤色、可燃物を黒色とし、地色を白色とする。","電気火災に適応する消火器の絵表示は、地色を黄色とする。"],"answer":4,"notes":["正しい。消防法施行令第10条第2項第2号のとおりである。","正しい。消防法施行規則第9条第1号のとおりである。","正しい。消防法施行規則第6条第6項のとおりである。","正しい。消火器の技術上の規格を定める省令第38条第4項のとおりである。","誤り。電気火災用の絵表示は、電気の閃光を黄色とし、地色を青色とする。地色を黄色とするのは油火災用（Ｂ火災用）である（消火器の技術上の規格を定める省令第38条第4項）。"],"ref":["消防法施行令第10条第2項","消防法施行規則第6条第6項","消防法施行規則第9条","消火器の技術上の規格を定める省令第38条第4項"],"src":[]},
{"id":"S1-035","cat":"senmon","sub":"消防法","kubun":"1","stem":"統括防火管理者及び自衛消防組織に関する消防法の規定についての次の記述のうち、正しいものはどれか。","choices":["統括防火管理者は、防火対象物の管理について権原を有する者のうち、最も大きな権原を有する者が単独で定める。","各部分の防火管理者が作成する消防計画に、統括防火管理者が作成する防火対象物の全体についての消防計画が適合しなければならない。","統括防火管理者は、防火対象物の全体についての防火管理上必要な業務を行う場合において必要があると認めるときは、各部分の防火管理者に対し、当該業務の実施のために必要な措置を講ずることを指示することができる。","統括防火管理者を定めたときは所轄消防長又は消防署長に届け出なければならないが、解任したときは届け出る必要はない。","自衛消防組織を置いた権原を有する者は、自衛消防組織の要員の現況等を所轄消防長又は消防署長に届け出る必要はない。"],"answer":2,"notes":["誤り。統括防火管理者は、管理について権原を有する者が、政令で定める資格を有する者のうちから協議して定める（消防法第8条の2第1項）。","誤り。各部分の防火管理者が作成する消防計画が、統括防火管理者が作成する防火対象物の全体についての消防計画に適合するものでなければならない（消防法第8条の2第3項）。","正しい。消防法第8条の2第2項のとおりである。","誤り。統括防火管理者を定めたときは遅滞なく届け出なければならず、解任したときも同様である（消防法第8条の2第4項）。","誤り。自衛消防組織を置いたときは、遅滞なく自衛消防組織の要員の現況その他総務省令で定める事項を所轄消防長又は消防署長に届け出なければならず、当該事項を変更したときも同様である（消防法第8条の2の5第2項）。"],"ref":["消防法第8条の2","消防法第8条の2の5"],"src":[]},
{"id":"S1-036","cat":"senmon","sub":"銃刀法","kubun":"1","stem":"銃砲刀剣類所持等取締法の定義等に関する次の記述のうち、誤っているものはどれか。","choices":["刃渡り15センチメートル以上の刀、やり及びなぎなたは、刀剣類に当たる。","刃渡り5.5センチメートル以上の剣は、刀剣類に当たる。","45度以上に自動的に開刃する装置を有する飛出しナイフは、一定の要件を満たすものを除き、刀剣類に当たる。","圧縮した気体を使用して金属性弾丸を発射する機能を有する銃のうち、弾丸の運動エネルギーの値が内閣府令で定める値以上となる空気銃は、銃砲に当たる。","クロスボウは銃砲に当たらないため、同法による所持の禁止の対象とされていない。"],"answer":4,"notes":["正しい。銃砲刀剣類所持等取締法第2条第2項のとおりである。","正しい。同法第2条第2項のとおりである。","正しい。同法第2条第2項のとおりである。刃渡り5.5センチメートル以下で、開刃した刃体をさやと直線に固定させる装置を有しない等の要件を満たすものは除かれる。","正しい。同法第2条第1項第2号のとおりである。","誤り。クロスボウは銃砲ではないが、銃砲とともに「銃砲等」として所持が禁止されており、所持の許可を受けた場合など法定の場合を除き所持してはならない（同法第3条第1項）。"],"ref":["銃砲刀剣類所持等取締法第2条","銃砲刀剣類所持等取締法第3条第1項"],"src":[]},
{"id":"S1-037","cat":"senmon","sub":"銃刀法","kubun":"1","stem":"銃砲刀剣類所持等取締法に定める所持の禁止及び登録に関する次の記述のうち、誤っているものはどれか。","choices":["何人も、法令に基づき職務のため所持する場合など法定の場合を除いては、銃砲等又は刀剣類を所持してはならない。","美術品として価値のある刀剣類で登録を受けたものは、所持することができる。","美術品若しくは骨とう品として価値のある古式銃砲又は美術品として価値のある刀剣類の登録は、都道府県公安委員会が行う。","登録を受けた刀剣類を携帯し、又は運搬する者は、その登録証を常に携帯していなければならない。","所持の許可又は登録に係る銃砲等又は刀剣類を盗み取られたときは、直ちにその旨を警察官に届け出なければならない。"],"answer":2,"notes":["正しい。銃砲刀剣類所持等取締法第3条第1項のとおりである。","正しい。同法第14条の規定による登録を受けたもの（変装銃砲刀剣類等を除く。）を所持する場合は、所持の禁止の例外とされている（同法第3条第1項第6号）。","誤り。登録は、都道府県の教育委員会（条例により知事が文化財の保護に関する事務を行う都道府県では知事）が行う（同法第14条第1項）。教育委員会は、登録をしたときは所有者の住所地を管轄する都道府県公安委員会に通知する（同条第4項）。","正しい。同法第24条第1項のとおりである。","正しい。同法第23条の2のとおりである。"],"ref":["銃砲刀剣類所持等取締法第3条","銃砲刀剣類所持等取締法第14条","銃砲刀剣類所持等取締法第23条の2","銃砲刀剣類所持等取締法第24条"],"src":[]},
{"id":"S1-038","cat":"senmon","sub":"銃刀法","kubun":"1","stem":"刃物の携帯の禁止（銃砲刀剣類所持等取締法第22条）に関する次の記述のうち、正しいものはどれか。","choices":["刃体の長さが6センチメートルを超える刃物は、業務その他正当な理由がある場合であっても、携帯してはならない。","刃体の長さが8センチメートル以下のはさみ若しくは折りたたみ式のナイフ又はこれら以外の刃物で、政令で定める種類又は形状のものは、同条による携帯の禁止の対象から除かれている。","繁華街で絡まれたときに備えて護身用に持ち歩くことは、「正当な理由」に当たる。","同条に違反して刃物を携帯した者は、過料に処せられる。","同条の「携帯」には、自宅や居室の中に刃物を置いておくことも含まれる。"],"answer":1,"notes":["誤り。刃体の長さが6センチメートルを超える刃物の携帯が禁止されるのは、業務その他正当な理由による場合を除いた場合である（銃砲刀剣類所持等取締法第22条）。例えば、調理師が仕事場に包丁を持って行く場合は業務に、店で購入した刃物を自宅に持ち帰る場合は正当な理由に当たる。","正しい。同法第22条ただし書のとおりである。政令で定める種類又は形状は、同法施行令第43条に定められている。","誤り。護身用として持ち歩くことは、正当な理由に当たらないとされている。","誤り。同法第22条に違反した者は、2年以下の拘禁刑又は30万円以下の罰金に処せられる（同法第31条の18第2項第2号）。","誤り。「携帯」とは、自宅や居室以外の場所で、刃物を手に持ち、又は身体に帯びるなど、直ちに使用し得る状態で身辺に置くことをいう。"],"ref":["銃砲刀剣類所持等取締法第22条","銃砲刀剣類所持等取締法施行令第43条","銃砲刀剣類所持等取締法第31条の18第2項第2号"],"src":["https://www.keishicho.metro.tokyo.lg.jp/kurashi/drug/hamono/hamono.html"]},
{"id":"S1-039","cat":"senmon","sub":"銃刀法","kubun":"1","stem":"銃砲刀剣類所持等取締法第24条の2（銃砲刀剣類等の一時保管等）に関する次の記述のうち、誤っているものはどれか。","choices":["警察官は、銃砲刀剣類等を携帯し、又は運搬していると疑うに足りる相当な理由のある者が、異常な挙動その他周囲の事情から合理的に判断して他人の生命又は身体に危害を及ぼすおそれがあると認められる場合は、銃砲刀剣類等であると疑われる物を提示させ、又はそれが隠されていると疑われる物を開示させて調べることができる。","警察官は、銃砲刀剣類等を携帯し、又は運搬している者が、異常な挙動その他周囲の事情から合理的に判断して他人の生命又は身体に危害を及ぼすおそれがあると認められる場合において、その危害を防止するため必要があるときは、これを提出させて一時保管することができる。","同条に規定する警察官の権限は、銃砲刀剣類等による危害を予防するため必要な最小の限度において用いるべきものとされている。","施設警備業務に従事する警備員も、警備業務対象施設内においては、同条に基づき刃物を提出させて一時保管することができる。","一時保管された銃砲刀剣類等は、原則として、一時保管が始まった日から起算して5日以内に本人に返還される。"],"answer":3,"notes":["正しい。銃砲刀剣類所持等取締法第24条の2第1項のとおりである。","正しい。同条第2項のとおりである。","正しい。同条第4項のとおりである。","誤り。同条の提示・開示・一時保管は警察官の権限であり、警備員にはこのような権限はない（警備業法第15条）。危険な刃物等を所持する者を認めたときは、警察に通報する。","正しい。所轄警察署長は、一時保管を始めた日から起算して5日以内に本人に返還するものとされている（同条第6項）。ただし、危害防止のため本人への返還が不適当な場合や、所持が禁止されている銃砲等・刀剣類である場合などの例外がある（同項ただし書、同条第7項）。"],"ref":["銃砲刀剣類所持等取締法第24条の2","警備業法第15条"],"src":[]},
{"id":"S1-040","cat":"senmon","sub":"銃刀法","kubun":"1","stem":"銃砲刀剣類所持等取締法に関する次の記述のうち、正しいものはどれか。","choices":["銃砲等又は刀剣類を拾得した者は、速やかにその旨を最寄りの警察署に届け出なければならない。","銃砲等又は刀剣類を発見した者は、これを拾得しなかった場合には、警察署に届け出る必要はない。","準空気銃は空気銃に当たらないため、所持の禁止の対象とされていない。","金属で作られ、拳銃に著しく類似する形態を有する模造拳銃であっても、弾丸を発射する機能がなければ、所持することができる。","模造刀剣類は刀剣類ではないから、業務その他正当な理由なく携帯しても処罰されることはない。"],"answer":0,"notes":["正しい。銃砲刀剣類所持等取締法第23条のとおりである。警備業務対象施設内で拾得されたものも同様である。","誤り。銃砲等又は刀剣類を発見した者も、拾得した者と同様に、速やかに最寄りの警察署に届け出なければならない（同法第23条）。違反には罰則がある（同法第35条第2号）。","誤り。準空気銃（空気銃に該当しないが、人を傷害し得る運動エネルギーの弾丸を発射できるもの）は、法令に基づき職務のため所持する場合など法定の場合を除き、所持が禁止されている（同法第21条の3）。","誤り。模造拳銃（金属で作られ、かつ、拳銃に著しく類似する形態を有する物で内閣府令で定めるもの）は、届出をして輸出のための製造等を業とする者が業務のため所持する場合を除き、何人も所持してはならない（同法第22条の2）。","誤り。何人も、業務その他正当な理由による場合を除いては、模造刀剣類（金属で作られ、かつ、刀剣類に著しく類似する形態を有する物で内閣府令で定めるもの）を携帯してはならず（同法第22条の4）、違反には罰則がある（同法第35条第2号）。"],"ref":["銃砲刀剣類所持等取締法第21条の3","銃砲刀剣類所持等取締法第22条の2","銃砲刀剣類所持等取締法第22条の4","銃砲刀剣類所持等取締法第23条","銃砲刀剣類所持等取締法第35条"],"src":[]},
{"id":"S1-041","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設に立ち入った者への声かけと退去の求め方に関する次の記述のうち、適当でないものはどれか。","choices":["定められた名札やIDカードを付けていない来訪者には、積極的に声をかけて用件を尋ねる。","正当な用件のある来訪者であっても、定められた名札等を付けていないときは、受付に案内して手続をとらせる。","正当な理由がないと認められる者に退去を求めるときは、応援を求め、複数の警備員で対応する。","退去を求めた相手がその場を立ち去れば、施設の敷地の外に出たことまで見届ける必要はない。","退去を求める際は、相手が手を伸ばしても届かない距離を保ち、相手に背を向けないようにする。"],"answer":3,"notes":["正しい。名札やIDカードを付けているかどうかは離れていても分かるので、付けていない来訪者には積極的に声をかけ、用件を尋ねて、正当な理由のある者かどうかを見分ける（文部科学省「学校の危機管理マニュアル作成の手引」の不審者侵入への対応の例）。","正しい。対応した警備員だけが正当な用件を知っていても、ほかの者には不審者と区別がつかない。正当な理由があっても名札等を付けていない者は、受付に案内して所定の手続をとらせる（同手引）。","正しい。少しでも不審な点があると感じたら一人で対応せず、応援を求めて複数で対応するのが原則である（同手引）。厚生労働省の警備業向けマニュアルも、不審者には複数人で対応するよう示している。","誤り。いったん退去しても再び侵入するおそれがあるので、敷地の外に出たことを見届け、開いている門や出入口は閉めて施錠し、しばらくの間は複数で様子を見る。必要に応じて警察にも連絡する（同手引）。","正しい。相手が手を伸ばしても届かない距離を保ち、毅然とした態度で、いかなる場合も相手に背を向けないようにする（同手引）。"],"ref":["警備業法施行規則第38条第3項"],"src":["https://www.mext.go.jp/a_menu/kenko/anzen/__icsFiles/afieldfile/2019/05/07/1401870_01.pdf","https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S1-042","cat":"senmon","sub":"施設警備","kubun":"1","stem":"退去を求めても応じない者に対応する場合の要領として、適当なものはどれか。","choices":["相手を落ち着かせるため別室に案内するときは、警備員が相手の前を歩いて先導する。","速やかに110番通報し、相手の手の動きや所持品に注意しながら警察官の到着を待つ。","別室では、相手を入口に近い位置に座らせ、警備員は部屋の奥に位置して話を聴く。","別室に案内した後は、相手が勝手に出て行かないよう、出入口の扉を閉めておく。","相手を興奮させないよう、別室では警備員が1人だけで相手と向き合って話を聴く。"],"answer":1,"notes":["誤り。前を歩くと背後から危害を加えられるおそれがある。別室へは複数で案内し、案内する際は相手の前ではなく横を歩く（文部科学省「学校の危機管理マニュアル作成の手引」の不審者侵入への対応の例）。","正しい。退去に応じない者は危害を加える可能性があると考え、速やかに110番通報する。凶器をかばん等に隠し持っている場合もあるので手の動きに注意し、相手が興奮しないよう落ち着いて対応しながら警察官の到着を待つ。到着した警察官を現場へ案内する者も決めておく（同手引）。","誤り。別室では相手を先に部屋の奥へ案内し、警備員は身を守るために入口の近くに位置する（同手引）。","誤り。すぐに避難できるよう、出入口の扉は開けておく（同手引）。また、相手を出られないようにすると、監禁罪（刑法第220条）に当たるおそれがあり、他人の権利及び自由の侵害（警備業法第15条）にもなる。","誤り。相手と警備員が1対1にならないようにし、複数で対応する（同手引）。"],"ref":["警備業法第15条","刑法第220条","警備業法施行規則第38条第3項"],"src":["https://www.mext.go.jp/a_menu/kenko/anzen/__icsFiles/afieldfile/2019/05/07/1401870_01.pdf"]},
{"id":"S1-043","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設の周辺での不審な行動の着眼点とその扱いに関する次の記述のうち、適当でないものはどれか。","choices":["人目を気にしながら周囲の様子をうかがい、同じ場所を行ったり来たりしている者に注意を払う。","見かけない人が施設の周辺でメモを取ったり、写真やビデオを撮影したりしているときは注意を払う。","防犯カメラの向きや、警備員の配置や動きを確かめるような様子を見せる者に注意を払う。","普段見かけない車両が施設の近くに長時間駐車しているときは、車種、色、ナンバーなどを記録しておく。","不審な行動の例に当てはまる者は、その場で不審者と断定し、直ちに施設の敷地外へ退去させる。"],"answer":4,"notes":["正しい。人目を気にしながら周辺の様子をうかがっていることや、同じ場所を行ったり来たりするなどの不自然な行動は、不審者の特徴の例とされている（例：警視庁警備部「テロを未然に防ぐ小さな勇気」）。","正しい。見かけない人が施設の周辺でメモや録音をしたり、写真やビデオ撮影をしたりしていることは、不審者の特徴の例とされている（同資料）。施設の下見である可能性がある。","正しい。防犯カメラの向きや警備員の様子などを確認していることは、不審者の特徴の例とされている（同資料）。","正しい。レンタカーや普段見ない車両が長時間駐車していることは、不審な点の例とされている（同資料）。通報に備えて、車種、色、型、ナンバーなどを記録しておく。","誤り。これらは不審者の特徴の例示であり、これに限られるものではない（同資料）。当てはまるからといって直ちに犯罪を企てているとは限らないうえ、警備員は特別の権限を有しないので（警備業法第15条）、不審者と断定して強制的に退去させることはできない。声をかけて用件を尋ねる、動きを観察する、責任者に報告するなどし、必要に応じて110番通報する。"],"ref":["警備業法第15条","警備業法施行規則第38条第3項"],"src":["https://www.keishicho.metro.tokyo.lg.jp/kurashi/heion/antep_mpd.files/partnership2.pdf"]},
{"id":"S1-044","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設で受け付けた郵便物や宅配物に不審な点がある場合の対応として、適当なものはどれか。","choices":["差出人がはっきりせず、中身の表示と比べて重さが不自然な郵便物は、開封せずに報告し、警察に通報する。","宅配業者が届けた荷物は配送の途中で確認されているので、不審な点があっても通常どおり宛先に届ける。","差出人がはっきりしない郵便物は、中身を確かめるため、振って音を聞いたり光に透かしたりして調べる。","封筒から粉がにじみ出ているときは、粉を払い落としたうえで宛先の部署に届け、開封するかを判断させる。","差出人の住所と関係のない地域から発送されていることは、郵便物の不審な特徴には当たらない。"],"answer":0,"notes":["正しい。身に覚えのない郵便物で差出人もはっきりしないもの、中身の記載に対し実際の形や重さが不自然なものは、不審物の特徴の例とされている（例：警視庁警備部「テロを未然に防ぐ小さな勇気」）。開封したり動かしたりせず、責任者に報告するとともに110番通報する。","誤り。配達されたものであっても、不審物の特徴がある荷物は不審物として扱う。配送の過程で危険物の有無まで確認されているとは限らない。","誤り。不審物は振ったり落としたりしない。爆発物の場合は「さわるな、ふむな、けとばすな」、化学剤等の場合は「さわるな、かぐな、うごかすな」が原則とされている（同資料）。","誤り。中からにじみ出た液体や粉などの汚れは、不審物の特徴の例とされている（同資料）。化学剤等のおそれもあるので、粉を払ったり、においをかいだりせず、周囲から人を遠ざけて警察に通報する。","誤り。差出人の住所と関係のない地域から発送されていることも、不審物の特徴の例とされている（同資料）。"],"ref":["警備業法施行規則第38条第3項"],"src":["https://www.keishicho.metro.tokyo.lg.jp/kurashi/heion/antep_mpd.files/partnership2.pdf"]},
{"id":"S1-047","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設警備業務で、施設内の拾得物の届出を受けた場合の取扱いとして、適当でないものはどれか。","choices":["拾得の日時と場所、物件の種類と特徴、拾得者の氏名と連絡先などを、依頼者の定める様式に記録する。","遺失者だと名乗る者が現れたときは、物件の特徴などを確かめずに、その場で引き渡してよい。","現金が入った財布などは、拾得者の目の前で中身を確かめて金額を記録し、拾得者にも確認してもらう。","拾得者に報労金などの権利を放棄するかどうかを確かめ、放棄する場合はその申告を受けて記録しておく。","不特定かつ多数の者が利用する施設では、拾得物の種類や特徴などを、利用者の見やすい場所に掲示する。"],"answer":1,"notes":["正しい。拾得物は、施設占有者である依頼者が定めた手順に従って受け付け、後で遺失者への返還や警察署長への提出ができるよう、拾得の日時・場所、物件の特徴、拾得者の氏名等を記録する。施設占有者は、拾得者から請求があれば、物件の種類及び特徴、交付を受けた日時等を記載した書面を交付しなければならない（遺失物法第14条）。","誤り。遺失者を名乗る者には、物件の特徴や遺失の日時・場所などを尋ねて本人であることを確かめ、受領の記録をとったうえで返還する。特例施設占有者には、返還の相手が遺失者であることを確認し、受領書と引換えに返還することが義務付けられている（遺失物法第22条第1項）。","正しい。現金は後で金額をめぐる争いが生じやすいので、拾得者の目の前で確かめて記録し、確認してもらう。交付を受けた物件は、遺失者に返還し、又は警察署長に提出するまでの間、善良な管理者の注意をもって取り扱う（遺失物法第15条）。","正しい。施設で拾得をした拾得者は、あらかじめ施設占有者に申告して、物件に関する一切の権利を放棄することができる（遺失物法第30条）。拾得者が権利を放棄したときは、交付を受けた施設占有者が拾得者とみなされる（同法第33条）。","正しい。不特定かつ多数の者が利用する施設の施設占有者は、交付を受けた物件の種類及び特徴等を、施設を利用する者の見やすい場所に掲示しなければならない。掲示に代えて、書面を備え付けていつでも関係者に自由に閲覧させることもできる（遺失物法第16条）。"],"ref":["遺失物法第14条","遺失物法第15条","遺失物法第16条","遺失物法第22条","遺失物法第30条","遺失物法第33条"],"src":[]},
{"id":"S1-048","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設内で酒に酔って騒いでいる者への対応に関する次の記述のうち、適当でないものはどれか。","choices":["相手を刺激しないよう、落ち着いた丁寧な言葉で話しかけ、複数の警備員で対応する。","管理権者の定めに従って退去を求めても応じず、ほかの利用者に危害を加えるおそれがあるときは、警察に通報する。","警備員は、法律に基づき、公共の場所で著しく粗野又は乱暴な言動をしている酔客の言動を制止しなければならない。","酔って倒れ、呼びかけに反応しない者を見つけたときは、酔っているだけと決めつけず、119番通報など救護の措置をとる。","退去を求める際に、相手の腕をつかんで引っ張るなど、身体に力を加えて施設の外へ連れ出すことはしない。"],"answer":2,"notes":["正しい。不審者や暴れている者には、誠意ある言葉で話しかけて感情を逆なでしないようにし、可能な限り複数の警備員で対応する（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。","正しい。警備業務は施設の管理権等の範囲内で行われるものであり（警備業法第15条、解釈運用基準 第14の1）、警備員は特別の権限を持たない。酔って騒ぐ者には、管理権者の定めに従って退去を求め、応じずにほかの利用者に危害を加えるおそれがあるときは、警察に通報して警察官の対応を求める。なお、現にほかの利用者に暴行を加えているような場合に、誰にでも認められる正当防衛（刑法第36条）や現行犯逮捕（刑事訴訟法第213条）まで否定されるわけではない。","誤り。酒に酔つて公衆に迷惑をかける行為の防止等に関する法律で、公共の場所又は乗物において公衆に迷惑をかけるような著しく粗野又は乱暴な言動をしている酩酊者の言動を制止しなければならないとされているのは、警察官である（同法第5条第1項）。警備員にはこのような権限はない（警備業法第15条）。なお、このような言動をした酩酊者は、拘留又は科料に処せられる（同法第4条第1項）。","正しい。急性アルコール中毒や頭のけがなど、命に関わる状態のおそれがある。反応がなければ119番通報とAEDの手配をし、呼吸を確かめる（消防庁の一次救命処置の手順）。泥酔のため自己の生命、身体等に危害を及ぼすおそれがあり、応急の救護を要する者を保護するのは警察官であり（警察官職務執行法第3条第1項第1号）、必要に応じて警察にも連絡する。","正しい。身体に力を加えて連れ出すと暴行罪（刑法第208条）に当たるおそれがあり、他人の権利及び自由の侵害（警備業法第15条）にもなる。"],"ref":["警備業法第15条","解釈運用基準 第14の1","酒に酔つて公衆に迷惑をかける行為の防止等に関する法律第4条・第5条","警察官職務執行法第3条第1項","刑法第36条","刑法第208条","刑事訴訟法第213条"],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://laws.e-gov.go.jp/law/336AC0100000103","https://www.fdma.go.jp/laws/tutatsu/items/20261023_kyuuki_01.pdf"]},
{"id":"S1-049","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設の入口で来場者の協力を得て行う手荷物検査（所持品検査）の要領として、適当なものはどれか。","choices":["検査を手早く進めるため、目的や方法の説明を省き、警備員がかばんの中身を取り出して確かめる。","かばんは本人に開けてもらい、持込みを断る物の有無を確かめるのに必要な範囲で確認する。","時間を節約するため、入場者の外見や印象から不審だと感じた者だけを選んで検査する。","検査を拒んだ者は、拒んだこと自体が不審であるから、警察官が到着するまで事務室に留め置く。","混雑して列が長くなったときは、検査を終えた者と終えていない者が会場内で混ざっても差し支えない。"],"answer":1,"notes":["誤り。所持品検査は相手の承諾を得て行う任意のものであり、目的と方法を掲示や声かけで知らせ、協力を求めてから行う。中身は本人に取り出してもらうなどし、承諾なく警備員が他人の持ち物に手を入れない（警備業法第15条）。","正しい。かばんは本人に開けてもらって本人の目の前で確認し、確認は検査の目的（持込みを断る物の発見）に必要な範囲にとどめる。必要以上に財布や手帳の中身まで調べることは、他人の権利の不当な侵害となるおそれがある（警備業法第15条）。","誤り。入口での検査は、対象者に一律に協力を求めて行うのが基本である。外見や印象だけで特定の者を選ぶと、危険な物を見落とすおそれがあるうえ、差別的な取扱いと受け取られて苦情やトラブルの原因にもなる。","誤り。検査を拒まれた場合は、施設の管理権者の定めに従い入場を断るなどの措置にとどめる。警察官の到着まで留め置くことは監禁罪（刑法第220条）に当たるおそれがあり、他人の権利及び自由の侵害（警備業法第15条）にもなる。危険な物を所持しているおそれがあるときは警察に通報する。","誤り。検査を終えた者と終えていない者が混ざると、検査の効果が失われる。動線を分けるなどして混在を防ぎ、混在したときは再検査などの対応をとる。空港の保安検査でも、受検者と未受検者の接触や混在がないことを確実にする措置が求められている（危害行為防止基本方針 三の5）。"],"ref":["警備業法第15条","解釈運用基準 第14","刑法第220条","警備業法施行規則第38条第3項"],"src":["https://www.mlit.go.jp/koku/content/001993118.pdf"]},
{"id":"S1-050","cat":"senmon","sub":"施設警備","kubun":"1","stem":"巡回中に室内でガスの臭いに気付いた場合の措置として、適当なものはどれか。","choices":["室内の状況を確かめるため、出入口にある照明のスイッチを入れてから室内に入る。","早く換気するため、換気扇のスイッチを入れて室内の空気を外へ排出する。","ガス栓を閉め、窓や扉を開けて換気したうえで、ガス事業者等に連絡して指示を受ける。","LPガスは空気より軽いので、換気は天井近くの高い位置を中心に行う。","臭いが弱いときはガス漏れとは限らないので、巡回を終えてから責任者にまとめて報告する。"],"answer":2,"notes":["誤り。ガスが漏れているおそれがあるときは、換気扇や照明などの電気のスイッチは、入れるときだけでなく切るときにも火花が出てガスに引火するおそれがあるので、操作しない（LPガス安全委員会・経済産業省「家庭用LPガス保安ガイド」）。消防庁「LPガスを安全に使う為のポイント3」も、換気扇などの換気器具のスイッチは電気火花でガスに引火するおそれがあるので操作しないとしている。","誤り。換気扇のスイッチも電気火花でガスに引火するおそれがあるので、絶対に操作しない（同資料）。窓や扉を開けて換気する。","正しい。ガスの臭いに気付いたら、器具栓とガス栓を閉め（LPガスは容器バルブも閉める。）、扉や窓を開けて新鮮な空気を取り入れ、ガス事業者（LPガスの場合は販売店又は緊急時連絡の保安機関）に連絡して指示を受ける（同資料）。責任者にも速やかに報告する。","誤り。LPガスは空気より重いので、室内の床などの低い箇所の換気も十分に行う（同資料）。","誤り。わずかな臭いでもガス漏れのおそれがあり、放置すると爆発や火災につながるおそれがある。速やかに責任者に報告し、関係者に連絡する。ガス漏れの有無は、巡回の点検事項でもある。"],"ref":["警備業法施行規則第38条第3項"],"src":["https://www.fdma.go.jp/relocation/e-college/cat67/cat50/cat48/13lp3.html","https://www.mhlw.go.jp/content/000611912.pdf","https://www.tfd.metro.tokyo.lg.jp/content/000025039.pdf"]},
{"id":"S1-051","cat":"senmon","sub":"施設警備","kubun":"1","stem":"防犯カメラ（遠隔監視装置）による監視と映像の取扱いに関する次の記述のうち、適当でないものはどれか。","choices":["特定の個人を識別できるカメラ映像は個人情報に当たるので、依頼者が定めた利用目的と手順に従って取り扱う。","モニターで不審者を認めたときは、現場に向かう警備員に特徴や移動方向を伝え、モニターで動きを追い続ける。","撮影されていることを本人が容易に認識できない設置状況では、作動中である旨の掲示などの措置が必要とされている。","カメラの死角となる場所を把握しておき、巡回で重点的に確認するなど、人による警戒と組み合わせる。","利用者から、なくし物を探したいので録画映像を見せてほしいと頼まれたときは、警備員の判断でその場で見せる。"],"answer":4,"notes":["正しい。カメラにより特定の個人を識別できる画像を取得する場合は個人情報を取り扱うことになり、利用目的をできる限り特定し、その範囲内で利用する必要がある（個人情報保護委員会「個人情報の保護に関する法律についてのガイドライン」に関するQ&A Q1-13）。警備員は、依頼者が定めた取扱いの手順に従う。","正しい。遠隔監視装置は施設警備業務用機器の一つである（警備員等の検定等に関する規則 別表第一）。モニターで得た情報を現場の警備員に的確に伝えることで、安全で効果的な対応につながる。","正しい。偽りその他不正の手段による個人情報の取得は禁止されており（個人情報の保護に関する法律第20条第1項）、設置状況等から撮影されていることを本人が容易に認識できるとはいえない場合は、カメラが作動中であることを掲示するなどの措置を講じなければならないとされている。外観上カメラであることが明らかな場合でも、掲示等が望ましいとされている（同Q&A Q1-13）。","正しい。カメラで見通せない場所は人の目で補う必要がある。死角となる場所を把握し、巡回の経路や重点箇所に反映させる。","誤り。録画映像にはほかの利用者も映っており、映像の閲覧や提供は、依頼者が定めた手続に従って行う。警備員の判断でその場で見せてはならない。業務上知り得た情報を目的外に使用したり、漏らしたりしないことも求められる。"],"ref":["個人情報の保護に関する法律第20条第1項","警備員等の検定等に関する規則 別表第一"],"src":["https://www.ppc.go.jp/all_faq_index/faq1-q1-13_"]},
{"id":"S1-052","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設警備業務用機器が故障し、又は不調となった場合の措置として、適当なものはどれか。","choices":["故障や不調に気付いたら責任者と依頼者に報告し、復旧までは巡回を増やすなどして警戒を補う。","誤った警報が繰り返し出る侵入検知装置は、警備員の判断で回路を切り離し、勤務明けに報告する。","勤務の開始時の機器の作動確認は、前の勤務者から異常の申送りがなければ省略してよい。","故障した機器は、修理を待つと警戒に穴が空くので、警備員がその場で分解して直すようにする。","無線機が使えなくなった場合の代わりの連絡手段は、実際に故障が起きてから考えればよい。"],"answer":0,"notes":["正しい。施設警備業務用機器（携帯用無線装置、金属探知機、侵入検知装置、遠隔監視装置等）の故障又は不調の場合にとるべき措置は、施設警備業務の検定でも問われる事項である（警備員等の検定等に関する規則 別表第一・別表第二）。故障の箇所と時刻を記録して報告し、復旧までは巡回の強化や人の配置など代わりの方法で警戒の空白を補う。","誤り。誤作動と決めつけて警備員の判断で回路を切り離すと、その箇所の警戒が失われる。直ちに責任者と依頼者に報告し、その指示に従って点検や修理を依頼し、それまでの間は巡回などで警戒を補う。","誤り。前の勤務者が気付いていない不調もあるので、勤務の開始時には機器の作動を自ら確かめる。出入口の設備等の正常な作動の確認と不具合発生時の連絡・報告を業務とする例もある（総務省掲載の施設警備保安等業務の実施要項）。","誤り。機器の修理は、依頼者を通じて保守業者等が行う。警備員が分解すると、故障を広げるおそれがある。","誤り。無線機の故障や電波の届かない場所に備え、携帯電話や内線電話など代わりの連絡手段をあらかじめ決めておく。"],"ref":["警備員等の検定等に関する規則 別表第一","警備員等の検定等に関する規則 別表第二","警備業法施行規則第38条第3項"],"src":["https://www.soumu.go.jp/main_content/000452708.pdf"]},
{"id":"S1-053","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設の閉館時及び開館時の業務に関する次の記述のうち、適当でないものはどれか。","choices":["時間外に残留する者がいるときは、届出の内容と照らし合わせて残留者を把握し、退館の時刻を記録する。","照明がついている部屋は在室者の有無を確かめ、在室者がいるときは退出を確かめてから施錠する。","施錠されていない扉を見つけて施錠したときは、その場所と時刻を日誌に記録して報告する。","開館時は、建物の外周や出入口に侵入の痕跡などの異常がないかを確かめてから開錠する。","開錠や施錠を行う時刻は、巡回の都合に合わせて、警備員の判断で前後させてよい。"],"answer":4,"notes":["正しい。時間外及び休館日の出入りは、「時間外残留（入館）者届」などの届出を受理して管理する例が示されている（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」の警備指令書の例）。残留者を把握しておくと、火災等の際の確認にも役立つ。","正しい。照明が点灯している部屋は在室の有無を確認し、不在であれば消灯する例が示されている（総務省掲載の施設警備保安等業務の実施要項の例）。在室者がいるのに施錠すると、閉じ込めや避難の妨げとなるおそれがある。","正しい。勤務者の退所を確かめてから施錠し、施錠したときは日誌に記入する例が示されている（同実施要項の例）。施錠漏れのあった場所の記録は、依頼者が対策を講じる資料にもなる。","正しい。夜間に侵入があった場合に備え、異常の有無を確かめてから開錠する。異常を認めたときは開錠せず、責任者に報告し、必要に応じて110番通報して現場を保存する。","誤り。開錠・施錠の箇所及び時刻は、依頼者との取決め（警備計画書、警備指令書等）で定められる。変更が必要なときは、警備員の判断で行わず、責任者を通じて依頼者と協議する。"],"ref":["警備業法施行規則第38条第3項"],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://www.soumu.go.jp/main_content/000452708.pdf"]},
{"id":"S1-054","cat":"senmon","sub":"施設警備","kubun":"1","stem":"巡回の準備と巡回中の連絡に関する次の記述のうち、適当なものはどれか。","choices":["異常に対応していて一部の地点を回れなかったときは、後で巡回記録器の記録だけを済ませておく。","一人で巡回中の警備員から定時の連絡がないときは、巡回が長引いているものとして次の定時まで待つ。","巡回の途中で体調が悪くなったときは、持ち場を空けないよう、巡回を終えてから報告する。","巡回に出る前に、懐中電灯や無線機などの携行品が正常に作動するかを確かめておく。","巡回の経路は効率を優先し、人通りが多く明るい場所だけを通るように定める。"],"answer":3,"notes":["誤り。巡回記録器（巡回時計等）の記録は、指定された地点を巡回したことを示すものであり、回っていない地点の記録を付けると虚偽の記録となる。回れなかった地点と理由を記録して報告し、指示を受けて改めて巡回する。","誤り。単独で巡回する警備員は、急病や事故、不審者との遭遇などで連絡できなくなることがある。定時の連絡がないときは無線等で呼び掛け、応答がなければ応援を出して所在と安全を確かめる。","誤り。体調の異常は転倒などの事故につながるおそれがある。速やかに責任者に連絡し、交代などの指示を受ける。","正しい。夜間の巡回では懐中電灯の使用など定められたルールを守ることが求められ（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）、無線機は異常を発見したときの連絡に欠かせない。電池の残量を含め、出発前に作動を確かめる。","誤り。巡回の経路は、死角となる場所や人目の届きにくい場所、重要な箇所を含めて定める。明るく人通りの多い場所だけでは、侵入の痕跡や不審物を見落とすおそれがある。"],"ref":["警備業法施行規則第38条第3項"],"src":["https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S1-055","cat":"senmon","sub":"施設警備","kubun":"1","stem":"施設内で利用者から盗難の被害を申告された場合の対応として、適当なものはどれか。","choices":["被害の日時、場所、被害品の特徴などを聴き取って記録し、責任者に報告して、定めに従い警察に通報する。","被害者が犯人だと指摘した人物には、事務室への同行を求め、所持品を提示させて被害品の有無を確かめる。","被害の届出は被害者本人が警察に行うものであるから、責任者や依頼者への報告はしなくてよい。","被害品が置かれていた場所は、被害の状況を確かめるため、警察官の到着前に周囲の物を動かして調べる。","犯人がまだ施設内にいるおそれがあるときでも、出入口の警戒は強めず、通常どおりの出入管理を続ける。"],"answer":0,"notes":["正しい。盗難の形跡の発見や届出を受けた場合は、警備責任者へ通報して必要な指示を受ける例が示されている（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」の警備指令書の例）。盗難事故は110番通報する例もある（総務省掲載の施設警備保安等業務の実施要項の例）。依頼者が定めた手順に従い、警察への通報や依頼者への連絡を行う。","誤り。警備員は特別の権限を有しない（警備業法第15条）。被害者の申告だけで犯人と決めつけ、所持品を提示させることは、他人の権利及び自由の侵害に当たるおそれがある。疑うべき具体的な理由がないのに携帯品の提出を求めることは、同条違反の例とされている（解釈運用基準 第14の2）。","誤り。施設内で発生した盗難は依頼者に関係する事案であり、速やかに責任者に報告し、依頼者にも連絡する。盗難等の事故の発生時の措置は、契約前書面の記載事項でもある（警備業法施行規則第33条第1号リ）。","誤り。被害の現場には指紋や足跡などの痕跡が残っているおそれがあるので、物に触れたり動かしたりせず、警察官が到着するまで現場の保存に努める。","誤り。犯人が施設内にいるおそれがあるときは、依頼者の定めに従い、出入口の監視を強めて不審な者の出入りに注意する。ただし、出入りする者の所持品を強制的に調べることはできない（警備業法第15条）。"],"ref":["警備業法第15条","解釈運用基準 第14","警備業法施行規則第33条第1号"],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://www.soumu.go.jp/main_content/000452708.pdf"]},
{"id":"S1-056","cat":"senmon","sub":"施設警備","kubun":"1","stem":"空港の施設警備に関係する危害行為防止基本方針の内容として、正しいものはどれか。","choices":["制限区域は、滑走路、誘導路、エプロン等に設定され、航空旅客取扱施設や航空貨物取扱施設には設定されない。","空港等の管理者は、制限区域へのみだりな立入りを防ぐため、柵やゲートを設けるほか、出入管理や警備等の措置を講じる。","ランドサイドとは、保安検査を受けた者だけが立ち入ることのできる搭乗待合室などの区域をいう。","航空機保安検査は、旅客の搭乗と貨物の搭載が終わった後に、航空機に危険物等が隠されていないかを確かめるものである。","航空保安対策に携わる職員の教育訓練は、航空保安対策の委託を受けた警備業者の職員を対象としていない。"],"answer":1,"notes":["誤り。空港等の管理者は、空港の敷地内で航空旅客取扱施設（危険物等所持制限区域を含む。）、航空貨物取扱施設、滑走路その他の離着陸区域、誘導路、エプロン、管制塔、格納庫その他の施設について、人、車両等の立入りを制限する制限区域を設定する（危害行為防止基本方針 六の1(1)）。","正しい。空港等の管理者は、制限区域内に人、車両等が立ち入らないよう立入禁止柵、ゲートを設置する等の施設上の措置を講じるとともに、みだりに立ち入らないよう出入管理、警備等の措置を講じなければならない（同(1)）。空港に係る施設警備業務では、空港ごとに施設警備業務に係る1級検定合格警備員を配置することなども求められる（警備員等の検定等に関する規則第2条）。","誤り。ランドサイドは、空港利用者の立入りが制限されていない区域のうち、出発フロア、到着フロア、見学用施設、車両乗降場、空港利用者用駐車場等の利用者が密集する区域で、特に保護が必要と認められるものであり、警備員又は従業員による巡回、必要に応じた監視カメラの設置等の警備のための措置が講じられる（同(2)）。","誤り。航空運送事業者等は、旅客の搭乗及び貨物の搭載前に、航空機に危険物等が隠されていないか航空機保安検査を実施し、その開始から出発までの間、航空機への不審者の侵入や不審車両の接近を防止する対策を講じる（同2）。","誤り。航空保安に係る教育訓練は、航空保安対策を委託する場合は委託先の職員を含め、認定を受けたインストラクター等が実施するものとされている（同5(1)）。"],"ref":["航空法第131条の2の2","航空法第131条の2の3","危害行為防止基本方針 六","警備員等の検定等に関する規則第2条"],"src":["https://www.mlit.go.jp/koku/content/001993118.pdf"]},
{"id":"S1-057","cat":"senmon","sub":"施設警備","kubun":"1","stem":"依頼者から預かった施設の鍵の取扱いに関する次の記述のうち、適当でないものはどれか。","choices":["預かった鍵は、警備計画書等で定めた方法により厳重に保管し、保管場所は常に施錠しておく。","異常の発生時を除き、預かった鍵を使って業務に関係のない場所や部屋に立ち入らない。","依頼者から指示があるときは、警備業務の終了時に、預かった鍵の数を確かめたうえで返還する。","預かった鍵を紛失したときに備えて、警備業者の判断で合鍵を作り、別の場所に保管しておく。","常に携行する鍵は、落としたりしないよう、ひも等で身に付けるなどして確実に携行する。"],"answer":3,"notes":["正しい。預託された施設の鍵は、警備計画書によるほか厳重に保管する例が示されている（総務省掲載の施設警備保安等業務の実施要項の例）。予備鍵等は引出しに収納し、常に施錠して保管する例もある。鍵の管理方法は、契約前書面の記載事項でもある（警備業法施行規則第33条第1号チ、解釈運用基準 第18の2(6)）。","正しい。異常発生時を除き、業務に関係のない場所及び室への出入りを禁止する例が示されている（同実施要項の例）。預かった鍵は、依頼者との取決めの範囲内でのみ使用する。","正しい。依頼者の指示によっては夜間警備業務の終了時に鍵を返還する例や、予備鍵等を確認して返却し、勤務中の異状の有無を報告する例が示されている（同実施要項の例）。","誤り。預託された鍵は複製しない（同実施要項の例）。合鍵があると紛失や不正使用の危険が増え、依頼者が鍵の所在と本数を把握できなくなる。鍵の管理方法は依頼者との取決めに従う。","正しい。常に携行する鍵は、ひも等で堅く結ぶなどして携行する例が示されている（同実施要項の例）。紛失した鍵は悪用されるおそれがあり、錠の交換が必要になることもある。"],"ref":["警備業法施行規則第33条第1号チ","解釈運用基準 第18の2(6)","警備業法施行規則第38条第3項"],"src":["https://www.soumu.go.jp/main_content/000452708.pdf"]},
{"id":"S1-058","cat":"senmon","sub":"施設警備","kubun":"1","stem":"警備員等の検定等に関する規則に定める施設警備業務に係る検定に関する次の記述のうち、正しいものはどれか。","choices":["学科試験の法令に関する科目には、消防法は含まれるが、銃砲刀剣類所持等取締法は含まれない。","施設警備業務の管理に関することは、1級及び2級のいずれの検定でも学科試験の科目とされている。","施設警備業務用機器の故障又は不調の場合にとるべき措置は、1級・2級とも学科試験と実技試験で問われる。","事故の発生時における負傷者の救護に関することは、1級の検定に限り、学科試験で問われる事項とされている。","2級の検定の実技試験の科目は、出入管理及び巡回に関することに限られ、事故発生時の応急の措置に関することは含まれない。"],"answer":2,"notes":["誤り。施設警備業務に係る検定の学科試験の「法令に関すること」には、警備業法その他警備業務の実施の適正を確保するため必要な法令のほか、消防法、銃砲刀剣類所持等取締法その他施設警備業務の実施に必要な法令が含まれる（検定規則別表第一・別表第二）。","誤り。「施設警備業務の管理に関すること」（施設の構造等の事前調査、出入管理・巡回・機器の使用の管理等）は、1級の検定の学科試験及び実技試験の科目であり（検定規則別表第一）、2級の検定の科目とはされていない（同別表第二）。","正しい。1級・2級とも、学科試験の「警備業務対象施設における保安に関すること」で施設警備業務用機器の故障又は不調の場合にとるべき措置に関する知識が、実技試験の同じ科目でその措置を行う能力が、判定の基準とされている（検定規則別表第一・別表第二）。施設警備業務用機器とは、携帯用無線装置、金属探知機、侵入検知装置、遠隔監視装置その他施設警備業務を実施するために使用する機器をいう。","誤り。事故の発生時における負傷者の救護及び警備業務対象施設における危険の防止のための措置は、1級・2級とも、「警備業務対象施設の破壊等の事故が発生した場合における応急の措置に関すること」の判定の基準とされている（検定規則別表第一・別表第二）。","誤り。2級の実技試験の科目は、「警備業務対象施設における保安に関すること」（出入管理、巡回、施設警備業務用機器の操作、故障又は不調の場合の措置）と「警備業務対象施設の破壊等の事故が発生した場合における応急の措置に関すること」である（検定規則別表第二）。"],"ref":["警備員等の検定等に関する規則第6条","警備員等の検定等に関する規則 別表第一","警備員等の検定等に関する規則 別表第二"],"src":[]},
{"id":"S1-059","cat":"senmon","sub":"空港保安","kubun":"1","stem":"航空法第131条の2の3に基づく危害行為の防止のための指示に関する次の記述のうち、誤っているものはどれか。","choices":["この指示は、例えば開披検査への協力等について、法的根拠をもって必要な指示を行えるようにすることを目的としている。","指示を行える職員は保安検査に従事する者に限られ、空港の制限区域を警備する者の職員は含まれない。","指示を行えるのは、必要な教育訓練を受け、指示を行える職員として空港等の設置者等の指定を受けた職員である。","旅客その他の者は、指示があったときは、正当な理由がない限り、その指示に従わなければならない。","指示を行う職員は、身分を示す証明書を携帯し、旅客その他の者から請求があったときは、これを提示しなければならない。"],"answer":1,"notes":["正しい。航空法第131条の2の3第2項の指示は、例えば開披検査への協力等について、法的根拠を持って必要な指示を行えるようにすることで、航空保安対策がより確実に講じられるようにすることを目的としている。ただし、措置を適確に実施する必要があると認めるときに行うもので、無制限に指示を行えるものではない（危害行為防止基本方針 六の5(3)）。","誤り。指示を行える職員には、保安検査や預入手荷物検査を行う者及び受託者の職員、航空運送事業者の職員のほか、航空旅客取扱施設又は空港の制限区域を警備する者の職員（その主体から委託を受けて警備業務を行う者の職員を含む。）も含まれる（同方針 六の5(3)）。例えば、関係者以外の立入りを禁じた区域に侵入しようとする旅客等に対し、その行為をやめるよう指示することが想定されている。この指示は、航空法が、教育訓練を受けて指定を受けた職員に認めたものであり、警備業法によって警備員に与えられた権限ではない（警備業法第15条）。","正しい。指示を行えるのは、空港等の設置者等が国土交通省令で定めるところにより指定した職員であって、危害行為の防止に関連する職務に従事する者に限られる（航空法第131条の2の3第2項）。基本方針は、必要な教育訓練を受けていること及び指定を受けていることを要件としている（同方針 六の5(3)）。","正しい。航空法第131条の2の3第4項のとおりである。なお、この指示は航空機外での行為を対象とし、航空機内での行為には、安全阻害行為等の禁止等の規定（同法第73条の3・第73条の4）により対応するのが原則である（同方針 六の5(3)）。","正しい。航空法第131条の2の3第3項のとおりである。"],"ref":["航空法第131条の2の3","航空法第73条の3","航空法第73条の4","危害行為防止基本方針 六の5(3)","警備業法第15条"],"src":["https://www.mlit.go.jp/koku/content/001993118.pdf"]},
{"id":"S1-060","cat":"senmon","sub":"空港保安","kubun":"1","stem":"航空法及び危害行為防止基本方針に定める預入手荷物検査に関する次の記述のうち、正しいものはどれか。","choices":["航空運送事業者等は、預入手荷物を受託した時から航空機に積載するまでの間、危険物等が混入されないよう保安措置をとる。","預入手荷物検査は、旅客が航空機の客室内に持ち込む携行品を対象とする検査である。","預入手荷物検査で含まれていないことを確認する物件は、凶器を含め、保安検査で所持の有無を確認する物件と同じ範囲である。","航空機強取行為等を行うおそれがない者として国土交通省令で定める者の預入手荷物も、例外なく検査を経なければ積載できない。","預入手荷物検査は、機器による検査で爆発物等が含まれていると疑われる場合に限り、開披検査により行う。"],"answer":0,"notes":["正しい。航空運送事業者等は、旅客から受託した時点から航空機内に積載するまでの間、外部から危険物等が混入されないよう保安措置をとるとともに、搭乗旅客と預入手荷物との照合を行い、不一致が発生した場合には適切な対応をとるものとされている（危害行為防止基本方針 四の5）。","誤り。預入手荷物とは、旅客の手荷物のうち、携行品その他航空機の客室内に持ち込まれるものを除いたものをいう（航空法第131条の2の6第1項）。客室内に持ち込む携行品は、保安検査の対象である（同法第131条の2の5）。","誤り。預入手荷物検査で含まれていないことを確認するのは、保安検査の対象となる物件のうち、爆発性又は易燃性を有する物件として国土交通省令で定めるものに限られる（航空法第131条の2の6第1項）。","誤り。航空機強取行為等を行うおそれがないものとして国土交通省令で定める者の預入手荷物を航空機内に積載する場合は、預入手荷物検査を要しない（航空法第131条の2の6第1項ただし書）。","誤り。預入手荷物検査は機器による検査を基本とし、爆発物等が含まれていると疑われる場合のほか、機器が故障により使用できない場合等の必要な場合に開披検査により行う。爆発物等が発見された場合は、警察への引渡し等を含む必要な対応をとる（危害行為防止基本方針 四の5）。"],"ref":["航空法第131条の2の5","航空法第131条の2の6","危害行為防止基本方針 四"],"src":["https://www.mlit.go.jp/koku/content/001993118.pdf"]},
{"id":"S1-061","cat":"senmon","sub":"空港保安","kubun":"1","stem":"航空機内への物件の持込みの制限に関する次の記述のうち、誤っているものはどれか。","choices":["危険物の中には、一定の数量等の制限の下で、持込み手荷物又は預入手荷物として運ぶことができるものがある。","航空運送事業を経営する者は、爆発物等であることを疑うに足りる相当な理由がある携行品の機内への持込みを拒絶することができる。","小型の喫煙用ライター（ターボライターなど一部の種類を除く。）は、1人1個に限り身に付けて機内に持ち込むことができるが、預入手荷物とすることはできない。","化粧品類のエアゾールは、1容器当たりの容量にかかわらず、航空機内に持ち込むことはできない。","刃物類は、ハイジャックやテロに使われるおそれがあるため、持込み手荷物としては機内に持ち込めないものがある。"],"answer":3,"notes":["正しい。航空法は、爆発のおそれがあるもの、燃えやすいものその他人に危害を与え又は他の物件を損傷するおそれのあるもので国土交通省令で定めるものの航空機による輸送を禁止しているが（航空法第86条第1項）、その中には一定の制限の下で持込み手荷物又は預入手荷物として運ぶことができるものがある（国土交通省「機内への持込み、お預け手荷物に制限がある品目について」）。","正しい。航空法第86条の2第1項。形状、重量その他の事情により爆発物等であることを疑うに足りる相当な理由がある場合は、輸送や航空機内への持込みを拒絶し、所持人に取卸しを要求することができる。自ら取り卸すことができるのは、託送人又は所持人がその場に居合わせない場合に限られる。","正しい。小型の喫煙用ライター又は小型の安全マッチは、預入手荷物とすることはできず、1人当たり1個に限り、身に付けて持ち込むこととされている（航空機による爆発物等の輸送基準等を定める告示 別表第18、令和8年4月24日適用）。燃料と空気が燃焼の前に混合されるプリミキシングライター（いわゆるターボライター）などはこの扱いから除かれており、持込み手荷物にも預入手荷物にもできない。航空会社がより厳しいルールを設けている場合もある。","誤り。非放射性の医薬品類及び化粧品類（エアゾールを含む。）は、1容器当たりの質量又は容量が0.5kg以下又は0.5ℓ以下のもので、1人当たり2kg又は2ℓまで、持込み手荷物又は預入手荷物として運ぶことができる（同告示 別表第18）。なお、国際線では、これとは別に、液体物（エアゾールを含む。）を客室内に持ち込む際の容器の容量等の制限がある（国土交通省「国際線の客室内への液体物持込制限について」）。","正しい。刃物類のように、ハイジャックやテロに使われるおそれがあるため持込み手荷物として機内に持ち込めないものがある（国土交通省の同ページ）。保安検査で発見された場合は、放棄や預入手荷物への変更が求められ、必要な場合には警察への引渡し等の対応がとられる（危害行為防止基本方針 三の5）。"],"ref":["航空法第86条","航空法第86条の2","航空機による爆発物等の輸送基準等を定める告示 別表第18"],"src":["https://www.mlit.go.jp/koku/koku_fr2_000007.html","https://www.mlit.go.jp/common/001388681.pdf","https://www.mlit.go.jp/koku/content/001993118.pdf","https://www.mlit.go.jp/common/001175649.pdf"]},
{"id":"S1-062","cat":"senmon","sub":"空港保安","kubun":"1","stem":"航空機の強取等の処罰に関する法律に関する次の記述のうち、正しいものはどれか。","choices":["暴行又は脅迫を用いて航行中の航空機を強取した者は、無期又は10年以上の拘禁刑に処せられる。","航空機の強取等の罪を犯し、よって人を死亡させた者は、無期又は7年以上の拘禁刑に処せられる。","偽計又は威力を用いて航行中の航空機の針路を変更させた者は、3年以下の拘禁刑又は50万円以下の罰金に処せられる。","航空機の強取等の罪は、日本国民が日本国外で犯した場合に限り、国外犯として処罰される。","航空機の強取等の罪を犯す目的で予備をした者が、実行に着手する前に自首したときは、その刑を減軽し、又は免除する。"],"answer":4,"notes":["誤り。暴行若しくは脅迫を用い、又はその他の方法により人を抵抗不能の状態に陥れて、航行中の航空機を強取し、又はほしいままにその運航を支配した者は、無期又は7年以上の拘禁刑に処せられる（航空機の強取等の処罰に関する法律第1条第1項）。未遂も罰せられる（同条第2項）。","誤り。航空機強取等致死の罪は、死刑又は無期拘禁刑である（同法第2条）。","誤り。偽計又は威力を用いて、航行中の航空機の針路を変更させ、その他その正常な運航を阻害した者は、1年以上10年以下の拘禁刑に処せられる（同法第4条）。","誤り。同法第1条から第4条までの罪は、刑法第2条の例に従う（同法第5条）。すなわち、日本国外においてこれらの罪を犯したすべての者に適用される。","正しい。同法第3条。航空機の強取等の罪を犯す目的でその予備をした者は3年以下の拘禁刑に処せられるが、実行に着手する前に自首した者は、その刑を減軽し、又は免除する。"],"ref":["航空機の強取等の処罰に関する法律第1条〜第5条","刑法第2条"],"src":["https://laws.e-gov.go.jp/law/345AC0000000068"]},
{"id":"S1-063","cat":"senmon","sub":"機械警備","kubun":"1","stem":"機械警備業務の開始の届出（警備業法第40条）に関する次の記述のうち、誤っているものはどれか。","choices":["届出書には、認定をした公安委員会の名称及び認定の番号を記載する。","届出書には、基地局ごとに、当該機械警備業務に係る待機所の名称及び所在地を記載する。","届出書には、その都道府県の区域内の基地局について選任する機械警備業務管理者の資格者証の写しを添付する。","届出書の提出をしなかった者は、100万円以下の罰金に処せられる。","届出書には、待機所ごとに、配置する警備員の氏名を記載する。"],"answer":4,"notes":["正しい。法第40条第3号の内閣府令で定める事項として、認定をした公安委員会の名称及び認定の番号が定められている（府令第54条第1号）。","正しい。府令第54条第2号のとおりである。あわせて、その待機所に係る警備業務対象施設（他の都道府県の区域内に所在するものを除く。）の所在する市町村（指定都市にあっては区又は総合区）の名称も記載する。","正しい。府令第55条第1号のとおりである。このほか、誠実に業務を行うことを誓約する書面、履歴書及び住民票の写し等、精神機能の障害に関する医師の診断書なども添付する（同条第2号～第5号）。","正しい。法第40条の規定に違反して届出書の提出をしなかった者は、100万円以下の罰金に処せられる（法第57条第6号）。","誤り。待機所ごとに配置する警備員の氏名は、基地局ごとに備える書類の記載事項である（法第44条第1号）。届出書には、氏名又は名称及び住所等、基地局の名称及び所在地並びに機械警備業務管理者の氏名及び住所、府令で定める事項を記載する（法第40条、府令第54条）。"],"ref":["警備業法第40条","警備業法第44条第1号","警備業法第57条第6号","警備業法施行規則第54条","警備業法施行規則第55条"],"src":[]},
{"id":"S1-064","cat":"senmon","sub":"機械警備","kubun":"1","stem":"機械警備業務に係る廃止等の届出（警備業法第41条）に関する次の記述のうち、正しいものはどれか。","choices":["基地局の機械警備業務管理者を交代させたときの届出書には、新たに選任した機械警備業務管理者の資格者証の写し等を添付する。","基地局を一つでも廃止したときは、その都道府県の区域内で機械警備業務を廃止したものとして、廃止の届出書を提出しなければならない。","機械警備業者の名称や代表者の氏名に変更があったときは、機械警備業務の届出をした全ての公安委員会に変更の届出書を提出しなければならない。","廃止等の届出書は、警察署長を経由せず、公安委員会に直接提出しなければならない。","待機所の所在地に変更があっても、変更の届出をする必要はない。"],"answer":0,"notes":["正しい。機械警備業務管理者の氏名及び住所は法第40条第2号の事項であり、その変更は法第41条の届出の対象となる。届出書には、府令第55条に規定する書類のうち当該変更事項に係る書類（資格者証の写し、誓約書等）を添付する（府令第58条第1号）。","誤り。当該都道府県の区域内で機械警備業務を廃止する旨の届出書（都道府県内廃止届出書）は、区域内の基地局及び警備業務対象施設が全てなくなった場合にのみ提出する（府令第56条第1項、解釈運用基準 第27の1）。基地局を廃止したが区域内で機械警備業務を続ける場合は、変更の届出書（別記様式第19号）による。","誤り。氏名又は名称、住所及び代表者の氏名の変更の届出は、法第11条第1項の変更届出書により、主たる営業所の所在地を管轄する公安委員会に対してのみ行われる。他の公安委員会は、主たる営業所の所在地を管轄する公安委員会からの通知（法第11条第2項）により把握する（解釈運用基準 第27の2）。","誤り。廃止等の届出書は、開始の届出書の提出に当たって経由した警察署長（府令第53条第2項）を経由して、当該事由の発生の日から10日以内に提出しなければならない（府令第56条第2項）。","誤り。待機所の名称及び所在地は法第40条第3号の事項（府令第54条第2号）であり、変更があったときは法第41条の届出をしなければならない。届出書の提出をしなかった者には罰則がある（法第58条第3号）。"],"ref":["警備業法第11条","警備業法第40条","警備業法第41条","警備業法第58条第3号","警備業法施行規則第53条第2項","警備業法施行規則第54条","警備業法施行規則第56条","警備業法施行規則第58条","解釈運用基準 第27"],"src":[]},
{"id":"S1-065","cat":"senmon","sub":"機械警備","kubun":"1","stem":"機械警備業務管理者に関する次の記述のうち、正しいものはどれか。","choices":["機械警備業務管理者が監督する警備業務用機械装置の「維持管理」とは日常的な維持管理をいい、軽易な故障の際の応急的な修理は含まれない。","二以上の基地局を通じて1人の機械警備業務管理者を置くことの承認は、一度受ければ、その後に承認の要件を満たさなくなっても取り消されない。","機械警備業務管理者を選任しなかった者は、指導教育責任者を選任しなかった場合と同じく、100万円以下の罰金に処せられる。","機械警備業務管理者が作成する警備業務用機械装置の運用の計画には、装置の定期的な点検の予定が含まれる。","機械警備業務管理者資格者証は、指導教育責任者資格者証と同じく、警備業務の区分ごとに交付される。"],"answer":3,"notes":["誤り。府令第61条第1号の「警備業務用機械装置の維持管理」とは、日常的な維持管理のほか、軽易な故障の際の応急的な修理等をいう（解釈運用基準 第28の1(1)）。","誤り。兼任の承認は、警備業務対象施設の数の合計数が5,000以下であり、かつ、機械警備業務管理者の業務の適正な実施に支障がない場合にのみ行われ、承認の要件を満たさなくなったときは取り消すこととされている（府令第60条、解釈運用基準 第28の2(2)・(5)）。支障の有無は、指令件数や勤務員の人数、兼任する基地局を管理するための通信方法等を踏まえ、総合的に判断される（同(3)）。","誤り。法第42条第1項の規定に違反して機械警備業務管理者を選任しなかった者は、30万円以下の罰金に処せられる（法第58条第8号）。指導教育責任者を選任しなかった者は100万円以下の罰金であり（法第57条第5号）、罰金の額が異なる。","正しい。府令第61条第1号の「計画」とは、指令業務に従事する警備員の勤務予定、警備業務用機械装置の定期的な点検の予定、故障の際に執るべき措置についての定め等をいう（解釈運用基準 第28の1(2)）。","誤り。指導教育責任者資格者証は警備業務の区分ごとに交付される（法第22条第3項）が、機械警備業務管理者資格者証にはこの規定が準用されておらず（法第42条第3項）、区分ごとに交付されるものではない。"],"ref":["警備業法第22条第3項","警備業法第42条","警備業法第57条第5号","警備業法第58条第8号","警備業法施行規則第60条","警備業法施行規則第61条第1号","解釈運用基準 第28"],"src":[]},
{"id":"S1-066","cat":"senmon","sub":"機械警備","kubun":"1","stem":"機械警備業者が基地局ごとに備える書類（警備業法第44条）に関する次の記述のうち、誤っているものはどれか。","choices":["待機所ごとに、配置する車両その他の装備の種類ごとの数量を記載する。","待機所ごとに、市町村の区域（指定都市にあっては、区又は総合区の区域）ごとの警備業務対象施設の数を記載する。","受信した情報に応じて「講じた措置」とは、警備員に対する指令に限られ、警察機関への連絡は含まれない。","情報を受信して警備員を現場に向かわせた場合は、受信の時から警備員が現場に到着する時までに要した時間を記載する。","基地局に書類を備え付けず、又は必要な事項を記載しなかった者は、30万円以下の罰金に処せられる。"],"answer":2,"notes":["正しい。府令第64条第1項第4号のとおりである。この「その他の装備」は、法第43条の「その他の装備」と同じく無線機、懐中電灯等をいい、護身用具は含まれない（解釈運用基準 第29の3、第30の3）。","正しい。府令第64条第1項第2号のとおりである（別記様式第21号により記載する）。","誤り。府令第64条第1項第5号の「その情報に応じて講じた措置」とは、警備員に対する指令、警察機関への連絡等をいい、その時刻についても記載するよう指導するものとされている（解釈運用基準 第30の4）。","正しい。府令第64条第1項第5号括弧書のとおりである。基地局への立入検査では、受信の日時や現場到着までに要した時間の記載状況を検査し、確実かつ正確な記載が行われるよう指導するものとされている（解釈運用基準 第30の4）。","正しい。法第44条に規定する書類を備え付けず、又はこれに必要な事項を記載せず、若しくは虚偽の記載をした者は、30万円以下の罰金に処せられる（法第58条第9号）。"],"ref":["警備業法第44条","警備業法第58条第9号","警備業法施行規則第64条第1項","解釈運用基準 第29の3","解釈運用基準 第30"],"src":[]},
{"id":"S1-067","cat":"senmon","sub":"機械警備","kubun":"1","stem":"機械警備業務において、基地局で盗難等の事故の発生に関する情報を受信した場合の警察機関への通報に関する次の記述のうち、適当なものはどれか。","choices":["警察への通報は、受信した情報の内容にかかわらず、警備員を現場に向かわせる前に行うのが原則である。","警備員が現場に着く前に施設の関係者から侵入されたとの連絡があっても、警備員が現場を確認するまで警察へ通報してはならない。","通報の基準や方法は全国で統一されているので、警備業務対象施設の所在する都道府県の警察の運用を確かめる必要はない。","警察への通報は、原則として、施設を管轄する警察署の代表電話に掛けて行う。","現場の確認を待たずに警察に通報するときは、通常の110番通報と区別できるよう、その旨を告げる。"],"answer":4,"notes":["誤り。警察庁が示した通報基準を基に都道府県警察が定める要領では、警備員が現場で事実を確認し、警察の初動措置を要すると認めたときに通報する「確認通報」が原則とされている（例：山口県警察の通報基準、富山県警察の運用要領）。即応体制の整備（法第43条）も、現場における警備員による事実の確認を前提としている。","誤り。警備員が現場に到着する前に、施設の関係者等からの連絡により異常の事実が確認された場合は、現場の確認を待たずに通報する「即時通報」が認められている（例：警視庁の通達、静岡県警察・山口県警察・富山県警察の要領）。","誤り。機械警備業務管理者講習では、警察機関への通報の要領を、当該都道府県警察における110番電話の運用方針を踏まえて説明することとされている（指導教育責任者講習の運用 別表第3）。即時通報を認める施設の種別や、警察が即時通報を依頼する期間などは、都道府県警察ごとに異なる（例：静岡県警察は3箇月以内、山口県警察は6か月）。","誤り。警察への通報は、原則として110番により行う（例：静岡県警察・山口県警察・富山県警察の要領）。他の都道府県に所在する基地局からの通報の方法など、細部は都道府県警察ごとに定められている。","正しい。即時通報を行うときは、通常の110番通報と区別するため、冒頭で即時通報である旨を告げるよう指導されている（例：警視庁の通達、山口県警察の通報基準、富山県警察の運用要領）。"],"ref":["警備業法第43条","指導教育責任者講習の運用 別表第3"],"src":["https://www.keishicho.metro.tokyo.lg.jp/about_mpd/johokoukai_portal/kunrei/kunrei_seian.files/23_8_015.pdf","https://www.pref.shizuoka.jp/police/_res/projects/project_police/_page_/002/000/926/seian038.pdf","https://www.pref.yamaguchi.lg.jp/uploaded/attachment/120292.pdf","https://police.pref.toyama.jp/documents/2477/167kikaikeibigyousyakaranokeisatukikanhenoijouhappou.pdf"]},
{"id":"S1-068","cat":"senmon","sub":"機械警備","kubun":"1","stem":"機械警備業務において、警備員による現場の確認の前に警察に通報（即時通報）した場合の対応に関する次の記述のうち、適当でないものはどれか。","choices":["即時通報をした場合でも、警備員を速やかに現場に向かわせ、事実の確認その他の必要な措置を講じる。","警備員が警察官より先に現場に到着したときは、警察官の到着を待たずに、単独で屋内に入って侵入者を捜す。","現場に向かう警備員には、即時通報をした事案であることを伝える。","警察官が到着したときは、施設の状況を伝えるなど、警察官の現場の検索や被疑者の検挙活動に協力する。","即時通報の後に、施設の関係者から誤操作であったとの連絡を受けたときは、速やかにその旨を警察に連絡する。"],"answer":1,"notes":["正しい。即時通報を行った場合でも、法第43条に基づく警備員による事実の確認その他の必要な措置が免除又は軽減されるものではない（例：警視庁の通達、山口県警察の通報基準）。","誤り。即時通報事案で警察官より先に到着した場合は、警戒しながら待機し、警察官の到着後はその現場の検索や被疑者の検挙活動に協力するよう指示するものとされている（例：富山県警察の運用要領）。単独で屋内に入ると、侵入者と遭遇して危害を受けるおそれがあり、現場の痕跡を損なうおそれもある（現場保存について解釈運用基準 第29の1）。","正しい。即時通報を行った場合は、臨場する警備員に即時通報事案である旨を明示し、必要な指示をすることとされている（例：富山県警察の運用要領）。","正しい。警察官の現場の検索や被疑者の検挙活動への協力について、臨場する警備員に必要な指示をすることとされている（例：富山県警察の運用要領）。","正しい。警察の不要な出動が続かないよう、誤報と判明したときは速やかに警察に連絡する。誤報については、その都度原因を調査して改善措置を講じ、その結果を通報先の警察署に報告するよう指導されている（例：静岡県警察の要領）。"],"ref":["警備業法第43条","解釈運用基準 第29の1","指導教育責任者講習の運用 別表第3"],"src":["https://www.keishicho.metro.tokyo.lg.jp/about_mpd/johokoukai_portal/kunrei/kunrei_seian.files/23_8_015.pdf","https://www.pref.shizuoka.jp/police/_res/projects/project_police/_page_/002/000/926/seian038.pdf","https://www.pref.yamaguchi.lg.jp/uploaded/attachment/120292.pdf","https://police.pref.toyama.jp/documents/2477/167kikaikeibigyousyakaranokeisatukikanhenoijouhappou.pdf"]},
{"id":"S1-069","cat":"senmon","sub":"機械警備","kubun":"1","stem":"機械警備業務における誤報とその防止に関する次の記述のうち、適当でないものはどれか。","choices":["警察の初動措置を要しない誤報が多発すると、警察力が無駄に費やされ、真に対応を要する事案への対応に支障を来すおそれがある。","台風の接近中に受信した侵入の情報は、風による誤報と考えられるので、現場での確認を省略してよい。","誤報の原因には、機器の誤作動のほか、窓等の閉め忘れや、地震、台風等によるものがある。","誤報が生じた場合は、その都度、原因を調査し、機器の改善等の措置を講じる。","同一の施設で誤報が続く場合は、利用者への操作方法の説明や感知器の設置場所の見直しなど、抜本的な対策を講じる。"],"answer":1,"notes":["正しい。機械警備業務管理者講習では、110番通報の誤報による社会的損失とその人的・物的原因を考えさせ、効果的な防止対策を説明することとされている（指導教育責任者講習の運用 別表第3）。","誤り。機械警備業者は、情報を受信した場合に速やかに現場における警備員による事実の確認その他の必要な措置が講じられるよう即応体制を整備しなければならず（法第43条）、誤報かどうかは現場の確認によって判断する。気象の状況から誤報と決めつけて確認を省略してはならない。","正しい。例えば警視庁の通達では、「誤報」を、異常発報のうち明らかに機器の誤作動、窓等の閉め忘れ、地震、台風等に起因するもので、警察の緊急初動措置を要しないものとしている。","正しい。誤報が生じた場合は、その都度原因を調査し、機器の改善措置を講ずるよう指導されている（例：静岡県警察・山口県警察・富山県警察の要領）。","正しい。同一の施設で誤報が続く場合などには、誤報防止の抜本的な改善策を講ずるよう指導されている（例：静岡県警察・山口県警察の要領）。利用者の操作の誤りによるものは操作方法の説明、感知器の設置場所によるものは設置の見直しなど、原因に応じた対策をとる。"],"ref":["警備業法第43条","警備業法施行規則第38条第3項","指導教育責任者講習の運用 別表第3"],"src":["https://www.keishicho.metro.tokyo.lg.jp/about_mpd/johokoukai_portal/kunrei/kunrei_seian.files/23_8_015.pdf","https://www.pref.shizuoka.jp/police/_res/projects/project_police/_page_/002/000/926/seian038.pdf","https://www.pref.yamaguchi.lg.jp/uploaded/attachment/120292.pdf","https://police.pref.toyama.jp/documents/2477/167kikaikeibigyousyakaranokeisatukikanhenoijouhappou.pdf"]},
{"id":"S1-070","cat":"senmon","sub":"消防法","kubun":"1","stem":"消防法に定める火災の調査に関する次の記述のうち、誤っているものはどれか。","choices":["消防長又は消防署長は、消火活動をなすとともに、火災の原因並びに火災及び消火のために受けた損害の調査に着手しなければならない。","消防長又は消防署長は、火災の原因の調査のため必要があるときは、関係のある者に対して質問することができる。","放火又は失火の疑いのあるときは、その火災の原因の調査の主たる責任及び権限は、所轄警察署長にある。","消防長又は消防署長は、放火又は失火の犯罪があると認めるときは、直ちにこれを所轄警察署に通報するとともに、必要な証拠を集めてその保全に努めなければならない。","消防長又は消防署長及び関係保険会社の認めた代理者は、火災の原因及び損害の程度を決定するために、火災により破損され又は破壊された財産を調査することができる。"],"answer":2,"notes":["正しい。消防法第31条のとおりである。","正しい。消防法第32条第1項のとおりである。火災の原因である疑いがあると認められる製品を製造し、又は輸入した者に対して、資料の提出を命じ、又は報告を求めることもできる。","誤り。放火又は失火の疑いのあるときは、その火災の原因の調査の主たる責任及び権限は、消防長又は消防署長にある（消防法第35条第1項）。警察官が放火又は失火の犯罪の被疑者を逮捕し、又は証拠物を押収したときは、消防長又は消防署長は、事件が検察官に送致されるまでは、警察官の捜査に支障を来さない範囲で、被疑者に質問し、又は証拠物を調査することができる（同法第35条の2）。","正しい。消防法第35条第2項のとおりである。","正しい。消防法第33条のとおりである。調査のため必要があるときは、関係者に資料の提出を命じ、又は消防職員に関係のある場所に立ち入って財産の状況を検査させることができる（同法第34条第1項）。"],"ref":["消防法第31条","消防法第32条","消防法第33条","消防法第34条","消防法第35条","消防法第35条の2"],"src":[]},
{"id":"S1-071","cat":"senmon","sub":"消防法","kubun":"1","stem":"消防法に定める危険物に関する次の記述のうち、正しいものはどれか。","choices":["ガソリンは第4類の危険物のうち第1石油類に、灯油及び軽油は第2石油類に当たる。","液化石油ガス（プロパンガス）は、引火しやすいため、第4類の危険物（引火性液体）に当たる。","指定数量以上の危険物は、所轄消防長又は消防署長の承認を受ければ、30日以内の期間、製造所等以外の場所で仮に貯蔵し、又は取り扱うことができる。","指定数量未満の危険物の貯蔵及び取扱いの技術上の基準は、政令で定められている。","製造所等では、危険物取扱者以外の者も、丙種危険物取扱者が立ち会えば、危険物を取り扱うことができる。"],"answer":0,"notes":["正しい。第1石油類とはアセトン、ガソリンその他1気圧において引火点が21度未満のものをいい、第2石油類とは灯油、軽油その他1気圧において引火点が21度以上70度未満のものをいう（消防法別表第一 備考第12号・第14号）。","誤り。消防法上の危険物は、別表第一の品名欄に掲げる物品で、性質欄に掲げる性状を有する固体又は液体である（消防法第2条第7項、別表第一）。1気圧・20度で気体である液化石油ガスは危険物に当たらない。液化石油ガスは、一定数量以上を貯蔵し、又は取り扱う場合に、あらかじめ所轄消防長又は消防署長への届出を要する物質として、消防法第9条の3に例示されている。","誤り。所轄消防長又は消防署長の承認を受けて仮に貯蔵し、又は取り扱うことができる期間は、10日以内である（消防法第10条第1項ただし書）。","誤り。指定数量未満の危険物の貯蔵及び取扱いの技術上の基準は、市町村条例で定める（消防法第9条の4第1項）。","誤り。製造所、貯蔵所及び取扱所においては、危険物取扱者以外の者は、甲種危険物取扱者又は乙種危険物取扱者が立ち会わなければ、危険物を取り扱ってはならない（消防法第13条第3項）。丙種危険物取扱者は立ち会うことができない。"],"ref":["消防法第2条第7項","消防法第9条の3","消防法第9条の4","消防法第10条第1項","消防法第13条第3項","消防法別表第一"],"src":[]},
{"id":"S1-072","cat":"senmon","sub":"消防法","kubun":"1","stem":"火災の予防に関する消防法の規定についての次の記述のうち、正しいものはどれか。","choices":["消防職員は、立入検査のため関係のある場所に立ち入るときは、関係のある者から請求があった場合に限り、市町村長の定める証票を携帯すればよい。","消防長又は消防署長は、防火対象物の改修等を命じた場合でも、その旨を公示する必要はない。","消防職員による立入検査は、個人の住居であるかどうかにかかわらず、関係者の承諾を得た場合に限り行うことができる。","消防長又は消防署長は、火災の予防に危険であると認める防火対象物について、権原を有する関係者に改修等の必要な措置を命ずることができる。","住宅用防災機器の設置及び維持の義務は、住宅のうち共同住宅に限って課されている。"],"answer":3,"notes":["誤り。消防職員は、関係のある場所に立ち入る場合には、市町村長の定める証票を携帯し、関係のある者の請求があるときは、これを示さなければならない（消防法第4条第2項）。","誤り。消防法第5条第1項の命令をした場合には、標識の設置その他総務省令で定める方法により、その旨を公示しなければならない（同条第3項）。関係者は、標識の設置を拒み、又は妨げてはならない（同条第4項）。","誤り。消防長又は消防署長は、火災予防のために必要があるときは、消防職員にあらゆる仕事場、工場若しくは公衆の出入する場所その他の関係のある場所に立ち入って検査させることができる。関係者の承諾が必要とされるのは個人の住居の場合であり、それも、火災発生のおそれが著しく大であるため特に緊急の必要がある場合は不要である（消防法第4条第1項）。","正しい。消防法第5条第1項のとおりである。命ずる措置には、改修、移転、除去、工事の停止又は中止その他の必要な措置がある。ただし、他の法令により建築等の許可又は認可を受け、その後事情の変更していないものについては、この限りでない。","誤り。住宅の用途に供される防火対象物の関係者は、戸建て住宅か共同住宅かを問わず、住宅用防災機器を設置し、及び維持しなければならない（消防法第9条の2第1項）。設置及び維持の基準は、政令で定める基準に従い市町村条例で定める（同条第2項）。"],"ref":["消防法第4条","消防法第5条","消防法第9条の2"],"src":[]},
{"id":"S1-073","cat":"senmon","sub":"消防法","kubun":"1","stem":"自動火災報知設備の設置及び維持に関する消防法施行規則の基準についての次の記述のうち、誤っているものはどれか。","choices":["受信機は、防災センター、中央管理室、守衛室など常時人がいる場所に設ける。","発信機の直近の箇所に設ける表示灯は、緑色の灯火とする。","受信機の操作スイッチは、床面からの高さが0.8メートル（いすに座って操作するものは0.6メートル）以上1.5メートル以下の箇所に設ける。","一の防火対象物に二以上の受信機が設けられているときは、受信機のある場所相互間で同時に通話することができる設備を設ける。","非常電源として蓄電池設備を用いる場合、その容量は、自動火災報知設備を有効に10分間作動できる容量以上とする。"],"answer":1,"notes":["正しい。受信機は防災センター等に設ける（消防法施行規則第24条第2号ニ）。「防災センター等」とは、防災センター、中央管理室、守衛室その他これらに類する場所（常時人がいる場所に限る。）をいう（同規則第12条第1項第8号）。","誤り。表示灯は、赤色の灯火で、取付け面と15度以上の角度となる方向に沿って10メートル離れたところから点灯していることが容易に識別できるものとする（消防法施行規則第24条第8号の2ニ）。","正しい。消防法施行規則第24条第2号ロのとおりである。","正しい。消防法施行規則第24条第2号トのとおりである。","正しい。消防法施行規則第24条第4号ロのとおりである。誘導灯の非常電源の容量（原則20分間）とは異なる（同規則第28条の3第4項第10号）。"],"ref":["消防法施行規則第12条第1項第8号","消防法施行規則第24条"],"src":[]},
{"id":"S1-074","cat":"senmon","sub":"消防法","kubun":"1","stem":"消火器の技術上の規格を定める省令に定める消火器の構造及び性能に関する次の記述のうち、正しいものはどれか。","choices":["放射時間は、温度20度において5秒以上であれば足りる。","消火器の外面は、その10パーセント以上を赤色仕上げとすれば足りる。","蓄圧式の消火器（二酸化炭素消火器等を除く。）の指示圧力計は、使用圧力の範囲を示す部分を赤色で明示する。","消火器は、充てんされた消火剤の容量又は質量の70パーセント以上の量を放射できるものであればよい。","レバーを握って放射する手さげ式の消火器の安全栓は、リング部を黄色仕上げとする。"],"answer":4,"notes":["誤り。放射時間は、温度20度において10秒以上でなければならない（消火器の技術上の規格を定める省令第10条第2号）。","誤り。消火器の外面は、その25パーセント以上を赤色仕上げとしなければならない（同省令第37条）。","誤り。指示圧力計は、使用圧力の範囲を示す部分を緑色で明示する（同省令第28条第7号）。点検の際は、指針が緑色の範囲内にあるかを確認する。","誤り。充てんされた消火剤の容量又は質量の90パーセント（化学泡消火薬剤にあっては85パーセント）以上の量を放射できるものでなければならない（同省令第10条第4号）。","正しい。消火器には不時の作動を防止するため安全栓を設け、レバー式の手さげ式の消火器等の安全栓は、リング部を黄色仕上げとし、上方向に引き抜くよう装着しなければならない（同省令第21条第1項・第3項）。"],"ref":["消火器の技術上の規格を定める省令第10条","消火器の技術上の規格を定める省令第21条","消火器の技術上の規格を定める省令第28条","消火器の技術上の規格を定める省令第37条"],"src":[]},
