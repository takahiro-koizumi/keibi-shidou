{"id":"KB-021","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法施行規則第38条第3項の表に定める業務別教育の教育事項に関する次の記述のうち、正しいものはどれか。","choices":["法第2条第1項第1号の警備業務（機械警備業務を除く。）の教育事項として、当該警備業務を適正に実施するため必要な道路交通関係法令に関することが掲げられている。","法第2条第1項第2号の警備業務の教育事項として、巡回の方法に関することが掲げられている。","法第2条第1項第3号の警備業務の教育事項として、人又は車両の雑踏する場所における雑踏の整理の方法に関することが掲げられている。","法第2条第1項第4号の警備業務の教育事項として、人の身辺における警戒に係る警戒位置その他警戒の方法に関することが掲げられている。","法第2条第1項第1号の警備業務（機械警備業務を除く。）の教育事項として、人の身体に対する危害の発生を防止するためにとるべき避難等の措置に関することが掲げられている。"],"answer":3,"notes":["誤り。道路交通関係法令に関することは、法第2条第1項第2号の警備業務の教育事項である（警備業法施行規則第38条第3項の表）。第1号の警備業務（機械警備業務を除く。）の教育事項は、出入の管理の方法、巡回の方法、警報装置その他の機器の使用方法、不審者又は不審な物件を発見した場合にとるべき措置等である。","誤り。巡回の方法に関することは、法第2条第1項第1号の警備業務（機械警備業務を除く。）の教育事項である（警備業法施行規則第38条第3項の表）。第2号の警備業務の教育事項は、道路交通関係法令、車両及び歩行者の誘導の方法、雑踏の整理の方法、各種資機材の使用方法、負傷等の事故の発生に際してとるべき措置等である。","誤り。雑踏の整理の方法に関することは、法第2条第1項第2号の警備業務の教育事項である（警備業法施行規則第38条第3項の表）。第3号の警備業務の教育事項は、運搬に使用する車両等の構造及び設備、車両等による伴走及び運搬中における周囲の見張りの方法、積卸しに際しての警戒の方法、各種資機材の使用方法、運搬中における盗難等の事故の発生に際してとるべき措置等である。","正しい。警備業法施行規則第38条第3項の表の第4号の警備業務の欄のイのとおりである。このほか、各種資機材の使用方法、不審者又は不審な物件を発見した場合にとるべき措置、人の身体に対する危害の発生を防止するためにとるべき避難等の措置等が掲げられている。","誤り。人の身体に対する危害の発生を防止するためにとるべき避難等の措置に関することは、法第2条第1項第4号の警備業務の教育事項である（警備業法施行規則第38条第3項の表）。"],"ref":["警備業法施行規則第38条第3項"],"src":[]},
{"id":"KB-022","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法施行規則に定める基本教育等に関する次の記述のうち、誤っているものはどれか。","choices":["新任の警備員に対する基本教育の教育事項である「警備員の資質の向上に関すること」とは、警備業の現状と社会的役割、警備員の使命と心構え等をいう。","基本教育の教育事項である「護身用具の使用方法その他の護身の方法」にいう護身の方法とは、護身用具の使用方法に限られ、護身術は含まれない。","基本教育の教育事項中「その他警備業務の適正な実施に必要な法令」には、刑事訴訟法（現行犯人の逮捕及び引渡し等）や遺失物法が含まれる。","「必要に応じて行う警備業務に関する知識及び技能の向上のための教育」とは、基本教育及び業務別教育以外に行うものをいう。","警備会社の合併等により従前から警備業務に従事していた警備員を新たに使用する場合でも、前後の事業の実態に同一性が認められるときは、改めて新任教育を行う必要はない。"],"answer":1,"notes":["正しい。解釈運用基準第20の2(2)のとおりである。この教育事項は、新たに警備業務に従事させようとする警備員の基本教育にのみ掲げられている（警備業法施行規則第38条第2項の表の一の項ロ）。","誤り。「護身の方法」とは、「護身用具の使用方法」のほか、護身術をいう（解釈運用基準第20の2(5)）。この教育事項は新たに警備業務に従事させようとする警備員に対する基本教育の教育事項であり（警備業法施行規則第38条第2項の表の一の項ホ）、講義の方法及び実技訓練の方法により行う（同表の備考第2号）。","正しい。日本国憲法（基本的人権）、刑法（正当防衛、緊急避難等）、刑事訴訟法（現行犯人の逮捕及び引渡し等）、遺失物法等をいう（解釈運用基準第20の2(3)）。","正しい。警備員教育は、基本教育、業務別教育並びに必要に応じて行う警備業務に関する知識及び技能の向上のための教育とされ（警備業法施行規則第38条第1項）、最後のものは基本教育及び業務別教育以外に行うものをいう（解釈運用基準第20の2(1)）。","正しい。原則として新任教育を要するが、当該警備員に教育を行っていた警備業者の事業の実態と、当該警備員を新たに使用することとなる警備業者の事業の実態とに同一性が認められるときに限り、改めて新任教育を行う必要はない（解釈運用基準第20の4）。"],"ref":["警備業法施行規則第38条第1項・第2項","解釈運用基準 第20の2・第20の4"],"src":[]},
{"id":"KB-023","cat":"hourei","sub":"警備業法","kubun":null,"stem":"専任の指導教育責任者が置かれている営業所に近接する営業所について、当該指導教育責任者を兼任させるための公安委員会の承認（警備業法施行規則第39条第3項）に関する次の記述のうち、正しいものはどれか。","choices":["承認は営業所単位で行われ、その営業所で取り扱う警備業務の区分ごとに行われるものではない。","「近接する」とは、二つの営業所の間がおおむね片道2時間以内で行ける距離にあることをいう。","承認を受ければ、1人の指導教育責任者が3か所の営業所の指導教育責任者を兼ねることもできる。","兼任させる者がその営業所で取り扱う警備業務の区分に係る指導教育責任者資格者証を有していなくても、警備員が5人以下であれば承認を受けられる。","専任の指導教育責任者が置かれている営業所が他の都道府県にあるときは、その都道府県の公安委員会の意見を聴いて承認が行われる。"],"answer":4,"notes":["誤り。兼任の承認は、当該営業所の当該警備業務の区分について行う（解釈運用基準第21の2(4)）。承認を行うのは、兼任させようとする近接する営業所（警備員の数が5人以下である営業所）の所在する都道府県の区域を管轄する公安委員会である（警備業法施行規則第39条第3項）。","誤り。「近接する」とは、二つの営業所における指導及び教育に関する業務を適時適切に行うことができる距離にあることをいい、おおむね片道1時間以内で行ける距離にあることが必要である（解釈運用基準第21の2(3)）。","誤り。兼任を認めることにより当該指導教育責任者が3以上の営業所の指導教育責任者を兼ねることとなる場合には、兼任を認めないこととされている（解釈運用基準第21の2(5)）。","誤り。承認は、「近接」及び「5人以下」の要件を満たし、当該指導教育責任者が当該営業所において取り扱う警備業務の区分に係る資格者証の交付を受けており、かつ、指導及び教育が十分に行われると認められる場合にのみ行う（警備業法施行規則第39条第3項、解釈運用基準第21の2(4)）。","正しい。解釈運用基準第21の2(6)のとおりである。なお、承認の要件を満たさなくなったときは、承認は取り消される（同(7)）。"],"ref":["警備業法施行規則第39条第3項","解釈運用基準 第21の2"],"src":[]},
{"id":"KB-024","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備員指導教育責任者資格者証（以下「資格者証」という。）の交付申請と、講習修了者と同等以上の知識及び能力を有するとの認定（警備員指導教育責任者及び機械警備業務管理者に係る講習等に関する規則（以下「講習規則」という。）第8条）に関する次の記述のうち、誤っているものはどれか。","choices":["資格者証の交付を受けようとする者は、その住所地を管轄する公安委員会に、住所地の所轄警察署長を経由して交付申請書を提出する。","講習の課程を修了した者は、警備員指導教育責任者講習修了証明書を交付申請書に添付して、資格者証の交付を申請する。","講習規則第8条第1号の認定は、警備員の指導及び教育に関する業務における管理的又は監督的地位にあった期間が通算して5年以上である者について行う。","同等以上の知識及び能力を有するとの認定は、資格者証の交付申請を受けた公安委員会が行うものであり、認定のみを独立して申請させるものではない。","警視以上の警察官であった者で、警備員の指導及び教育に関する業務における管理的又は監督的地位にあった期間が通算して3年以上であり、十分な能力を有すると認められるものは、認定の基準に当たる。"],"answer":2,"notes":["正しい。警備業法施行規則第42条第1項・第2項のとおりである。","正しい。交付申請書には、法第22条第2項第1号に掲げる者に該当することを証する書面を添付する（警備業法施行規則第42条第3項第1号）。この書面は、講習規則第7条第1項の警備員指導教育責任者講習修了証明書である（解釈運用基準第21の3(1)）。このほか、履歴書、住民票の写し、法第22条第4項各号に該当しない旨の誓約書等を添付する（同項第2号）。","誤り。講習規則第8条第1号の期間は、通算して7年以上である。あわせて、警備員の指導及び教育について十分な能力を有すると認められることが必要である（警備員指導教育責任者及び機械警備業務管理者に係る講習等に関する規則第8条第1号）。「十分な能力を有する」とは、実際に警備員を指導・教育した経験が相当にあり、かつ、指導教育責任者としてふさわしい人格識見があること等をいう（解釈運用基準第21の5(1)）。","正しい。解釈運用基準第21の5(3)のとおりである。指導及び教育の質を一定水準以上に確保するため、この認定は警察庁と緊密な連絡を取りながら慎重に運用することとされている（同(4)）。","正しい。講習規則第8条第2号の認定の基準の一つである（解釈運用基準第21の5(2)①）。このほか、警察官であった者で在職中警備業の指導及び監督に関する業務に直接従事した期間が通算して3年以上であり、十分な能力を有すると認められるもの等も基準とされている（同②③）。"],"ref":["警備業法第22条第2項","警備業法施行規則第42条","警備員指導教育責任者及び機械警備業務管理者に係る講習等に関する規則第7条・第8条","解釈運用基準 第21の3・第21の5"],"src":[]},
{"id":"KB-025","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備員指導教育責任者講習（新規取得講習）の受講申込み及び受講資格の疎明に関する次の記述のうち、正しいものはどれか。","choices":["受講申込みの時点で受講資格を満たしていなくても、講習の開始日までに満たす見込みがあれば、受講申込書は受理される。","所属していた警備業者が廃業して警備業務従事証明書を提出できないときは、その事情を疎明した上で、誓約書及び履歴書を代わりに提出させる。","1級の合格証明書の交付を受けている者は、受講申込書に合格証明書の写しのほか、警備業務従事証明書も添付しなければならない。","警備業務の管理又は監督に従事している者は、警備員名簿に登載され、現場で具体的な指揮、命令を行っていても、警備業務に従事しているとはいえない。","2級の合格証明書の交付を受けた者は、交付を受けた時点から途切れることなく1年以上従事していなければ、受講資格を満たさない。"],"answer":1,"notes":["誤り。疎明資料は受講申込時に受講申込書に添付して提出することとされている（講習規則第4条第2項）から、指導教育責任者講習を受けようとする者は、受講申込時において講習規則第3条各号のいずれかに該当している必要がある（指導教育責任者講習の運用通達8）。","正しい。警備業務従事証明書を提出できないことについてやむを得ない事情がある場合は、当該事情を疎明した上で、受講資格に該当することを誓約する書面及び履歴書を警備業務従事証明書に代えて提出させる（指導教育責任者講習の運用通達7(3)ウ）。なお、警備業者に対しては、従事証明書の発行を拒否しないよう指導することとされている（同オ）。","誤り。講習規則第3条第2号（1級の合格証明書の交付を受けている者）に該当する者の疎明資料は、1級の検定に係る合格証明書の写しである（指導教育責任者講習の運用通達7(2)イ）。警備業務従事証明書が必要なのは、同条第1号（従事証明書及び履歴書）及び第3号（2級の合格証明書の写し及び従事証明書）に該当する者である（同ア・ウ）。","誤り。警備業務の管理又は監督に従事している者で、警備員名簿に登載され、警備現場において具体的な指揮、命令を行っている者は、「警備業務に従事し」ているといえる（指導教育責任者講習の運用通達7(1)イ）。","誤り。合格証明書の交付を受けた時点から継続して従事していることは要しないが、1年以上継続して当該区分の警備業務に従事した期間があること及び現に当該区分の警備業務に従事していることが必要である（講習規則第3条第3号、指導教育責任者講習の運用通達7(1)ウ）。"],"ref":["警備員指導教育責任者及び機械警備業務管理者に係る講習等に関する規則第3条・第4条","指導教育責任者講習の運用通達（令和6年6月27日）7・8"],"src":[]},
{"id":"KB-026","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備員指導教育責任者講習に関する次の記述のうち、誤っているものはどれか。","choices":["新規取得講習における警備業務の区分に応じた専門的な知識及び技能に関する講習時間は、1号の警備業務では23時限、2号の警備業務では14時限である。","公安委員会は、指導教育責任者講習を行おうとするときは、実施予定期日の30日前までに、実施期日、場所、警備業務の区分、受講手続等を公示する。","既に他の区分の指導教育責任者資格者証の交付を受けている者に対する指導教育責任者講習は、区分に応じた専門的な知識及び技能に関する講習事項についてのみ行われる。","指導教育責任者資格者証の交付を受けている者が他の区分について受ける追加取得講習の修了考査は、新規取得講習と同じく、5肢択一式40問、100分で行われる。","講習の実施を委託する場合であっても、修了考査の問題の作成及び管理、採点並びに合否の判定は委託しないこととされている。"],"answer":3,"notes":["正しい。警備員指導教育責任者及び機械警備業務管理者に係る講習等に関する規則第5条第1項の表の四の項。3号の警備業務は14時限、4号の警備業務は10時限である。1時限は50分である（同表の備考第2号）。","正しい。講習規則第2条。公示は、都道府県公報への掲載その他の公衆が知ることのできる状態に置く方法により行い、ウェブサイトへの掲載などにより警備業者に周知徹底することとされている（指導教育責任者講習の運用通達6(1)）。","正しい。資格者証又は講習修了証明書の交付を受けている者に対する他の区分の講習（追加取得講習）は、区分に応じた専門的な知識及び技能に関する講習事項について行う（講習規則第6条第1項）。受講申込書には、交付を受けている資格者証等の写しを添付する（同条第2項）。","誤り。追加取得講習の修了考査は、5肢択一式問題14問、時間は35分である（指導教育責任者講習の運用通達 別添3(2)イ・4(2)）。5肢択一式40問、100分で行うのは、新規取得講習及び機械警備業務管理者講習の修了考査である。","正しい。修了考査の問題の作成及び管理、修了考査の採点並びに合否の判定は委託しない（指導教育責任者講習の運用通達10(1)）。講習の実施の要否、時期及び回数の決定も公安委員会が行う。"],"ref":["警備員指導教育責任者及び機械警備業務管理者に係る講習等に関する規則第2条・第5条・第6条","指導教育責任者講習の運用通達（令和6年6月27日）6・10・別添"],"src":[]},
{"id":"KB-027","cat":"hourei","sub":"警備業法","kubun":null,"stem":"現任指導教育責任者講習に関する次の記述のうち、正しいものはどれか。","choices":["受講対象者は、警備業者の営業所において現に指導教育責任者として警備業務の区分ごとに選任されている者である。","講習事項のうち講習時間が最も長いのは、警備業法その他警備業務の実施の適正を確保するため必要な最新の法令に関することである。","講習は講義の方法のみにより行われ、実技訓練や討論の方法により行われることはない。","警備業者は、やむを得ない理由により受講させられないことを講習の実施前に申し立てる必要があり、実施後に申し立てることはできない。","対面講習の受講日には、通知書及び運転免許証等の身分確認ができる物を持参させれば足り、指導教育責任者資格者証を持参させる必要はない。"],"answer":0,"notes":["正しい。現任指導教育責任者講習の運用通達2のとおりである。受講させる義務は警備業者にあり（警備業法第22条第8項）、資格者証の交付を受けていても指導教育責任者に選任されていない者は対象とならない。","誤り。講習事項と講習時間は、最新の法令に関すること1時限、事件・事故等の発生状況その他最新の治安情勢に関すること1時限、最新の各種資機材の機能・使用方法・管理方法に関すること2時限、事故の事例を踏まえた事故の防止に関すること1時限である（講習規則第9条第3項）。最も長いのは資機材に関する事項である。","誤り。資機材に関する事項は講義又は実技訓練、事故の事例を踏まえた事故の防止に関する事項は講義又は討論の方法により行う（現任指導教育責任者講習の運用通達 別表1〜4）。","誤り。警備業者は、やむを得ない理由により受講させることができないと講習の実施前に申し立て、又は受けさせることができなかったと実施後に申し立てることができる。この場合は、やむを得ない理由を疎明する書面の提出を求め、理由があると認められるときに限り、改めて別の日時又は場所の講習が通知される（現任指導教育責任者講習の運用通達3(2)）。","誤り。対面講習の受講日には、通知書及び指導教育責任者資格者証のほかに運転免許証等の身分確認ができる物を持参させ、受講対象者であることを確認する（現任指導教育責任者講習の運用通達3(3)ア）。"],"ref":["警備業法第22条第8項","警備員指導教育責任者及び機械警備業務管理者に係る講習等に関する規則第9条","現任指導教育責任者講習の運用通達（令和7年12月9日）2・3・別表"],"src":[]},
{"id":"KB-028","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備員等の検定の手続等に関する次の記述のうち、誤っているものはどれか。","choices":["警備員が検定を受けようとするときは、その者が属する営業所の所在地を管轄する公安委員会に検定申請書を提出することもできる。","検定申請書には、申請前6月以内に撮影した無帽、正面、上三分身、無背景の写真を添付する。","実技試験は、公安委員会の指定を受けた警察職員が行う。","講習会の課程を修了したことにより検定に合格した者とみなされる者には、成績証明書は交付されない。","公安委員会が検定の実施期日、場所、種別及び級等を公示する期限は、実施予定期日の30日前である。"],"answer":4,"notes":["正しい。検定申請書は、住所地又は警備員である場合はその者が属する営業所の所在地を管轄する公安委員会に、それぞれの所轄警察署長を経由して提出する（警備員等の検定等に関する規則第9条第1項・第2項）。","正しい。検定規則第9条第4項第2号。縦3.0cm、横2.4cmで、裏面に氏名及び撮影年月日を記入したもの2葉である。なお、警備員の名簿にはり付ける写真は3年以内に撮影したものである（警備業法施行規則第66条第1項第1号）。","正しい。検定規則第6条第3項。検定実技試験員は、警察庁が行う警備業担当者養成専科を修了した警察職員等の中から指定する（警備員等の検定の運用通達4）。","正しい。成績証明書は、検定に合格した者（講習会の課程を修了したことにより合格したとみなされる者を除く。）に交付される（検定規則第11条）。講習会修了者は、講習会修了証明書を添えて合格証明書の交付を申請する（検定規則第14条第3項第2号）。","誤り。検定の公示は、実施予定期日の90日前までに行う（警備員等の検定等に関する規則第7条）。実施予定期日の30日前までに公示するのは、指導教育責任者講習である（講習規則第2条）。"],"ref":["警備業法第23条","警備員等の検定等に関する規則第6条・第7条・第9条・第11条","警備員等の検定の運用通達（令和7年12月9日）4"],"src":[]},
{"id":"KB-029","cat":"hourei","sub":"警備業法","kubun":null,"stem":"検定の合格証明書の交付申請、携帯等に関する次の記述のうち、正しいものはどれか。","choices":["合格証明書の交付申請書には、交付の日から起算して3年を経過していない成績証明書又は講習会修了証明書を添付すればよい。","施設警備業務に係る2級の合格証明書を有する者が同じ種別の1級の検定に合格したときは、新たな合格証明書の交付ではなく、2級の合格証明書の書換えを受けることとなる。","検定合格警備員の配置を要する警備業務では、警備業者は、従事する検定合格警備員に合格証明書を携帯させ、関係人の請求があれば提示させなければならない。","検定合格警備員は、合格証明書に係る種別の警備業務に従事している間、国家公安委員会規則で定める標章を必ず用いなければならない。","合格証明書の返納命令は、その合格証明書を交付した公安委員会であるかどうかにかかわらず、返納事由を認知した公安委員会が行うのが原則である。"],"answer":2,"notes":["誤り。合格証明書交付申請書に添付する成績証明書又は講習会修了証明書は、交付の日から起算して1年を経過していないものに限られる（警備員等の検定等に関する規則第14条第3項第2号、警備員等の検定の運用通達5(6)ウ）。","誤り。合格証明書は、検定に合格した警備業務の種別及び級に応じて1枚ずつ交付されるものであり、既に検定に合格している者が別の種別又は別の級の検定に合格した場合は、別の合格証明書を交付する（警備員等の検定の運用通達5(6)エ）。","正しい。警備員等の検定等に関する規則第3条。同規則第2条の表に掲げる警備業務（検定合格警備員の配置の基準が定められた警備業務）を行うときの警備業者の義務である。","誤り。検定合格警備員は、合格証明書に係る種別の警備業務に従事している間は、標章を「用いることができる」とされている（検定規則第16条）。合格証明書の交付を受けていない者等がこの標章又はこれに似せて作った物を用いた場合は、軽犯罪法第1条第15号により処罰される（警備員等の検定の運用通達7）。","誤り。合格証明書の返納命令は、やむを得ない場合を除き、当該合格証明書を交付した公安委員会が行う。他の公安委員会が返納事由を認知した場合は、交付した公安委員会にその旨を通知する（警備員等の検定の運用通達5(6)オ(ｳ)）。"],"ref":["警備業法第23条第4項・第5項","警備員等の検定等に関する規則第3条・第14条・第16条","警備員等の検定の運用通達（令和7年12月9日）5(6)・7"],"src":[]},
{"id":"KB-030","cat":"hourei","sub":"警備業法","kubun":null,"stem":"登録講習機関（警備業法第23条第3項の登録を受けた者）に関する次の記述のうち、誤っているものはどれか。","choices":["登録は、3年ごとにその更新を受けなければ、その期間の経過によって効力を失う。","登録を申請した株式会社の親法人が警備業者であるときは、登録の要件に適合しない。","登録を取り消された者は、その取消しの日から2年を経過しない間は、登録を受けることができない。","登録講習機関が講習会に関する帳簿を保存しなければならない期間は、講習会を実施した日から3年間である。","講習会の業務の全部又は一部を休止し、又は廃止しようとするときは、あらかじめ国家公安委員会に届け出なければならない。"],"answer":3,"notes":["正しい。警備業法第27条第1項、警備業法施行令第2条。更新の申請は、登録の有効期間満了の日の90日前から30日前までの間に行う（警備業法施行規則第46条第2項）。","正しい。登録申請者が株式会社である場合に警備業者がその親法人であることなど、警備業者に支配されているものとして定める場合に該当しないことが、登録の要件とされている（警備業法第26条第1項第2号イ）。","正しい。警備業法第25条第2号。警備業法又は同法に基づく命令に違反し、罰金以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなった日から2年を経過しない者も同様である（同条第1号）。","誤り。帳簿は、講習会を実施した日から5年間保存しなければならない（警備業法第36条、同法施行規則第50条第3項）。3年間保存するのは、講習会に用いた教材及び試験に用いた問題用紙・答案用紙である（施行規則第50条第4項、警備員等の検定等に関する規則第19条第2項）。","正しい。警備業法第31条。届出書には、休止又は廃止しようとする講習会業務の範囲、その年月日（休止の場合はその期間）及び理由を記載する（警備業法施行規則第47条）。"],"ref":["警備業法第25条〜第27条・第31条・第36条","警備業法施行令第2条","警備業法施行規則第46条・第47条・第50条"],"src":[]},
{"id":"KB-031","cat":"hourei","sub":"警備業法","kubun":null,"stem":"機械警備業務管理者に関する次の記述のうち、正しいものはどれか。","choices":["機械警備業務管理者資格者証の交付申請書には、指導教育責任者資格者証の交付申請書と同様に、精神機能の障害に関する医師の診断書を添付する必要はない。","機械警備業務の管理に関する業務で管理的又は監督的地位に通算5年以上あり、十分な能力を有する者は、講習修了者と同等以上と認定する基準に当たる。","機械警備業務管理者講習の修了考査は、追加取得講習の修了考査と同じく、5肢択一式14問により35分で行われる。","基地局とは受信機器を設置する施設をいい、受信機器が単に情報のモニターのためだけのものである場合も含まれる。","機械警備業務管理者講習の講習事項のうち講習時間が最も長いのは、指令業務に関すること（8時限）である。"],"answer":1,"notes":["誤り。機械警備業務管理者資格者証の欠格事由には、指導教育責任者資格者証の欠格事由に加え、精神機能の障害により機械警備業務管理者の業務を適正に行うに当たって必要な認知、判断及び意思疎通を適切に行うことができない者が含まれる（警備業法第42条第3項による読替え、警備業の要件に関する規則第3条第2項、解釈運用基準第28の3(1)）。このため、交付申請書には精神機能の障害に関する医師の診断書を添付する（警備業法施行規則第63条第1項による読替え）。","正しい。警備員指導教育責任者及び機械警備業務管理者に係る講習等に関する規則第14条第1号。「十分な能力を有する」とは、機械警備業務の管理に関する業務に従事した経験が相当にあり、機械警備業務管理者としてふさわしい高度な判断能力を有すること等をいう（解釈運用基準第28の4(1)）。指導教育責任者の場合（同規則第8条第1号）は通算7年以上である。","誤り。機械警備業務管理者講習の修了考査は、5肢択一式問題40問、時間は100分である（指導教育責任者講習の運用通達 別添3(2)ウ・4(3)）。14問・35分は、追加取得講習の修了考査である。","誤り。基地局とは受信機器を設置する施設であるが、当該受信機器が単に情報のモニターのためだけのものである場合は含まれない（解釈運用基準第26の1）。","誤り。講習時間が最も長いのは、警備業法その他機械警備業務の実施の適正を確保するため必要な法令に関すること（8時限）である。警備業務用機械装置の運用に関すること及び指令業務に関することは各5時限である（講習規則第11条第1項）。"],"ref":["警備業法第42条","警備業法施行規則第63条","警備員指導教育責任者及び機械警備業務管理者に係る講習等に関する規則第11条・第14条","解釈運用基準 第26・第28"],"src":[]},
{"id":"KB-032","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業者が営業所ごとに備える警備員の名簿に関する次の記述のうち、誤っているものはどれか。","choices":["名簿には、6月以内に撮影した無帽、正面、上三分身、無背景の写真をはり付けなければならない。","名簿には、氏名、本籍、住所、生年月日及び採用年月日を記載し、退職した場合には退職年月日も記載する。","「従事させる警備業務の内容」は、業務の具体的内容のほか、その行われる場所又は地域についても記載するよう指導することとされている。","指導教育責任者資格者証の交付を受けている警備員については、その資格者証に係る警備業務の区分のほか、交付した公安委員会の名称、交付年月日及び番号を記載する。","名簿に記載すべき事項が電磁的方法により記録され、必要に応じ直ちに表示されることができるときは、その記録をもって名簿に代えることができる。"],"answer":0,"notes":["誤り。名簿には、3年以内に撮影した無帽、正面、上三分身、縦3cm・横2.4cmの写真（無背景のものに限る。）をはり付ける（警備業法施行規則第66条第1項第1号）。申請前6月以内に撮影した写真とされているのは、検定申請書に添付する写真である（警備員等の検定等に関する規則第9条第4項第2号）。","正しい。警備業法第45条、同法施行規則第66条第1項第1号イ。名簿は、警備員が退職した後も、その退職の日から1年間備えておく（同条第2項）。","正しい。例えば「○○市内の道路工事現場における車両の誘導」「○○市○○町の××ビルにおける常駐警備」のように記載させる（警備業法施行規則第66条第1項第1号ハ、解釈運用基準第31の1(1)）。","正しい。警備業法施行規則第66条第1項第1号ホ。機械警備業務管理者資格者証の交付を受けている警備員についても、交付した公安委員会の名称、交付年月日及び番号を記載する（同号ヘ）。","正しい。警備業法施行規則第67条。この記録をする場合には、国家公安委員会が定める基準を確保するよう努めなければならない（同規則第68条）。"],"ref":["警備業法第45条","警備業法施行規則第66条〜第68条","解釈運用基準 第31の1"],"src":[]},
{"id":"KB-033","cat":"hourei","sub":"警備業法","kubun":null,"stem":"公安委員会による指示（警備業法第48条）及び営業停止命令（同法第49条第1項）に関する次の記述のうち、正しいものはどれか。","choices":["警備業者の警備員が他の都道府県で違反行為をした場合の指示は、主たる営業所の所在地を管轄する公安委員会が行うのが原則である。","指示の要件である「警備業務の適正な実施が害されるおそれ」は、違反の状態が現に存している場合に限り認められる。","指示は、「今後は法第○条の規定を確実に遵守すること」のように遵守すべき条文を示せば足り、具体的な措置まで定める必要はない。","営業停止命令の「一部の停止」には、特定の種類の警備業務に係る営業についてのみ停止を命ずる場合が含まれる。","法第43条に基づく都道府県公安委員会規則で定める基準に適合しないことは、指示の要件である「この法律」の違反には当たらない。"],"answer":3,"notes":["誤り。指示は、違反行為に係る事実を十分に把握して最も適切に判断できると認められる公安委員会が行うべきであるから、原則として、違反行為が行われた場所を管轄する公安委員会が行う（解釈運用基準第33の1）。","誤り。法令違反の状態が現存している場合のほか、違反の状態は現存していないが、その違反の原因となった事由が存続しており、違反が偶然的なものではなく繰り返されるおそれがあるような場合をいう（解釈運用基準第33の2(2)）。","誤り。指示の内容は、違反状態の解消のための措置、履行されなかった義務に替わる措置、将来の違反の防止のための措置等を具体的に定めることが必要であり、単に「今後は法第○条の規定を確実に遵守すること。」というような指示は望ましくないとされている（解釈運用基準第33の3）。","正しい。「一部の停止」とは、管轄区域内に2以上の営業所を有しそれぞれの分担区域を設けている場合に一方の営業所に係る営業についてのみ停止を命じたり、特定の種類の警備業務に係る営業についてのみ停止を命じたりするような場合をいう（解釈運用基準第34の1(3)）。","誤り。法第43条（即応体制の整備）の規定に基づく都道府県公安委員会規則で定める基準に適合しない場合は、同条の規定の違反になり、「この法律」に違反したという要件を満たす（解釈運用基準第33の2(1)）。"],"ref":["警備業法第48条・第49条","解釈運用基準 第33・第34"],"src":[]},
{"id":"KB-034","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法第50条の聴聞の特例及び同法第51条の行政手続法の適用除外に関する次の記述のうち、誤っているものはどれか。","choices":["公安委員会は、営業停止命令をしようとするときは、行政手続法の意見陳述のための手続の区分にかかわらず、聴聞を行わなければならない。","指導教育責任者資格者証の返納命令に係る聴聞を行うに当たっては、期日の1週間前までに通知をし、かつ、聴聞の期日及び場所を公示しなければならない。","聴聞の主宰者は、必要があると認めるときは、警備業務に関する事項に関し専門的知識を有する参考人の出頭を求めて意見を聴取することができる。","公安委員会が指定する医師の診断に基づき中毒者と認めた者に対する認定の取消しには、行政手続法第3章の規定（第12条及び第14条を除く。）は適用されない。","認定を取り消されて警備業を営んでいる者に対し営業の廃止を命じようとするときも、公安委員会は聴聞を行わなければならない。"],"answer":4,"notes":["正しい。警備業法第50条第1項。営業停止命令及び営業の廃止の命令（認定を取り消されて警備業を営んでいる者に係るものを除く。）は、行政手続法第13条第1項の区分にかかわらず聴聞の対象となる。","正しい。警備業法第50条第2項。認定の取消し、資格者証・合格証明書等の返納命令、営業停止命令等に係る聴聞に適用される。聴聞の期日における審理は公開により行う（同条第4項）。","正しい。警備業法第50条第5項。当該事案の関係人の出頭を求めて意見を聴取することもできる。","正しい。警備業法第51条。指定医は、精神保健指定医のうちから、複数の病院から合計2人以上を指定することとされている（解釈運用基準第35）。","誤り。法第49条第2項第2号に掲げる者（認定を取り消されて警備業を営んでいる者）に係る営業の廃止の命令は、法第50条第1項の聴聞の対象から除かれており、行政手続法第3章（第12条及び第14条を除く。）の規定も適用されない（警備業法第50条第1項、第51条）。"],"ref":["警備業法第49条〜第51条","解釈運用基準 第35"],"src":[]},
{"id":"KB-035","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法の罰則に関する次の記述のうち、正しいものはどれか。","choices":["自己の名義をもって他人に警備業を営ませた者は、30万円以下の罰金に処せられる。","法第19条の規定に違反して、依頼者に契約後書面を交付しなかった者は、100万円以下の罰金に処せられる。","指導教育責任者資格者証の返納命令に違反した者は、1年以下の拘禁刑若しくは100万円以下の罰金に処せられ、又はこれを併科される。","認定を受けたことを示す標識を主たる営業所に掲示しなかった者は、20万円以下の過料に処せられる。","偽りその他不正の手段により認定の有効期間の更新を受けた者は、30万円以下の罰金に処せられる。"],"answer":1,"notes":["誤り。法第13条の規定に違反して他人に警備業を営ませた者（名義貸し）は、100万円以下の罰金に処せられる（警備業法第57条第3号）。","正しい。法第19条の規定に違反して、書面を交付せず、又は同条に規定する事項が記載されていない書面若しくは虚偽の記載のある書面を交付した者は、100万円以下の罰金に処せられる（警備業法第57条第4号）。契約前書面（同条第1項）についても同じである。","誤り。資格者証（合格証明書・機械警備業務管理者資格者証を含む。）の返納命令に違反した者は、30万円以下の罰金に処せられる（警備業法第58条第4号）。1年以下の拘禁刑若しくは100万円以下の罰金又はその併科となるのは、営業の停止・廃止の命令又は登録講習機関の業務の停止の命令に違反した者である（同法第56条）。","誤り。法第6条の規定に違反した者は、30万円以下の罰金に処せられる（警備業法第58条第2号）。20万円以下の過料に処せられるのは、死亡等の届出書を提出しなかった者等である（同法第60条）。","誤り。偽りその他不正の手段により認定又は認定の有効期間の更新を受けた者は、100万円以下の罰金に処せられる（警備業法第57条第8号）。認定申請書等に虚偽の記載をして提出した者は、30万円以下の罰金である（同法第58条第1号）。"],"ref":["警備業法第56条〜第58条・第60条"],"src":[]},
{"id":"KB-036","cat":"hourei","sub":"警備業法","kubun":null,"stem":"警備業法の両罰規定、過料等に関する次の記述のうち、誤っているものはどれか。","choices":["両罰規定は、法人の従業者が違反行為をした場合に限り適用され、法人の代表者が違反行為をした場合には適用されない。","両罰規定によりその法人又は人に科されるのは、各本条の罰金刑に限られる。","法第12条の規定に違反して死亡等の届出書を提出しなかった者は、20万円以下の過料に処せられる。","警察職員による営業所、基地局又は待機所への立入検査を拒み、妨げ、又は忌避した者は、30万円以下の罰金に処せられる。","登録講習機関が財務諸表等を事務所に備えて置かなかったときは、20万円以下の過料に処せられる。"],"answer":0,"notes":["誤り。両罰規定は、法人の代表者又は法人若しくは人の代理人、使用人その他の従業者が、その法人又は人の業務に関し、第56条から第58条までの違反行為をしたときに適用される（警備業法第59条）。代表者が違反行為をした場合も含まれる。","正しい。行為者を罰するほか、その法人又は人に対しても、各本条の罰金刑を科する（警備業法第59条）。両罰規定によって法人又は人に拘禁刑が科されることはない。","正しい。警備業法第60条第1号。届出書に虚偽の記載をして提出した者も同様である。","正しい。警備業法第58条第7号。公安委員会の求める報告若しくは資料の提出をせず、又は虚偽の報告若しくは資料の提出をした者も同様である。","正しい。警備業法第60条第2号。登録講習機関は、毎事業年度経過後3月以内に財務諸表等を作成し、5年間事務所に備えて置かなければならない（同法第32条第1項）。"],"ref":["警備業法第32条","警備業法第58条〜第60条"],"src":[]},
{"id":"KR-001","cat":"hourei","sub":"憲法","kubun":null,"stem":"日本国憲法の基本的人権に関する次の記述のうち、誤っているものはどれか。","choices":["憲法が保障する基本的人権は、人類の多年にわたる自由獲得の努力の成果である。","憲法が国民に保障する基本的人権は、侵すことのできない永久の権利として、現在及び将来の国民に与えられる。","すべて国民は、個人として尊重される。","憲法第14条は、法の下の平等について、政治的関係における差別を禁止しているが、経済的又は社会的関係における差別については定めていない。","国民は、憲法が保障する自由及び権利を濫用してはならず、常に公共の福祉のためにこれを利用する責任を負う。"],"answer":3,"notes":["正しい。憲法第97条は、基本的人権は人類の多年にわたる自由獲得の努力の成果であり、侵すことのできない永久の権利として信託されたものであると定めている。","正しい。憲法第11条後段のとおり。同条前段は「国民は、すべての基本的人権の享有を妨げられない」と定めている。","正しい。憲法第13条前段（個人の尊重）のとおり。同条後段は、生命、自由及び幸福追求に対する国民の権利は、公共の福祉に反しない限り、立法その他の国政の上で最大の尊重を必要とすると定めている。","誤り。憲法第14条第1項は、すべて国民は法の下に平等であって、人種、信条、性別、社会的身分又は門地により、政治的、経済的又は社会的関係において差別されないと定めており、経済的関係・社会的関係も含まれる。","正しい。憲法第12条後段のとおり。同条前段は、憲法が保障する自由及び権利は、国民の不断の努力によって保持しなければならないと定めている。"],"ref":["日本国憲法第11条","日本国憲法第12条","日本国憲法第13条","日本国憲法第14条第1項","日本国憲法第97条"],"src":[]},
{"id":"KR-002","cat":"hourei","sub":"憲法","kubun":null,"stem":"日本国憲法に定める自由及び権利に関する次の記述のうち、正しいものはどれか。","choices":["集会、言論、出版その他の表現の自由は保障されているが、結社の自由は憲法に定められていない。","住居、書類及び所持品について侵入、捜索及び押収を受けない権利は、憲法第33条の場合を除き、令状がなければ侵されない。","検閲は、公共の安全を維持するため必要がある場合に限り、これをすることができる。","財産権は、これを侵してはならないとされており、私有財産を公共のために用いることは認められていない。","何人も、居住、移転及び職業選択の自由を有し、これらの自由は公共の福祉による制約を受けない。"],"answer":1,"notes":["誤り。憲法第21条第1項は「集会、結社及び言論、出版その他一切の表現の自由は、これを保障する」と定めており、結社の自由も保障されている。","正しい。憲法第35条第1項は、何人も、その住居、書類及び所持品について、侵入、捜索及び押収を受けることのない権利は、第33条の場合を除いては、正当な理由に基づいて発せられ、かつ、捜索する場所及び押収する物を明示する令状がなければ、侵されないと定めている。なお、捜索・差押えの権限は検察官、検察事務官又は司法警察職員に認められたもので（刑事訴訟法第218条・第220条）、警備員にはない。","誤り。憲法第21条第2項は「検閲は、これをしてはならない」と定めており、例外は設けられていない。同項は、通信の秘密も侵してはならないと定めている。","誤り。憲法第29条第3項により、私有財産は、正当な補償の下に、これを公共のために用いることができる。","誤り。憲法第22条第1項は「何人も、公共の福祉に反しない限り、居住、移転及び職業選択の自由を有する」と定めており、公共の福祉による制約を受ける。"],"ref":["日本国憲法第21条","日本国憲法第22条第1項","日本国憲法第29条","日本国憲法第35条第1項","刑事訴訟法第218条","刑事訴訟法第220条"],"src":[]},
{"id":"KR-003","cat":"hourei","sub":"憲法","kubun":null,"stem":"日本国憲法の人身の自由に関する次の記述のうち、誤っているものはどれか。","choices":["何人も、法律の定める手続によらなければ、その生命若しくは自由を奪われ、又はその他の刑罰を科せられない。","何人も、理由を直ちに告げられ、かつ、直ちに弁護人に依頼する権利を与えられなければ、抑留又は拘禁されない。","何人も、自己に不利益な供述を強要されない。","公務員による拷問及び残虐な刑罰は、絶対にこれを禁ずる。","何人も、権限を有する司法官憲が発し、かつ理由となっている犯罪を明示する令状によらなければ逮捕されず、憲法はこの原則に例外を設けていない。"],"answer":4,"notes":["正しい。憲法第31条（法定手続の保障）のとおり。","正しい。憲法第34条前段のとおり。","正しい。憲法第38条第1項のとおり。","正しい。憲法第36条のとおり。","誤り。憲法第33条は「現行犯として逮捕される場合を除いては」令状によらなければ逮捕されないと定めており、現行犯逮捕は令状主義の例外である。これを受けて刑事訴訟法第213条は、現行犯人は何人でも逮捕状なくして逮捕することができると定めている。"],"ref":["日本国憲法第31条","日本国憲法第33条","日本国憲法第34条","日本国憲法第36条","日本国憲法第38条第1項","刑事訴訟法第213条"],"src":[]},
{"id":"KR-004","cat":"hourei","sub":"刑法","kubun":null,"stem":"刑法の正当行為及び正当防衛に関する次の記述のうち、正しいものはどれか。","choices":["法令又は正当な業務による行為は、罰しない。","正当防衛は、自己の権利を防衛するための行為に限り認められ、他人の権利を防衛するための行為には認められない。","正当防衛は、急迫不正の侵害に対する行為であれば、やむを得ずにしたものでなくても成立する。","防衛の程度を超えた行為（過剰防衛）は、正当防衛と同様に罰しない。","警備員が警備業務として行う行為は、正当な業務による行為であるから、その方法や程度にかかわらず罰せられない。"],"answer":0,"notes":["正しい。刑法第35条（正当行為）のとおり。法令による行為には、私人による現行犯逮捕（刑事訴訟法第213条）なども含まれる。","誤り。刑法第36条第1項は「自己又は他人の権利を防衛するため」と定めており、他人の権利を守るための行為にも正当防衛が成立し得る。","誤り。刑法第36条第1項は、急迫不正の侵害に対して、自己又は他人の権利を防衛するため「やむを得ずにした行為」であることを要件としている。","誤り。刑法第36条第2項により、防衛の程度を超えた行為は、情状により、その刑を減軽し、又は免除することができるにとどまる。犯罪は成立し、当然に罰しないことにはならない。","誤り。正当業務行為（刑法第35条）として罰せられないのは、その行為が目的・方法・程度において社会通念上相当と認められる場合に限られる。警備員は法律により特別に権限を与えられているものではなく（警備業法第15条）、警備業務であれば何をしてもよいわけではない。"],"ref":["刑法第35条","刑法第36条","警備業法第15条"],"src":[]},
{"id":"KR-005","cat":"hourei","sub":"刑法","kubun":null,"stem":"刑法の緊急避難に関する次の記述のうち、誤っているものはどれか。","choices":["緊急避難は、自己又は他人の生命、身体、自由又は財産に対する現在の危難を避けるための行為について認められる。","緊急避難は、正当防衛と異なり、避けようとする危難が人の不正な侵害によるものであることを要しない。","緊急避難は、避難行為によって生じた害が避けようとした害の程度を超えた場合であっても、やむを得ずにした行為であれば成立する。","避難行為がその程度を超えた場合は、情状により、その刑を減軽し、又は免除することができる。","緊急避難の規定は、業務上特別の義務がある者には適用しない。"],"answer":2,"notes":["正しい。刑法第37条第1項本文のとおり。","正しい。正当防衛（刑法第36条）は「急迫不正の侵害」に対するものであるのに対し、緊急避難（第37条）は「現在の危難」を避けるためのものであり、天災や動物による危難なども含まれる。","誤り。刑法第37条第1項本文は「これによって生じた害が避けようとした害の程度を超えなかった場合に限り、罰しない」と定めている（害の均衡）。","正しい。刑法第37条第1項ただし書（過剰避難）のとおり。","正しい。刑法第37条第2項のとおり。警察官や消防職員など、業務上特別の義務がある者には、緊急避難の規定は適用されない。"],"ref":["刑法第36条","刑法第37条"],"src":[]},
{"id":"KR-006","cat":"hourei","sub":"刑法","kubun":null,"stem":"刑法の故意、責任能力等に関する次の記述のうち、正しいものはどれか。","choices":["罪を犯す意思がない行為は、法律に特別の規定がある場合であっても、罰せられることはない。","法律を知らなかった者は、罪を犯す意思がなかったものとして、罰せられない。","心神耗弱者の行為は、罰しない。","犯罪の実行に着手した者が自己の意思により犯罪を中止したときは、その刑を減軽することはできるが、免除することはできない。","14歳に満たない者の行為は、罰しない。"],"answer":4,"notes":["誤り。刑法第38条第1項は、罪を犯す意思がない行為は罰しないとしつつ、ただし書で「法律に特別の規定がある場合は、この限りでない」と定めている。過失傷害罪（第209条）や業務上過失致死傷罪（第211条）などは、故意がなくても罰せられる。","誤り。刑法第38条第3項により、法律を知らなかったとしても、そのことによって罪を犯す意思がなかったとすることはできない。ただし、情状により、その刑を減軽することができる。","誤り。刑法第39条第2項により、心神耗弱者の行為は、その刑を減軽する。罰しないとされているのは心神喪失者の行為である（同条第1項）。","誤り。刑法第43条ただし書により、自己の意思により犯罪を中止したとき（中止犯）は、その刑を減軽し、又は免除する。","正しい。刑法第41条（責任年齢）のとおり。"],"ref":["刑法第38条","刑法第39条","刑法第41条","刑法第43条"],"src":[]},
{"id":"KR-007","cat":"hourei","sub":"刑法","kubun":null,"stem":"刑法の暴行罪及び傷害罪に関する次の記述のうち、誤っているものはどれか。","choices":["暴行罪は、暴行を加えた結果、人を傷害するに至った場合に成立する。","人の身体を傷害した者は、15年以下の拘禁刑又は50万円以下の罰金に処せられる。","身体を傷害し、よって人を死亡させた者は、3年以上の有期拘禁刑に処せられる。","傷害罪又は傷害致死罪が行われるに当たり、現場において勢いを助けた者は、自ら人を傷害しなくても処罰される。","暴行罪の法定刑には、拘禁刑及び罰金のほか、拘留及び科料も定められている。"],"answer":0,"notes":["誤り。刑法第208条の暴行罪は、暴行を加えた者が人を傷害するに至らなかったときに成立する。人を傷害するに至ったときは傷害罪（第204条）となる。","正しい。刑法第204条（傷害）のとおり。","正しい。刑法第205条（傷害致死）のとおり。","正しい。刑法第206条（現場助勢）により、1年以下の拘禁刑又は10万円以下の罰金若しくは科料に処せられる。","正しい。刑法第208条により、2年以下の拘禁刑若しくは30万円以下の罰金又は拘留若しくは科料に処せられる。"],"ref":["刑法第204条","刑法第205条","刑法第206条","刑法第208条"],"src":[]},
{"id":"KR-008","cat":"hourei","sub":"刑法","kubun":null,"stem":"刑法の逮捕・監禁罪、脅迫罪及び強要罪に関する次の記述のうち、正しいものはどれか。","choices":["不法に人を逮捕し、又は監禁した者は、3年以下の拘禁刑又は30万円以下の罰金に処せられる。","脅迫罪は、本人の生命、身体、自由、名誉又は財産に対し害を加える旨を告知した場合に成立し、本人の親族に対し害を加える旨を告知しても成立しない。","強要罪には、未遂を罰する規定がない。","不法に人を逮捕し、又は監禁し、よって人を死傷させた者は、傷害の罪と比較して、重い刑により処断される。","警備員が、犯罪の嫌疑のない人を施設内の一室に閉じ込めて出られないようにしても、警備業務として行う限り、監禁罪は成立しない。"],"answer":3,"notes":["誤り。刑法第220条により、不法に人を逮捕し、又は監禁した者は、3月以上7年以下の拘禁刑に処せられる。罰金刑は定められていない。","誤り。刑法第222条第2項により、親族の生命、身体、自由、名誉又は財産に対し害を加える旨を告知して人を脅迫した者も、脅迫罪として処罰される（法定刑は2年以下の拘禁刑又は30万円以下の罰金）。","誤り。刑法第223条第3項により、強要罪の未遂は罰せられる。強要罪は、脅迫し、又は暴行を用いて、人に義務のないことを行わせ、又は権利の行使を妨害する罪で、法定刑は3年以下の拘禁刑である。","正しい。刑法第221条（逮捕等致死傷）のとおり。","誤り。正当な理由なく人を閉じ込めて出られないようにすれば、監禁罪（刑法第220条）が成立する。警備員は法律により特別に権限を与えられているものではなく（警備業法第15条）、警備業務であることを理由に罰せられなくなるものではない。"],"ref":["刑法第220条","刑法第221条","刑法第222条","刑法第223条","警備業法第15条"],"src":[]},
{"id":"KR-009","cat":"hourei","sub":"刑法","kubun":null,"stem":"刑法の窃盗罪及び強盗罪に関する次の記述のうち、誤っているものはどれか。","choices":["他人の財物を窃取した者は、窃盗の罪とし、10年以下の拘禁刑又は50万円以下の罰金に処せられる。","窃盗犯人が、逮捕を免れるために暴行又は脅迫をしたときは強盗として論じられるが、盗んだ財物を取り返されることを防ぐために暴行又は脅迫をしたときは強盗として論じられない。","暴行又は脅迫を用いて他人の財物を強取した者は、強盗の罪とし、5年以上の有期拘禁刑に処せられる。","強盗が人を負傷させたときは、無期又は6年以上の拘禁刑に処せられる。","窃盗罪及び強盗罪の未遂は、罰せられる。"],"answer":1,"notes":["正しい。刑法第235条（窃盗）のとおり。","誤り。刑法第238条（事後強盗）により、窃盗が、財物を得てこれを取り返されることを防ぎ、逮捕を免れ、又は罪跡を隠滅するために、暴行又は脅迫をしたときは、強盗として論じられる。取り返されることを防ぐ目的の場合も含まれる。","正しい。刑法第236条第1項のとおり。同条第2項により、同様の方法で財産上不法の利益を得た場合も強盗となる。","正しい。刑法第240条前段のとおり。死亡させたときは、死刑又は無期拘禁刑に処せられる（同条後段）。","正しい。刑法第243条により、窃盗罪（第235条）、強盗罪（第236条）、事後強盗罪（第238条）、強盗致死傷罪（第240条）などの未遂は罰せられる。"],"ref":["刑法第235条","刑法第236条","刑法第238条","刑法第240条","刑法第243条"],"src":[]},
{"id":"KR-010","cat":"hourei","sub":"刑法","kubun":null,"stem":"刑法の恐喝罪及び横領の罪に関する次の記述のうち、正しいものはどれか。","choices":["恐喝罪は、人を恐喝して財物を交付させた場合に成立し、財産上不法の利益を得た場合には成立しない。","恐喝罪の未遂は、罰せられない。","業務上自己の占有する他人の物を横領した者は、10年以下の拘禁刑に処せられる。","遺失物等横領罪は、遺失物を横領した場合に限り成立し、漂流物その他占有を離れた他人の物を横領しても成立しない。","路上で拾った他人の財布を、遺失者に返還せず、警察署長にも提出しないで自分のものにしても、拾った物であるから犯罪は成立しない。"],"answer":2,"notes":["誤り。刑法第249条第2項により、恐喝の方法により財産上不法の利益を得、又は他人にこれを得させた者も、恐喝罪として処罰される（法定刑は10年以下の拘禁刑）。","誤り。刑法第250条により、恐喝罪の未遂は罰せられる。","正しい。刑法第253条（業務上横領）のとおり。自己の占有する他人の物を横領する横領罪（第252条第1項）の法定刑（5年以下の拘禁刑）より重い。","誤り。刑法第254条は「遺失物、漂流物その他占有を離れた他人の物を横領した者」を処罰の対象としている。法定刑は1年以下の拘禁刑又は10万円以下の罰金若しくは科料である。","誤り。拾った物を遺失者に返還せず、警察署長にも提出しないで自分のものにすれば、遺失物等横領罪（刑法第254条）が成立する。拾得者は、速やかに、拾得をした物件を遺失者に返還し、又は警察署長に提出しなければならない（遺失物法第4条第1項）。"],"ref":["刑法第249条","刑法第250条","刑法第252条","刑法第253条","刑法第254条","遺失物法第4条第1項"],"src":[]},
{"id":"KR-011","cat":"hourei","sub":"刑法","kubun":null,"stem":"刑法の住居侵入等の罪、業務妨害罪及び器物損壊罪に関する次の記述のうち、誤っているものはどれか。","choices":["刑法第130条は、正当な理由なく人の住居等に侵入する行為を処罰しているが、要求を受けたにもかかわらずその場所から退去しない行為は処罰していない。","正当な理由がないのに、人の看守する建造物に侵入した者も、刑法第130条により処罰される。","刑法第130条の罪の未遂は、罰せられる。","威力を用いて人の業務を妨害した者は、偽計を用いて人の業務を妨害した者と同様に処罰される。","他人の物を損壊した者に対する器物損壊罪は、告訴がなければ公訴を提起することができない。"],"answer":0,"notes":["誤り。刑法第130条は、正当な理由がないのに人の住居等に侵入した者（住居侵入罪）のほか、要求を受けたにもかかわらずこれらの場所から退去しなかった者（不退去罪）も処罰している。法定刑は3年以下の拘禁刑又は10万円以下の罰金である。","正しい。刑法第130条の客体は、人の住居のほか、人の看守する邸宅、建造物若しくは艦船である。「看守する」とは、管理人や警備員を置いたり施錠したりするなどして、事実上管理・支配していることをいう。","正しい。刑法第132条のとおり。","正しい。刑法第234条（威力業務妨害）は「前条の例による」と定めており、第233条（偽計業務妨害）と同じく3年以下の拘禁刑又は50万円以下の罰金に処せられる。","正しい。刑法第261条の器物損壊罪は、第264条により親告罪とされている。法定刑は3年以下の拘禁刑又は30万円以下の罰金若しくは科料である。"],"ref":["刑法第130条","刑法第132条","刑法第233条","刑法第234条","刑法第261条","刑法第264条"],"src":[]},
{"id":"KR-012","cat":"hourei","sub":"刑事訴訟法","kubun":null,"stem":"刑事訴訟法に定める現行犯人及び準現行犯人に関する次の記述のうち、正しいものはどれか。","choices":["現に罪を行っている者は現行犯人であるが、現に罪を行い終わった者は現行犯人に当たらない。","犯人として追呼されている者など法定の事由に当たる者は、罪を行い終わってからの時間の経過に関係なく、現行犯人とみなされる。","誰何されて逃走しようとする者は、準現行犯人となることはない。","盗品などの贓物を所持している者は、罪を行い終わってから間がないと明らかに認められるときは、現行犯人とみなされる。","準現行犯人は現行犯人とはみなされないので、私人は、準現行犯人を逮捕状なしに逮捕することはできない。"],"answer":3,"notes":["誤り。刑事訴訟法第212条第1項は「現に罪を行い、又は現に罪を行い終つた者を現行犯人とする」と定めている。","誤り。刑事訴訟法第212条第2項により、同項各号（①犯人として追呼されているとき、②贓物又は明らかに犯罪の用に供したと思われる兇器その他の物を所持しているとき、③身体又は被服に犯罪の顕著な証跡があるとき、④誰何されて逃走しようとするとき）のいずれかに当たる者が、罪を行い終わってから間がないと明らかに認められるときに限り、現行犯人とみなされる（準現行犯人）。","誤り。誰何されて逃走しようとするときは、刑事訴訟法第212条第2項第4号に当たる。","正しい。刑事訴訟法第212条第2項第2号は、贓物又は明らかに犯罪の用に供したと思われる兇器その他の物を所持しているときを挙げており、同項各号のいずれかに当たる者が、罪を行い終わってから間がないと明らかに認められるときは、現行犯人とみなされる（準現行犯人）。ただし、準現行犯人の逮捕は、要件の判断を誤るおそれがあるので慎重であるべきとされている。","誤り。準現行犯人は現行犯人とみなされる（刑事訴訟法第212条第2項）ので、現行犯人と同様に、何人でも逮捕状なくして逮捕することができる（同法第213条）。"],"ref":["刑事訴訟法第212条","刑事訴訟法第213条","指導教育責任者講習の運用通達（令和6年6月27日）別表第3（機械警備業務管理者講習の実施要領）"],"src":[]},
{"id":"KR-013","cat":"hourei","sub":"刑事訴訟法","kubun":null,"stem":"刑事訴訟法に定める逮捕に関する次の記述のうち、正しいものはどれか。","choices":["逮捕状による逮捕は、検察官、検察事務官又は司法警察職員のほか、警備員も行うことができる。","現行犯人は、何人でも、逮捕状なくしてこれを逮捕することができる。","一定の重い罪を犯したことを疑うに足りる十分な理由がある場合で、急速を要し、裁判官の逮捕状を求めることができないときは、私人もその理由を告げて被疑者を逮捕することができる。","警備員が現行犯人を逮捕するには、あらかじめ警察官の承諾を得なければならない。","現行犯人を逮捕した者は、逮捕後直ちに、裁判官に逮捕状を求める手続をしなければならない。"],"answer":1,"notes":["誤り。逮捕状による逮捕（通常逮捕）をすることができるのは、検察官、検察事務官又は司法警察職員に限られる（刑事訴訟法第199条第1項）。警備員を含む私人が逮捕できるのは、現行犯人（準現行犯人を含む。）に限られる。","正しい。刑事訴訟法第213条のとおり。憲法第33条も、現行犯として逮捕される場合を令状主義の例外としている。","誤り。緊急逮捕（刑事訴訟法第210条第1項）をすることができるのは、検察官、検察事務官又は司法警察職員に限られ、私人は行うことができない。","誤り。刑事訴訟法第213条は、現行犯人は何人でも逮捕状なくして逮捕することができると定めており、警察官の承諾は要件とされていない。","誤り。逮捕後直ちに裁判官の逮捕状を求める手続をしなければならないのは、緊急逮捕の場合である（刑事訴訟法第210条第1項）。現行犯逮捕には逮捕状は不要であり、私人が逮捕したときは、直ちに検察官又は司法警察職員に引き渡さなければならない（同法第214条）。"],"ref":["日本国憲法第33条","刑事訴訟法第199条第1項","刑事訴訟法第210条第1項","刑事訴訟法第213条","刑事訴訟法第214条"],"src":[]},
{"id":"KR-014","cat":"hourei","sub":"刑事訴訟法","kubun":null,"stem":"私人が現行犯人を逮捕した後の手続に関する次の記述のうち、誤っているものはどれか。","choices":["検察官、検察事務官及び司法警察職員以外の者は、現行犯人を逮捕したときは、直ちにこれを引き渡さなければならない。","司法巡査は、私人から現行犯人を受け取ったときは、速やかにこれを司法警察員に引致しなければならない。","司法巡査は、私人から犯人を受け取った場合には、逮捕者の氏名、住居及び逮捕の事由を聴き取らなければならない。","司法巡査は、私人から犯人を受け取った場合において、必要があるときは、逮捕者に対し、ともに官公署に行くことを求めることができる。","私人が逮捕した現行犯人の引渡し先は司法警察職員に限られており、検察官に引き渡すことはできない。"],"answer":4,"notes":["正しい。刑事訴訟法第214条のとおり。私人が逮捕した現行犯人は、直ちに地方検察庁若しくは区検察庁の検察官又は司法警察職員に引き渡す。窃盗犯人を現行犯逮捕して、長時間にわたり所持品や身元等について調べることは、警備業法第15条に違反する行為の例とされている（解釈運用基準 第14の2）。","正しい。刑事訴訟法第215条第1項のとおり。","正しい。刑事訴訟法第215条第2項前段のとおり。","正しい。刑事訴訟法第215条第2項後段のとおり。","誤り。刑事訴訟法第214条により、私人が逮捕した現行犯人は、直ちに地方検察庁若しくは区検察庁の検察官又は司法警察職員に引き渡さなければならない。検察官に引き渡すこともできる。"],"ref":["刑事訴訟法第214条","刑事訴訟法第215条","解釈運用基準 第14の2"],"src":[]},
{"id":"KR-015","cat":"hourei","sub":"刑事訴訟法","kubun":null,"stem":"軽微な犯罪の現行犯逮捕の制限（刑事訴訟法第217条）に関する次の記述のうち、正しいものはどれか。","choices":["この制限の対象は、拘留又は科料に当たる罪に限られ、罰金に当たる罪は対象とならない。","軽微な犯罪の現行犯人は、犯人の住居及び氏名が明らかでなく、かつ、犯人が逃亡するおそれがある場合に限り、逮捕することができる。","軽犯罪法違反の罪の現行犯人は、犯人の住居若しくは氏名が明らかでない場合又は犯人が逃亡するおそれがある場合に限り、逮捕することができる。","この制限は、警察官が現行犯人を逮捕する場合にのみ適用され、私人が逮捕する場合には適用されない。","刑法の罪については、2万円以下の罰金、拘留又は科料に当たる罪に限り、この制限の対象となる。"],"answer":2,"notes":["誤り。刑事訴訟法第217条の対象は、30万円（刑法、暴力行為等処罰に関する法律及び経済関係罰則の整備に関する法律の罪以外の罪については、当分の間、2万円）以下の罰金、拘留又は科料に当たる罪であり、一定額以下の罰金に当たる罪も含まれる。","誤り。刑事訴訟法第217条は「犯人の住居若しくは氏名が明らかでない場合又は犯人が逃亡するおそれがある場合に限り」と定めており、これらのいずれかに当たれば逮捕することができる。すべてを満たす必要はない。","正しい。軽犯罪法の罪は拘留又は科料に当たる罪（同法第1条）であるから、刑事訴訟法第217条により、犯人の住居若しくは氏名が明らかでない場合又は犯人が逃亡するおそれがある場合に限り、現行犯逮捕をすることができる。","誤り。刑事訴訟法第217条は、現行犯人は何人でも逮捕できるとする第213条などの規定の適用を、軽微な犯罪について制限するものであり、私人が逮捕する場合にも適用される。","誤り。刑法の罪については、2万円以下に限られず、30万円以下の罰金、拘留又は科料に当たる罪が対象となる（例：過失傷害罪（刑法第209条第1項）は30万円以下の罰金又は科料）。当分の間2万円以下とされているのは、刑法、暴力行為等処罰に関する法律及び経済関係罰則の整備に関する法律の罪以外の罪である（刑事訴訟法第217条の括弧書き）。"],"ref":["刑事訴訟法第213条","刑事訴訟法第217条","軽犯罪法第1条","刑法第209条"],"src":[]},
{"id":"KR-016","cat":"hourei","sub":"刑事訴訟法","kubun":null,"stem":"警備員が私人として現行犯人を逮捕する場合に関する次の記述のうち、誤っているものはどれか。","choices":["準現行犯人の逮捕は、罪を行い終わってから間がないと明らかに認められるかどうかの判断を誤るおそれがあるので、特に慎重であるべきとされている。","逮捕の際に相手が抵抗した場合、私人であっても、社会通念上逮捕のために必要かつ相当であると認められる限度内の実力を用いることは許される。","窃盗犯人を現行犯逮捕して、長時間にわたり所持品や身元について調べることは、警備業法第15条に違反する行為の例とされている。","私人が現行犯人を逮捕した場合も、逮捕の現場においては、令状なしに犯人の身体や所持品を捜索し、証拠物を差し押さえることができる。","犯罪の現場から逃走した犯人を見失い、後日その人物を見つけた場合は、その者を現行犯人として逮捕することはできない。"],"answer":3,"notes":["正しい。準現行犯人（刑事訴訟法第212条第2項）は、犯行を現認していない場合も含むため誤認のおそれがある。警察庁の講習の運用通達でも、機械警備業務管理者講習の実施要領（別表第3）の刑事訴訟法の欄で、特に準現行犯人の逮捕は慎重であるべきことを教えることとされている。","正しい。判例（最高裁昭和50年4月3日判決）は、現行犯逮捕の際に抵抗を受けたときは、警察官であると私人であるとを問わず、社会通念上逮捕のために必要かつ相当であると認められる限度内の実力を行使することが許され、その実力の行使は刑法第35条により罰せられないとしている。限度を超えれば暴行罪や傷害罪に問われることがある。","正しい。警備業法等の解釈運用基準（第14）は、警備業法第15条違反となる具体例として、窃盗犯人を現行犯逮捕して、長時間にわたり、所持品、身元等について調べることを挙げている。逮捕した現行犯人は、直ちに引き渡さなければならない（刑事訴訟法第214条）。","誤り。逮捕の現場で令状なしに差押え、捜索又は検証をすることができるのは、検察官、検察事務官又は司法警察職員に限られる（刑事訴訟法第220条）。私人である警備員には捜索・差押えの権限はない。","正しい。現行犯人は現に罪を行い、又は現に罪を行い終わった者であり（刑事訴訟法第212条第1項）、準現行犯人も罪を行い終わってから間がないと明らかに認められることが必要である（同条第2項）。後日見つけた者はこれらに当たらない。"],"ref":["刑事訴訟法第212条","刑事訴訟法第214条","刑事訴訟法第220条","刑法第35条","解釈運用基準 第14の2","指導教育責任者講習の運用通達（令和6年6月27日）別表第3（機械警備業務管理者講習の実施要領）"],"src":[]},
{"id":"KR-017","cat":"hourei","sub":"刑事訴訟法","kubun":null,"stem":"刑事訴訟法に定める告訴及び告発に関する次の記述のうち、誤っているものはどれか。","choices":["告発は、犯罪により害を被った者に限り、することができる。","犯罪により害を被った者は、告訴をすることができる。","親告罪の告訴は、犯人を知った日から6か月を経過したときは、することができない。","告訴は、公訴の提起があるまで取り消すことができるが、告訴を取り消した者は、更に告訴をすることができない。","告訴又は告発は、書面又は口頭で、検察官又は司法警察員にしなければならない。"],"answer":0,"notes":["誤り。刑事訴訟法第239条第1項により、何人でも、犯罪があると思料するときは、告発をすることができる。犯罪により害を被った者（被害者）がするのは告訴である（同法第230条）。","正しい。刑事訴訟法第230条のとおり。被害者の法定代理人も、独立して告訴をすることができる（同法第231条第1項）。","正しい。刑事訴訟法第235条本文のとおり。器物損壊罪（刑法第261条）などの親告罪は、告訴がなければ公訴を提起することができない。","正しい。刑事訴訟法第237条第1項及び第2項のとおり。","正しい。刑事訴訟法第241条第1項のとおり。口頭による告訴又は告発を受けた検察官又は司法警察員は、調書を作らなければならない（同条第2項）。"],"ref":["刑事訴訟法第230条","刑事訴訟法第235条","刑事訴訟法第237条","刑事訴訟法第239条","刑事訴訟法第241条"],"src":[]},
{"id":"KR-018","cat":"hourei","sub":"警察官職務執行法","kubun":null,"stem":"警察官職務執行法に関する次の記述のうち、正しいものはどれか。","choices":["警備員も、警察官職務執行法に基づき、異常な挙動その他周囲の事情から合理的に判断して何らかの犯罪を犯そうとしていると疑うに足りる相当な理由のある者を停止させて質問することができる。","警察官が停止させて質問することができるのは、何らかの犯罪を犯し、又は犯そうとしていると疑うに足りる相当な理由のある者に限られ、既に行われた犯罪について知っていると認められる者は含まれない。","警察官は、その場で質問をすることが本人に対して不利であり、又は交通の妨害になると認められる場合には、質問するため、その者に附近の警察署、派出所又は駐在所に同行することを求めることができる。","警察官職務執行法に規定する手段は、目的を達成するために有効であれば、必要な最小の限度にとどめる必要はない。","職務質問のため警察署への同行を求められた者は、これを拒むことができない。"],"answer":2,"notes":["誤り。職務質問（警察官職務執行法第2条第1項）は警察官に与えられた権限であり、警備員にはこのような権限はない。警備員は、法律により特別に権限を与えられているものではない（警備業法第15条）。","誤り。警察官職務執行法第2条第1項は、既に行われた犯罪について、若しくは犯罪が行われようとしていることについて知っていると認められる者も、停止させて質問することができる対象としている。","正しい。警察官職務執行法第2条第2項（任意同行）のとおり。","誤り。警察官職務執行法第1条第2項は、同法に規定する手段は、目的のため必要な最小の限度において用いるべきものであって、いやしくもその濫用にわたるようなことがあってはならないと定めている。","誤り。警察官職務執行法第2条第3項により、職務質問の対象者は、刑事訴訟に関する法律の規定によらない限り、身柄を拘束され、又はその意に反して警察署等に連行され、若しくは答弁を強要されることはない。同行は任意である。"],"ref":["警察官職務執行法第1条第2項","警察官職務執行法第2条","警備業法第15条"],"src":[]},
{"id":"KR-019","cat":"hourei","sub":"警察官職務執行法","kubun":null,"stem":"警察官職務執行法に定める保護及び避難等の措置に関する次の記述のうち、誤っているものはどれか。","choices":["警察官は、泥酔のため自己又は他人の生命、身体又は財産に危害を及ぼすおそれのある者で、応急の救護を要すると信ずるに足りる相当な理由のあるものを発見したときは、取りあえず警察署、病院等の適当な場所において、これを保護しなければならない。","迷い子、病人、負傷者等で適当な保護者を伴わず、応急の救護を要すると認められる者であっても、本人がこれを拒んだ場合は、警察官職務執行法による保護の対象とならない。","警察官職務執行法による警察の保護は、簡易裁判所の裁判官の許可状がある場合を除き、24時間を超えてはならない。","警察官は、天災、交通事故、極端な雑踏等の危険な事態がある場合において、特に急を要するときは、危害を受けるおそれのある者を、その場の危害を避けさせるために必要な限度で引き留め、又は避難させることができる。","警察官は、泥酔者や迷い子などを保護したときでも、その者の家族、知人その他の関係者に通知することは要しない。"],"answer":4,"notes":["正しい。警察官職務執行法第3条第1項第1号のとおり。","正しい。警察官職務執行法第3条第1項第2号の括弧書きのとおり。","正しい。警察官職務執行法第3条第3項のとおり。許可状による延長は、通じて5日を超えてはならない（同条第4項）。","正しい。警察官職務執行法第4条第1項（避難等の措置）のとおり。","誤り。警察官は、保護の措置をとった場合においては、できるだけすみやかに、その者の家族、知人その他の関係者にこれを通知し、その者の引取方について必要な手配をしなければならない（警察官職務執行法第3条第2項）。責任ある家族、知人等が見つからないときは、すみやかに、適当な公衆保健若しくは公共福祉のための機関等にその事件を引き継がなければならない（同項）。"],"ref":["警察官職務執行法第3条","警察官職務執行法第4条"],"src":[]},
{"id":"KR-020","cat":"hourei","sub":"警察官職務執行法","kubun":null,"stem":"警察官職務執行法に定める犯罪の予防及び制止、立入並びに武器の使用に関する次の記述のうち、正しいものはどれか。","choices":["警備員は、警備業務対象施設において犯罪がまさに行われようとするのを認めたときは、警察官職務執行法に基づき、その行為を制止することができる。","興行場、旅館、駅その他多数の客の来集する場所の管理者は、その公開時間中において、警察官が犯罪の予防等のため立ち入ることを要求した場合には、正当の理由なくして、これを拒むことができない。","警察官は、犯罪がまさに行われようとするのを認めたときは、急を要しない場合であっても、その行為を制止することができる。","警察官は、他人の土地や建物に立ち入る際、その場所の管理者から要求されても、その理由を告げ、又は身分を示す証票を呈示する必要はない。","警察官が武器を使用して人に危害を与えることが許されるのは、刑法の正当防衛又は緊急避難に該当する場合に限られる。"],"answer":1,"notes":["誤り。警察官職務執行法第5条の警告及び制止は警察官に与えられた権限であり、警備員にはこのような権限はない（警備業法第15条）。","正しい。警察官職務執行法第6条第2項のとおり。","誤り。警察官職務執行法第5条により、警察官は、犯罪がまさに行われようとするのを認めたときは、関係者に必要な警告を発することができ、その行為により人の生命若しくは身体に危険が及び、又は財産に重大な損害を受けるおそれがあって、急を要する場合に、その行為を制止することができる。","誤り。警察官職務執行法第6条第4項により、警察官は、立入りに際して、その場所の管理者又はこれに準ずる者から要求された場合には、その理由を告げ、かつ、その身分を示す証票を呈示しなければならない。","誤り。警察官職務執行法第7条ただし書により、正当防衛若しくは緊急避難に該当する場合のほか、同条各号に該当する場合（一定の凶悪な罪の犯人や逮捕状により逮捕する者が抵抗し、又は逃亡しようとするときなどに、これを防ぎ、又は逮捕するために他に手段がないと信ずるに足りる相当な理由のある場合）にも、人に危害を与えることができる。"],"ref":["警察官職務執行法第5条","警察官職務執行法第6条","警察官職務執行法第7条","警備業法第15条"],"src":[]},
{"id":"KR-021","cat":"hourei","sub":"遺失物法","kubun":null,"stem":"遺失物法に定める物件の拾得者等の義務に関する次の記述のうち、誤っているものはどれか。","choices":["拾得者は、速やかに、拾得をした物件を遺失者に返還し、又は警察署長に提出しなければならない。","法令の規定によりその所持が禁止されている物に該当する物件や、犯罪の犯人が占有していたと認められる物件は、速やかに、警察署長に提出しなければならない。","施設において物件（埋蔵物を除く。）の拾得をした拾得者（当該施設の施設占有者を除く。）は、速やかに、当該物件を当該施設の施設占有者に交付しなければならない。","拾得者から物件の交付を受けた施設占有者は、遺失者が判明するまでその物件を自ら保管しなければならず、警察署長に提出することはできない。","施設占有者は、交付を受けた物件を遺失者に返還し、又は警察署長に提出するまでの間、これを善良な管理者の注意をもって取り扱わなければならない。"],"answer":3,"notes":["正しい。遺失物法第4条第1項本文のとおり。","正しい。遺失物法第4条第1項ただし書のとおり。これらの物件は、遺失者に返還せず、警察署長に提出する。なお、施設において拾得した場合は、拾得者は施設占有者に交付し（同条第2項）、交付を受けた施設占有者がこれらの物件を警察署長に提出する（同法第13条第1項ただし書）。","正しい。遺失物法第4条第2項のとおり。「施設」とは、建築物その他の施設（車両、船舶、航空機その他の移動施設を含む。）であって、その管理に当たる者が常駐するものをいう（同法第2条第5項）。","誤り。遺失物法第13条第1項により、交付を受けた施設占有者は、速やかに、当該物件を遺失者に返還し、又は警察署長に提出しなければならない。","正しい。遺失物法第15条のとおり。"],"ref":["遺失物法第2条第5項","遺失物法第4条","遺失物法第13条第1項","遺失物法第15条"],"src":[]},
{"id":"KR-022","cat":"hourei","sub":"遺失物法","kubun":null,"stem":"遺失物の拾得者の権利及び報労金に関する次の記述のうち、正しいものはどれか。","choices":["遺失物は、遺失物法の定めるところに従い公告をした後3か月以内にその所有者が判明しないときは、これを拾得した者がその所有権を取得する。","物件の返還を受ける遺失者は、物件の価格の100分の10以上100分の30以下に相当する額の報労金を拾得者に支払わなければならない。","施設において拾得された物件の返還を受ける遺失者は、その物件の交付を受けた施設占有者があるときは、報労金の全額を施設占有者に支払えばよく、拾得者に支払う必要はない。","報労金は、物件が遺失者に返還された後6か月を経過するまでは、請求することができる。","施設において物件を拾得した者は、拾得の時から1週間以内に施設占有者に交付すれば、報労金を請求する権利を失わない。"],"answer":0,"notes":["正しい。民法第240条のとおり。ただし、所有権を取得した者が、取得の日から2か月以内に物件を警察署長などから引き取らないときは、その所有権を失う（遺失物法第36条）。","誤り。遺失物法第28条第1項により、報労金の額は、物件の価格の100分の5以上100分の20以下に相当する額である。","誤り。遺失物法第28条第2項により、物件の交付を受けた施設占有者があるときは、遺失者は、拾得者及び施設占有者に対し、それぞれ報労金の額の2分の1の額を支払わなければならない。","誤り。遺失物法第29条により、報労金は、物件が遺失者に返還された後1か月を経過したときは、請求することができない。","誤り。遺失物法第34条第3号により、施設において拾得した者が、拾得の時から24時間以内に施設占有者に交付しなかったときは、報労金を請求する権利や所有権を取得する権利を失う。なお、施設以外の場所で拾得した者は、拾得の日から1週間以内に警察署長に提出しなかったときに、これらの権利を失う（同条第2号）。"],"ref":["民法第240条","遺失物法第28条","遺失物法第29条","遺失物法第34条","遺失物法第36条"],"src":[]},
{"id":"KR-023","cat":"hourei","sub":"軽犯罪法","kubun":null,"stem":"軽犯罪法第1条に定める罪に関する次の記述のうち、正しいものはどれか。","choices":["正当な理由がなくて刃物を携帯していた者は、隠して携帯していたかどうかにかかわらず、軽犯罪法により処罰される。","入ることを禁じた場所に正当な理由がなくて入った者は、刑法の住居侵入罪に当たらない限り、処罰されることはない。","正当な理由がなくて合かぎ、のみ、ガラス切りその他他人の邸宅又は建物に侵入するのに使用されるような器具を隠して携帯していた者は、軽犯罪法により処罰される。","火事や犯罪の発生などの変事に際し、正当な理由がなく、現場に出入りするについて公務員の指示に従うことを拒んだ者は処罰されるが、公務員を援助する者の指示に従うことを拒んだ者は処罰されない。","他人の業務に対して悪戯などでこれを妨害した者は、刑法の業務妨害罪に当たらない限り、処罰されることはない。"],"answer":2,"notes":["誤り。軽犯罪法第1条第2号は、正当な理由がなくて刃物、鉄棒その他人の生命を害し、又は人の身体に重大な害を加えるのに使用されるような器具を「隠して」携帯していた者を処罰の対象としている。なお、刃物の携帯は銃砲刀剣類所持等取締法（第22条）でも規制されている。","誤り。軽犯罪法第1条第32号により、入ることを禁じた場所又は他人の田畑に正当な理由がなくて入った者も処罰される。","正しい。軽犯罪法第1条第3号（侵入具の隠匿携帯）のとおり。","誤り。軽犯罪法第1条第8号は、風水害、地震、火事、交通事故、犯罪の発生その他の変事に際し、正当な理由がなく、現場に出入するについて公務員若しくはこれを援助する者の指示に従うことを拒み、又は公務員から援助を求められたのにかかわらずこれに応じなかった者を処罰の対象としている。","誤り。軽犯罪法第1条第31号により、他人の業務に対して悪戯などでこれを妨害した者も処罰される。"],"ref":["軽犯罪法第1条","銃砲刀剣類所持等取締法第22条"],"src":[]},
{"id":"KR-024","cat":"hourei","sub":"軽犯罪法","kubun":null,"stem":"軽犯罪法の刑罰及び適用に関する次の記述のうち、誤っているものはどれか。","choices":["軽犯罪法第1条各号のいずれかに該当する者は、拘留又は科料に処せられる。","軽犯罪法第1条の罪を教唆し、又は幇助した者は、処罰されない。","軽犯罪法第1条の罪を犯した者に対しては、情状により、その刑を免除し、又は拘留及び科料を併科することができる。","軽犯罪法の適用に当たっては、国民の権利を不当に侵害しないように留意し、その本来の目的を逸脱して他の目的のためにこれを濫用するようなことがあってはならない。","拘留は1日以上30日未満、科料は1,000円以上1万円未満とされている。"],"answer":1,"notes":["正しい。軽犯罪法第1条のとおり。","誤り。軽犯罪法第3条により、第1条の罪を教唆し、又は幇助した者は、正犯に準ずる。刑法第64条は、拘留又は科料のみに処すべき罪の教唆者及び従犯は、特別の規定がなければ罰しないとしているが、軽犯罪法第3条はその特別の規定に当たる。","正しい。軽犯罪法第2条のとおり。","正しい。軽犯罪法第4条のとおり。","正しい。刑法第16条（拘留は1日以上30日未満）及び第17条（科料は1,000円以上1万円未満）のとおり。"],"ref":["軽犯罪法第1条","軽犯罪法第2条","軽犯罪法第3条","軽犯罪法第4条","刑法第16条","刑法第17条","刑法第64条"],"src":[]},
{"id":"KR-025","cat":"hourei","sub":"憲法","kubun":null,"stem":"日本国憲法第18条から第28条までに定める権利及び自由に関する次の記述のうち、誤っているものはどれか。","choices":["思想及び良心の自由は、これを侵してはならない。","何人も、犯罪による処罰の場合であっても、その意に反する苦役に服させられない。","何人も、宗教上の行為、祝典、儀式又は行事に参加することを強制されない。","通信の秘密は、これを侵してはならない。","勤労者の団結する権利及び団体交渉その他の団体行動をする権利は、これを保障する。"],"answer":1,"notes":["正しい。日本国憲法第19条のとおり。","誤り。憲法第18条は「何人も、いかなる奴隷的拘束も受けない。又、犯罪に因る処罰の場合を除いては、その意に反する苦役に服させられない」と定めており、犯罪による処罰の場合は例外とされている。","正しい。憲法第20条第2項のとおり。同条第1項は、信教の自由は何人に対してもこれを保障すると定めている。","正しい。憲法第21条第2項後段のとおり。同項前段は検閲の禁止を定めている。なお、正当な理由がないのに封をしてある信書を開けた者は、信書開封罪（刑法第133条）として処罰される。","正しい。憲法第28条のとおり。労働組合の適法な集会、デモ行進等の周辺で、大勢で長時間ば声を浴びせ、唾を吐きかけるなどの嫌がらせをすることは、警備業法第15条違反の具体例とされている（解釈運用基準 第14の2）。"],"ref":["日本国憲法第18条","日本国憲法第19条","日本国憲法第20条第2項","日本国憲法第21条第2項","日本国憲法第28条","刑法第133条","解釈運用基準 第14の2"],"src":[]},
{"id":"KR-026","cat":"hourei","sub":"憲法","kubun":null,"stem":"日本国憲法に定める刑事手続上の権利に関する次の記述のうち、正しいものはどれか。","choices":["自己に不利益な唯一の証拠が本人の自白である場合でも、その自白が任意にされたものであれば、有罪とされることがある。","実行の時に適法であった行為でも、その後に制定された法律で処罰の対象とされたときは、刑事上の責任を問われる。","刑事被告人は、死刑又は無期の拘禁刑に当たる事件に限り、資格を有する弁護人を依頼することができる。","強制、拷問若しくは脅迫による自白又は不当に長く抑留若しくは拘禁された後の自白は、これを証拠とすることができない。","抑留又は拘禁された後に無罪の裁判を受けた者が国に補償を求めることができるのは、公務員に故意又は過失があった場合に限られる。"],"answer":3,"notes":["誤り。憲法第38条第3項により、何人も、自己に不利益な唯一の証拠が本人の自白である場合には、有罪とされ、又は刑罰を科せられない。自白が任意にされたものであっても、有罪とするには自白のほかに証拠が必要である。","誤り。憲法第39条前段により、何人も、実行の時に適法であった行為については、刑事上の責任を問われない（遡及処罰の禁止）。同条は、既に無罪とされた行為について刑事上の責任を問うことや、同一の犯罪について重ねて刑事上の責任を問うことも禁じている。","誤り。憲法第37条第3項により、刑事被告人は、いかなる場合にも、資格を有する弁護人を依頼することができる。被告人が自らこれを依頼することができないときは、国でこれを附する。","正しい。憲法第38条第2項のとおり。同条第1項は、何人も、自己に不利益な供述を強要されないと定めている。","誤り。憲法第40条により、何人も、抑留又は拘禁された後、無罪の裁判を受けたときは、法律の定めるところにより、国にその補償を求めることができ、公務員の故意又は過失は要件とされていない。公務員の不法行為により損害を受けたときの国又は公共団体への賠償請求は、別に憲法第17条が定めている。"],"ref":["日本国憲法第17条","日本国憲法第37条第3項","日本国憲法第38条第2項・第3項","日本国憲法第39条","日本国憲法第40条"],"src":[]},
{"id":"KR-027","cat":"hourei","sub":"刑法","kubun":null,"stem":"刑法第36条第1項の正当防衛の要件に関する判例の考え方として、正しいものはどれか。","choices":["「急迫」とは、法益の侵害が現に存在しているか、又は間近に押し迫っていることをいう。","侵害があらかじめ予期されていた場合には、そのことだけで侵害の急迫性は失われる。","相手の加害行為に対し憤激又は逆上して反撃を加えた場合には、そのことだけで防衛の意思を欠くとされる。","「やむを得ずにした行為」といえるためには、緊急避難と同様に、ほかに取るべき方法がなかったことが必要である。","反撃行為が防衛手段として相当性を有するものであっても、その結果が侵害されようとした法益より大きいときは、正当防衛は成立しない。"],"answer":0,"notes":["正しい。判例（最高裁昭和46年11月16日判決）は、刑法第36条にいう「急迫」とは、法益の侵害が現に存在しているか、又は間近に押し迫っていることを意味するとしている。既に終わった侵害に対する反撃は、急迫性を欠く。","誤り。判例（最高裁昭和46年11月16日判決、最高裁昭和52年7月21日決定）は、侵害があらかじめ予期されていたとしても、そのことから直ちに急迫性を失うものではないとしている。ただし、その機会を利用し積極的に相手に対して加害行為をする意思で侵害に臨んだときは、急迫性の要件を満たさないとしている。","誤り。判例（最高裁昭和46年11月16日判決）は、防衛行為は防衛の意思をもってなされることが必要であるが、相手の加害行為に対し憤激又は逆上して反撃を加えたからといって、直ちに防衛の意思を欠くものとはいえないとしている。","誤り。判例（最高裁昭和44年12月4日判決）は、「やむを得ずにした行為」とは、反撃行為が自己又は他人の権利を防衛する手段として必要最小限度のもの、すなわち防衛手段として相当性を有するものであることをいうとしている。ほかに取るべき方法がなかったこと（補充性）までは必要とされず、この点で緊急避難（刑法第37条）と異なる。","誤り。判例（最高裁昭和44年12月4日判決）は、反撃行為が防衛手段として相当性を有する以上、その反撃行為により生じた結果がたまたま侵害されようとした法益より大であっても、正当防衛でなくなるものではないとしている。なお、防衛の程度を超えた行為（過剰防衛）は、情状により刑を減軽し、又は免除することができるにとどまる（刑法第36条第2項）。"],"ref":["刑法第36条","刑法第37条","最高裁昭和44年12月4日判決","最高裁昭和46年11月16日判決","最高裁昭和52年7月21日決定"],"src":[]},
{"id":"KR-028","cat":"hourei","sub":"刑法","kubun":null,"stem":"刑法の未遂、共犯及び自首に関する次の記述のうち、誤っているものはどれか。","choices":["犯罪の実行に着手してこれを遂げなかった者は、その刑を減軽することができる。","二人以上共同して犯罪を実行した者は、すべて正犯とする。","人を教唆して犯罪を実行させた者には、正犯の刑を科する。","罪を犯した者が捜査機関に発覚する前に自首したときは、その刑を減軽することができる。","正犯を幇助した者は従犯とし、従犯の刑は、正犯の刑と同じとする。"],"answer":4,"notes":["正しい。刑法第43条本文（未遂減免）のとおり。未遂を罰する場合は各本条で定められており（第44条）、自己の意思により犯罪を中止したときは、その刑を減軽し、又は免除する（第43条ただし書）。","正しい。刑法第60条（共同正犯）のとおり。","正しい。刑法第61条第1項（教唆）のとおり。教唆者を教唆した者についても同様である（同条第2項）。","正しい。刑法第42条第1項（自首）のとおり。","誤り。正犯を幇助した者は従犯とする（刑法第62条第1項）が、従犯の刑は、正犯の刑を減軽する（第63条）。正犯の刑を科するとされているのは教唆者である（第61条第1項）。"],"ref":["刑法第42条","刑法第43条","刑法第44条","刑法第60条","刑法第61条","刑法第62条","刑法第63条"],"src":[]},
{"id":"KR-029","cat":"hourei","sub":"刑法","kubun":null,"stem":"刑法の過失傷害の罪（第209条〜第211条）に関する次の記述のうち、正しいものはどれか。","choices":["過失により人を傷害した者に対しては、罰金又は科料のほか、1年以下の拘禁刑も科することができる。","過失傷害罪と同様に、過失致死罪も、告訴がなければ公訴を提起することができない。","重大な過失により人を死傷させた者は、業務上過失致死傷罪と同じ法定刑で処罰される。","業務上必要な注意を怠り、よって人を死傷させた者は、3年以下の拘禁刑又は100万円以下の罰金に処せられる。","業務上過失致死傷罪にいう「業務」は、収入を得る目的で反復継続して行うものに限られる。"],"answer":2,"notes":["誤り。刑法第209条第1項により、過失により人を傷害した者は、30万円以下の罰金又は科料に処せられ、拘禁刑は定められていない。","誤り。告訴がなければ公訴を提起することができないのは過失傷害罪（刑法第209条第2項）であり、過失致死罪（第210条。50万円以下の罰金）は親告罪ではない。","正しい。刑法第211条後段により、重大な過失により人を死傷させた者（重過失致死傷罪）も、業務上過失致死傷罪と同様に、5年以下の拘禁刑又は100万円以下の罰金に処せられる。","誤り。刑法第211条前段により、業務上必要な注意を怠り、よって人を死傷させた者は、5年以下の拘禁刑又は100万円以下の罰金に処せられる。","誤り。判例（最高裁昭和33年4月18日判決）は、業務とは、人が社会生活上の地位に基づき反復継続して行う行為であって、他人の生命身体等に危害を加えるおそれのあるものをいい、収入を得る目的であるかどうかは問わないとしている。また、人の生命・身体の危険を防止することを義務内容とする業務も含まれるとされている（最高裁昭和60年10月21日決定）。警備業務の実施中に必要な注意を怠って人を死傷させれば、業務上過失致死傷罪に問われることがある。"],"ref":["刑法第209条","刑法第210条","刑法第211条","最高裁昭和33年4月18日判決","最高裁昭和60年10月21日決定"],"src":[]},
{"id":"KR-030","cat":"hourei","sub":"刑法","kubun":null,"stem":"刑法第36章「窃盗及び強盗の罪」の規定に関する次の記述のうち、正しいものはどれか。","choices":["強盗の罪を犯す目的でその予備をした者は、強盗罪の未遂犯として処罰される。","人を昏酔させてその財物を盗取した者は、暴行又は脅迫を用いていないので、窃盗の罪として処罰される。","自己の財物が他人の財物とみなされるのは、公務所の命令により他人が看守するものである場合に限られる。","窃盗及び強盗の罪については、電気は、財物とみなされる。","配偶者との間で窃盗罪を犯した者は、告訴がなければ公訴を提起することができない。"],"answer":3,"notes":["誤り。強盗の罪を犯す目的で、その予備をした者は、強盗予備罪（刑法第237条）として2年以下の拘禁刑に処せられる。予備は実行の着手前の準備行為であり、実行に着手して遂げなかった未遂（第243条）とは区別される。","誤り。刑法第239条（昏酔強盗）により、人を昏酔させてその財物を盗取した者は、強盗として論じられる。","誤り。刑法第242条により、自己の財物であっても、他人が占有し、又は公務所の命令により他人が看守するものであるときは、窃盗及び強盗の罪については、他人の財物とみなされる。他人が占有している場合も含まれる。","正しい。刑法第245条のとおり。他人の電気を無断で使用する行為も窃盗罪となり得る。詐欺及び恐喝の罪についても、この規定が準用される（第251条）。","誤り。配偶者、直系血族又は同居の親族との間で窃盗罪等を犯した者は、その刑を免除する（刑法第244条第1項）。告訴がなければ公訴を提起することができないのは、これら以外の親族との間で犯した場合である（同条第2項）。この特例は、親族でない共犯には適用されない（同条第3項）。"],"ref":["刑法第237条","刑法第239条","刑法第242条","刑法第244条","刑法第245条","刑法第251条","刑法第243条"],"src":[]},
{"id":"KR-031","cat":"hourei","sub":"刑法","kubun":null,"stem":"刑法の名誉毀損罪及び侮辱罪に関する次の記述のうち、誤っているものはどれか。","choices":["侮辱罪の法定刑は、拘留又は科料のみである。","公然と事実を摘示し、人の名誉を毀損した者は、その事実の有無にかかわらず、処罰の対象となる。","死者の名誉を毀損した者は、虚偽の事実を摘示することによってした場合でなければ、罰せられない。","事実を摘示しなくても、公然と人を侮辱した者は、侮辱罪として処罰される。","名誉毀損罪及び侮辱罪は、告訴がなければ公訴を提起することができない。"],"answer":0,"notes":["誤り。刑法第231条により、侮辱罪の法定刑は、1年以下の拘禁刑若しくは30万円以下の罰金又は拘留若しくは科料である。かつては拘留又は科料のみであったが、令和4年の刑法改正で引き上げられた。","正しい。刑法第230条第1項のとおり。法定刑は3年以下の拘禁刑又は50万円以下の罰金である。ただし、公共の利害に関する事実に係り、その目的が専ら公益を図ることにあった場合に、真実であることの証明があったときは、罰しない（第230条の2）。","正しい。刑法第230条第2項のとおり。","正しい。刑法第231条のとおり。例えば、警備員が、他の客の前で、万引きを疑った客を大声でののしるなどの行為は、侮辱罪や名誉毀損罪に当たるおそれがある。","正しい。刑法第232条第1項のとおり。名誉毀損罪及び侮辱罪は親告罪である。"],"ref":["刑法第230条","刑法第230条の2","刑法第231条","刑法第232条"],"src":[]},
{"id":"KR-032","cat":"hourei","sub":"刑法","kubun":null,"stem":"刑法の放火及び失火の罪に関する次の記述のうち、正しいものはどれか。","choices":["放火して、現に人が住居に使用し又は現に人がいる建造物を焼損した者は、死刑又は無期若しくは3年以上の拘禁刑に処せられる。","現に人が住居に使用せず、かつ、現に人がいない他人の建造物に放火したが、焼損するに至らなかった者は、処罰されない。","火災の際に消火を妨害した者が処罰されるのは、消火用の物を損壊した場合に限られる。","業務上必要な注意を怠ったことによる失火は、通常の失火と同じく、50万円以下の罰金に処せられる。","現住建造物等放火罪を犯す目的で、その予備をした者は、2年以下の拘禁刑に処せられる。"],"answer":4,"notes":["誤り。刑法第108条により、放火して、現に人が住居に使用し又は現に人がいる建造物、汽車、電車、艦船又は鉱坑を焼損した者は、死刑又は無期若しくは5年以上の拘禁刑に処せられる。","誤り。他人の非現住建造物等放火罪（刑法第109条第1項。2年以上の有期拘禁刑）の未遂は罰せられる（第112条）。現住建造物等放火罪（第108条）の未遂も同様である。","誤り。刑法第114条により、火災の際に、消火用の物を隠匿し、若しくは損壊し、又はその他の方法により、消火を妨害した者は、1年以上10年以下の拘禁刑に処せられる。損壊した場合に限られない。","誤り。失火罪（刑法第116条）は50万円以下の罰金であるが、業務上必要な注意を怠ったことによるとき、又は重大な過失によるときは、3年以下の拘禁刑又は150万円以下の罰金に処せられる（第117条の2）。","正しい。刑法第113条本文のとおり。他人の非現住建造物等放火罪（第109条第1項）を犯す目的での予備も同様である。ただし、情状により、その刑を免除することができる（第113条ただし書）。"],"ref":["刑法第108条","刑法第109条","刑法第112条","刑法第113条","刑法第114条","刑法第116条","刑法第117条の2"],"src":[]},
{"id":"KR-033","cat":"hourei","sub":"刑法","kubun":null,"stem":"現行の刑法に定める刑罰に関する次の記述のうち、誤っているものはどれか。","choices":["有期拘禁刑は、1月以上20年以下とされている。","拘禁刑に処せられた者には、改善更生を図るため、必要な作業を行わせ、又は必要な指導を行うことができる。","刑法の主刑は、死刑、懲役、禁錮、罰金、拘留及び科料であり、没収は付加刑である。","罰金を完納することができない者は、1日以上2年以下の期間、労役場に留置される。","前に拘禁刑以上の刑に処せられたことがない者が3年以下の拘禁刑の言渡しを受けたときは、情状により、その刑の全部の執行を猶予することができる。"],"answer":2,"notes":["正しい。刑法第12条第1項のとおり。拘禁刑は無期及び有期とされ、有期拘禁刑を加重する場合は30年にまで上げることができる（第14条第2項）。","正しい。刑法第12条第3項のとおり。","誤り。刑法第9条により、主刑は、死刑、拘禁刑、罰金、拘留及び科料であり、没収を付加刑とする。懲役及び禁錮は、刑法等の一部を改正する法律（令和4年法律第67号）により廃止され、令和7年6月1日から拘禁刑に一本化された。","正しい。刑法第18条第1項のとおり。科料を完納することができない者は、1日以上30日以下の期間、労役場に留置される（同条第2項）。","正しい。刑法第25条第1項第1号のとおり。猶予の期間は、裁判が確定した日から1年以上5年以下である。50万円以下の罰金の言渡しを受けた場合も同様である。"],"ref":["刑法第9条","刑法第12条","刑法第14条","刑法第18条","刑法第25条"],"src":[]},
{"id":"KR-034","cat":"hourei","sub":"刑事訴訟法","kubun":null,"stem":"刑事訴訟法に定める通常逮捕及び緊急逮捕に関する次の記述のうち、正しいものはどれか。","choices":["逮捕状は、検察官又は司法警察員のほか、司法巡査も裁判官に請求することができる。","緊急逮捕をした場合において、裁判官の逮捕状が発せられないときは、直ちに被疑者を釈放しなければならない。","緊急逮捕をすることができるのは、死刑又は無期若しくは長期1年以上の拘禁刑に当たる罪を犯したことを疑うに足りる十分な理由がある場合である。","緊急逮捕をしたときは、逮捕の時から24時間以内に、裁判官の逮捕状を求める手続をすればよい。","逮捕状により被疑者を逮捕する場合において、逮捕状を所持していないときは、急速を要するときであっても、逮捕することはできない。"],"answer":1,"notes":["誤り。刑事訴訟法第199条第2項により、逮捕状は、検察官又は司法警察員（警察官たる司法警察員については、国家公安委員会又は都道府県公安委員会が指定する警部以上の者に限る。）の請求により発せられる。司法巡査は請求することができない。","正しい。刑事訴訟法第210条第1項後段のとおり。なお、通常逮捕・緊急逮捕をすることができるのは検察官、検察事務官又は司法警察職員であり、警備員を含む私人が逮捕状なしに逮捕できるのは現行犯人（準現行犯人を含む。）に限られる（同法第213条）。","誤り。刑事訴訟法第210条第1項により、緊急逮捕の対象は、死刑又は無期若しくは長期3年以上の拘禁刑に当たる罪である。さらに、急速を要し、裁判官の逮捕状を求めることができないことも必要である。","誤り。刑事訴訟法第210条第1項により、緊急逮捕をした場合には、直ちに裁判官の逮捕状を求める手続をしなければならない。","誤り。刑事訴訟法第201条第2項において準用する第73条第3項により、逮捕状を所持しないためこれを示すことができない場合において、急速を要するときは、被疑者に対し被疑事実の要旨及び逮捕状が発せられている旨を告げて逮捕することができる。ただし、逮捕状は、できる限り速やかに示さなければならない。"],"ref":["刑事訴訟法第73条第3項","刑事訴訟法第199条","刑事訴訟法第201条","刑事訴訟法第210条","刑事訴訟法第213条"],"src":[]},
{"id":"KR-035","cat":"hourei","sub":"刑事訴訟法","kubun":null,"stem":"現行犯人が逮捕された後の捜査機関の手続に関する次の記述のうち、誤っているものはどれか。","choices":["現行犯人が逮捕された場合には、逮捕状により被疑者が逮捕された場合に関する規定が準用される。","司法警察員は、逮捕された被疑者を受け取ったときは、直ちに犯罪事実の要旨及び弁護人を選任することができる旨を告げた上、弁解の機会を与えなければならない。","検察官は、司法警察員から送致された被疑者について留置の必要があると思料するときは、被疑者を受け取った時から24時間以内に、裁判官に勾留を請求しなければならない。","司法警察員は、留置の必要があると思料するときは、司法警察員が被疑者を受け取った時から48時間以内に、被疑者を検察官に送致する手続をすればよい。","検察官が勾留を請求するまでの時間の制限は、被疑者が身体を拘束された時から72時間を超えることができない。"],"answer":3,"notes":["正しい。刑事訴訟法第216条のとおり。このため、第203条以下の時間の制限などは、現行犯逮捕の場合にも適用される。","正しい。刑事訴訟法第203条第1項（第216条により準用）のとおり。留置の必要がないと思料するときは、直ちに被疑者を釈放しなければならない。","正しい。刑事訴訟法第205条第1項のとおり。この時間の制限内に公訴を提起したときは、勾留の請求をすることを要しない（同条第3項）。","誤り。刑事訴訟法第203条第1項（第216条により準用）により、48時間の制限は、司法警察員が被疑者を受け取った時からではなく、被疑者が身体を拘束された時から起算する。警備員などの私人が現行犯人を逮捕した場合は、その逮捕によって身体の拘束が始まっているので、司法警察員が受け取った時から48時間以内であっても、この制限を超えることがある。私人が現行犯人を逮捕したときは、直ちに検察官又は司法警察職員に引き渡さなければならない（同法第214条）。","正しい。刑事訴訟法第205条第2項のとおり。時間の制限内に勾留の請求又は公訴の提起をしないときは、直ちに被疑者を釈放しなければならない（同条第4項）。"],"ref":["刑事訴訟法第203条","刑事訴訟法第205条","刑事訴訟法第214条","刑事訴訟法第216条"],"src":[]},
{"id":"KR-036","cat":"hourei","sub":"刑事訴訟法","kubun":null,"stem":"刑事訴訟法に定める告訴及び自首に関する次の記述のうち、正しいものはどれか。","choices":["親告罪について共犯の一人に対してした告訴は、他の共犯に対しても、その効力を生ずる。","被害者が死亡したときは、その配偶者、直系の親族又は兄弟姉妹は、被害者の明示した意思に反する場合であっても、告訴をすることができる。","告訴をすることができる者が数人ある場合において、そのうち一人が告訴期間を経過したときは、他の者も告訴をすることができなくなる。","告訴は代理人によってすることができるが、告訴の取消しは、代理人によってすることができない。","自首は、検察官又は司法警察員に対し、書面によってしなければならない。"],"answer":0,"notes":["正しい。刑事訴訟法第238条第1項のとおり（告訴の不可分）。告訴の取消しについても同様である。","誤り。刑事訴訟法第231条第2項により、被害者が死亡したときは、その配偶者、直系の親族又は兄弟姉妹は、告訴をすることができるが、被害者の明示した意思に反することはできない。","誤り。刑事訴訟法第236条により、告訴をすることができる者が数人ある場合には、一人の期間の徒過は、他の者に対しその効力を及ぼさない。","誤り。刑事訴訟法第240条により、告訴は代理人によりすることができ、告訴の取消しについても同様である。","誤り。刑事訴訟法第245条により、告訴又は告発の方式を定めた第241条が自首について準用されるので、自首は、書面又は口頭で検察官又は司法警察員にすればよく、書面に限られない。罪を犯した者が捜査機関に発覚する前に自首したときは、その刑を減軽することができる（刑法第42条第1項）。"],"ref":["刑事訴訟法第231条","刑事訴訟法第236条","刑事訴訟法第238条","刑事訴訟法第240条","刑事訴訟法第241条","刑事訴訟法第245条","刑法第42条"],"src":[]},
{"id":"KR-037","cat":"hourei","sub":"刑事訴訟法","kubun":null,"stem":"刑事訴訟法に定める照会、領置及び被疑者以外の者の取調べに関する次の記述のうち、誤っているものはどれか。","choices":["捜査については、公務所又は公私の団体に照会して必要な事項の報告を求めることができる。","捜査機関は、所有者、所持者又は保管者が任意に提出した物を、令状によらずに領置することができる。","捜査機関は、犯罪の捜査をするについて必要があるときは、被疑者以外の者の出頭を求め、これを取り調べることができる。","被疑者以外の者の供述を録取した調書について、その者は、署名押印を求められても、これを拒絶することができる。","被疑者以外の者は、捜査機関から出頭を求められたときは、正当な理由がない限り、これを拒むことができない。"],"answer":4,"notes":["正しい。刑事訴訟法第197条第2項のとおり（捜査関係事項照会）。照会の相手方には、民間の会社などの私の団体も含まれる。","正しい。刑事訴訟法第221条により、検察官、検察事務官又は司法警察職員は、被疑者その他の者が遺留した物又は所有者、所持者若しくは保管者が任意に提出した物を領置することができ、令状は必要とされていない。例えば、防犯カメラの映像を記録した媒体を任意に提出する場合がこれに当たる。","正しい。刑事訴訟法第223条第1項のとおり。被疑者以外の者（参考人）に鑑定、通訳又は翻訳を嘱託することもできる。","正しい。刑事訴訟法第223条第2項において準用する第198条第5項ただし書のとおり。調書は、本人に閲覧させ、又は読み聞かせて、誤りがないかどうかを問わなければならない（第198条第4項の準用）。","誤り。刑事訴訟法第223条第2項において準用する第198条第1項ただし書により、被疑者以外の者（参考人）は、出頭を拒み、又は出頭後、何時でも退去することができる。ただし、犯罪の捜査に欠くことのできない知識を有すると明らかに認められる者が出頭又は供述を拒んだ場合には、第1回の公判期日前に限り、検察官は、裁判官にその者の証人尋問を請求することができる（第226条）。"],"ref":["刑事訴訟法第197条第2項","刑事訴訟法第198条","刑事訴訟法第221条","刑事訴訟法第223条","刑事訴訟法第226条"],"src":[]},
{"id":"KR-038","cat":"hourei","sub":"刑事訴訟法","kubun":null,"stem":"刑事訴訟法に定める証人に関する次の記述のうち、正しいものはどれか。","choices":["証人として召喚を受けた者は、捜査機関の取調べに対する参考人と同様に、出頭を拒むことができる。","警備員は、医師や弁護士と同様に、業務上委託を受けたため知り得た事実で他人の秘密に関するものについて、証言を拒むことができる。","何人も、自己が刑事訴追を受け、又は有罪判決を受けるおそれのある証言を拒むことができる。","証人が正当な理由なく宣誓又は証言を拒んだときは、過料に処せられることはあるが、刑罰を科されることはない。","証人に宣誓をさせるかどうかは裁判所の裁量であり、宣誓をさせないで尋問するのが原則である。"],"answer":2,"notes":["誤り。召喚を受けた証人が正当な理由がなく出頭しないときは、10万円以下の過料に処せられることがあるほか（刑事訴訟法第150条）、1年以下の拘禁刑又は30万円以下の罰金に処せられる（第151条）。裁判所は、その証人を勾引することもできる（第152条）。","誤り。業務上の秘密について証言を拒むことができるのは、医師、歯科医師、助産師、看護師、弁護士、弁理士、公証人、宗教の職に在る者又はこれらの職に在った者に限られており（刑事訴訟法第149条）、警備員は含まれていない。","正しい。刑事訴訟法第146条のとおり。自己の配偶者、三親等内の血族若しくは二親等内の姻族などが刑事訴追を受け、又は有罪判決を受けるおそれのある証言も拒むことができる（第147条）。","誤り。証人が正当な理由がなく宣誓又は証言を拒んだときは、10万円以下の過料に処せられることがあるほか（刑事訴訟法第160条）、1年以下の拘禁刑又は30万円以下の罰金に処せられる（第161条）。","誤り。刑事訴訟法第154条により、証人には、法律に特別の定めのある場合を除いて、宣誓をさせなければならない。宣誓の趣旨を理解することができない者は、宣誓をさせないで尋問する（第155条第1項）。"],"ref":["刑事訴訟法第146条","刑事訴訟法第147条","刑事訴訟法第149条","刑事訴訟法第150条〜第152条","刑事訴訟法第154条","刑事訴訟法第155条","刑事訴訟法第160条","刑事訴訟法第161条"],"src":[]},
{"id":"KR-039","cat":"hourei","sub":"警察官職務執行法","kubun":null,"stem":"警察官職務執行法に定める凶器の調査、保護の通知及び避難等の措置に関する次の記述のうち、誤っているものはどれか。","choices":["警察官は、刑事訴訟に関する法律により逮捕されている者については、その身体について凶器を所持しているかどうかを調べることができる。","警察官が、危険な事態に際し、その事物の管理者等に危害防止の措置をとることを命ずることができるのは、天災又は事変の場合に限られる。","警察官は、極端な雑踏等の危険な事態がある場合においては、その場に居合わせた者、その事物の管理者その他関係者に必要な警告を発することができる。","警察官は、警察で保護をした者の氏名、住所、保護の理由、保護及び引渡しの時日並びに引渡先を、毎週簡易裁判所に通知しなければならない。","警察官は、避難等の措置をとったときは、順序を経て所属の公安委員会にこれを報告しなければならない。"],"answer":1,"notes":["正しい。警察官職務執行法第2条第4項のとおり。","誤り。警察官職務執行法第4条第1項は、天災、事変、工作物の損壊、交通事故、危険物の爆発、狂犬、奔馬の類等の出現、極端な雑踏等の危険な事態がある場合において、特に急を要するときは、その場に居合わせた者、その事物の管理者その他関係者に対し、危害防止のため通常必要と認められる措置をとることを命じ、又は自らその措置をとることができると定めており、天災又は事変の場合に限られない。","正しい。警察官職務執行法第4条第1項のとおり。","正しい。警察官職務執行法第3条第5項のとおり。","正しい。警察官職務執行法第4条第2項前段のとおり。この場合、公安委員会は、他の公の機関に対し、その後の処置について必要と認める協力を求めるため適当な措置をとらなければならない（同項後段）。"],"ref":["警察官職務執行法第2条第4項","警察官職務執行法第3条第5項","警察官職務執行法第4条"],"src":[]},
{"id":"KR-040","cat":"hourei","sub":"警察官職務執行法","kubun":null,"stem":"警察官職務執行法第5条から第8条までの規定に関する次の記述のうち、正しいものはどれか。","choices":["警察官が、人の生命、身体又は財産に対し危害が切迫した場合において他人の建物に立ち入るには、その建物の管理者の承諾を得なければならない。","警察官が武器を使用することができるのは、自己又は他人に対する防護のため必要な場合に限られ、犯人の逮捕のために使用することはできない。","警察官は、犯罪がまさに行われようとする場合において、その行為により財産に重大な損害を受けるおそれがあって急を要するときであっても、その行為を制止することはできない。","警察官は、危険な事態に際して他人の土地、建物等に立ち入る場合には、みだりに関係者の正当な業務を妨害してはならない。","警察官は、刑事訴訟に関する法令に基づく職務であっても、警察官職務執行法に規定がないものは遂行することができない。"],"answer":3,"notes":["誤り。警察官職務執行法第6条第1項により、警察官は、同法第4条・第5条に規定する危険な事態が発生し、人の生命、身体又は財産に対し危害が切迫した場合において、その危害を予防し、損害の拡大を防ぎ、又は被害者を救助するため、やむを得ないと認めるときは、合理的に必要と判断される限度において他人の土地、建物又は船車の中に立ち入ることができる。管理者の承諾は要件とされていない。","誤り。警察官職務執行法第7条本文により、警察官は、犯人の逮捕若しくは逃走の防止、自己若しくは他人に対する防護又は公務執行に対する抵抗の抑止のため必要であると認める相当な理由のある場合においては、その事態に応じ合理的に必要と判断される限度において、武器を使用することができる。","誤り。警察官職務執行法第5条により、警察官は、犯罪がまさに行われようとするのを認めたときは、その予防のため関係者に必要な警告を発し、また、その行為により人の生命若しくは身体に危険が及び、又は財産に重大な損害を受けるおそれがあって、急を要する場合においては、その行為を制止することができる。","正しい。警察官職務執行法第6条第3項のとおり。同条第1項の危険時の立入りのほか、同条第2項の多数の客の来集する場所への立入りの場合も同様である。","誤り。警察官職務執行法第8条により、警察官は、同法の規定によるほか、刑事訴訟その他に関する法令及び警察の規則による職権職務を遂行すべきものとされている。"],"ref":["警察官職務執行法第5条","警察官職務執行法第6条","警察官職務執行法第7条","警察官職務執行法第8条"],"src":[]},
{"id":"KR-041","cat":"hourei","sub":"遺失物法","kubun":null,"stem":"遺失物法に定める物件の範囲、費用の負担及び所有権の取得等に関する次の記述のうち、正しいものはどれか。","choices":["運転免許証など個人の身分を証する文書は、遺失者が判明しなくても、拾得者がその所有権を取得することはできない。","他人が置き去った物を発見しただけでは、その物の占有を始めていないので、遺失物法にいう拾得をしたことにはならない。","埋蔵物について、発見者が所有権を取得することとなる公告後の期間は、遺失物の場合と同じく3か月である。","施設において埋蔵物を発見した者は、速やかに、これを当該施設の施設占有者に交付しなければならない。","物件の提出、交付及び保管に要した費用は、物件の返還を受ける遺失者ではなく、拾得者が負担する。"],"answer":0,"notes":["正しい。遺失物法第35条第2号により、個人の身分若しくは地位又は個人の一身に専属する権利を証する文書、図画又は電磁的記録は、所有権を取得することができない物件とされている。個人の秘密に属する事項が記録された文書等（同条第3号）や、遺失者又はその関係者と認められる個人の住所又は連絡先が記録された文書等（同条第4号）も同様である。","誤り。遺失物法第2条第2項により、「拾得」とは物件の占有を始めることをいうが、埋蔵物及び他人の置き去った物にあっては、これを発見することをいう。他人の置き去った物は、準遺失物として「物件」に含まれる（同条第1項）。","誤り。埋蔵物は、遺失物法の定めるところに従い公告をした後6か月以内にその所有者が判明しないときに、これを発見した者がその所有権を取得する（民法第241条本文）。遺失物の場合は3か月である（民法第240条）。他人の所有する物の中から発見された埋蔵物は、発見者とその他人が等しい割合で所有権を取得する（同条ただし書）。","誤り。遺失物法第4条第2項は、施設において拾得をした物件のうち、埋蔵物を除いたものについて施設占有者への交付を義務付けている。埋蔵物は、同条第1項により、遺失者に返還し、又は警察署長に提出する。","誤り。遺失物法第27条第1項により、物件の提出、交付及び保管に要した費用は、物件の返還を受ける遺失者又は物件の所有権を取得してこれを引き取る者の負担とされている。"],"ref":["遺失物法第2条","遺失物法第4条","遺失物法第27条第1項","遺失物法第35条","民法第240条","民法第241条"],"src":[]},
{"id":"KR-042","cat":"hourei","sub":"遺失物法","kubun":null,"stem":"遺失物法に定める施設占有者の義務及び警察署長の措置に関する次の記述のうち、誤っているものはどれか。","choices":["交付を受けた施設占有者は、拾得者の請求があったときは、物件の種類及び特徴、交付を受けた日時等を記載した書面を交付しなければならない。","警察署長は、提出を受けた物件の遺失者を知ることができないときは、物件の種類及び特徴並びに拾得の日時及び場所を公告しなければならない。","警察署長は、拾得者の同意があるときに限り、遺失者の求めに応じ、拾得者の氏名等を告知することができる。","警察署長は、提出を受けた傘や衣類などの政令で定める物件について、公告の日から2週間以内に遺失者が判明しないときは、これを売却することができる。","施設占有者（特例施設占有者を除く。）は、交付を受けた日から2週間以内に警察署長に提出すれば、報労金を請求する権利を失わない。"],"answer":4,"notes":["正しい。遺失物法第14条のとおり。記載事項は、物件の種類及び特徴、物件の交付を受けた日時、施設の名称及び所在地並びに施設占有者の氏名（法人にあっては、その名称及び代表者の氏名）である。","正しい。遺失物法第7条第1項のとおり。公告は警察署の掲示場に掲示して行い、遺失者が判明した場合を除き、公告の日から3か月間（埋蔵物は6か月間）継続しなければならない（同条第2項・第4項）。","正しい。遺失物法第11条第2項のとおり。警察署長は、同意をした拾得者の求めに応じ、遺失者の氏名等を告知することもできる（同条第3項）。","正しい。遺失物法第9条第2項第1号のとおり。物件が滅失し、若しくは毀損するおそれがあるとき又はその保管に過大な費用若しくは手数を要するときも、売却することができる（同条第1項）。","誤り。遺失物法第34条第4号により、交付を受け、又は自ら拾得をした日から1週間以内に警察署長への提出をしなかった施設占有者（特例施設占有者を除く。）は、費用及び報労金を請求する権利並びに所有権を取得する権利を失う。2週間以内に提出しても、1週間を過ぎていればこれらの権利を失う。2週間以内とされているのは、原則として特例施設占有者の場合である（同条第5号）。"],"ref":["遺失物法第7条","遺失物法第9条","遺失物法第11条","遺失物法第14条","遺失物法第34条"],"src":[]},
{"id":"KR-043","cat":"hourei","sub":"軽犯罪法","kubun":null,"stem":"施設警備業務に関係する軽犯罪法第1条の罪に関する次の記述のうち、誤っているものはどれか。","choices":["人が住んでおらず、かつ、看守していない建物の内に、正当な理由がなくてひそんでいた者は、軽犯罪法による処罰の対象となる。","資格がないのに、法令により定められた制服若しくは標章又はこれらに似せて作った物を用いた者は、軽犯罪法による処罰の対象となる。","自己の占有する場所内に死体があることを知りながら速やかに公務員に申し出なかった者が処罰されるのは、変死体の場合に限られる。","虚構の犯罪又は災害の事実を公務員に申し出た者は、軽犯罪法による処罰の対象となる。","正当な理由がなくて変死体又は死胎の現場を変えた者は、軽犯罪法による処罰の対象となる。"],"answer":2,"notes":["正しい。軽犯罪法第1条第1号のとおり。人が看守している建造物に正当な理由なく侵入すれば、刑法第130条の建造物侵入罪となる。","正しい。軽犯罪法第1条第15号のとおり。警備業者及び警備員は、警備業務を行うに当たっては、警察官及び海上保安官の制服と明確に識別することができる服装を用いなければならない（警備業法第16条第1項、警備業法施行規則第27条）。","誤り。軽犯罪法第1条第18号は、自己の占有する場所内に、扶助を必要とする老幼・傷病者等又は人の死体若しくは死胎のあることを知りながら、速やかにこれを公務員に申し出なかった者を処罰の対象としており、変死体の場合に限られない。","正しい。軽犯罪法第1条第16号のとおり。","正しい。軽犯罪法第1条第19号のとおり。変死者又は変死の疑いのある死体があるときは、検察官が検視をしなければならない（刑事訴訟法第229条第1項）。"],"ref":["軽犯罪法第1条第1号・第15号・第16号・第18号・第19号","刑法第130条","警備業法第16条第1項","警備業法施行規則第27条","刑事訴訟法第229条"],"src":[]},
{"id":"KR-044","cat":"hourei","sub":"軽犯罪法","kubun":null,"stem":"雑踏警備業務や交通誘導警備業務に関係する軽犯罪法第1条の罪に関する次の記述のうち、正しいものはどれか。","choices":["正当な理由がなくて他人の標灯を消した者が処罰されるのは、その標灯が道路上に設けられていた場合に限られる。","ラジオなどの音を異常に大きく出して静穏を害し近隣に迷惑をかけた者は、公務員の制止をきかなかった場合に処罰の対象となる。","公共の場所で威勢を示して公衆の列に割り込んだ者が処罰されるのは、乗物の切符を買うために待っている列に割り込んだ場合に限られる。","他人の進路に一人で立ちふさがって立ち退こうとしない者は、身辺に群がったわけではないので、軽犯罪法による処罰の対象とならない。","工事現場に設置された他人の看板をみだりに取り除いた者は、看板を損壊していなければ、軽犯罪法による処罰の対象とならない。"],"answer":1,"notes":["誤り。軽犯罪法第1条第6号は、正当な理由がなくて他人の標灯又は街路その他公衆の通行し、若しくは集合する場所に設けられた灯火を消した者を処罰の対象としており、他人の標灯については、設けられた場所を問わない。","正しい。軽犯罪法第1条第14号は、公務員の制止をきかずに、人声、楽器、ラジオなどの音を異常に大きく出して静穏を害し近隣に迷惑をかけた者を処罰の対象としている。","誤り。軽犯罪法第1条第13号は、威勢を示して、公共の乗物や演劇その他の催しを待ち、又はこれらの乗物や催しの切符を買うため待っている公衆の列に割り込み、又はその列を乱した者を処罰の対象としており、催しの入場を待つ列なども含まれる。同号は、公共の場所において多数の人に対して著しく粗野又は乱暴な言動で迷惑をかけた者も処罰の対象としている。","誤り。軽犯罪法第1条第28号は、他人の進路に立ちふさがって、若しくはその身辺に群がって立ち退こうとせず、又は不安若しくは迷惑を覚えさせるような仕方で他人につきまとった者を処罰の対象としており、一人で進路に立ちふさがった場合も含まれる。","誤り。軽犯罪法第1条第33号は、みだりに他人の家屋その他の工作物にはり札をし、若しくは他人の看板、禁札その他の標示物を取り除き、又はこれらの工作物若しくは標示物を汚した者を処罰の対象としており、看板を取り除いただけでも対象となる。看板を損壊すれば、刑法第261条の器物損壊罪に当たり得る。"],"ref":["軽犯罪法第1条第6号・第13号・第14号・第28号・第33号","刑法第261条"],"src":[]},
{"id":"CS-001","cat":"chishiki","sub":"警察機関への連絡","kubun":null,"stem":"110番通報の要領に関する次の記述のうち、適当でないものはどれか。","choices":["通報の際は、受理した係員の質問に答える形で、落ち着いて話す。","通報ではまず「何があったか」を聞かれるので、事件か事故かなど、起きたことから簡潔に伝える。","公衆電話から110番通報するときは、硬貨又はテレホンカードを入れなければ通報できない。","かけ間違えたときは、黙って電話を切らずに、間違いである旨を伝える。","通報後に警察から連絡が入ることがあるので、携帯電話の電源は切らずにおく。"],"answer":2,"notes":["正しい。110番通報では係員が必要な事項を順に質問するので、それに答える形で落ち着いて話す（警視庁・山梨県警察の案内）。","正しい。各都道府県警察の案内では、最初に「何があったか（事件か事故か）」を尋ね、続いて場所、時間、犯人の特徴、現在の状況などを尋ねる例が示されている。","誤り。公衆電話から110番通報するときは、硬貨やテレホンカードは不要である。緊急通報ボタンのある公衆電話は、受話器を取ってボタンを押してから「110」を押し、ボタンのないものは、受話器を取って発信音を確かめてから「110」を押す（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。","正しい。黙って切ると、事件・事故の可能性があるものとして対応することになるため、間違いであることを伝える（静岡県警察の案内）。","正しい。通報後に警察官から折り返し電話がかかる場合があるため、携帯電話の電源を切らないよう案内されている（中国四国管区警察局四国警察支局・静岡県警察の案内）。"],"ref":[],"src":["https://www.keishicho.metro.tokyo.lg.jp/jiken_jiko/110/110_110.html","https://www.pref.yamanashi.jp/police/p_tiiki/110info/kakekata.html","https://www.pref.shizuoka.jp/police/about/110kinkyu/tadashikuriyo.html","https://www.chugokushikoku.npa.go.jp/shikoku/kou/hotline110.html","https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"CS-002","cat":"chishiki","sub":"警察機関への連絡","kubun":null,"stem":"110番通報と警察相談専用電話（#9110）に関する次の記述のうち、誤っているものはどれか。","choices":["110番は、警察官にすぐ現場へ駆けつけてほしい事件や事故など、緊急の場合に利用する。","緊急の対応を必要としない相談は、#9110又は最寄りの警察署を利用する。","#9110は全国共通の番号で、原則として発信地を管轄する警察本部等の相談窓口につながる。","緊急性のない問合せなどで110番を利用すると、本当に緊急を要する人の通報が遅れるおそれがある。","たった今発生した事件を目撃した場合であっても、自分が被害者でなければ、110番ではなく#9110を利用する。"],"answer":4,"notes":["正しい。110番は緊急時のためのダイヤルであり、警察官にすぐ現場に駆けつけてほしい事件や事故のときに利用する（警視庁の案内）。","正しい。警察庁は、生活の安全に関わる悩みごと・困りごとなど緊急でない相談は、最寄りの警察署又は「#9110」を利用するよう案内している。","正しい。#9110は全国統一の警察相談専用電話で、発信地を管轄する都道府県警察本部の相談窓口につながる（愛知県警察の案内）。なお、都県境などでは隣接する県につながることがある（警視庁の案内）。","正しい。いたずら電話等で110番の回線がふさがると、本当に必要な人が必要な時に通報できず、警察への通報が遅れる（中国四国管区警察局四国警察支局の案内）。","誤り。被害に遭った場合だけでなく、たった今事件や交通事故を目撃した場合も、緊急ダイヤルの110番に通報する（警視庁の案内）。#9110は緊急の対応を必要としない相談のための番号である。"],"ref":[],"src":["https://www.keishicho.metro.tokyo.lg.jp/jiken_jiko/110/110_110.html","https://www.npa.go.jp/goiken_index.html","https://www.pref.aichi.jp/police/soudan/dial/jumin/soudan.html","https://www.chugokushikoku.npa.go.jp/shikoku/kou/hotline110.html","https://www.keishicho.metro.tokyo.lg.jp/sodan/madoguchi/sogo.html"]},
{"id":"CS-003","cat":"chishiki","sub":"警察機関への連絡","kubun":null,"stem":"110番通報で現場の場所や状況を伝える要領として、適当なものはどれか。","choices":["住所が分からないときは、交差点名や目標となる建物、階数など、場所を特定できる手掛かりを伝える。","住所は、町名と番地を伝えれば足り、市区町村名から伝える必要はない。","犯人の逃走方向や逃走手段は、警察官が現場に到着してから伝えれば足りる。","携帯電話で通報するときは、警察官と早く合流できるよう、移動しながら通話する。","けが人の有無は消防に伝える事項であり、110番通報で伝える必要はない。"],"answer":0,"notes":["正しい。場所は、住所のほか、目標となる店舗や建物、階数などで伝える（警視庁・山梨県警察の案内）。パトカーや警察官を向かわせるには、場所の特定が重要である。","誤り。同じ町名が複数の市区町にあることがあり、場所の特定に支障が生じるので、住所は市区町村名から伝える（静岡県警察の案内）。","誤り。犯人の人相・服装などの特徴、逃げた方向、逃走手段、車のナンバーなどは、通報の際にできるだけ詳しく伝える（山梨県警察の案内）。","誤り。携帯電話は電波の状態によって通話が突然切れることがあるので、立ち止まって（車は停止して）通話する。また、現場を離れると事件・事故の場所が分かりにくくなる（静岡県警察、中国四国管区警察局四国警察支局の案内）。","誤り。110番通報では、被害や目撃の状況とともに、けが人の有無も尋ねられる（警視庁・静岡県警察の案内）。"],"ref":[],"src":["https://www.keishicho.metro.tokyo.lg.jp/jiken_jiko/110/110_110.html","https://www.pref.yamanashi.jp/police/p_tiiki/110info/kakekata.html","https://www.pref.shizuoka.jp/police/about/110kinkyu/tadashikuriyo.html","https://www.chugokushikoku.npa.go.jp/shikoku/kou/hotline110.html"]},
{"id":"CS-004","cat":"chishiki","sub":"警察機関への連絡","kubun":null,"stem":"警備員が事故の発生を上司や警察機関に報告・連絡する場合の一般的な要領として、適当でないものはどれか。","choices":["まず何が起きたかという要点を伝え、詳しい経過はその後に補足する。","いつ、どこで、誰が、何を、なぜ、どのように（5W1H）を意識して伝える。","自分で確認した事実と、推測や未確認の情報とを区別して伝える。","第一報は、誤った報告を避けるため、事故の全容と原因が判明してから行う。","報告後に新たな事実が判明したり状況が変化したりしたときは、その都度追加して報告する。"],"answer":3,"notes":["正しい。緊急時の報告は、受け手がすぐに判断し行動できるよう、結論（要点）を先に伝え、経過や理由は後から補足するのが原則である。","正しい。5W1Hを意識すると、報告に必要な事項の漏れを防ぐことができる。","正しい。事実と推測・伝聞が混ざると、受け手が判断を誤るおそれがある。確認がとれていない事項は、未確認であることを明らかにして伝える（消防庁の火災・災害等即報要領も、確認がとれていない事項はその旨を記入して報告すれば足りるとしている）。","誤り。第一報は、全容が判明するのを待たずに、分かっている範囲で速やかに行う。消防庁の火災・災害等即報要領も、第1報は迅速性を最優先とし、分かる範囲で報告するものとしている。","正しい。第一報の後は、判明した事項や状況の変化を逐次報告する（続報）。"],"ref":["火災・災害等即報要領（昭和59年10月15日消防災第267号消防庁長官通知）第1の3(5)","火災・災害等即報要領 第1号様式〜第4号様式（その1）の（注）"],"src":["https://www.fdma.go.jp/laws/tutatsu/items/0157ffda5156f93ad95c768be1f2d329292cbd9e.pdf"]},
{"id":"CS-005","cat":"chishiki","sub":"警察機関への連絡","kubun":null,"stem":"無線機を使用して連絡する場合の要領として、適当なものはどれか。","choices":["必要のない無線通信であっても、他の通信の妨げにならなければ行ってよい。","送信するときは、自局の呼出名称などを付けて、誰が送信しているのかを明らかにする。","無線通信に使用する用語は、誤解を避けるため、できる限り詳しく丁寧なものとする。","通信上の誤りに気付いたときは、混乱を避けるため、その通信が終わってからまとめて訂正する。","地名や車両番号などを送るときは、送信時間を短くするため、相手に復唱を求めない。"],"answer":1,"notes":["誤り。必要のない無線通信は、これを行ってはならない（無線局運用規則第10条第1項）。不要な通信は、緊急の連絡の妨げになる。","正しい。無線通信を行うときは、自局の識別信号（呼出符号、呼出名称など）を付して、その出所を明らかにしなければならない（無線局運用規則第10条第3項）。","誤り。無線通信に使用する用語は、できる限り簡潔でなければならない（無線局運用規則第10条第2項）。","誤り。無線通信は正確に行うものとし、通信上の誤りを知ったときは、直ちに訂正しなければならない（無線局運用規則第10条第4項）。","誤り。無線通信は正確に行わなければならない（無線局運用規則第10条第4項）。聞き違えやすい地名や数字などの重要な事項は、相手に復唱させるなどして、正しく伝わったことを確かめる。"],"ref":["無線局運用規則第10条"],"src":["https://laws.e-gov.go.jp/law/325M50080000017"]},
{"id":"CS-006","cat":"chishiki","sub":"警察機関への連絡","kubun":null,"stem":"警察機関への連絡その他応急の措置に関する警備業法令及び解釈運用基準の内容として、誤っているものはどれか。","choices":["警備業法施行規則が定める基本教育では、「事故の発生時における警察機関への連絡その他応急の措置に関すること」は、新任の警備員と現任の警備員のいずれの教育事項にも含まれている。","解釈運用基準では、警備業務対象施設内で、適当な保護者を伴わず、応急の救護を要すると信ずるに足る相当な理由のある者を発見して警察に通報する行為は、「警戒し、防止する」業務に含まれるとされている。","解釈運用基準では、基本教育の教育事項中の「応急の措置」とは、警察機関への連絡のほか、負傷者に対する応急手当、避難誘導等をいうとされている。","解釈運用基準では、機械警備業者の即応体制の整備（警備業法第43条）にいう「その他の必要な措置」とは、警察機関への連絡、基地局への連絡、現場保存等をいうとされている。","基本教育のうち「事故の発生時における警察機関への連絡その他応急の措置に関すること」についての教育は、講義の方法のみによって行うものとされている。"],"answer":4,"notes":["正しい。新たに警備業務に従事させようとする警備員（表の一の項ニ）と、現に警備業務に従事させている警備員（表の二の項ハ）の双方の教育事項とされている（警備業法施行規則第38条第2項の表）。","正しい。異常な挙動その他の周囲の事情から合理的に判断して、適当な保護者を伴わず、応急の救護を要すると信ずるに足る相当な理由のある者を発見して警察に通報する行為は、「警戒し、防止する」業務に含まれる（解釈運用基準 第2の1(5)）。","正しい。「応急の措置」とは、警察機関への連絡のほか、負傷者に対する応急手当、避難誘導等をいう（解釈運用基準 第20の2(4)）。","正しい。警備業法第43条の「その他の必要な措置」とは、警察機関への連絡、基地局への連絡、現場保存等をいう（解釈運用基準 第29の1）。","誤り。この教育事項（表の一の項ニ及び二の項ハ）についての教育は、講義の方法及び実技訓練の方法によるものとされている（警備業法施行規則第38条第2項の表の備考二）。"],"ref":["警備業法施行規則第38条第2項の表及び備考二","解釈運用基準 第2の1(5)","解釈運用基準 第20の2(4)","解釈運用基準 第29の1","警備業法第43条"],"src":[]},
{"id":"CS-007","cat":"chishiki","sub":"現場保存","kubun":null,"stem":"事件の現場保存に関する次の記述のうち、適当なものはどれか。","choices":["侵入の跡を見つけたときは、犯人が残っていないか確かめるため、一人で現場の奥まで入って捜す。","現場保存は、指紋や足跡、遺留品などの痕跡を事件発生時の状態のまま警察に引き継ぎ、捜査に役立てるために行う。","荒らされた室内の物は、被害状況を確認しやすくするため、警察官の到着前に元の位置に戻しておく。","被害品を確認するためであれば、警備員が現場に入り、物色された引き出しなどを手で開けて調べてよい。","現場保存は警察官が行うものであるから、警備員は警察官が到着するまで現場保存の措置をとる必要はない。"],"answer":1,"notes":["誤り。犯人が潜んでいるおそれがあって危険であるうえ、現場の痕跡を損なうおそれもある。不用意に近づかず、応援を求めるとともに110番通報し、現場の外から状況を見守る（滋賀県の防犯の案内も、不審な物音を聞いた場合は不用意に近づかないとしている）。","正しい。現場保存は、犯人の指紋や足跡などを採取できるよう、現場をそのままにしておくことである（滋賀県の防犯の案内）。警察も、できる限り現場を犯罪の行われた際の状況のまま保存するよう努めることとされている（犯罪捜査規範第86条第1項）。","誤り。物を動かしたり元に戻したりすると、指紋などの痕跡が失われ、犯行の状況も分からなくなる。現場の物には触れず、動かさない。","誤り。被害の確認のために現場に入ったり物に触れたりすると、痕跡を損なう。被害の確認は、警察官の到着を待ってその指示に従う。","誤り。警察官が到着するまでの間、警備員は現場保存などの措置をとる。解釈運用基準も、機械警備業務の即応体制にいう「その他の必要な措置」には現場保存等が含まれるとしている（解釈運用基準 第29の1）。"],"ref":["犯罪捜査規範第86条第1項","解釈運用基準 第29の1"],"src":["https://www.pref.shiga.lg.jp/ippan/kurashi/bouhankoutsu/11523.html","https://laws.e-gov.go.jp/law/332M50400000002"]},
{"id":"CS-008","cat":"chishiki","sub":"現場保存","kubun":null,"stem":"警備員が行う現場保存の範囲と立入りの制限に関する次の記述のうち、適当なものはどれか。","choices":["保存の範囲は、立入りを制限される人の負担を考え、犯行が行われた地点だけに限って最小限とする。","保存の範囲を定めた後も、施設の従業員であれば、警察官の到着前に自由に出入りさせてよい。","現場保存のためであれば、警備員は警察官と同様の権限に基づき、立ち入ろうとする者を強制的に排除できる。","警備員自身も、負傷者の救護などやむを得ない場合を除き、保存した範囲にみだりに立ち入らない。","保存の範囲の外で遺留品と思われる物を見つけたときは、範囲外であるから片付けてよい。"],"answer":3,"notes":["誤り。犯人の侵入・逃走の経路などにも痕跡が残るので、保存の範囲は犯行が行われた地点だけでなく広めに定める。警察も、犯罪の行われた地点だけでなく広く現場保存の範囲を定めることとされている（犯罪捜査規範第87条）。範囲は後から狭めることができても、失われた痕跡は戻らない。","誤り。保存の範囲を定めたら、ロープを張るなどしてその範囲を表示し、みだりに出入りする者がないようにする（犯罪捜査規範第88条第1項参照）。施設の従業員であっても同様である。","誤り。警備業務は特別な権限に基づくものではなく、私人の管理権等の範囲内で行われる（警備業法第15条、解釈運用基準 第14の1）。立入りの制限は、施設の管理権の範囲内で行い、又は周囲の人に協力を求めて行う。","正しい。警察官であっても、負傷者の救護、証拠物件の変質・散逸の予防等特にやむを得ない事情のある場合を除き、みだりに現場に入ってはならないとされている（犯罪捜査規範第86条第2項）。警備員も、保存した範囲にむやみに立ち入らない。","誤り。保存の範囲外であっても、事件に関係すると思われる物には触れず、そのままにしておく。必要に応じて保存の範囲を広げ、警察官に伝える。"],"ref":["犯罪捜査規範第86条第2項","犯罪捜査規範第87条","犯罪捜査規範第88条第1項","警備業法第15条","解釈運用基準 第14の1"],"src":["https://laws.e-gov.go.jp/law/332M50400000002"]},
{"id":"CS-009","cat":"chishiki","sub":"現場保存","kubun":null,"stem":"現場に負傷者がいる場合の措置として、適当なものはどれか。","choices":["負傷者の救護のためにやむを得ず現場の物を動かしたときは、元の位置や状態を写真やメモで記録し、警察官に伝える。","警察官が到着するまでは、現場保存を優先し、負傷者の救護は控える。","救護のために現場に立ち入ったことは、現場の物を動かしていなければ、警察官に伝える必要はない。","ガス漏れなど二次災害の危険があっても、現場保存のため、危険を除く措置はとらずに警察官の到着を待つ。","意識のある負傷者から犯人の特徴などを聞けた場合でも、その内容は記録せず、警察官の事情聴取に任せる。"],"answer":0,"notes":["正しい。負傷者の救護その他やむを得ない理由で現場を変更したときは、写真、見取図、記録その他の方法により原状を明らかにしておく（犯罪捜査規範第89条参照）。動かした物と元の状態を、到着した警察官に伝える。","誤り。人命の救護は現場保存に優先する。負傷者に対する応急手当は「応急の措置」の一つである（解釈運用基準 第20の2(4)）。警察官であっても、負傷者の救護のためであれば現場に入ることができるとされている（犯罪捜査規範第86条第2項）。","誤り。救護に当たった者が現場に立ち入ると、足跡や指紋が残ることがある。誰がどこに立ち入ったかを警察官に伝え、犯人の痕跡と区別できるようにする。","誤り。二次災害を防ぐ措置は、人の生命・身体を守るため、現場保存より優先する。やむを得ず現場を変えたときは、その状況を記録して警察官に伝える。","誤り。負傷者から聞けた犯人の特徴などは、後で聞けなくなることもあるので、記録して警察官に伝える。警察も、ひん死の重傷者からは犯人の氏名、目撃者等を聴取しておくこととされている（犯罪捜査規範第85条第2項）。"],"ref":["犯罪捜査規範第85条第2項","犯罪捜査規範第86条第2項","犯罪捜査規範第89条","解釈運用基準 第20の2(4)"],"src":["https://laws.e-gov.go.jp/law/332M50400000002"]},
{"id":"CS-010","cat":"chishiki","sub":"現場保存","kubun":null,"stem":"現場保存における遺留品、痕跡及び目撃者の取扱いとして、適当でないものはどれか。","choices":["犯人の遺留品と思われる物には素手で触れず、その場から動かさない。","目撃者がいるときは、警察官が到着するまでとどまるよう協力を求め、難しいときは氏名と連絡先を聞いておく。","屋外の足跡が雨で消えるおそれがあっても、現場の状態を変えないよう、覆いなどの措置はとらない。","現場を発見した時刻や、その時の状況をメモしておく。","目撃者から聞いた話は、自分が直接見た事実と区別して記録する。"],"answer":2,"notes":["正しい。遺留品には犯人の指紋などが残っていることがあるので、素手で触れたり動かしたりしない。","正しい。目撃者の協力は事件の解明に欠かせない。警察も、現場又はその付近に居合わせた者の氏名、住居等を明確にしておくこととされている（犯罪捜査規範第88条第1項）。ただし、警備員には特別な権限がないので（警備業法第15条）、強制的に引き止めることはできない。","誤り。雨や日光などにより変質、変形又は消失するおそれのある痕跡は、踏まないよう注意しながら、シートや容器で覆うなどして原状を保存する（犯罪捜査規範第88条第2項参照）。","正しい。発見の時刻や状況、とった措置とその時刻などを記録しておくと、警察官への正確な報告に役立つ。","正しい。自分が直接見た事実と、他人から聞いた話（伝聞）や推測を区別しておくと、警察官が事実を正確に把握できる。"],"ref":["犯罪捜査規範第88条","警備業法第15条"],"src":["https://laws.e-gov.go.jp/law/332M50400000002"]},
{"id":"CS-011","cat":"chishiki","sub":"現場保存","kubun":null,"stem":"警察官が現場に到着したときの警備員の対応として、適当でないものはどれか。","choices":["発見時の状況と、警備員がとった措置を報告する。","警察官への説明を終えた後も、発見時の状況など事件の具体的な内容は、捜査に当たる警察官以外の者にむやみに話さない。","保存した範囲に出入りした者がいれば、その者と出入りした場所を伝える。","現場の位置や保存した範囲を案内し、説明する。","警察官が到着した後も、現場保存の範囲や方法は警備員の判断を優先して決める。"],"answer":4,"notes":["正しい。発見時の状況や警備員がとった措置は、時刻も含めて正確に伝える。機械警備業務でも、基地局の備付書類に、講じた措置（警察機関への連絡等）とその時刻、警察官への引継ぎの状況などを記載するよう指導することとされている（警備業法施行規則第64条第1項第5号、解釈運用基準 第30の4）。","正しい。第一発見者である場合などは、捜査機関以外の者に事件の具体的な内容を話すことを避け、言動を慎む（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。上司や依頼者への報告は、定められた手順に従って行う。","正しい。出入りした者の足跡や指紋を犯人のものと区別するために必要な情報である（犯罪捜査規範第88条第1項参照）。","正しい。警察官を現場に案内し、保存した範囲や状況を説明して、確実に引き継ぐ。","誤り。警察官が到着した後は、現場保存を警察官に引き継ぎ、その指示に従って行動する。警備員は特別な権限を与えられているものではない（警備業法第15条）。"],"ref":["犯罪捜査規範第88条第1項","警備業法施行規則第64条第1項第5号","解釈運用基準 第30の4","警備業法第15条"],"src":["https://laws.e-gov.go.jp/law/332M50400000002","https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"CS-012","cat":"chishiki","sub":"避難誘導","kubun":null,"stem":"建物で火災が発生した場合の避難誘導に関する次の記述のうち、適当でないものはどれか。","choices":["避難には安全な階段を使用させ、エレベーターは使用させない。","メガホンや携帯拡声器を活用し、身振り手振りを交えて誘導する。","一度避難した者を、再び建物内に戻らせない。","避難誘導する際は、出火した階から最も離れた階を優先する。","誘導員が避難するときは、逃げ遅れた者がいないことを確認する。"],"answer":3,"notes":["正しい。エレベーターは停電などで停止し、閉じ込められるおそれがあるので、避難には使用しない（東京消防庁の資料）。","正しい。避難する人は係員の声や身振りを頼りにしているので、メガホンや拡声器を使い、身振り手振りを交えて誘導する（東京消防庁の資料）。","正しい。一度避難した者を、再び建物内に戻らせない（東京消防庁の資料）。持ち物などを取りに戻ると、火災に巻き込まれるおそれがある。","誤り。煙や火は上の階へ広がりやすいので、火災発生階とその直上階を優先して避難誘導する（東京消防庁の資料）。","正しい。誘導員が避難するときは、逃げ遅れた者がいないことを確認し、最後の者は防火戸を閉めて避難する（東京消防庁の資料）。"],"ref":[],"src":["https://www.tfd.metro.tokyo.lg.jp/content/000028748.pdf","https://www.tfd.metro.tokyo.lg.jp/learning/contents/jiei/chapter/step-38.html","https://www.tfd.metro.tokyo.lg.jp/learning/contents/evacuation/contents04_1.html"]},
{"id":"CS-013","cat":"chishiki","sub":"避難誘導","kubun":null,"stem":"火災時の煙からの避難に関する次の記述のうち、適当なものはどれか。","choices":["ハンカチやタオルなどで口と鼻を覆い、低い姿勢で煙の下を避難する。","火災の煙で廊下にも出られないときは、外の様子が分かるよう部屋の出入口の戸を開けたままにして、消防隊の救助を待つ。","煙は横方向よりも縦方向にゆっくり広がるので、階段では煙に追いつかれにくい。","煙の中は早く通り抜けた方がよいので、走って避難する。","火災の煙は視界を悪くするが、吸い込んでも中毒になるおそれはない。"],"answer":0,"notes":["正しい。煙を吸い込まないよう口と鼻を覆い、比較的見通しのきく床に近い低い所を、低い姿勢で避難する。階段でも同じである（東京消防庁の資料）。","誤り。火煙により廊下にも出られない場合は、出入口の戸を確実に閉めて煙の流入を防ぎ、懐中電灯や手を振るなどの合図で居場所を知らせながら、消防隊の救助を待つ（東京消防庁の資料）。","誤り。煙が縦方向（上方）へ広がる速さは横方向よりはるかに速く、大人が歩く速さの3〜4倍とされる（東京消防庁の資料）。上の階へは煙がすぐに広がるので、早めに避難する。","誤り。煙の中から避難するときは、走らずにできるだけ姿勢を低くし、ハンカチなどで口や鼻を押さえて煙を吸わないようにする（東京消防庁の資料）。","誤り。火災の煙には、一酸化炭素等による中毒や、熱せられた煙を吸い込むことによる呼吸困難などの危険がある（東京消防庁の資料）。"],"ref":[],"src":["https://www.tfd.metro.tokyo.lg.jp/learning/contents/evacuation/contents03_2.html","https://www.tfd.metro.tokyo.lg.jp/learning/contents/evacuation/evacuation_question02c.html","https://www.tfd.metro.tokyo.lg.jp/content/000028748.pdf"]},
{"id":"CS-014","cat":"chishiki","sub":"避難誘導","kubun":null,"stem":"避難誘導の際の指示や情報の伝え方に関する次の記述のうち、適当でないものはどれか。","choices":["緊急時は複雑なことは伝えず、あいまいな言い方を避けて、簡潔な表現で指示する。","放送や呼びかけでは、誰が伝えているのかを明らかにし、落ち着いた口調で繰り返し伝える。","誘導員は、避難者と接触しないよう、避難者からは見えにくい物陰に立って誘導する。","詳しい説明に時間をかけるよりも、まず安全な場所への迅速な避難を優先する。","地震の際に建物の安全性に関する情報を伝えることは、パニックの防止に有効とされる。"],"answer":2,"notes":["正しい。緊急時は簡易な表現を使い、複雑なことは伝えず、あやふやな言い方をしない（消防庁「外国人来訪者や障害者等が利用する施設における災害情報の伝達及び避難誘導に関するガイドライン」の手引き）。","正しい。放送は、簡潔で分かりやすい内容とし、明確に落ち着いた口調で繰り返す。また、誰が放送しているのか（例「こちらは防災センターです」）を明確にする（東京消防庁の資料）。","誤り。誘導員の立ち位置は、避難する者からよく見える位置で、避難する者と接触するおそれや避難の妨げになるおそれのない位置を選ぶ（消防庁の同手引き）。","正しい。詳しい説明など時間を要する対応は、緊急時（発災直後）は必要以上に行わず、安全な場所への迅速な避難を優先する（消防庁の同手引き）。","正しい。地震時の対応では、建物の安全性に関する情報を伝えることがパニック防止に有効とされている（消防庁の同手引き）。"],"ref":[],"src":["https://www.fdma.go.jp/mission/prevention/items/guideline04.pdf","https://www.tfd.metro.tokyo.lg.jp/content/000028748.pdf"]},
{"id":"CS-015","cat":"chishiki","sub":"避難誘導","kubun":null,"stem":"高齢者や障害者などの要配慮者の避難誘導に関する次の記述のうち、適当なものはどれか。","choices":["視覚障害のある人を誘導するときは、誘導者が本人の手を引いて先導する。","聴覚障害のある人には、正面に立って口元が見えるように話し、伝わりにくいときは身振りや筆談なども用いる。","車いす使用者を誘導するときは、急いで避難させるため、声をかけずにすぐ車いすを押して動き出す。","同伴者がいる場合は、本人ではなく同伴者に、必要な支援の内容を確認する。","災害対策基本法上の要配慮者とは障害者をいい、高齢者や乳幼児は含まれない。"],"answer":1,"notes":["誤り。手を引っ張っての誘導は、進む方向に混乱を与え、不安を与えるので行わない。誘導者は本人の斜め手前（横半歩前）に立ち、肘か肩をつかんでもらって、本人のペースに合わせて歩く（消防庁「外国人来訪者や障害者等が利用する施設における災害情報の伝達及び避難誘導に関するガイドライン」の手引き）。","正しい。表情や口元、身振りがよく見えるよう正面に立ち、口をはっきり開けて話す。繰り返しても伝わらないときは、筆談などで伝える（消防庁の同手引き）。","誤り。車いすを動かす前には「動きます」などと声をかけ、止まるときや曲がるときにも声をかける。また、移動の前に、避難のルートを簡潔に説明する（消防庁の同手引き）。","誤り。同伴者がいる場合でも、本人の人格を尊重し、本人にコミュニケーションの方法や希望するサポートの方法などを確認する（消防庁の同手引き）。","誤り。要配慮者とは、高齢者、障害者、乳幼児その他の特に配慮を要する者をいう（災害対策基本法第8条第2項第17号）。"],"ref":["災害対策基本法第8条第2項第17号"],"src":["https://www.fdma.go.jp/mission/prevention/items/guideline04.pdf","https://laws.e-gov.go.jp/law/336AC0000000223"]},
{"id":"CS-016","cat":"chishiki","sub":"避難誘導","kubun":null,"stem":"施設内で大きな地震が発生した場合の利用者への対応として、適当なものはどれか。","choices":["揺れている間に、利用者を直ちに屋外へ避難させる。","揺れが収まった後、エレベーターが動いていれば、エレベーターを使って避難させる。","停電で暗くなったときは、非常照明がつくのを待たずに、手探りで出口へ向かうよう呼びかける。","揺れている間は、頭を保護し、倒れやすい物や窓ガラスから離れて身の安全を確保するよう呼びかける。","揺れが収まったら、係員の指示を待たずに、各自で一斉に最寄りの出口へ急ぐよう呼びかける。"],"answer":3,"notes":["誤り。揺れている間に慌てて外へ飛び出すと、瓦、窓ガラス、看板などの落下物や転倒でけがをするおそれがある。まず身の安全を確保し、揺れが収まってから周囲の状況を確かめて行動する（消防庁・東京消防庁の資料）。","誤り。エレベーターが動いていたとしても、エレベーターによる避難はしない（消防庁「地震防災マニュアル」）。停電などで停止し、閉じ込められるおそれがある。","誤り。停電になっても、非常照明がつくまでむやみに動かないようにし、慌てずに係員の指示に従う（消防庁「地震防災マニュアル」）。","正しい。揺れを感じたら、まず身の安全を確保する。頭を保護し、ショーケースなど倒れやすい物や窓際から離れる（消防庁「地震防災マニュアル」、東京消防庁「地震 その時10のポイント」）。","誤り。出口や階段に人が殺到すると、転倒などの事故につながる。慌てて出口に殺到せず、係員の指示に従って避難するよう呼びかける（消防庁「地震防災マニュアル」）。"],"ref":[],"src":["https://www.fdma.go.jp/relocation/bousai_manual/occ/occurrence130.html","https://www.fdma.go.jp/relocation/bousai_manual/occ/occurrence140.html","https://www.fdma.go.jp/relocation/bousai_manual/occ/occurrence150.html","https://www.fdma.go.jp/relocation/bousai_manual/occ/occurrence160.html","https://www.tfd.metro.tokyo.lg.jp/lfe/bou_topic/jisin/point10.html","https://www.fdma.go.jp/publication/database/jishin2jishin/post17.html"]},
{"id":"CS-017","cat":"chishiki","sub":"警察機関への連絡","kubun":null,"stem":"目撃した犯人や逃走車両の特徴を警察に伝える要領として、適当でないものはどれか。","choices":["服装は犯人が着替えるおそれがあるので、通報では体の特徴だけを伝えれば足りる。","体の特徴として、身長、体格、年齢、髪形、ひげの有無などを伝える。","言葉遣いやなまり、持っていた物なども、人物の特徴として伝える。","車両のナンバーは、数字だけでなく、地名、ひらがな及びナンバープレートの色も伝える。","車両の車種、色、形のほか、へこみやステッカーなど、その車両の目印となる特徴も伝える。"],"answer":0,"notes":["誤り。服装は、付近にいる犯人を見つけ出すための重要な手掛かりであり、110番通報で尋ねられる犯人の特徴にも含まれている（警視庁の案内は、犯人の特徴として性別、人数、年齢、服装、逃げた方向などを挙げている）。着衣の種類と色、帽子の有無なども伝える（山梨県警察の案内）。","正しい。体の特徴として、身長、体格、年齢、髪形（長さ・色）、ひげの有無などを覚えて伝える（山梨県警察の案内）。","正しい。言葉遣い（なまり、使用言語）や所持品も、人物を特定する手掛かりとなる特徴である（山梨県警察の案内）。","正しい。ナンバーは、地名、ひらがな、数字及びナンバープレートの色を覚えて伝える（山梨県警察の案内）。数字だけでなく各部分が分かると、車両を絞り込みやすい。","正しい。車種、色、形のほか、バンパーの破損やシールが貼られていることなど、その車両の目印となる特徴も伝える（山梨県警察の案内）。"],"ref":[],"src":["https://www.pref.yamanashi.jp/police/p_sousa1/fusinnanber.html","https://www.keishicho.metro.tokyo.lg.jp/jiken_jiko/110/110_110.html"]},
{"id":"CS-018","cat":"chishiki","sub":"警察機関への連絡","kubun":null,"stem":"携帯電話からの110番通報における位置情報の通知に関する次の記述のうち、正しいものはどれか。","choices":["携帯電話から110番通報をしたときは、通報者が通話の中で同意した場合に限り、位置情報が警察に通知される。","GPS機能を搭載した携帯電話であれば、地下街や建物の中から通報しても、正確な位置が警察に通知される。","県境の付近から携帯電話で110番通報をしても、隣の県の警察につながることはない。","電話番号の前に「184」を付けて110番通報をしたときも、位置情報は通常どおり警察に通知される。","GPS機能のない携帯電話から通報したときも、基地局の情報などから算出したおおよその位置が通知される。"],"answer":4,"notes":["誤り。携帯電話等から110番通報をすると、音声通報と同時に位置情報が警察に通知される（神奈川県警察・茨城県警察の案内）。通報者が通話の中で同意することは条件とされていない。","誤り。GPS機能を搭載した携帯電話でも、見通しのよい場所で数十メートルの誤差が生じることがあり、高層ビル内、室内、地下街などでは基地局に基づく算出が中心となって、数百メートル以上の誤差が生じることがある（神奈川県警察の案内）。位置情報が通知される場合でも、所在地や目標物を口頭で伝える。","誤り。携帯電話はどこからでもかけられるが、県境では、通報者の意図と異なり、隣の県につながるおそれがあるので、現在地をできるだけ正確に告げる（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。茨城県警察も、県境などで携帯電話から通報した場合は隣接する他県の警察本部に接続されることがあり、その場合は茨城県警察本部に転送されると案内している。","誤り。「184」を付けて通報すると、発信番号を非通知にする場合と同様に、位置情報も原則として通知されない。ただし、人の生命、身体等に危険が切迫しており、通報内容から直ちに位置が分からないと判断される場合には、警察が位置情報を取得することがある（神奈川県警察の案内）。","正しい。GPS機能のない携帯電話は、基地局に基づいて位置情報が算出されるため、数百メートル以上の誤差が生じることがある（神奈川県警察の案内）。通知される位置はおおよそのものであるから、所在地、交差点名、目標物などを口頭で伝える。"],"ref":[],"src":["https://www.police.pref.kanagawa.jp/kurashi/110ban_riyo/mesg2011.html","https://www.pref.ibaraki.jp/kenkei/a01_safety/security/110location.html","https://www.pref.ibaraki.jp/kenkei/a01_safety/security/110.html","https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"CS-019","cat":"chishiki","sub":"警察機関への連絡","kubun":null,"stem":"無線機を使用して報告する場合の要領として、適当なものはどれか。","choices":["報告を急ぐときは、ほかの通信が行われているかどうかを確かめずに、すぐに送信を始める。","数字を一字ずつ送るときは、「数字のひと」「数字のまる」のように、通話表を用いて送る。","相手を呼び出すときは、まず自分の呼出名称を送り、続けて相手の呼出名称を送る。","自分あての呼出しかどうか確かでないときも、応答が遅れないよう、直ちに応答する。","自分の呼出しがほかの通信の妨げになっていると知らされても、急ぎの報告であれば呼出しを続ける。"],"answer":1,"notes":["誤り。相手局を呼び出そうとするときは、原則として、電波を発射する前に受信機で聴守し、他の通信に混信を与えないことを確かめなければならず、混信を与えるおそれがあるときは、その通信が終了した後でなければ呼出しをしてはならない（無線局運用規則第19条の2。無線電話通信にも準用される（同規則第18条第1項））。","正しい。語辞を一字ずつ区切って送信する場合は、なるべく通話表を使用するものとされており（無線局運用規則第14条第4項）、通話表では「1」は「数字のひと」、「0」は「数字のまる」と送る（同規則別表第5号）。聞き違えやすい数字を正確に伝えることができる。","誤り。呼出しは、相手局の呼出符号（呼出名称）、「こちらは」、自局の呼出符号（呼出名称）の順に送信して行う（無線局運用規則第18条第1項、第20条第1項、別表第4号）。","誤り。自局に対する呼出しであることが確実でない呼出しを受信したときは、その呼出しが反覆され、かつ、自局に対する呼出しであることが確実に判明するまで応答してはならない（無線局運用規則第26条第1項）。","誤り。自局の呼出しが他の既に行われている通信に混信を与える旨の通知を受けたときは、直ちにその呼出しを中止しなければならない（無線局運用規則第22条第1項）。"],"ref":["無線局運用規則第14条第4項","無線局運用規則第18条第1項","無線局運用規則第19条の2","無線局運用規則第20条第1項","無線局運用規則第22条第1項","無線局運用規則第26条第1項","無線局運用規則別表第4号・別表第5号"],"src":["https://laws.e-gov.go.jp/law/325M50080000017"]},
{"id":"CS-020","cat":"chishiki","sub":"警察機関への連絡","kubun":null,"stem":"110番映像通報システム及び110番アプリシステムに関する次の記述のうち、誤っているものはどれか。","choices":["110番映像通報システムは、警察が映像の必要があると判断した場合に、通報者の同意を得て、スマートフォン等に専用のURLを送る仕組みである。","110番映像通報システムでは、その場で撮影した映像のほか、あらかじめ撮影してあった映像等も送ることができる。","110番アプリシステムは、聴覚の障害などにより音声での通報が困難な人が、文字や画像で通報するための仕組みである。","110番映像通報システムで映像を求められたときは、犯人の姿を確実に映すため、犯人のいる場所にできるだけ近づいて撮影する。","110番アプリシステムを利用するには、事前の登録が必要である。"],"answer":3,"notes":["正しい。110番通報を受けた警察職員が映像を取得する必要があると判断した場合に、通報者の同意を得て、SMS（ショートメッセージサービス）で専用URLを送信し、通報者はそのURLにアクセスして利用する（警察庁の案内）。","正しい。その場で撮影した映像に加え、あらかじめ撮影してあった映像等も送信できる（警察庁の案内）。なお、利用は通報者の任意の協力によるもので、送信にかかる費用は通報者の負担である。","正しい。聴覚障害などにより音声による110番通報が困難な人のためのシステムで、文字のチャット形式で通報でき、位置情報の通知や写真の送信もできる。音声で通報できる人は、通常どおり音声で110番通報する（警察庁の案内）。","誤り。110番映像通報システムの利用に当たっては、自身の安全の確保を最優先に行動することとされている（警察庁の案内）。犯人に近づいて撮影すると、通報者自身が危害を受けるおそれがある。","正しい。110番アプリシステムの利用には事前登録が必要であり、氏名、電話番号などを登録して利用する（警察庁の案内）。"],"ref":[],"src":["https://www.npa.go.jp/bureau/safetylife/110/app/index-2.html","https://www.npa.go.jp/bureau/safetylife/110/app/index.html"]},
{"id":"CS-021","cat":"chishiki","sub":"警察機関への連絡","kubun":null,"stem":"警察機関への連絡に備えて平素から行っておくこととして、適当でないものはどれか。","choices":["勤務する施設の所在地のほか、近くの目標となる建物や交差点名などを確かめておく。","災害などで110番がつながらない場合に備え、近くの警察署や交番の所在地を確かめておく。","通報の要領は、実際に事件が起きたときに、上司の指示を受けながら覚えればよい。","施設に設置された非常通報装置などの位置と、その使い方を確かめておく。","警察署、消防署、依頼者、自社などの連絡先を一覧にし、すぐに確かめられる所に備えておく。"],"answer":2,"notes":["正しい。110番通報では、場所（住所、近くの店舗や建物、階数など）を尋ねられる（警視庁の案内）。勤務する施設の所在地や周辺の目標物は、平素から確かめておく。","正しい。災害、停電、携帯電話回線の障害などで110番通報ができない場合に備え、自宅や勤務先の近くの警察署や交番の場所をあらかじめ確認しておき、有事の際は直接訴え出ることが案内されている（警視庁の案内）。","誤り。警備員は業務の性質上、事件・事故に遭遇することが多いため、平素から通報連絡の手段に精通し、習熟しておくことが重要である（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。基本教育の「事故の発生時における警察機関への連絡その他応急の措置に関すること」も、講義の方法及び実技訓練の方法によるものとされている（警備業法施行規則第38条第2項の表の備考二）。","正しい。金融機関などには、通報用のボタンを押すと、あらかじめ録音された施設の名称、住所等の情報が警察本部の通信指令課に110番通報される非常通報装置が設置されていることがある（例：長野県警察「非常通報装置の設置に関する事務取扱要領」）。火災の発生を、ボタンを押すだけで記憶された音声メッセージにより知らせる装置もある（厚生労働省の同マニュアル）。いざというときに使えるよう、位置と使い方を確かめておく。","正しい。緊急時に連絡先を探す時間を省き、関係機関や依頼者、自社に確実に連絡できるよう、連絡先を整理して備えておく。"],"ref":["警備業法施行規則第38条第2項の表及び備考二"],"src":["https://www.keishicho.metro.tokyo.lg.jp/jiken_jiko/110/110_110.html","https://www.mhlw.go.jp/content/000611912.pdf","https://www.pref.nagano.lg.jp/police/koukai/jouhou/chiiki/rk_hjth.html"]},
