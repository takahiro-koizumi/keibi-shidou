{"id":"S2-067","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"行事の入場を待つ参集者の列（待機列）の整理や開門時の誘導に関する次の記述のうち、適当でないものはどれか。","choices":["夏季の屋外であっても、待機列の場所は整理のしやすさだけで決めればよく、日陰の有無は考えなくてよい。","待機列は、歩道や通路の通行の妨げにならない場所に設け、ロープ等で区画して折り返すなどして整える。","開門時に参集者が先を争って走り出すおそれがあるときは、列の先頭部分の参集者を制止しながら、ゆっくりと誘導する。","列の最後尾の位置を看板などで示し、案内する者を配置するなどして、割込みや列の乱れによるトラブルを防ぐ。","入場券や手荷物の確認に時間がかかると入口で滞留が生じるので、確認を行う場所や要員の数を事前に検討しておく。"],"answer":0,"notes":["誤り。環境省「夏季のイベントにおける熱中症対策ガイドライン2020」は、熱中症対策として、待機列を日陰に誘導することなどを示している。屋外で長時間待つ参集者は熱中症になりやすいので、待機列の場所は日陰の有無も考えて決め、給水や休憩の呼び掛けにも配意する。","正しい。待機列が歩道や通路にはみ出すと一般の通行を妨げ、滞留の原因にもなる。通路等の幅員を確保し（例：栃木県警察雑踏警備実施要領 第5の3(8)ウ）、ロープ等の資機材を活用して列を区画する。","正しい。イベント会場の開門時等に群衆が先を争って走り出す現象が予想される場合には、転倒事故を防止するため、群衆の先頭部分にいる参集者を制止し、ゆっくりと誘導する方法（先導誘導）をとるとされている（例：高知県警察「適切な雑踏警備の実施について」第4の3(4)）。","正しい。最後尾が分からないと、割込みや列の乱れから参集者同士のトラブルが起きやすい。最後尾の表示や案内により列を整然と保つことは、雑踏の整理の基本である。","正しい。入場時に多数の参集者が出入口に殺到すると、滞留や雑踏密度の過度の増加が生じる（例：栃木県警察雑踏警備実施要領 第6の3(2)ウ）。確認に要する時間を見込んで、確認場所の配置や要員の数を事前に検討する。"],"ref":["警備業法施行規則第38条第3項の表（法第2条第1項第2号の警備業務）ハ","栃木県警察雑踏警備実施要領 第5の3(8)・第6の3(2)","高知県警察「適切な雑踏警備の実施について」（令和6年4月1日）第4の3(4)"],"src":["https://www.wbgt.env.go.jp/heatillness_gline.php","https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf","https://www.police.pref.kochi.lg.jp/docs/2023121400069/file_contents/20250129_bini_83.pdf"]},
{"id":"S2-068","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"行事が終わった後の退場や帰路の誘導に関する次の記述のうち、適当でないものはどれか。","choices":["群衆密度が高いときは、会場の区域ごとに時間をずらして退場させるなどして、出口や帰路の通路に人が集中しないようにする。","最寄り駅の構内が帰路の参集者で飽和したときは、鉄道事業者と連携し、参集者を一定のまとまりごとに分断して、後方からの圧力を緩和しながら順に誘導する。","帰路の参集者が一つの駅に集中しないよう、場内放送や案内看板で、ほかの駅や経路を案内する。","行事の終了間際は、帰り始める参集者と観覧を続ける参集者が交錯しやすいので、出口付近の通路の状況に特に注意する。","通行規制やロープ規制の解除は、各配置場所の警備員が、自分の持ち場の人の流れを見て、それぞれの判断で行う。"],"answer":4,"notes":["正しい。群衆密度の状況次第では、参集者の帰路時の会場における規制退場を実施するなど、群衆密度の上昇を抑えるための措置をとるとされている（例：高知県警察「適切な雑踏警備の実施について」第4の3(3)）。","正しい。帰路客により駅構内が飽和状態になって前進できないなどの場合には、鉄道事業者と意思疎通を図った上で、群衆を一定程度のまとまりで分断し、後方から来る参集者の圧力を緩和しながら、先頭のまとまりから順次誘導する方法（分断誘導）をとるとされている（例：高知県警察「適切な雑踏警備の実施について」第4の3(5)）。","正しい。帰路が一つの駅や経路に集中すると滞留が生じやすい。あらかじめ定めた迂回路への誘導やほかの経路の案内により、人の流れを分散させる（例：高知県警察「適切な雑踏警備の実施について」第4の3(3)）。","正しい。多数の者が集まる行事では、人の流れがぶつかり合うことで滞留が生じ、雑踏事故に発展する可能性があるとされている（例：高知県警察「適切な雑踏警備の実施について」第4の3(1)）。終了間際は、出口へ向かう流れと観覧を続ける人の流れが交錯しやすい。","誤り。ロープ規制などの解除は、全体の人の流れを把握している本部の指示に基づき、帰路の流れが落ち着いたことを確かめて行う。持ち場ごとにばらばらに解除すると、ほかの場所の流れと合流して新たな滞留を生むおそれがある。雑踏警備は、警備本部で組織的に情報を集約し、一元的な指揮の下で行う（例：栃木県警察雑踏警備実施要領 第3の4・第6の3(1)エ）。なお、道路で警察が行う交通規制は警察が解除するもので、警備員の判断で解除することはできない（警備業法第15条）。"],"ref":["警備業法第15条","警備業法施行規則第38条第3項の表（法第2条第1項第2号の警備業務）ハ","高知県警察「適切な雑踏警備の実施について」（令和6年4月1日）第4の3","栃木県警察雑踏警備実施要領 第3の4・第6の3(1)"],"src":["https://www.police.pref.kochi.lg.jp/docs/2023121400069/file_contents/20250129_bini_83.pdf","https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf"]},
{"id":"S2-069","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"雑踏事故の前触れとなる状況とその際の措置に関する次の記述のうち、適当でないものはどれか。","choices":["参集者の歩く速さが極端に落ちたり、長い時間滞留したりする状態は、雑踏事故が起こる危険性が高まった状態である。","人の流れの中で立ち止まる参集者には、「立ち止まらないでください」などと呼び掛け、人の流れを止めないようにする。","混雑の状況を正確に確かめるため、警備員が群集の中に分け入り、最も混雑している場所まで進んで様子を見る。","人出が予想を上回ったり、電車が運休したりしたときは、事態が悪化する前に、予備の要員の投入などの措置をとる。","逆方向に向かう人の流れがぶつかって滞留しかけているときは、一方からの通行をいったん止め、一定の方向へ通行させる。"],"answer":2,"notes":["正しい。参集者の歩行速度が極端に低下し、又は長時間滞留するなどした場合には、雑踏事故が発生する蓋然性が高まるとされている（例：高知県警察「適切な雑踏警備の実施について」第4の3(2)）。このような状況を認めたら、直ちに本部に報告する。","正しい。「立ち止まらないでください」などと継続して呼び掛けるとともに、実際に立ち止まっている者には口頭や警笛で素早く注意を促すなど、常に人の流れを止めない措置をとるとされている（例：高知県警察「適切な雑踏警備の実施について」第4の3(2)）。","誤り。群集の中に分け入ると、警備員自身が受傷するおそれがあるうえ、群集の圧力をさらに高めかねない。雑踏の状況は、立哨台などの高い位置やカメラ等を活用して把握し（例：高知県警察「適切な雑踏警備の実施について」第4の1(4)・第4の3(6)ウ）、群集の外側から分断や進入規制などの措置をとる。","正しい。当日になって人出が予想を上回る、電車が運休するなどの不測の事態に備えて予備の部隊を確保し、雑踏事故につながりかねない状況が発生した場合には、事態が悪化する前に先手を打って投入するとされている（例：高知県警察「適切な雑踏警備の実施について」第3の7(2)・第4の1(6)）。主催者側も、突発的な運用が可能となる人数の警備員をあらかじめ確保しておく（同 第3の2(3)）。","正しい。逆方向に向かう人同士の流れがぶつかって滞留が生じるおそれが高まっている道路では、一方からの通行をいったん分断した上で参集者を一定の方向へ通行するよう誘導し、分断した側の参集者をあらかじめ設定した迂回路へ誘導するとされている（例：高知県警察「適切な雑踏警備の実施について」第4の3(1)）。"],"ref":["警備業法施行規則第38条第3項の表（法第2条第1項第2号の警備業務）ハ","高知県警察「適切な雑踏警備の実施について」（令和6年4月1日）第3の2・第3の7・第4の1・第4の3"],"src":["https://www.police.pref.kochi.lg.jp/docs/2023121400069/file_contents/20250129_bini_83.pdf"]},
{"id":"S2-070","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"雑踏警備の現場で迷子や急病人が発生した場合の措置に関する次の記述のうち、適当なものはどれか。","choices":["迷子を保護した警備員は、保護者を早く見つけるため、持ち場を離れて子どもを連れ、会場内を歩いて捜して回る。","保護者と名乗る者が来たときは、急いでいる様子であれば、申出の内容や子どもの反応を確かめずに引き渡す。","救急車を要請した後は、救急隊の到着を待てばよく、会場入口への誘導の要員の配置や進入路の確保は要しない。","熱中症が疑われる人は、涼しい場所へ移して体を冷やし、自力で水が飲めないときは救急車を呼ぶ。","急病人を救護所へ運んだときは、あとは救護所の担当者に任せれば足り、警備本部へ報告する必要はない。"],"answer":3,"notes":["誤り。持ち場を離れると配置に空白が生じ、保護者と行き違いになるおそれもある。迷子を保護したときは、子どもの特徴等を本部に報告し、あらかじめ定められた迷子の保護場所に引き継ぐ。雑踏警備では、迷子や泥酔者の保護、急病人や負傷者の救護を担当する班を編成する例がある（例：栃木県警察雑踏警備実施要領 第6の2(4)ア(ｵ)）。","誤り。子どもを保護者以外の者に引き渡すことのないよう、申出の内容（子どもの氏名、服装等）と子どもの反応などを確かめてから引き渡す。","誤り。救急車を要請したときは、会場の入口など救急車を迎える場所に誘導の要員を出し、救急隊が傷病者のもとへすぐに行けるよう、通路の参集者に道を空けてもらうなどして進入路を確保する。道路の交通規制は警察が行うもので、雑踏事故の発生時などには、救急車が現場に迅速に到着できるよう、警察官が消防署と連携して交通規制・誘導を行うとされている（例：高知県警察「適切な雑踏警備の実施について」第5の5）。熱中症等の急病人が出たときに迅速に搬送できるよう、搬送先病院や救急車の手配について事前に調整しておくことも求められている（同 第3の6(1)エ）。","正しい。熱中症が疑われる人を見かけたら、エアコンが効いている室内や風通しのよい日陰など涼しい場所へ避難させ、衣服をゆるめて体を冷やし、水分を補給させる。自力で水が飲めない、意識がない場合は、すぐに救急車を呼ぶ（厚生労働省リーフレット「熱中症予防のために」）。","誤り。急病人や負傷者の発生とその後の状況は本部に報告する。雑踏警備は、警備本部で組織的に情報を集約し、一元的な指揮の下で行う（例：栃木県警察雑踏警備実施要領 第3の4）。人の雑踏する場所における負傷等の事故の発生に際してとるべき措置は、2号警備業務の業務別教育の教育事項とされている（警備業法施行規則第38条第3項の表）。"],"ref":["警備業法施行規則第38条第3項の表（法第2条第1項第2号の警備業務）ホ","栃木県警察雑踏警備実施要領 第3の4・第6の2(4)","高知県警察「適切な雑踏警備の実施について」（令和6年4月1日）第3の6・第5の5"],"src":["https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf","https://www.police.pref.kochi.lg.jp/docs/2023121400069/file_contents/20250129_bini_83.pdf","https://www.mhlw.go.jp/content/001118217.pdf"]},
{"id":"S2-071","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"屋外の行事の雑踏警備における天候の急変への対応に関する次の記述のうち、適当でないものはどれか。","choices":["雷鳴が聞こえるなど雷雲が近づく様子があるときは、落雷の危険が差し迫っているので、参集者を建物や車両の中などへ誘導する。","急な雷雨のときは、参集者が雨に濡れないよう、会場内の高い木の下へ誘導し、雨宿りをさせる。","強風が予想されるときは、テントや看板などの仮設物が倒れたり飛ばされたりしないよう、固定の状況を確かめる。","急な豪雨で参集者が駅や屋根のある場所へ一斉に向かうと、出入口や階段で滞留が生じやすいので、誘導の要員を増やす。","気象の急変に気付いた警備員は、直ちに本部に報告し、行事の中断や避難の誘導は本部の指示に従って行う。"],"answer":1,"notes":["正しい。雷鳴など雷雲が近づく様子があるときは、落雷が差し迫っているので、速やかに安全な空間へ避難する。鉄筋コンクリート建築、自動車（オープンカーは不可）、バス、列車の内部は比較的安全な空間とされている（気象庁「雷から身を守るには」）。","誤り。高い木の近くは危険であり、最低でも木の全ての幹、枝、葉から2メートル以上離れるとされている（気象庁「雷から身を守るには」）。雷雨のときは、建物や車両の中など安全な空間へ誘導する。","正しい。仮設の舞台、観客席、桟敷席等の安全管理は、会場及びその周辺について主催者に講じさせる措置の一つとされている（例：栃木県警察雑踏警備実施要領 第5の3(8)カ）。強風時は仮設物の倒壊や飛散のおそれがあるので、固定の状況を確かめ、危険なものは主催者に撤去などの措置を求める。","正しい。降雨等の気象条件が参集者に与える影響と予想される事案は、事前に検討しておくべき事項とされている（例：栃木県警察雑踏警備実施要領 第5の2(3)ウ）。雨を避ける人が一斉に移動すると、出入口や階段などで滞留が生じやすい。","正しい。天候の変化等で行事の内容が急に変更される場合に備えて変更時の警備計画を作成し、当日は計画に沿った運用となっているかを確認するとされている（例：高知県警察「適切な雑踏警備の実施について」第3の2(2)・第4の2(1)）。現場の警備員は、気付いた状況を本部に報告し、本部の一元的な指揮の下で行動する。"],"ref":["警備業法施行規則第38条第3項の表（法第2条第1項第2号の警備業務）ハ・ホ","栃木県警察雑踏警備実施要領 第5の2(3)・第5の3(8)","高知県警察「適切な雑踏警備の実施について」（令和6年4月1日）第3の2・第4の2"],"src":["https://www.jma.go.jp/jma/kishou/know/toppuu/thunder4-3.html","https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf","https://www.police.pref.kochi.lg.jp/docs/2023121400069/file_contents/20250129_bini_83.pdf"]},
{"id":"S2-072","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"雑踏警備における主催者、警察等との連絡体制等に関する次の記述のうち、適当なものはどれか。","choices":["主催者側の警備本部と警察の警備本部との間の連絡手段を確保し、雑踏の状況の変化を互いに伝えられるようにしておく。","主催者から警備を受託した警備業者は、警察からの指導事項は主催者が受けるものであるから、その内容を知る必要はない。","無線機の交信は、各警備員が気付いたことを自由に送信するのがよく、交信の順序や要領を決めておく必要はない。","行事の終了後の検討会は、事故が起きた場合に開けば足り、無事に終わった場合は開く必要はない。","消防や医療機関との連絡は警察が行うので、主催者側は、救護や救急の連絡体制を事前に定めておく必要はない。"],"answer":0,"notes":["正しい。主催者との連絡体制を確立し、連携にそごを来さないこととされ（例：群馬県警察雑踏事故防止対策要綱 第6の1(1)）、雑踏状況の変化に応じた指導等を確実に行えるよう、主催者等が設置する警備本部に警察の連絡員（リエゾン）を派遣する例もある（例：高知県警察「適切な雑踏警備の実施について」第4の1(7)）。","誤り。主催者が警備業者に警備を委託している場合には、警察からの指導事項が主催者側（主催者及び受託警備業者の両者）に十分に通じるよう配意するとされている（例：群馬県警察雑踏事故防止対策要綱 第5の1(4)）。受託した警備業者も指導事項を把握し、警備計画や警備員への指示に反映させる。","誤り。雑踏事故の前兆や突発事案の発生時に迅速かつ的確に指揮できるよう、指揮命令系統を明確にし、無線通信による指揮命令と報告連絡が円滑に行えるよう措置するとされている（例：栃木県警察雑踏警備実施要領 第6の3(1)エ）。各自が自由に送信すると、重要な報告や指示が伝わらなくなるおそれがある。","誤り。雑踏警備の終了後は、参集者が過度に集中した箇所の有無、警備員・スタッフとの連携状況、措置の効果等を検証して記録化し、主催者（委託先の警備会社職員を含む。）等と合同検討会を開いて課題や改善事項を共有し、次回に活用させるとされている（例：高知県警察「適切な雑踏警備の実施について」第8の1）。事故がなかった場合でも行う。","誤り。主催者には、警察、消防、救急、医療、公共交通機関等の関係機関・団体と、行事内容、警備計画、避難等の突発・重大事案対応要領等を共有するなど緊密に連携させるとされている（例：高知県警察「適切な雑踏警備の実施について」第3の2(5)）。関係機関団体等とは事前に十分な打合せを行い、連絡体制を確立する（例：栃木県警察雑踏警備実施要領 第5の4）。"],"ref":["群馬県警察雑踏事故防止対策要綱 第5の1・第6の1","栃木県警察雑踏警備実施要領 第5の4・第6の3(1)","高知県警察「適切な雑踏警備の実施について」（令和6年4月1日）第3の2・第4の1・第8の1"],"src":["https://www.pref.gunma.jp/uploaded/attachment/54099.pdf","https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf","https://www.police.pref.kochi.lg.jp/docs/2023121400069/file_contents/20250129_bini_83.pdf"]},
{"id":"S2-073","cat":"senmon","sub":"検定と配置基準","kubun":"2","stem":"雑踏警備業務及び交通誘導警備業務における検定合格警備員の配置に関する次の記述のうち、正しいものはどれか。","choices":["特定の種別の警備業務の実施基準を満たす義務は、警備業者ではなく、警備業務の依頼者が負う。","検定合格警備員の配置を要する交通誘導警備業務を、道路又は交通の状況により認めるのは、国家公安委員会である。","高速自動車国道で行う交通誘導警備業務であっても、都道府県公安委員会が必要と認めたものでなければ、検定合格警備員を配置する必要はない。","検定合格警備員の配置が必要な特定の種別は、都道府県公安委員会規則で定められるので、その内容は都道府県ごとに異なる。","雑踏警備業務を行う場所が三つの区域に区分される場合は、一級検定合格警備員一人を含め、検定合格警備員を少なくとも四人配置する。"],"answer":4,"notes":["誤り。警備業者は、特定の種別の警備業務を行うときは、国家公安委員会規則で定めるところにより、その種別ごとに合格証明書の交付を受けている警備員に当該警備業務を実施させなければならない（警備業法第18条）。実施基準に従って検定合格警備員を配置する義務を負うのは警備業者である（警備員等の検定等に関する規則第2条）。","誤り。道路又は交通の状況により、道路における危険を防止するため必要と認めるのは、都道府県公安委員会である（警備員等の検定等に関する規則第2条の表の六の項）。その認定の基準は、警察庁の通達（令和6年3月12日付け丙生企発第115号）に定めるところによるとされている（解釈運用基準 第17の2(6)）。","誤り。高速自動車国道又は自動車専用道路において行う交通誘導警備業務では、公安委員会の認定の有無にかかわらず、一級又は二級の検定合格警備員を交通誘導警備業務を行う場所ごとに一人以上配置しなければならない（警備員等の検定等に関する規則第2条の表の五の項）。都道府県公安委員会の認定が問題となるのは、それ以外の交通誘導警備業務である（同表の六の項）。","誤り。特定の種別は、その実施に専門的知識及び能力を要し、かつ、事故が発生した場合には不特定又は多数の者の生命、身体又は財産に危険を生ずるおそれがあるものとして、国家公安委員会規則で定められる（警備業法第18条、警備員等の検定等に関する規則第1条）。雑踏警備業務と交通誘導警備業務は、全国共通の特定の種別である。","正しい。雑踏警備業務を行う場所が二以上の区域に区分される場合は、場所ごとに一級検定合格警備員を一人配置するほか、区域ごとに一級又は二級の検定合格警備員を一人以上配置しなければならない（警備員等の検定等に関する規則第2条の表の四の項）。一人の一級検定合格警備員が両者を兼ねることはできない（解釈運用基準 第17の2(2)）ので、三つの区域に区分される場合は、一級検定合格警備員一人と区域ごとの三人を合わせて四人以上となる。"],"ref":["警備業法第18条","警備員等の検定等に関する規則第1条・第2条","解釈運用基準 第17の2(2)・(6)"],"src":[]},
{"id":"S2-074","cat":"senmon","sub":"検定と配置基準","kubun":"2","stem":"警備員等の検定の試験科目及び登録講習機関が行う講習会に関する次の記述のうち、誤っているものはどれか。","choices":["雑踏警備業務に係る一級の検定には、二級にはない科目として、事前調査など雑踏警備業務の管理に関することが含まれる。","雑踏警備業務に係る検定の学科試験では、軽犯罪法、道路交通法その他雑踏警備業務の実施に必要な法令に関する知識が問われる。","講習会の学科試験又は実技試験に合格しなかった者は、講習を受け直さなくても、直ちに次の試験を受けることができる。","交通誘導警備業務に係る検定では、車両の誘導だけでなく、人に対する合図その他の方法による人の誘導の能力も問われる。","講習会の実技試験は、受講者を何人かずつまとめて行うのではなく、受講者一人ごとに行われる。"],"answer":2,"notes":["正しい。一級の検定の学科試験及び実技試験には「雑踏警備業務の管理に関すること」（雑踏警備業務を実施する場所の広さ、その周囲における道路及び交通の状況その他の事情に関する事前調査等）が含まれるが、二級の検定にはこの科目はない（警備員等の検定等に関する規則第6条第1項・別表第一・別表第二）。","正しい。雑踏警備業務に係る一級及び二級の検定の学科試験の科目「法令に関すること」には、軽犯罪法、道路交通法その他雑踏警備業務の実施に必要な法令に関する知識が含まれる（同規則別表第一・別表第二）。","誤り。講習会の学科試験又は実技試験に合格しなかった者に対しては、その者が更に一時限以上の学科講習又は実技講習を受けた後でなければ、次の学科試験又は実技試験を行わない（同規則第17条第12号）。","正しい。交通誘導警備業務に係る検定では、交通誘導警備業務用資機材を使用して人又は車両の誘導を行う能力や、人又は車両に対する合図その他の方法により人又は車両の誘導を行う能力が問われる（同規則別表第一・別表第二）。","正しい。同規則第17条第10号のとおりである。講習会は、検定の級ごとに、講習（学科講習及び実技講習）及び試験（学科試験及び実技試験）により行われ（同条第1号）、課程を修了した者には講習会修了証明書が交付される（同条第13号）。"],"ref":["警備業法第23条第3項・第28条","警備員等の検定等に関する規則第6条・第17条・別表第一・別表第二"],"src":[]},
{"id":"S2-075","cat":"senmon","sub":"民法","kubun":"2","stem":"損害賠償に関する民法の規定についての次の記述のうち、正しいものはどれか。","choices":["不法行為による損害賠償は、別段の意思表示がないときは、壊れた物の修理など、原状回復の方法によって行うのが原則である。","不法行為によって他人の身体を害した者が賠償すべき損害は、治療費や休業による減収などの財産上の損害に限られる。","人の身体を害する不法行為による損害賠償請求権は、被害者が損害及び加害者を知った時から3年間行使しないときは、時効によって消滅する。","他人の生命を侵害した者は、被害者の父母、配偶者及び子に対し、その財産権が侵害されなかった場合でも、損害を賠償しなければならない。","債務不履行による損害賠償では、特別の事情によって生じた損害は、当事者がその事情を予見すべきであったときでも、請求することができない。"],"answer":3,"notes":["誤り。不法行為による損害賠償には民法第417条が準用され（民法第722条第1項）、別段の意思表示がないときは、金銭をもってその額を定める（民法第417条）。","誤り。他人の身体、自由若しくは名誉を侵害した場合又は他人の財産権を侵害した場合のいずれであるかを問わず、損害賠償の責任を負う者は、財産以外の損害（精神的な損害）に対しても賠償をしなければならない（民法第710条）。","誤り。人の生命又は身体を害する不法行為による損害賠償請求権は、被害者又はその法定代理人が損害及び加害者を知った時から5年間行使しないときに、時効によって消滅する（民法第724条の2による第724条第1号の読替え）。3年間となるのは、物を壊されたなど、それ以外の不法行為の場合である（民法第724条第1号）。","正しい。民法第711条（近親者に対する損害の賠償）のとおりである。","誤り。債務の不履行に対する損害賠償は、通常生ずべき損害の賠償をさせることを目的とするが、特別の事情によって生じた損害であっても、当事者がその事情を予見すべきであったときは、債権者はその賠償を請求することができる（民法第416条）。"],"ref":["民法第416条","民法第417条","民法第710条","民法第711条","民法第722条第1項","民法第724条","民法第724条の2"],"src":[]},
{"id":"S2-076","cat":"senmon","sub":"民法","kubun":"2","stem":"民法に定める不法行為の責任に関する次の記述のうち、誤っているものはどれか。","choices":["未成年者は、他人に損害を加えた場合において、自己の行為の責任を弁識するに足りる知能を備えていなかったときは、その行為について賠償の責任を負わない。","共同不法行為において、共同行為者のうちいずれの者が損害を加えたかを知ることができないときは、どの者も賠償の責任を負わない。","精神上の障害により自己の行為の責任を弁識する能力を欠く状態で他人に損害を加えた者でも、故意又は過失によって一時的にその状態を招いたときは、賠償の責任を負う。","監督義務者に代わって責任無能力者を監督する者も、責任無能力者が第三者に加えた損害について、監督義務者と同様の責任を負う。","行為者を教唆した者及び幇助した者は、共同行為者とみなされ、各自が連帯して損害を賠償する責任を負う。"],"answer":1,"notes":["正しい。民法第712条のとおりである。","誤り。数人が共同の不法行為によって他人に損害を加えたときは各自が連帯してその損害を賠償する責任を負い、共同行為者のうちいずれの者がその損害を加えたかを知ることができないときも、同様とされている（民法第719条第1項）。","正しい。民法第713条ただし書のとおりである。","正しい。民法第714条第2項のとおりである。責任無能力者を監督する法定の義務を負う者は、その義務を怠らなかったとき、又はその義務を怠らなくても損害が生ずべきであったときを除き、責任無能力者が第三者に加えた損害を賠償する責任を負う（同条第1項）。","正しい。行為者を教唆した者及び幇助した者は、共同行為者とみなして、民法第719条第1項の規定が適用される（同条第2項）。"],"ref":["民法第712条","民法第713条","民法第714条","民法第719条"],"src":[]},
{"id":"S2-077","cat":"senmon","sub":"民法","kubun":"2","stem":"民法に定める事務管理に関する次の記述のうち、正しいものはどれか。","choices":["管理者は、本人の意思を推知することができるときでも、自らが最も合理的と考える方法によって事務管理をすればよい。","管理者は、事務管理を始めたときは、本人が既にそのことを知っている場合であっても、本人に通知しなければならない。","管理者は、本人から請求があっても、事務管理が終わるまでは、事務の処理の状況を報告する必要はない。","管理者が本人の意思に反して事務管理をしたときでも、本人のために支出した有益な費用は、本人が受けた利益の有無にかかわらず全額の償還を請求できる。","管理者は、原則として、本人やその相続人、法定代理人が管理をすることができるようになるまで、事務管理を継続しなければならない。"],"answer":4,"notes":["誤り。管理者は、本人の意思を知っているとき、又はこれを推知することができるときは、その意思に従って事務管理をしなければならない（民法第697条第2項）。それ以外のときも、事務の性質に従い、最も本人の利益に適合する方法によって管理する（同条第1項）。","誤り。管理者は、事務管理を始めたことを遅滞なく本人に通知しなければならないが、本人が既にこれを知っているときは、この限りでない（民法第699条）。","誤り。事務管理には委任の規定（民法第645条から第647条まで）が準用され（民法第701条）、管理者は、本人の請求があるときは、いつでも事務の処理の状況を報告し、事務管理が終了した後は、遅滞なくその経過及び結果を報告しなければならない（民法第645条）。","誤り。管理者が本人の意思に反して事務管理をしたときは、本人が現に利益を受けている限度においてのみ、有益な費用の償還を請求することができる（民法第702条第3項）。","正しい。民法第700条本文のとおりである。ただし、事務管理の継続が本人の意思に反し、又は本人に不利であることが明らかであるときは、この限りでない（同条ただし書）。"],"ref":["民法第645条","民法第697条","民法第699条","民法第700条","民法第701条","民法第702条"],"src":[]},
{"id":"S2-078","cat":"senmon","sub":"消防法","kubun":"2","stem":"火災の予防のための火の使用の制限等に関する消防法の規定についての次の記述のうち、正しいものはどれか。","choices":["火を使用する器具の取扱いその他火の使用に関し火災の予防のために必要な事項は、政令で定める基準に従い市町村条例で定める。","火災に関する警報は、気象台長等から気象の状況の通報を受けた都道府県知事が発する。","火災に関する警報が発せられたとき、市町村条例で定める火の使用の制限に従わなければならないのは、その市町村の住民に限られる。","市町村長は、火災の警戒上特に必要があると認めるときは、期間を限らずに、一定区域内におけるたき火又は喫煙の制限をすることができる。","液化石油ガスなど消火活動等に重大な支障を生ずるおそれのある物質で政令で定めるものを貯蔵し、又は取り扱う者は、その開始後遅滞なく届け出ればよい。"],"answer":0,"notes":["正しい。消防法第9条のとおりである。火の使用に関する具体的な規制（祭礼や花火大会などの屋外の催しで火気器具等を使用する場合の規制を含む。）は、各市町村の火災予防条例で定められる。","誤り。気象庁長官、管区気象台長、地方気象台長等は、気象の状況が火災の予防上危険であると認めるときは、その状況を直ちに都道府県知事に通報し、都道府県知事は直ちにこれを市町村長に通報する（消防法第22条第1項・第2項）。火災に関する警報を発することができるのは、市町村長である（同条第3項）。","誤り。警報が発せられたときは、警報が解除されるまでの間、その市町村の区域内に在る者は、市町村条例で定める火の使用の制限に従わなければならない（消防法第22条第4項）。住民に限られず、催しの参集者や工事の関係者なども含まれる。","誤り。市町村長は、火災の警戒上特に必要があると認めるときは、期間を限って、一定区域内におけるたき火又は喫煙の制限をすることができる（消防法第23条）。","誤り。圧縮アセチレンガス、液化石油ガスその他の火災予防又は消火活動に重大な支障を生ずるおそれのある物質で政令で定めるものを貯蔵し、又は取り扱う者は、あらかじめ、その旨を所轄消防長又は消防署長に届け出なければならない（消防法第9条の3第1項）。政令では、圧縮アセチレンガス40キログラム以上、液化石油ガス300キログラム以上などと定められている（危険物の規制に関する政令第1条の10）。"],"ref":["消防法第9条","消防法第9条の3","消防法第22条","消防法第23条","危険物の規制に関する政令第1条の10"],"src":[]},
{"id":"S2-079","cat":"senmon","sub":"消防法","kubun":"2","stem":"消防活動や救急業務への協力等に関する消防法の規定についての次の記述のうち、誤っているものはどれか。","choices":["消防法上の救急業務には、傷病者が医師の管理下に置かれるまでの間に、緊急やむを得ないものとして応急の手当を行うことが含まれる。","救急隊員は、緊急の必要があるときは、傷病者の発生した現場付近に在る者に対し、救急業務に協力することを求めることができる。","救急隊員の求めに応じて救急業務に協力した者が、そのために負傷したときは、国がその損害を補償する。","救急隊員は、救急業務の実施に際しては、常に警察官と密接な連絡をとるものとされている。","消防長又は消防署長は、人命の救助等のため緊急の必要があるときは、延焼のおそれのない消防対象物や土地であっても、使用し、又は処分することができる。"],"answer":2,"notes":["正しい。救急業務とは、災害により生じた事故や、屋外若しくは公衆の出入する場所において生じた事故等による傷病者のうち、医療機関その他の場所へ緊急に搬送する必要があるものを、救急隊によって医療機関等に搬送することをいい、傷病者が医師の管理下に置かれるまでの間において、緊急やむを得ないものとして応急の手当を行うことを含む（消防法第2条第9項）。","正しい。消防法第35条の10第1項のとおりである。","誤り。市町村が行う救急業務に協力した者が、そのため死亡し、負傷し、若しくは疾病にかかり又は障害の状態となった場合は、市町村が、政令で定める基準に従い条例の定めるところにより、その者又はその遺族の損害を補償しなければならない（消防法第36条の3第1項）。火災の現場で消防作業に従事した者（同法第25条第2項・第29条第5項）についても同様である。","正しい。消防法第35条の10第2項のとおりである。","正しい。消防長若しくは消防署長（消防本部を置かない市町村においては消防団の長）は、消火若しくは延焼の防止又は人命の救助のために緊急の必要があるときは、延焼のおそれがある消防対象物等以外の消防対象物及び土地を使用し、処分し又はその使用を制限することができる。この場合、損害を受けた者から要求があるときは、時価によりその損失を補償する（消防法第29条第3項）。"],"ref":["消防法第2条第9項","消防法第29条第3項","消防法第35条の10","消防法第36条の3"],"src":[]},
{"id":"S2-080","cat":"senmon","sub":"消防法","kubun":"2","stem":"防炎規制に関する消防法令の規定についての次の記述のうち、誤っているものはどれか。","choices":["高層建築物、地下街、劇場、旅館、病院など政令で定める防火対象物で使用するカーテン等は、政令で定める基準以上の防炎性能を有しなければならない。","防炎規制の対象となる防火対象物には、劇場や旅館などのほか、一定の工事中の建築物その他の工作物も含まれる。","防炎対象物品には、どん帳やカーテンのほか、展示用の合板や工事用シートも含まれる。","防炎対象物品に防炎性能を有する旨の表示を付けることは、防炎性能の有無にかかわらず、販売する者の判断で行うことができる。","防炎表示又は指定表示が付されていない防炎対象物品は、防炎物品として販売し、又は販売のために陳列してはならない。"],"answer":3,"notes":["正しい。消防法第8条の3第1項のとおりである。対象となる防火対象物は、高層建築物、地下街のほか、消防法施行令別表第一(1)項から(4)項まで、(5)項イ、(6)項、(9)項イ、(12)項ロ及び(16の3)項に掲げる防火対象物等である（消防法施行令第4条の3第1項）。","正しい。消防法第8条の3第1項の政令で定める防火対象物には、工事中の建築物その他の工作物（総務省令で定めるものを除く。）が含まれる（消防法施行令第4条の3第1項、消防法施行規則第4条の3第1項）。","正しい。防炎対象物品は、カーテン、布製のブラインド、暗幕、じゅうたん等、展示用の合板、どん帳その他舞台において使用する幕及び舞台において使用する大道具用の合板並びに工事用シートである（消防法施行令第4条の3第3項）。","誤り。防炎性能を有する旨の表示（防炎表示）は、防炎性能を有する防炎対象物品又はその材料に、総務省令で定めるところにより付することができるものであり（消防法第8条の3第2項）、何人も、それ以外の場合に防炎表示又はこれと紛らわしい表示を付してはならない（同条第3項）。","正しい。消防法第8条の3第4項のとおりである。"],"ref":["消防法第8条の3","消防法施行令第4条の3","消防法施行規則第4条の3"],"src":[]},
{"id":"SD-001","cat":"shidou","sub":"指導教育責任者の業務","kubun":null,"stem":"警備業法施行規則第40条に定める警備員指導教育責任者の業務として、誤っているものはどれか。","choices":["指導計画書を作成し、その計画書に基づき警備員を実地に指導し、及びその記録を作成すること。","教育計画書を作成し、及びそれに基づく警備員教育の実施を管理すること。","警備員教育の実施に関する記録の記載について監督すること。","警備員の指導及び教育の実施状況を、定期的に公安委員会に報告すること。","警備員の指導及び教育について、警備業者に必要な助言をすること。"],"answer":3,"notes":["正しい。警備業法施行規則第40条第1号のとおり。指導計画書は、営業所に備える書類の一つである（同規則第66条第1項第4号）。","正しい。警備業法施行規則第40条第2号のとおり。教育計画書は、同規則第66条第1項第5号の書類である。","正しい。警備業法施行規則第40条第3号のとおり。教育の記録（同規則第66条第1項第6号の書類）その他警備員教育の実施に関する記録の記載について監督する。","誤り。公安委員会への定期的な報告は、警備業法施行規則第40条に定める指導教育責任者の業務ではない。同条第4号は「警備員の指導及び教育について警備業者に必要な助言をすること」である。","正しい。警備業法施行規則第40条第4号のとおり。"],"ref":["警備業法第22条第1項","警備業法施行規則第40条","警備業法施行規則第66条第1項第4号～第6号"],"src":[],"avoid":["KB-015"]},
{"id":"SD-002","cat":"shidou","sub":"指導教育責任者の業務","kubun":null,"stem":"警備員教育の実施の管理に関する次の記述のうち、正しいものはどれか。","choices":["警備業法施行規則第40条第2号の「警備員教育の実施を管理すること」には、指導教育責任者が自ら警備員教育を実施することは含まれない。","「警備員教育の実施を管理すること」には、他の者による警備員教育の実施について、必要な指導や実施状況の把握を行うことが含まれる。","部外の講師を招いて警備業者の施設で行う教育は、教育計画書に記載する教育計画に基づかないものであっても、警備員教育の時間数に算入できる。","警備業者は、警備員教育の全てを、自ら又はその従業者により行わなければならない。","警備業者の施設以外で行う部外実施教育は、実施する者がどのような団体であっても、警備員教育の時間数に算入できる。"],"answer":1,"notes":["誤り。「警備員教育の実施を管理すること」とは、自ら警備員教育を実施することのほか、他の者による警備員教育の実施について必要な指導、実施状況の把握等を行うことをいう（解釈運用基準 第21の2(8)）。","正しい。解釈運用基準 第21の2(8)のとおり。","誤り。部外の講師を招いて警備業者の施設で行う教育を時間数に算入できるのは、教育事項等が警備業法施行規則第38条に適合し、かつ、指導教育責任者が作成する教育計画書に記載する教育計画に基づき、警備員の知識及び能力の水準に照らし適切かつ効果的に実施する場合である（解釈運用基準 第20の3(2)）。","誤り。警備業者は、その責任において警備員教育を実施しなければならないが、その全てを自ら又はその従業者により行うことまでは要さず、法令に反しない範囲で、部外の者が行う教育を警備員教育の一部と認め、時間数に算入することができる（解釈運用基準 第20の3）。","誤り。警備業者の施設以外で行う部外実施教育を時間数に算入できるのは、警備員等の教育訓練事業を行う一般社団法人・一般財団法人、事業協同組合等、登録講習機関、複数の警備業者が警備員教育を共同して行うための団体が行う教育であって、教育計画に基づき適切かつ効果的に実施するものに限られる（解釈運用基準 第20の3(2)）。"],"ref":["警備業法施行規則第40条第2号","解釈運用基準 第21の2(8)","解釈運用基準 第20の3"],"src":[]},
{"id":"SD-003","cat":"shidou","sub":"指導教育責任者の業務","kubun":null,"stem":"警備員教育の記録（警備業法施行規則第66条第1項第6号の書類）等に関する次の記述のうち、誤っているものはどれか。","choices":["教育の記録は、年度ごとに作成し、営業所ごとに備えて置く。","教育の記録には、警備員教育の実施年月日、内容、方法、時間数、実施場所、実施者の氏名及び対象となった警備員の氏名を記録する。","警備員の名簿には、その警備員に対して行った警備員教育の実施年月日、内容、時間数及び実施者の氏名を記載する。","教育の記録に記載する「内容」とは、警備業法施行規則第38条第2項及び第3項の表の教育事項についての細目をいう。","教育の記録には、教育を受けた警備員及び実施者が、記載事項に誤りがないことを確認する旨を付記する。"],"answer":4,"notes":["正しい。警備業法第45条、警備業法施行規則第66条第1項第6号のとおり。","正しい。警備業法施行規則第66条第1項第6号のとおり。","正しい。警備業法施行規則第66条第1項第1号ロのとおり。","正しい。解釈運用基準 第31の2(1)のとおり。教育計画書に記載する「内容」も同じである。","誤り。記載事項に誤りがないことを確認する旨を付記するのは、指導教育責任者及び実施者である（警備業法施行規則第66条第1項第6号）。指導教育責任者は、教育の記録の記載について監督する立場にある（同規則第40条第3号）。"],"ref":["警備業法第45条","警備業法施行規則第40条第3号","警備業法施行規則第66条第1項第1号・第6号","解釈運用基準 第31の2(1)"],"src":[]},
{"id":"SD-004","cat":"shidou","sub":"指導教育責任者の業務","kubun":null,"stem":"警備員指導教育責任者の心構えとして、適当でないものはどれか。","choices":["自らが警備員の模範となるよう、服装や言動を律する。","法令の改正や最近の事件・事故の発生状況などの情報を集め、指導及び教育に生かす。","指導教育責任者の業務は計画書や記録の作成が中心であるから、警備業務の現場に出向いて警備員を指導する必要はない。","指導及び教育に当たっては、警備員一人一人の経験や能力の違いを考慮する。","警備員の指導及び教育について改善すべき点に気付いたときは、警備業者に必要な助言をする。"],"answer":2,"notes":["正しい。警備員は指導する者の言動を見て学ぶので、自ら模範を示すことは指導の基本である。","正しい。現任指導教育責任者講習でも、最新の法令、事件・事故の発生状況、不適切な事例の分析などが講習事項とされている。","誤り。指導教育責任者は、指導計画書に基づき警備員を実地に指導し、その記録を作成することが業務とされている（警備業法施行規則第40条第1号）。現場の実態を把握し、実地に指導することが求められる。","正しい。業務別教育は、警備員が従事する警備業務の具体的な内容に即し、その知識、技能の程度に応じて行うこととされている（解釈運用基準 第20の2(6)）。","正しい。警備業法施行規則第40条第4号のとおり。"],"ref":["警備業法施行規則第40条","解釈運用基準 第20の2(6)","現任指導教育責任者講習の運用（令和7年12月9日）別表"],"src":["https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-005","cat":"shidou","sub":"指導教育責任者の業務","kubun":null,"stem":"警備員指導教育責任者の業務の進め方として、適当なものはどれか。","choices":["部外の講師に教育を依頼するときは、教育計画の趣旨や警備員の知識・技能の程度を事前に伝え、教育の内容を打ち合わせておく。","新しい警備業務の現場を受注しても、その現場の特性に応じた指導は行わず、従来の指導内容のままとする。","他の者が行った教育については、内容を確かめずに、実施者の報告どおりに教育の記録の確認を済ませる。","警備員教育の時間数が不足している警備員がいても、本人の自主性に任せ、受講の機会を設けない。","実地に指導した内容の記録は、問題が見つかった場合に限って作成すればよい。"],"answer":0,"notes":["正しい。部外の講師による教育も、指導教育責任者が作成する教育計画に基づき、警備員の知識及び能力の水準に照らし適切かつ効果的に実施する必要がある（解釈運用基準 第20の3(2)）。事前の打合せは、そのために欠かせない。","誤り。業務別教育は、警備員が従事する警備業務の具体的な内容に即して行うこととされている（解釈運用基準 第20の2(6)）。新しい現場では、その現場の状況や危険箇所に応じた指導が必要である。","誤り。教育の記録には、指導教育責任者及び実施者が記載事項に誤りがないことを確認する旨を付記する（警備業法施行規則第66条第1項第6号）。指導教育責任者は、他の者による教育についても実施状況を把握し、記録の記載を監督する（同規則第40条第2号・第3号、解釈運用基準 第21の2(8)）。","誤り。教育計画書に基づく警備員教育の実施を管理することは、指導教育責任者の業務である（警備業法施行規則第40条第2号）。受講できなかった者には、補講などで受講の機会を設ける。","誤り。指導教育責任者は、指導計画書に基づき警備員を実地に指導し、その記録を作成する（警備業法施行規則第40条第1号）。記録は、問題の有無にかかわらず作成し、その後の指導に生かす。"],"ref":["警備業法施行規則第40条","警備業法施行規則第66条第1項第6号","解釈運用基準 第20の2(6)","解釈運用基準 第20の3(2)","解釈運用基準 第21の2(8)"],"src":[]},
{"id":"SD-006","cat":"shidou","sub":"教育の重要性と計画","kubun":null,"stem":"警備業法第21条第1項（知識及び能力の向上に努める責務）の趣旨に関する次の記述のうち、正しいものはどれか。","choices":["警備業務の実施中に発生する事象には、その都度上司の判断を仰いで対応すれば足りるので、警備員自身が瞬時に判断する能力は求められていない。","警備員は警察官に準じた特別の権限を持つことから、高度な知識及び能力が求められている。","警備員は、警備業務の実施に伴って発生する様々な事象に適法、妥当かつ臨機応変に対応することが求められ、そのためには一般人の常識の範囲を超えた専門的な知識及び技能が必要とされる。","この規定は、警備員に対し、毎年度一定時間以上の研修を受けることを義務付けたものである。","警備業務の適正な実施には専門的な知識及び技能の錬磨が必要であるが、厳正な規律に従うことまでは求められていない。"],"answer":2,"notes":["誤り。警備員は、警備業務の実施に伴って発生する様々な事象への対応を、瞬時の判断により的確に行うことが求められている（解釈運用基準 第20の1(1)）。","誤り。警備業者及び警備員は、警備業法により特別に権限を与えられているものではない（警備業法第15条）。警備業務は、私人のいわゆる管理権等の範囲内で行われるものである（解釈運用基準 第14の1）。","正しい。解釈運用基準 第20の1(1)のとおり。こうした対応を瞬時の判断で的確に行うため、警備員には不断の努力が求められる。","誤り。警備業法第21条第1項は、知識及び能力の向上に「努めなければならない」とする努力義務の規定である。警備員に対する教育の実施は、同条第2項により警備業者に義務付けられている。","誤り。警備業務の適正な実施のためには、警備員が不断の努力を重ね、専門的な知識及び技能を錬磨し、厳正な規律に従って業務を行う必要があるとされている（解釈運用基準 第20の1(1)）。"],"ref":["警備業法第21条第1項","警備業法第15条","解釈運用基準 第20の1(1)","解釈運用基準 第14の1"],"src":[]},
{"id":"SD-007","cat":"shidou","sub":"教育の重要性と計画","kubun":null,"stem":"教育のねらいを「知識」「技能」「態度」に分けて考える場合の説明として、適当でないものはどれか。","choices":["知識の教育は、法令や警備業務実施の基本原則など、知らなかったことを理解させるものである。","技能の教育は、誘導の合図や資機材の操作など、できなかったことをできるようにするものである。","態度の教育は、知っていてできるのに実行しないことを、進んで実行するよう意欲や心構えを育てるものである。","教育計画を立てる際は、教育事項ごとに、知識・技能・態度のどれを主なねらいとするかを考えて教育の方法を選ぶ。","態度は一度の講義で身に付くものであるから、日常の業務の中で繰り返し指導する必要はない。"],"answer":4,"notes":["正しい。知識の教育は、知らなかったことを「分からせる」ことをねらいとし、講義などの方法が適している。作業の手順や動作を身に付けさせることは、技能の教育のねらいとされている。","正しい。技能の教育は「できるようにする」ことをねらいとし、実技訓練や現場での実地の指導が適している。","正しい。態度の教育は、規律や責任感、意欲を育て、知っていること・できることを確実に実行させることをねらいとする。","正しい。警備業法施行規則第38条第2項の表の備考第2号でも、応急の措置や護身の方法に関する教育は講義の方法及び実技訓練の方法によるなど、教育事項に応じた方法が定められている。","誤り。意欲、規律、責任感などの態度は一度の講義では身に付きにくく、日常の指導、手本を示すこと、良い行動を認めることなどの積重ねによって育てる。"],"ref":["警備業法施行規則第38条第2項の表の備考第2号","警備業法施行規則第38条第6項"],"src":["https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-008","cat":"shidou","sub":"教育の重要性と計画","kubun":null,"stem":"教育計画書に関する次の記述のうち、正しいものはどれか。","choices":["教育計画書は、警備員教育を実施した後に、その実績に基づいて作成する。","教育計画書には、年度ごとに、警備員教育の実施時期、内容、方法、時間数、実施者の氏名及び対象とする警備員の範囲に関する計画を記載する。","教育計画書は、主たる営業所に備えて置けば足り、その他の営業所に備えて置く必要はない。","教育計画書は警備業者の代表者が作成するものとされ、指導教育責任者は作成に関与しない。","警備員教育は、教育計画書に記載する教育計画に基づいて行えば足り、適切かつ効果的に行うことまでは求められていない。"],"answer":1,"notes":["誤り。教育計画書は、年度ごとに作成し（警備業法施行規則第66条第1項第5号）、当該年度の開始の日の30日前までに備えておかなければならない（同条第3項）。警備員教育は、この教育計画に基づいて行う（同規則第38条第6項）。実施の結果は、教育の記録（同規則第66条第1項第6号の書類）に記録する。","正しい。警備業法施行規則第66条第1項第5号のとおり。","誤り。教育計画書は、警備業法第45条により営業所ごとに備えて置く書類の一つである（警備業法施行規則第66条第1項第5号）。","誤り。教育計画書を作成し、それに基づく警備員教育の実施を管理することは、指導教育責任者の業務である（警備業法施行規則第40条第2号）。","誤り。警備員教育は、教育計画書に記載する教育計画に基づき、適切かつ効果的に行わなければならない（警備業法施行規則第38条第6項）。"],"ref":["警備業法第45条","警備業法施行規則第38条第6項","警備業法施行規則第40条第2号","警備業法施行規則第66条第1項第5号・第3項"],"src":[]},
{"id":"SD-009","cat":"shidou","sub":"教育の重要性と計画","kubun":null,"stem":"警備員教育の計画を立てる際の考え方として、適当でないものはどれか。","choices":["警備員の経験や知識・技能の程度を把握し、それに応じた内容とする。","担当する警備業務の現場で起きた事故や苦情の事例を分析し、教育内容に反映させる。","業務別教育は、警備員が従事する警備業務の具体的な内容に即したものとする。","一度作成した計画は、警備員の構成や業務の内容が変わっても見直さず、毎年度そのまま用いる。","教育の実施後に、警備員の理解度や現場での実践状況を確かめ、次の計画の見直しに生かす。"],"answer":3,"notes":["正しい。業務別教育は、警備員の知識、技能の程度に応じて行うこととされている（解釈運用基準 第20の2(6)）。経験の浅い者と経験の長い者とでは、必要な教育が異なる。","正しい。実際の事故や苦情の事例を教材にすると、同様の事案の再発防止に役立ち、警備員の関心も高まる。","正しい。解釈運用基準 第20の2(6)のとおり。","誤り。教育計画書は年度ごとに作成するもので（警備業法施行規則第66条第1項第5号）、警備員の構成、業務の内容、法令の改正などの変化に応じて見直す必要がある。","正しい。計画、実施、効果の確認、改善を繰り返すことで、教育を適切かつ効果的なものにできる（警備業法施行規則第38条第6項参照）。"],"ref":["警備業法施行規則第38条第6項","警備業法施行規則第66条第1項第5号","解釈運用基準 第20の2(6)"],"src":[]},
{"id":"SD-010","cat":"shidou","sub":"教育の重要性と計画","kubun":null,"stem":"警備員に対する指導及び教育の重要性に関する次の記述のうち、適当なものはどれか。","choices":["警備員が正しい知識と技能を身に付けることは、事故の防止や依頼者・地域住民からの信頼の確保につながる。","警備業務の技能は現場で経験を積めば自然に身に付くので、教育は定められた時間数を形式的に満たせば足りる。","経験の長い警備員は十分な知識と技能を持っているので、継続して指導や教育を行う必要はない。","一人の警備員の不適正な行為は、その警備員個人の問題にとどまり、警備業全体の信用には影響しない。","警備員の資質は本人の性格で決まるものであり、教育によって高めることはできない。"],"answer":0,"notes":["正しい。警備業務は人の生命、身体、財産等を守ることを主な内容とする業務であり（解釈運用基準 第20の1(1)）、警備員の知識と技能は、事故の防止と社会からの信頼の基礎となる。","誤り。警備員教育は、教育計画に基づき適切かつ効果的に行わなければならない（警備業法施行規則第38条第6項）。時間数を形式的に満たすだけでは、教育の目的は達成できない。","誤り。警備業者及び警備員には知識及び能力の向上に努める責務があり（警備業法第21条第1項）、現に警備業務に従事している警備員にも毎年度の教育が定められている（警備業法施行規則第38条第5項。一定の資格者等を除く）。慣れによる手順の省略などを防ぐためにも、継続した指導が必要である。","誤り。警備員の不適正な行為は、所属する警備業者だけでなく、警備業全体に対する社会の信頼を損なうおそれがある。","誤り。新たに警備業務に従事させる警備員の基本教育には「警備員の資質の向上に関すること」（警備業の現状と社会的役割、警備員の使命と心構えなど）が含まれ、教育によって資質の向上を図ることとされている（警備業法施行規則第38条第2項、解釈運用基準 第20の2(2)）。"],"ref":["警備業法第21条","警備業法施行規則第38条","解釈運用基準 第20の1(1)","解釈運用基準 第20の2(2)"],"src":[]},
{"id":"SD-011","cat":"shidou","sub":"教育の方法","kubun":null,"stem":"講義の方法による教育を効果的に行うための留意事項として、適当でないものはどれか。","choices":["教本のほか、写真や映像などの視聴覚教材を活用して、具体的なイメージを持たせる。","講義の初めに目的と要点を示し、終わりに要点を繰り返して確認する。","予定した内容を時間内に話し終えることを最優先にし、受講者からの質問は受け付けない。","受講者の表情や反応を見ながら、理解が不十分と思われる点は説明を補う。","警備業務の現場で実際に起こり得る事例を交えて説明し、受講者の関心を引き付ける。"],"answer":2,"notes":["正しい。講義の方法は、教本、視聴覚教材等必要な教材を用いて行う方法とされている（警備業法施行規則第38条第2項の表の備考第3号）。","正しい。初めに全体像を示し、終わりに要点を確認することで、受講者は内容を整理して理解しやすくなる。","誤り。講義法は多くの内容を体系的に伝えられる反面、受講者が受け身になりやすく、理解の程度に差が出やすい。質問を受けて疑問を解消し、理解の程度を確かめることが大切である。電気通信回線を使用する講義でも、質疑応答の機会の確保が要件とされている（警備業法施行規則第38条第2項の表の備考第3号ニ）。","正しい。受講者の反応を確かめながら進めることで、一方通行になりがちな講義の欠点を補うことができる。","正しい。身近な事例は強い印象を与え、関心と理解を高める。"],"ref":["警備業法施行規則第38条第2項の表の備考第3号"],"src":["https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-012","cat":"shidou","sub":"教育の方法","kubun":null,"stem":"討議法や事例研究法による教育に関する次の記述のうち、適当なものはどれか。","choices":["討議法は、講師が一方的に説明し、多くの知識を短時間で効率よく伝える方法である。","討議では、結論を早く出すため、経験の長い警備員の意見だけを取り上げる。","事例研究に用いる事例は、受講者の業務と関係の薄いものの方が効果的である。","討議で誤った結論が出ても、受講者の自主性を尊重して、講師は何も補足せずに終える。","事例研究法は、実際に起こり得る事例を受講者に検討させ、判断力を養う方法である。"],"answer":4,"notes":["誤り。これは講義法の特徴である。討議法は、受講者があるテーマについて意見を出し合い、考えを深めて問題の解決を図る方法で、受講者の参加意欲を高めることができる。","誤り。討議法の利点は、受講者それぞれの経験や意見を出し合うことにある。講師は、発言の少ない者にも意見を求めるなど、全員が参加できるよう進める。","誤り。事例研究には、受講者の業務に身近で、実際に起こり得る事例を用いる。業務と関係の薄い事例では、受講者が自分の問題として考えにくい。","誤り。講師は、討議の結果を整理し、誤りがあれば正しい考え方を補足して締めくくる。講師のまとめがないと、討議が単なる話合いで終わるおそれがある。","正しい。事例研究法（ケーススタディ）は、実務で起こり得る問題を事例として研修の場で検討させ、判断力や問題解決の能力を養う方法である。事例は、受講者の業務に身近なものを用いる。"],"ref":["警備業法施行規則第38条第6項"],"src":["https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-013","cat":"shidou","sub":"教育の方法","kubun":null,"stem":"ロールプレイング（役割演技）による教育に関する次の記述のうち、適当でないものはどれか。","choices":["不審者への声かけや苦情への対応など、相手とのやり取りを伴う場面の訓練に適している。","演技がうまくできなかった受講者に対しては、他の受講者の前で厳しく批判して反省を促す。","実際の現場に近い場面を設定し、受講者に役割を与えて演じさせる。","演技の後に、演じた者と観察した者が感想や気付きを話し合い、良い点と改善点を確認する。","警備員の役だけでなく相手方の役も体験させると、相手の立場や気持ちを理解しやすくなる。"],"answer":1,"notes":["正しい。ロールプレイングは、言葉遣いや態度など、相手とのやり取りの技能を体験的に身に付けるのに適している。","誤り。ロールプレイングは、失敗しても実害のない場で試し、そこから学ぶための訓練である。人前で厳しく批判すると受講者が萎縮する。良かった点を認めた上で、改善点は具体的な提案として示す。","正しい。現実に近い場面を設定することで、学んだ知識を実際の対応に結び付けやすくなる。","正しい。演技後の振り返りで気付きを共有することが、ロールプレイングの効果を高める。","正しい。相手方の役を経験すると、警備員の言動が相手にどう受け止められるかを実感できる。"],"ref":["警備業法施行規則第38条第6項"],"src":["https://www.mhlw.go.jp/content/11300000/001388287.pdf","https://kokoro.mhlw.go.jp/listen/listen005/"]},
{"id":"SD-014","cat":"shidou","sub":"教育の方法","kubun":null,"stem":"OJTとOff-JTに関する次の記述のうち、正しいものはどれか。","choices":["OJTとは、通常の仕事を一時的に離れ、研修所などに集まって行う教育訓練をいう。","Off-JTとは、日常の業務に就きながら、上司や先輩が個別に指導する教育訓練をいう。","OJTは、指導する者の経験に任せて行うものであるから、計画を立てる必要はない。","OJTは、実際の業務を通じて行うため、個々の警備員の能力や習熟度に応じた指導を行いやすい。","Off-JTは、多数の警備員に同じ内容を体系的に教えることには向いていない。"],"answer":3,"notes":["誤り。これはOff-JTの説明である。OJTは、日常の業務に就きながら行われる教育訓練をいう。","誤り。これはOJTの説明である。Off-JTは、業務命令に基づき、通常の仕事を一時的に離れて行う教育訓練（研修）をいう。","誤り。OJTも、教育担当者、対象者、期間、内容などを具体的に定め、段階的・継続的に行うことが効果的である。指導教育責任者は、指導計画書を作成し、それに基づき警備員を実地に指導する（警備業法施行規則第40条第1号）。","正しい。OJTは、現場で一人一人の様子を見ながら指導できる。警備業法施行規則に定める実地教育の方法も、警備員一人に対して一人以上の指導者が現場で行うものである（同規則第38条第3項の表の備考、解釈運用基準 第20の3(1)）。","誤り。Off-JT（集合教育など）は、多数の警備員に同じ内容を体系的に教えることに適している。"],"ref":["警備業法施行規則第38条第3項の表の備考","警備業法施行規則第40条第1号","解釈運用基準 第20の3(1)"],"src":["https://www.mhlw.go.jp/content/11801500/001507470.pdf","https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-015","cat":"shidou","sub":"教育の方法","kubun":null,"stem":"仕事を段階的に教える「4段階の教え方」の順序として、適当なものはどれか。","choices":["習う準備をさせる → 説明し、やってみせる → やらせてみる → 教えた後を見る","説明し、やってみせる → 習う準備をさせる → やらせてみる → 教えた後を見る","習う準備をさせる → やらせてみる → 説明し、やってみせる → 教えた後を見る","やらせてみる → 説明し、やってみせる → 習う準備をさせる → 教えた後を見る","説明し、やってみせる → やらせてみる → 教えた後を見る → 習う準備をさせる"],"answer":0,"notes":["正しい。第1段階で緊張をほぐし、何を習うのか、なぜ必要なのかを示して習う気持ちにさせる。第2段階で要点を一つずつ説明し、やってみせる。第3段階で実際にやらせて誤りを直す。第4段階で仕事に就かせた後も様子を見て、質問を受けたり指導を加えたりする。","誤り。習う気持ちや心構えができていないうちに説明しても、理解されにくい。習う準備をさせることが第1段階である。","誤り。説明し、やってみせる前にやらせると、誤ったやり方が身に付くおそれがある。やらせてみるのは第3段階である。","誤り。習う準備をさせることが第1段階、説明し、やってみせることが第2段階、やらせてみることが第3段階である。","誤り。習う準備をさせることは最初の段階であり、教えた後を見ることが最後の段階である。"],"ref":[],"src":["https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-016","cat":"shidou","sub":"教育の方法","kubun":null,"stem":"警備員に仕事を教える際の原則として、適当でないものはどれか。","choices":["教える相手の経験や理解力に合わせて、内容や進め方を決める。","やさしいことから難しいことへと、段階を追って教える。","時間を節約するため、一度にできるだけ多くの事項をまとめて教える。","重要な手順については、なぜそうするのかという理由も併せて教える。","説明だけでなく、実物を見せたり実際に体験させたりする。"],"answer":2,"notes":["正しい。経験のある者には当然のことでも、新しく学ぶ者には分からないことが多い。相手の立場に立って教える。業務別教育も、警備員の知識、技能の程度に応じて行うこととされている（解釈運用基準 第20の2(6)）。","正しい。理解の程度を確かめながら、段階的に内容を高めていく。","誤り。一度に多くのことを教えると、理解が追い付かず覚えきれない。一度に一つのことを確実に教え、繰り返して身に付けさせる。","正しい。なぜそうするのかが分かると、納得して取り組むことができ、記憶にも残りやすい。","正しい。見る、聞く、触れるなど多くの感覚を使って体験したことは、身に付きやすい。"],"ref":["警備業法施行規則第38条第6項","解釈運用基準 第20の2(6)"],"src":["https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-017","cat":"shidou","sub":"面接の方法","kubun":null,"stem":"警備員と面接を行う際の準備や環境づくりとして、適当でないものはどれか。","choices":["面接は気軽な雰囲気で行うのがよいので、他の警備員がいる休憩室で、ほかの話題の合間に行う。","面接の目的を明確にし、確かめたい事項をあらかじめ整理しておく。","勤務の記録など、面接に必要な資料に前もって目を通しておく。","面接の日時と場所をあらかじめ決め、本人に伝えておく。","面接する側も落ち着いて話を聴けるよう、時間に余裕のある日時を設定する。"],"answer":0,"notes":["誤り。面接では個人的な事情に触れることも多いので、話の内容が周囲に聞こえない場所を選ぶ。他の警備員がいる場所では、本人が安心して話すことができない。","正しい。目的が明確でないと話が散漫になり、面接の効果が上がらない。","正しい。勤務状況などを事前に把握しておくと、事実に基づいて話し合うことができる。","正しい。時間と場所をあらかじめ確保して伝えておくと、本人も心の準備ができる。","正しい。面接する側に時間や心の余裕がないと、相手の話を十分に聴くことは難しい。"],"ref":[],"src":["https://kokoro.mhlw.go.jp/linecare_listen/ls003/","https://kokoro.mhlw.go.jp/attentive/atv004/"]},
{"id":"SD-018","cat":"shidou","sub":"面接の方法","kubun":null,"stem":"面接で警備員の話を聴く態度として、適当なものはどれか。","choices":["話の途中で誤りや甘えに気付いたときは、すぐに話を遮って正しい考え方を教える。","腕を組み、厳しい表情で聴くことで、面接の場に緊張感を持たせる。","相手の話を聴く前に、面接する側の結論や意見を十分に伝えておく。","相手の話を否定せずに最後まで聴き、話が一段落したところで、理解した内容を伝えて確認する。","相手が話しやすいよう、あいづちやうなずきは控え、黙って聴くことに徹する。"],"answer":3,"notes":["誤り。話の途中で遮ったり、評価や否定をしたりすると、相手は本当に話したいことを話さなくなる。まず最後まで聴き、相手の考えや気持ちを理解することが先である。","誤り。聴く側の表情、視線、姿勢なども、相手の話に関心を向けているかどうかを伝えるメッセージになる。腕組みや厳しい表情は相手を萎縮させ、話しにくくするので、穏やかな表情で相手に視線を向け、落ち着いた姿勢で聴く。","誤り。先に面接する側の結論を示すと、相手は自分の考えを述べにくくなる。まず相手の話を聴くことが大切である。","正しい。否定や批判をせず最後まで聴き（傾聴）、理解した内容を伝えて確認することで、相手は受け止めてもらえたと感じ、話の食い違いも防げる。","誤り。心のこもったあいづちやうなずきは、話を聴いていることを伝え、相手が次の言葉を話しやすくなる。"],"ref":[],"src":["https://kokoro.mhlw.go.jp/linecare_listen/ls001/","https://kokoro.mhlw.go.jp/linecare_listen/ls003/"]},
{"id":"SD-019","cat":"shidou","sub":"面接の方法","kubun":null,"stem":"面接における質問の仕方に関する次の記述のうち、適当でないものはどれか。","choices":["「この勤務で困っていることはどんなことですか」のように自由に答えられる開かれた質問は、相手の考えや気持ちを引き出しやすい。","「はい」「いいえ」で答えられる閉じた質問は、日時や事実関係を確かめる場面に適している。","閉じた質問ばかりを続けると、相手が自分の言葉で話す機会が少なくなり、尋問のようになりやすい。","質問するときは、相手を問い詰めたり責めたりする口調にならないよう注意する。","面接の時間を短くするため、面接する側が想定した答えに誘導するような質問を中心に進める。"],"answer":4,"notes":["正しい。開かれた質問は、相手が自分の言葉で自由に答えられるので、考えや気持ち、事情を引き出しやすい。","正しい。閉じた質問は答えやすく、事実を確かめるのに適している。開かれた質問と使い分ける。","正しい。「はい」「いいえ」で終わるやり取りばかりでは、相手の考えや事情が分からないままになりやすい。","正しい。問い詰める口調では、相手は身構えて本当のことを話しにくくなる。","誤り。誘導する質問では、相手の本当の考えや事実が分からず、面接の目的を果たせない。話を別の方向に誘導せず、相手の言葉で語ってもらうことが大切である。"],"ref":[],"src":["https://www.mhlw.go.jp/content/11300000/001388287.pdf","https://kokoro.mhlw.go.jp/listen/listen005/"]},
{"id":"SD-020","cat":"shidou","sub":"面接の方法","kubun":null,"stem":"面接で知り得た事柄の取扱いや面接の記録に関する次の記述のうち、適当なものはどれか。","choices":["面接で聞いた家庭の事情は、勤務上の配慮に必要な場合には、本人に断らずに現場の責任者に伝えてよい。","面接で聞いた個人的な事情を他の者に伝える必要があるときは、原則として本人の了解を得て、必要最小限の範囲にとどめる。","面接の記録には、事実と面接する側の推測とを区別せずに書いておく。","面接の記録は、後日の指導に使えるよう、その警備員が勤務する現場の詰所に保管しておく。","重要な内容の面接は、相手が打ち解けて話しやすい酒の席で行う。"],"answer":1,"notes":["誤り。勤務上の配慮のためであっても、面接で聞いた個人的な事情を本人の了解なく他の者に伝えると、信頼関係を損なう。伝える必要があるときは、原則として本人の了解を得て、必要最小限の範囲にとどめる。","正しい。他の者に伝える必要がある場合も、原則として本人の了解を得て、必要最小限の範囲にとどめる。","誤り。記録は後日の指導や確認に用いるものなので、事実と推測や意見とを区別して、正確に記載する。","誤り。面接の記録には個人的な事情が含まれるので、他の警備員も出入りする詰所などに置かず、関係者以外の者が見られないよう適切に管理する。","誤り。重要な内容の話合いは、会話が漏れない個室などで行う。酒の席で重要な話をするのは適切でない。"],"ref":[],"src":["https://kokoro.mhlw.go.jp/attentive/atv004/","https://kokoro.mhlw.go.jp/linecare_listen/ls001/"]},
{"id":"SD-021","cat":"shidou","sub":"面接の方法","kubun":null,"stem":"警備員との面接の進め方として、適当なものはどれか。","choices":["面接の冒頭では、警備員の緊張をほぐすよりも先に、問題点を厳しく指摘して反省を求める。","問題となった行動について面接するときは、事実関係を確かめる前に、本人に非を認めさせることを優先する。","面接の終わりには、話し合った内容と今後の取組を本人と確認し、その後の様子も見守る。","改善のための取組は、面接する側が一方的に決めて伝え、本人の考えは聴かない。","面接する側が答えられない相談を受けたときは、その場で思い付いた助言をして済ませる。"],"answer":2,"notes":["誤り。冒頭では緊張をほぐし、面接の目的を伝えて、本人が話しやすい雰囲気をつくる。いきなり厳しく指摘すると、本人は身構えて事情を話さなくなる。","誤り。まず本人の話をよく聴いて事実関係を確かめる。事実を確かめないまま非を認めさせようとすると、誤った判断や不信感を招く。","正しい。話し合った内容と今後の取組を確認して面接を締めくくり、その後も様子を見て、必要に応じて改めて話し合う。","誤り。本人の考えを聴き、本人が納得して取り組めるようにしなければ、改善の効果は上がらない。","誤り。答えられないときは、その旨を率直に伝え、本人が望めば詳しい者や専門の窓口につなぐなど、誠意を持って対応する。"],"ref":[],"src":["https://kokoro.mhlw.go.jp/linecare_listen/ls003/"]},
{"id":"SD-022","cat":"shidou","sub":"業務指導と身上指導","kubun":null,"stem":"警備業法第21条第2項の警備員に対する「指導及び監督」に関する次の記述のうち、誤っているものはどれか。","choices":["「指導及び監督」は、警備業務の実施に関する業務上のものに限られ、警備員の身分上の事項は含まれない。","警備業者が、その被用者に警備員を指導及び監督させる場合も含まれる。","個別の警備業務における具体的な基準は、警備業務の内容、警備員の年齢や勤務状態、地理的・気象的条件などを総合的に勘案し、社会通念上相当と認められるものとする必要がある。","警備員に対する指導及び監督が行われない場合には、職業安定法違反となることもある。","複数の警備業者が共同して警備業務を実施する場合も、各警備業者は、それぞれが雇用する警備員に対する指導及び監督を行う必要がある。"],"answer":0,"notes":["誤り。「指導及び監督」とは、警備業者がその警備員に対し、自己の責任において業務上及び身分上の指導及び監督を行うことをいう（解釈運用基準 第20の5）。業務の実施に関する指導だけでなく、警備員の身分上の事項（身上）についての指導及び監督も含まれる。","正しい。解釈運用基準 第20の5のとおり。","正しい。解釈運用基準 第20の5のとおり。警備対象施設の状況や期間（時間）的条件なども勘案する。","正しい。解釈運用基準 第20の6のとおり（職業安定法第44条）。","正しい。共同実施の場合も、各警備業者が各々その雇用する警備員に対する指導及び監督を行うことはもとより、構成員間の業務分担と連絡調整が適正に行われる必要がある（解釈運用基準 第20の6）。"],"ref":["警備業法第21条第2項","解釈運用基準 第20の5","解釈運用基準 第20の6"],"src":[]},
{"id":"SD-023","cat":"shidou","sub":"業務指導と身上指導","kubun":null,"stem":"警備業務の現場で行う業務指導の要領として、適当なものはどれか。","choices":["指示の後に復唱を求めると、警備員を信頼していないと受け取られるので、重要な事項であっても復唱は求めない。","警備員が誤った方法で業務をしていても、本人が気付くまで指摘せずに見守る。","現場の状況は日々変わるので、指導計画は作らず、その都度気付いた点を指導すれば足りる。","新しい現場に配置する警備員には、現場の状況を説明せず、配置後に自分で把握させる。","指示は、目的、内容、方法などを具体的に示し、重要な事項は警備員に復唱させて理解を確かめる。"],"answer":4,"notes":["誤り。復唱させるのは警備員を疑うためではなく、指示の誤解や聞き漏らしを防ぐためである。重要な事項ほど、復唱させて理解を確かめる。","誤り。誤った方法を放置すると、事故や苦情につながるおそれがある。誤りに気付いたら、その場で理由を示して正しい方法を指導する。","誤り。指導教育責任者は、指導計画書を作成し、その計画書に基づき警備員を実地に指導し、その記録を作成する（警備業法施行規則第40条第1号）。計画に基づきつつ、現場の状況に応じて機会をとらえて指導する。","誤り。配置の前に、現場の状況、危険な箇所、業務の要点などを説明しておく。","正しい。具体的な指示と復唱による確認で、指示の誤解や聞き漏らしを防ぐことができる。"],"ref":["警備業法施行規則第40条第1号"],"src":[]},
{"id":"SD-024","cat":"shidou","sub":"業務指導と身上指導","kubun":null,"stem":"警備員を注意したりほめたりする際の要領として、適当でないものはどれか。","choices":["注意するときは、人格ではなく、問題となった具体的な行動を取り上げる。","良い行動は、その場で具体的にほめ、本人の意欲を高める。","注意した後は、改善の様子を見て、良くなった点を認める。","注意の効果を高めるため、他の警備員の面前で、大声で威圧的に叱責することを繰り返す。","遅刻を繰り返し、再三注意しても改善されない警備員には、一定程度強く注意することもある。"],"answer":3,"notes":["正しい。人格を否定するような言動は、パワーハラスメントに当たり得る。何が問題で、どう改めるべきかを具体的に示す。","正しい。良い点を時機を逃さず具体的に認めると、その行動が定着し、意欲も高まる。","正しい。注意したままにせず、改善が見られたら認めることで、指導の効果が高まる。","誤り。他の労働者の面前における大声での威圧的な叱責を繰り返し行うことは、パワーハラスメントに該当すると考えられる例とされている（厚生労働省のパワーハラスメント防止指針）。注意は、相手の立場にも配慮して行う。","正しい。遅刻など社会的ルールを欠いた言動が見られ、再三注意しても改善されない者に一定程度強く注意をすることは、パワーハラスメントに該当しないと考えられる例とされている（厚生労働省のパワーハラスメント防止指針）。業務上必要かつ相当な範囲で行われる適正な指導は必要である。"],"ref":["事業主が職場における優越的な関係を背景とした言動に起因する問題に関して雇用管理上講ずべき措置等についての指針（令和2年厚生労働省告示第5号）"],"src":["https://www.mhlw.go.jp/web/t_doc?dataId=00011660&dataType=0&pageNo=1","https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-025","cat":"shidou","sub":"業務指導と身上指導","kubun":null,"stem":"警備員に対する身上指導として、適当なものはどれか。","choices":["警備員の身上を把握するため、本人には知らせずに、同僚の警備員から本人の私生活の様子を聞き出しておく。","職場の人間関係で悩んでいるとの相談を受けたときは、まず本人の落ち度を指摘し、我慢するよう指導する。","普段の様子をよく知っておき、遅刻の増加や顔色の悪さなど「いつもと違う」様子に気付いたときは、声をかけて話を聴く。","悩みを打ち明けられたときは、早く立ち直ってもらうため、まず「頑張れ」と励ますことを優先する。","体調不良が続いている様子に気付いても、病気かどうかは面接する側が判断し、医師などへの相談は勧めない。"],"answer":2,"notes":["誤り。本人に知らせずに同僚から私生活の様子を探ることは、プライバシーを侵し、信頼関係を損なう。身上の把握は、日頃の会話や面接など本人との関わりを通じて行う。","誤り。本人に問題があるように受け取れる発言や否定的な発言は、本人をさらに追い詰めるおそれがある。まず真摯に話を聴き、必要な対応を考える。","正しい。「いつもと違う」かどうかは、普段のその人からの変化で判断する。変化に気付いたら、心配していることを伝え、時間を取って話を聴く。","誤り。むやみな励ましは、相手をかえって追い詰めるおそれがある。まず相手の気持ちを十分に聴き、必要に応じて医師や専門の窓口への相談を勧める。","誤り。病気かどうかを判断するのは医師である。体調不良が続く様子に気付いたら、心配していることを率直に伝え、医師などへの相談を勧める。"],"ref":["解釈運用基準 第20の5"],"src":["https://kokoro.mhlw.go.jp/attentive/atv004/","https://kokoro.mhlw.go.jp/about-depression/ad006/"]},
{"id":"SD-026","cat":"shidou","sub":"業務指導と身上指導","kubun":null,"stem":"警備員の非違行為（法令や規律に違反する行為）を未然に防ぐための対応として、適当でないものはどれか。","choices":["日頃から警備員とよく話をし、困りごとを相談しやすい関係をつくっておく。","金銭の貸し借りをめぐるトラブルなどの兆候に気付いても、私生活の問題であるから関与せず、問題が表面化するまで様子を見る。","警備業務を行うに当たっては特別に権限を与えられているものでないことや、他人の権利及び自由を侵害してはならないことを、繰り返し指導する。","警備員による不適正な事案が起きたときは、その原因を分析し、同様の事案を防ぐための指導及び教育に生かす。","鍵や現金など依頼者の財産を取り扱う業務については、取扱いの手順を定めて守らせ、その状況を確かめる。"],"answer":1,"notes":["正しい。相談しやすい関係があれば、悩みや問題を早い段階で把握し、非違行為に至る前に手を打つことができる。","誤り。金銭トラブルなどの兆候を放置すると、非違行為につながるおそれがある。本人の人格やプライバシーに配慮しつつ、早めに面接して事情を聴き、必要な助言や指導を行う。","正しい。警備業法第15条の基本原則を守らせることは、警備員による権利の侵害や不当な干渉を防ぐ基本である。","正しい。事案の原因を分析して再発防止策を立て、指導及び教育に反映させる。","正しい。手順を定めて守らせ、実施状況を確認することは、事故や不正の防止に役立つ。"],"ref":["警備業法第15条","警備業法第21条第2項","解釈運用基準 第20の5"],"src":[]},
{"id":"SD-027","cat":"shidou","sub":"指導教育責任者の業務","kubun":null,"stem":"現場を巡回して行う実地の指導の進め方として、適当なものはどれか。","choices":["巡回の日時は、警備員が準備して待てるよう、毎回同じ曜日と時間帯に固定しておく。","指導の時間を確保するため、警備員を持ち場から離して詰所に集め、まとめて指導する。","巡回は昼間に限らず、夜間や早朝に勤務があればその時間帯にも行い、勤務の実態を把握する。","巡回で気付いた改善点は、現場責任者を通さずに警備員に直接指示し、現場責任者には伝えない。","一度の巡回で問題が見つからなかった現場は、それ以後の巡回の対象から外す。"],"answer":2,"notes":["誤り。日時を固定すると、その日時の状況しか確かめられず、ふだんの勤務の実態を把握しにくい。指導教育責任者は、指導計画書に基づき警備員を実地に指導する（警備業法施行規則第40条第1号）ので、日時や時間帯を変えて実態を確かめる。","誤り。警備員を持ち場から離すと、その間の警備業務に空白が生じ、事故や苦情の原因となる。巡回時の指導は、警備業務に支障が出ないよう、持ち場で短時間に行うか、交代の要員を確保して行う。","正しい。夜間や早朝の勤務は指導の目が届きにくい。時間帯を変えて巡回することで、勤務の実態に即した指導ができる。実地に指導したときは、その記録を作成する（警備業法施行規則第40条第1号）。","誤り。現場責任者を通さずに指示し、その内容も伝えないと、現場責任者の指示と食い違って警備員が混乱し、継続した指導もできない。気付いた点は現場責任者にも伝え、日常の指導に生かしてもらう。","誤り。現場の状況や配置される警備員は変わっていくので、問題が見つからなかった現場も、指導計画に基づいて継続して巡回し、実態を確かめる。"],"ref":["警備業法施行規則第40条第1号","警備業法施行規則第66条第1項第4号"],"src":[]},
{"id":"SD-028","cat":"shidou","sub":"指導教育責任者の業務","kubun":null,"stem":"新任の警備員に対する実地教育を、経験のある警備員に担当させる場合の対応として、適当でないものはどれか。","choices":["担当者には、教える項目、到達させる水準及び教え方の要点を、あらかじめ示しておく。","担当者には、新任の警備員の習得状況を報告させ、不十分な点は指導教育責任者が補う。","担当者は、経験年数だけでなく、手順を守り、分かりやすく教えることができるかも考えて選ぶ。","担当者が自己流のやり方を教えることのないよう、教える内容は定められた手順にそろえる。","実地教育は、担当する警備員1人が、新任の警備員数人をまとめて受け持つ形で行ってよい。"],"answer":4,"notes":["正しい。実地教育を他の者に行わせる場合も、指導教育責任者は警備員教育の実施を管理する（警備業法施行規則第40条第2号）。この管理には、他の者による警備員教育の実施について必要な指導を行うことが含まれる（解釈運用基準 第21の2(8)）。","正しい。他の者による警備員教育の実施状況の把握も、警備員教育の実施の管理に含まれる（解釈運用基準 第21の2(8)）。","正しい。新任の警備員に係る業務別教育の一部は、2年以上継続して当該警備業務に従事している警備員が行う実地教育の方法によることができる（警備業法施行規則第38条第3項の表の備考）。ただし、経験年数があっても、手順を守らない者や教え方が不適切な者では教育の効果が上がらない。","正しい。担当者ごとに教え方が異なると、誤ったやり方が新任の警備員に引き継がれるおそれがある。教える内容は、警備業者が定めた手順にそろえる。","誤り。実地教育の方法は、教育を受けるべき警備員1人に対して、1人以上の指導教育責任者、これと同等の知識経験がある者として国家公安委員会が定める者又は2年以上継続して当該警備業務に従事している警備員が行うものである（警備業法施行規則第38条第3項の表の備考）。警備業務の実施の現場でマン・ツー・マン方式で行われる教育とされている（解釈運用基準 第20の3(1)）。"],"ref":["警備業法施行規則第38条第3項の表の備考","警備業法施行規則第40条第2号","解釈運用基準 第20の3(1)","解釈運用基準 第21の2(8)"],"src":[]},
{"id":"SD-029","cat":"shidou","sub":"指導教育責任者の業務","kubun":null,"stem":"警備業法施行規則第40条第4号に基づき、警備員の指導及び教育について警備業者に行う助言として、適当でないものはどれか。","choices":["助言は、警備業者から指導及び教育について意見を求められたときに限って行う。","教育に必要な時間、場所や資機材が確保されていないときは、その確保について助言する。","経験の浅い警備員だけで勤務する現場があるなど、指導上問題のある配置の改善を助言する。","検定の合格者を配置する必要がある業務を行うときは、合格者を計画的に育成するよう助言する。","事故や苦情の分析から教育の不足が分かったときは、年度の途中でも教育の追加を助言する。"],"answer":0,"notes":["誤り。警備業法施行規則第40条第4号は、助言を警備業者から求められた場合に限っていない。指導教育責任者は、指導及び教育の実情をよく知る立場にあるので、必要と認めるときは自ら進んで助言する。","正しい。警備員教育は、教育計画に基づき適切かつ効果的に行わなければならない（警備業法施行規則第38条第6項）。そのための条件を整えることについて、警備業者に助言する。","正しい。警備員に対する指導及び監督は、警備員の性質・年齢・勤務状態などを総合的に勘案して行う必要がある（解釈運用基準 第20の5）。指導上問題のある配置は、助言の対象となる。","正しい。警備業者は、国家公安委員会規則で定める種別の警備業務を行うときは、同規則で定めるところにより、合格証明書の交付を受けている警備員に当該警備業務を実施させなければならない（警備業法第18条）。具体的には、業務を行う場所ごとや車両ごとなどに、定められた人数の合格者を配置する（警備員等の検定等に関する規則第2条）。必要な合格者を確保できるよう計画的に育成することは、警備員の教育に関わる事項である。","正しい。警備員教育には、基本教育及び業務別教育のほか、必要に応じて行う警備業務に関する知識及び技能の向上のための教育がある（警備業法施行規則第38条第1項）。"],"ref":["警備業法第18条","警備業法施行規則第38条第1項・第6項","警備業法施行規則第40条第4号","警備員等の検定等に関する規則第2条","解釈運用基準 第20の5"],"src":[]},
{"id":"SD-030","cat":"shidou","sub":"指導教育責任者の業務","kubun":null,"stem":"警備業務の現場で事故が起きたり、依頼者等から苦情を受けたりした場合の対応として、適当なものはどれか。","choices":["当事者の警備員に始末書を提出させれば、それをもって再発防止の措置は済んだものとする。","苦情を受けたときは、依頼者との関係を優先し、当事者の警備員の説明は聴かずに申出どおりに処理する。","苦情が申し出た者の誤解によるものと分かったときは、苦情に関する書類には記載しなくてよい。","原因は、警備員個人の不注意だけでなく、指示、配置、資機材、教育など管理の面も含めて分析する。","事故の当事者となった警備員を現場から外せば足り、指導や教育の内容を見直す必要はない。"],"answer":3,"notes":["誤り。始末書の提出は、再発防止の措置そのものではない。原因を究明し、指導や教育の内容、手順、配置などを改善して、その効果を確かめる必要がある。","誤り。苦情に関する書類には、原因究明の結果とともに苦情に対する弁明の内容を記載することとされている（警備業法施行規則第66条第1項第8号）。当事者の説明も聴いて事実関係を確かめ、原因を究明する。","誤り。警備業者は、依頼者等からの苦情に関し、苦情を申し出た者の氏名及び連絡先、苦情の内容、原因究明の結果、苦情に対する弁明の内容、改善措置並びに苦情処理を担当した者の氏名を記載した書類を備える（警備業法第45条、同法施行規則第66条第1項第8号）。誤解による苦情も記録し、誤解を招いた原因があれば、説明の仕方などの改善に生かす。","正しい。事故の原因は、人（警備員）、設備・資機材、作業の方法や環境、管理の各面から分析する（いわゆる4Mの考え方）。個人の不注意だけに原因を求めると、管理面の問題が見過ごされ、同じ事故が繰り返される。","誤り。当事者を外しても、指示、配置、教育などに原因があれば、同じ事故は他の警備員でも起こり得る。原因に応じて、指導や教育の内容を見直す。"],"ref":["警備業法第20条","警備業法第45条","警備業法施行規則第66条第1項第8号"],"src":["https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-031","cat":"shidou","sub":"指導教育責任者の業務","kubun":null,"stem":"教育計画書に基づく警備員教育の実施についての対応として、適当なものはどれか。","choices":["警備員教育は自己研さんの性格を持つので、勤務時間外に行い、受講時間は労働時間として扱わない。","勤務の都合で受講できなかった警備員には、同じ年度のうちに補講を行い、必要な教育を終えさせる。","定められた時間数の教育を終えた警備員には、知識や技能の不足が分かっても、その年度に追加の教育は行わない。","教育の実施状況は、年度末に教育の記録を見て確かめれば足り、年度の途中で確かめる必要はない。","会場が確保できないときは、勤務の合間に教本を配って読ませれば、講義の方法による教育として時間数に算入できる。"],"answer":1,"notes":["誤り。警備員教育は、警備業者が法令に基づいて行わなければならないもので（警備業法第21条第2項）、業務として受講させるものである。参加することが業務上義務付けられている研修・教育訓練の受講時間は、労働時間に当たる（厚生労働省「労働時間の適正な把握のために使用者が講ずべき措置に関するガイドライン」）。","正しい。現に警備業務に従事させている警備員に対する教育は、毎年度、定められた時間数以上行う（警備業法施行規則第38条第5項）。受講できなかった者の分を翌年度に回すことはできないので、年度内に補講の機会を設ける。","誤り。法令の時間数は最低限の基準であり、警備員教育には、必要に応じて行う警備業務に関する知識及び技能の向上のための教育も含まれる（警備業法施行規則第38条第1項）。不足が分かれば、追加の教育や実地の指導で補う。","誤り。年度末になって受講漏れに気付いても、その年度の教育を終えさせることは難しい。警備員教育の実施を管理する（警備業法施行規則第40条第2号）ため、年度の途中でも実施状況を把握し、計画どおりに進んでいるかを確かめる。","誤り。講義の方法は、教育を行う者が教本、視聴覚教材等を用いて受講者と対面して行うもの、又は電気通信回線を使用して所定の要件を満たして行うものである（警備業法施行規則第38条第2項の表の備考第3号、解釈運用基準 第20の2(8)）。教本を配って読ませるだけでは、講義の方法による教育には当たらない。"],"ref":["警備業法第21条第2項","警備業法施行規則第38条第1項・第5項","警備業法施行規則第38条第2項の表の備考第3号","警備業法施行規則第40条第2号","解釈運用基準 第20の2(8)"],"src":["https://www.mhlw.go.jp/kinkyu/dl/151106-04.pdf"]},
{"id":"SD-032","cat":"shidou","sub":"教育の重要性と計画","kubun":null,"stem":"警備員教育の計画における教育の目標の定め方として、適当なものはどれか。","choices":["目標は「安全意識の向上」のように幅広く定めておく方が、どの警備員にも当てはまり使いやすい。","目標は教育を行う側が把握していれば足り、受講する警備員にあらかじめ示す必要はない。","目標は「教育計画どおりに教育を実施すること」とすると、達成できたかどうかを確かめやすい。","目標は高いほど意欲が高まるので、受講者の現状にかかわらず、到達が難しい水準に定める。","目標は、教育の後に警備員が何をできるようになるかを、具体的に定める。"],"answer":4,"notes":["誤り。目標が抽象的だと、何をどこまで教えるのかが定まらず、教育の後に達成できたかどうかも確かめられない。","誤り。受講者が、何を学び、何ができるようになればよいかを理解していると、学ぶ意欲が高まり、教育の効果も上がる。教える者と習う者が同じ目標に向かっているという共通の理解に立つことが、指導・教育を効果的にする要素の一つとされている。","誤り。教育を実施すること自体は手段であり、目標ではない。警備員教育は、教育計画に基づき適切かつ効果的に行わなければならず（警備業法施行規則第38条第6項）、目標は警備員の知識や技能がどうなるかで定める。","誤り。目標は、受講者の経験や知識・技能の程度を踏まえ、努力すれば達成できる水準とする。到達が難しすぎる目標は、かえって意欲を失わせる。","正しい。例えば「誘導の合図を正しく示せるようになる」のように、行動で確かめられる形で目標を定めると、教育の内容や方法を選びやすく、教育の後に達成の程度を確かめることもできる。"],"ref":["警備業法施行規則第38条第6項"],"src":["https://www.mhlw.go.jp/content/11300000/001388287.pdf","https://www.mhlw.go.jp/file/06-Seisakujouhou-11800000-Shokugyounouryokukaihatsukyoku/h24text-15.pdf"]},
{"id":"SD-033","cat":"shidou","sub":"教育の重要性と計画","kubun":null,"stem":"警備員の経験の違いに応じた教育の考え方として、適当でないものはどれか。","choices":["新任の警備員には、基本となる手順を確実に身に付けさせることを重点とし、配置後も早い時期に実施状況を確かめる。","経験の長い警備員には、慣れによる手順の省略や自己流のやり方がないかを確かめ、基本を再確認させる。","経験の長い警備員には、基本的な事項の教育は省き、新しい法令や事例だけを教えれば足りる。","経験の長い警備員の教育では、その経験を事例として発表させるなど、受講者が参加する形を取り入れる。","他の警備業者で経験を積んだ者には、自社の手順や現場の決まりなど、前の勤務先と異なる点を重点的に教える。"],"answer":2,"notes":["正しい。新任の時期は知識や技能が未熟で、不安全な行動が起きやすい。基本を確実に身に付けさせ、現場に出た後も早い時期に実施状況を確かめて補う。","正しい。経験を重ねると、手順の省略や自己流のやり方が習慣になることがある。経験者の教育では、基本に立ち返って確認させることが重要である。","誤り。現に警備業務に従事させている警備員に対する教育も、警備業務実施の基本原則、警備業法その他の法令、事故の発生時における警察機関への連絡その他応急の措置に関する基本教育を含めて、毎年度行う（警備業法施行規則第38条第2項・第5項。一定の資格者等を除く）。慣れによる手順の省略を防ぐためにも、基本の確認は欠かせない。","正しい。経験者の知識や経験を教材として生かし、受講者が参加する形で進めると、関心や意欲が高まり、他の受講者の学びにもなる。","正しい。警備業者は、他の警備業者が既に教育を行っていたとしても、自らの責任において教育を行わなければならない（解釈運用基準 第20の1(2)）。前の勤務先のやり方と異なる点は、特に誤りが起きやすい。"],"ref":["警備業法施行規則第38条第2項・第5項","解釈運用基準 第20の1(2)","解釈運用基準 第20の2(6)"],"src":["https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-034","cat":"shidou","sub":"教育の重要性と計画","kubun":null,"stem":"年度の教育計画で、教育の時期や重点を定める際の考え方として、適当でないものはどれか。","choices":["法令の改正内容についての教育は、施行日を過ぎた後に、次年度の教育計画に組み入れて行えば足りる。","熱中症や路面の凍結など、季節によって高まる危険についての教育は、その時期を迎える前に行う。","年末年始や祭礼など人や車両が増える時期に備え、誘導や雑踏の整理についての教育を事前に行う。","検定の受検を予定している警備員には、受検の時期に合わせて必要な知識と技能の教育を計画する。","教育の日程は、夜勤明けの直後など疲れた状態での受講にならないよう、勤務と調整して定める。"],"answer":0,"notes":["誤り。改正された法令は施行日から適用されるので、警備員が改正前の知識のまま業務を行うことのないよう、施行日までに改正内容を教育する。年度の途中であっても、必要に応じて警備業務に関する知識及び技能の向上のための教育を行う（警備業法施行規則第38条第1項）。","正しい。危険が高まる時期の前に教育しておくことで、事故を未然に防ぐことができる。","正しい。業務の繁忙期の前に、その時期に多い事故の防止や対応の要領を教育しておく。","正しい。警備員教育には、基本教育及び業務別教育以外に、必要に応じて行う警備業務に関する知識及び技能の向上のための教育が含まれる（警備業法施行規則第38条第1項、解釈運用基準 第20の2(1)）。","正しい。疲れた状態では集中力が続かず、教育の効果が上がらない。警備員教育を適切かつ効果的に行うため（警備業法施行規則第38条第6項）、日程は勤務と調整して定める。"],"ref":["警備業法施行規則第38条第1項・第6項","解釈運用基準 第20の2(1)"],"src":[]},
{"id":"SD-035","cat":"shidou","sub":"教育の重要性と計画","kubun":null,"stem":"警備員が、決められた手順やルールを知りながら守らないこと（意図的な違反）を防ぐための指導の考え方として、適当でないものはどれか。","choices":["ルールが定められた理由と、守らなかった場合にどのような事故につながるかを、具体的に説明する。","手順を守っている警備員の行動を認め、手順を守ることが当たり前という職場の雰囲気をつくる。","「他の人もやっている」という意識が職場に広がっていないかを確かめ、職場全体の問題として取り組む。","手順を省略しても事故が起きていない場合は、効率のよいやり方として、そのまま認めてよい。","違反をした警備員を頭ごなしに叱るのではなく、本人と一緒に安全なやり方を考える。"],"answer":3,"notes":["正しい。ルールが作られた背景や、守らなかった場合の結果を理解すると、納得して守るようになる。","正しい。手順を守る行動を認めることで、その行動が定着し、手順を守ることが職場の当たり前になる。違反を注意するだけでなく、守っている者を認めることも大切である。","正しい。意図的な違反は、危険に対する認識の甘さ、能力の過信、ほかの人もやっているという意識、うまくいった経験などから生じるとされる。個人の問題としてだけでなく、職場全体で取り組む。","誤り。事故が起きなかったことは、そのやり方が安全であることを意味しない。うまくいった経験は意図的な違反を繰り返す原因の一つとされており、黙認すると他の警備員にも広がる。","正しい。上から押さえ付けるだけでは反発を招き、かえって違反が見えにくくなる。違反がどのような事故につながるかを説明し、本人と一緒に考えることが改善につながる。"],"ref":[],"src":["https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-036","cat":"shidou","sub":"教育の重要性と計画","kubun":null,"stem":"警備員教育の効果を確かめる方法として、適当なものはどれか。","choices":["受講者アンケートで「よく分かった」という回答が多ければ、教育の効果は十分に上がったと判断する。","教育の直後だけでなく、しばらくたってから、教えたことが現場で実践されているかを確かめる。","理解度の確認テストは受講者の負担になるので行わず、出席の確認をもって効果の確認に代える。","教育の効果は、教育の翌月に事故や苦情の件数が減ったかどうかだけで判断する。","確認テストの成績が低かった警備員には、意欲を失わないよう結果を伝えず、次年度の教育で補う。"],"answer":1,"notes":["誤り。受講者の満足度や「分かった」という自己評価は、知識や技能が実際に身に付いたかどうかとは別である。理解度の確認や、現場での実践の状況で確かめる。","正しい。教育の効果は、知識の理解だけでなく、現場での行動が変わったかどうかで確かめる。時間がたつと忘れたり元のやり方に戻ったりすることもあるので、一定の期間の後にも確かめる。","誤り。出席しただけでは、内容を理解したかどうかは分からない。電気通信回線を使用して行う講義では、受講者の警備業務に関する知識の習得の状況を確認できることが要件とされている（警備業法施行規則第38条第2項の表の備考第3号ハ）。","誤り。事故や苦情の件数のような結果の指標は、改善が表れるまでに時間がかかり、教育以外の要因の影響も受ける。理解度や現場での行動の変化なども併せて確かめる。","誤り。結果と不十分な点を本人に伝え、その年度のうちに補習や実地の指導で補う。結果を伝えないと、本人は何を改めればよいか分からない。"],"ref":["警備業法施行規則第38条第2項の表の備考第3号ハ","警備業法施行規則第38条第6項"],"src":[]},
{"id":"SD-037","cat":"shidou","sub":"教育の方法","kubun":null,"stem":"危険予知訓練（KYT）の基礎4ラウンド法の進め方として、適当でないものはどれか。","choices":["第1ラウンドでは、イラストシートなどの場面にひそむ危険を「〜なので〜して〜になる」の形で出し合う。","第2ラウンドでは、出された危険のうち重要なものを、みんなの合意でしぼり込んで「危険のポイント」とする。","第3ラウンドでは、危険のポイントを解決するための具体的で実行可能な対策を出し合う。","第4ラウンドでは、時間を節約するため、リーダーがあらかじめ決めておいた行動目標をメンバーに唱和させる。","チームは、一人ひとりが意見を出しやすいよう、5〜6人程度で編成する。"],"answer":3,"notes":["正しい。第1ラウンド（どんな危険がひそんでいるか）では、イラストシートの状況の中にひそむ危険を発見し、危険要因とそれが引き起こす現象を想定して出し合い、チームで共有する。","正しい。第2ラウンド（これが危険のポイント）では、重要と思われる危険を把握し、みんなの合意でしぼり込んで「危険のポイント」とし、指差し唱和で確認する。","正しい。第3ラウンド（あなたならどうする）では、危険のポイントを解決するにはどうしたらよいかを考え、具体的で実行可能な対策を出し合う。","誤り。第4ラウンド（私達はこうする）では、対策の中からみんなの合意でしぼり込んで重点実施項目とし、それを実践するためのチーム行動目標を設定して、指差し唱和で確認する。KYTは、全員が話し合って合意することで、危険に対する感受性や問題解決の能力、安全への参画意識を高めるものであり、リーダーが決めた目標を唱和させるだけでは、そのねらいが果たせない。","正しい。チームは、一人ひとりが意見を出しやすいように5人〜6人を標準とし、リーダー（司会・進行）と書記を決めて進める。"],"ref":[],"src":["https://anzeninfo.mhlw.go.jp/yougo/yougo40_1.html","https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-038","cat":"shidou","sub":"教育の方法","kubun":null,"stem":"ヒヤリ・ハット事例や事故事例を使った教育に関する次の記述のうち、適当でないものはどれか。","choices":["ヒヤリ・ハットを報告した警備員には、注意が足りなかったとして反省文を提出させ、再発を防ぐ。","手順どおりに行わなかったことが原因のヒヤリ・ハットでも、手順に無理がないかを見直す機会とする。","報告されたヒヤリ・ハットと改善の内容は、他の現場の警備員にも知らせて共有する。","重大な事故の背景には多くの小さな事故やヒヤリ・ハットがあるとの考え方に立ち、それらの情報も教育に生かす。","事故事例を教材にするときは、自分の現場で同じことが起きないかを、警備員に置き換えて考えさせる。"],"answer":0,"notes":["誤り。ヒヤリ・ハットは報告する側にとって名誉なことではないので、報告した者を責めないという取決めをし、これを実行しないと、報告されなくなり制度が長続きしないとされている（厚生労働省「職場のあんぜんサイト」）。報告したことを評価し、原因と対策を一緒に考える。","正しい。手順どおりに行わなかったことが原因であっても、手順に無理があって守ることができないのかもしれず、手順を見直す良い機会と考えるべきとされている（同）。","正しい。改善された事例を広く知らせることは、同様の事例の防止（水平展開）とともに、警備員の意識の向上にもつながるとされている（同）。","正しい。ハインリッヒの法則（1:29:300の法則）について、重要なのは比率の数字ではなく、災害の背景には危険有害要因が数多くあり、ヒヤリ・ハット等の情報をできるだけ把握して迅速、的確に対策を講じることであるとされている（同）。","正しい。身近な事例に結び付けると強い印象を与え、教育の効果が高まる。自分の現場に置き換えて考えさせることで、自分の問題として受け止めるようになる。"],"ref":[],"src":["https://anzeninfo.mhlw.go.jp/yougo/yougo26_1.html","https://anzeninfo.mhlw.go.jp/yougo/yougo24_1.html","https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-039","cat":"shidou","sub":"教育の方法","kubun":null,"stem":"日本語を母語としない警備員に業務を教える際の留意事項として、適当なものはどれか。","choices":["失礼にならないよう、尊敬語や謙譲語を多く使った丁寧な言い回しで説明する。","「カラコン」のような現場で使う略語は、早く慣れるよう、説明を加えずにそのまま使う。","指示は「〜してもらえますか」のように、疑問の形をとった柔らかい言い方で伝える。","説明の後に「分かりましたか」と尋ね、「はい」と答えれば理解したものとして次に進む。","説明は短く区切って話し、写真や図、実物を見せながら、文の最後まではっきり言い切る。"],"answer":4,"notes":["誤り。やさしい日本語で話す際は、尊敬語・謙譲語を使わないこととされている（出入国在留管理庁・文化庁「在留支援のためのやさしい日本語ガイドライン～話し言葉のポイント～」）。「です」「ます」の丁寧な言い方で足りる。","誤り。略語やカタカナの外来語は、日本語を学んだ外国人にも分かりにくい。分かりやすい言葉に言い換えるか、実物を示して意味を確かめながら教える（同ガイドライン）。","誤り。「〜してもらえますか」のような疑問の形をとった表現は、依頼なのか質問なのかが分かりにくい。はっきり言い切る形で伝える（同ガイドライン）。","誤り。「はい」という返事だけでは、理解したかどうかは分からない。実際にやってみせてもらったり、手順を説明してもらったりして理解を確かめる。安全衛生教育は、外国人労働者がその内容を理解できる方法により行うこととされている（外国人労働者の雇用管理の改善等に関して事業主が適切に対処するための指針）。","正しい。短く切って話すこと、文の最後まで言い切ること、資料・写真・図や実物を活用することは、やさしい日本語で話す際のポイントとされている（同ガイドライン）。"],"ref":[],"src":["https://www.moj.go.jp/isa/content/001388854.pdf","https://www.mhlw.go.jp/bunya/koyou/gaikokujin13/sisin01.html"]},
{"id":"SD-040","cat":"shidou","sub":"教育の方法","kubun":null,"stem":"高年齢の警備員に対する教育の留意事項として、適当でないものはどれか。","choices":["教育には十分な時間をかけ、写真や図、映像など文字以外の情報も活用する。","定年退職後に初めて警備業務に就く者は社会経験が豊富なので、教育は若い警備員より簡略にしてよい。","体力チェックなどを通じて、本人が自分の身体機能の変化を客観的に認識できるようにする。","転倒は危険を感じにくい場所でも起きるので、わずかな段差などにも注意を払うよう意識付けをする。","高年齢の警備員と共に働く警備員や現場責任者にも、高年齢者の特性と必要な配慮について教育する。"],"answer":1,"notes":["正しい。高年齢者を対象とした教育では、作業内容とそのリスクについて理解を得やすくするため、十分な時間をかけ、写真や図、映像等の文字以外の情報も活用することとされている（高年齢者の労働災害防止のための指針（令和8年4月1日適用））。","誤り。高年齢者が再雇用や再就職等により経験のない業種や業務に従事する場合には、特に丁寧な教育訓練を行うこととされている（同指針）。なお、警備業法施行規則に定める新任教育の時間数は、年齢によって変わらない（同規則第38条第4項）。","正しい。体力チェックの実施を通じて、高年齢者が自らの身体機能等を客観的に認識する必要性を理解することが重要とされている（同指針）。","正しい。高年齢者の転倒災害は危険に感じられない場所で発生していることも多いため、わずかな段差等の周りの環境にも常に注意を払うよう意識付けをすることが有効とされている（同指針）。","正しい。事業場内で教育を行う者や管理監督者、高年齢者と共に働く労働者にも、高年齢者の特性と安全衛生対策についての教育を行うことが望ましいとされている（同指針）。"],"ref":["労働安全衛生法第62条の2第2項","警備業法施行規則第38条第4項"],"src":["https://www.mhlw.go.jp/hourei/doc/kouji/K260212K0010.pdf"]},
{"id":"SD-041","cat":"shidou","sub":"教育の方法","kubun":null,"stem":"誘導の合図や護身術などの実技訓練を行う際の要領として、適当なものはどれか。","choices":["時間を節約するため、手本を見せた後は全員に一斉に繰り返させ、一人一人の動作の確認は省く。","誤った動作に気付いても、受講者の意欲をそがないよう、訓練の終わりにまとめて指摘する。","指導者が手本を示し、動作を区切って要点を説明した上で、一人ずつやらせて誤りを直す。","護身術の訓練は、実際の場面に近づけるため、防具やマットを使わずに全力で行わせる。","手本を見せると受講者がまねるだけになるので、手本は示さず、動作を言葉で説明してやらせる。"],"answer":2,"notes":["誤り。一斉に繰り返させるだけでは、一人一人の動作の誤りが見過ごされ、誤ったまま身に付くおそれがある。","誤り。誤った動作は、繰り返すうちに癖になるので、気付いたその場で、理由を示して直す。","正しい。説明し、やってみせ、やらせてみて誤りを直すという段階を踏むと、正しい動作を確実に身に付けさせることができる。応急の措置や護身の方法に関する教育は、講義の方法及び実技訓練の方法によるものとされている（警備業法施行規則第38条第2項の表の備考第2号）。","誤り。訓練で受講者がけがをしては意味がない。事前に体調を確かめ、防具やマットを使い、段階的に強度を上げるなど、安全に配慮して行う。","誤り。実物を見せたり、やってみせたりすることで、言葉だけでは伝わりにくい動作の要点を理解させることができる。"],"ref":["警備業法施行規則第38条第2項の表の備考第2号"],"src":["https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-042","cat":"shidou","sub":"面接の方法","kubun":null,"stem":"警備員との面接を行う時期や対象に関する次の記述のうち、適当でないものはどれか。","choices":["事故や苦情の当事者となった警備員とは、事実を確かめるとともに本人の気持ちも聴くため、早めに面接する。","面接は、警備員の勤務に支障が出ないよう、問題を起こした警備員に限って行う。","新たに配置した警備員とは、配置後の早い時期に面接し、困っていることや疑問を聴く。","配置換えや勤務時間帯の変更で勤務が大きく変わる警備員とは、変更の前後に面接し、新しい勤務への不安や事情を確かめる。","警備員から相談の申出があったときは、定期の面接を待たずに、できるだけ早く話を聴く機会を設ける。"],"answer":1,"notes":["正しい。事故や苦情の当事者は、自責の念や不安を抱えていることがある。事実を確かめるだけでなく、本人の気持ちを聴き、今後の指導や支援につなげる。","誤り。面接は、問題の指導のためだけでなく、警備員の状況や悩みを把握し、指導や身上の相談に生かすために行う。問題を起こした者に限ると、問題が起きる前に手を打つことができない。定期的な面接は、問題の有無にかかわらず全員を対象とする。","正しい。新たに配置された警備員は、業務や人間関係に慣れず、不安を抱えやすい。早い時期に話を聴き、必要な指導や支援につなげる。","正しい。配置換えや勤務時間帯の変更は、生活のリズムや人間関係が変わり、負担となることがある。変更の前後に面接し、事情を把握して配慮や指導に生かす。","正しい。相談の申出は、本人が困っていることの表れである。すぐに話を聴けないときは、話を聴く時間と場所を確保して本人に伝える。"],"ref":["解釈運用基準 第20の5"],"src":["https://kokoro.mhlw.go.jp/linecare_listen/ls003/"]},
{"id":"SD-043","cat":"shidou","sub":"面接の方法","kubun":null,"stem":"面接で話を聴く側に求められる基本的な態度に関する次の記述のうち、適当でないものはどれか。","choices":["相手の立場に立ち、相手のものの見方や考え方に沿って、その気持ちを理解しようとする。","相手の話を、善悪や好き嫌いで評価することなく、関心を持って聴く。","相手の話に分かりにくいところがあれば、そのままにせず、聴き直して確かめる。","共感するとは、相手の言うことに同調し、「私もそう思う」と賛成を示すことである。","規律に反する考えが語られても、初めから否定せず、なぜそう考えるようになったのかに関心を持って聴く。"],"answer":3,"notes":["正しい。共感的理解の態度である。相手の話を、相手の立場に立って、相手の気持ちに共感しながら理解しようとする（厚生労働省「こころの耳」で紹介されているロジャーズの3原則）。","正しい。無条件の肯定的関心（受容的な態度）である。善悪の評価、好き嫌いの評価を入れずに聴くことで、話し手は安心して話ができる（同）。","正しい。自己一致（純粋性）の態度である。話が分かりにくいときは分かりにくいことを伝えて真意を確かめ、分からないことをそのままにしない（同）。","誤り。共感的理解は、表面的に同調や同感することではなく、話し手のものの見方・考え方に沿って理解しようとすることである（厚生労働省「カウンセリングのスキル」）。理解したことを相手に伝えることは大切だが、相手の意見に賛成することとは異なる。","正しい。相手の話の内容が反社会的なものであっても、初めから否定することなく、なぜそのようなことを考えるようになったのか関心を持って聴くことが、無条件の肯定的関心に基づく傾聴とされている（厚生労働省「こころの耳」）。受け止めることは、その考えを認めることとは異なり、指導が必要な点は、話を十分に聴いた上で伝える。"],"ref":[],"src":["https://kokoro.mhlw.go.jp/listen/listen001/","https://www.mhlw.go.jp/file/06-Seisakujouhou-11800000-Shokugyounouryokukaihatsukyoku/h24text-15.pdf"]},
{"id":"SD-044","cat":"shidou","sub":"面接の方法","kubun":null,"stem":"勤務ぶりに問題のある警備員に改善を求める面接の進め方として、適当なものはどれか。","choices":["改善を求める点は、日時や場所、具体的な行動など、確かめた事実に基づいて伝える。","本人の受け止めに配慮し、改善を求める点ははっきり言わず、遠回しにほのめかす程度にとどめる。","他の警備員から聞いた評判も、問題点の根拠として本人に伝える。","一度の面接で、これまでの問題点をすべて挙げ、まとめて改善を求める。","改善の目標は本人の受け止め方に任せ、いつまでに何をどう改めるかは決めない。"],"answer":0,"notes":["正しい。確かめた事実に基づいて具体的に伝えると、本人も何が問題で、何を改めればよいかを理解しやすい。人格ではなく行動を取り上げることにもなる。","誤り。遠回しな言い方では、本人が問題点に気付かないまま終わるおそれがある。改めてほしい点は、相手の立場に配慮しつつ、はっきり具体的に伝える。","誤り。確かめていない評判を根拠にすると、事実と違っていた場合に本人の信頼を失い、反発を招く。面接の前に事実を確かめておく。","誤り。過去の問題をまとめて挙げると、本人は責められていると感じて受け入れにくくなり、何から改めればよいかも分かりにくい。改めてほしい点をしぼって伝える。","誤り。改善の目標は、本人の考えも聴きながら、いつまでに何をどう改めるかを具体的に決め、その後の様子を確かめる。目標があいまいでは、改善できたかどうかも確かめられない。"],"ref":[],"src":[]},
{"id":"SD-045","cat":"shidou","sub":"面接の方法","kubun":null,"stem":"警備員から深刻な悩みを打ち明けられた場合の対応として、適当なものはどれか。","choices":["「誰にも言わないで」と頼まれたときは、本人との約束を守り、誰にも相談せずに一人で支え続ける。","つらい気持ちを話し始めたときは、気分を変えてもらうため、すぐに明るい話題に切り替える。","専門の相談窓口などにつないだ後も、本人に声をかけ、温かく見守り続ける。","悩みが深刻なほど、相談を受けた者が解決策を決めてあげることを優先する。","話を聴く際は、本人の苦労をねぎらうことは控え、悩みの原因を分析することに集中する。"],"answer":2,"notes":["誤り。「誰にも言わないで」と打ち明けられたときでも、本人の名前を出さずに本人を守りながら、よりよい支え方を相談することはできるとされている（厚生労働省「ゲートキーパーになろう！」）。一人だけで支えようとせず、必要な支援につなげる。","誤り。話をそらすと、本人は受け止めてもらえなかったと感じ、それ以上話さなくなるおそれがある。本人の気持ちを尊重し、じっくりと耳を傾ける。","正しい。悩んでいる人を支えるゲートキーパーには、変化に気づく、じっくりと耳を傾ける、支援先につなげる、温かく見守るという4つの役割が期待されている（同）。つないだ後も関わりを続ける。","誤り。解決策を決めてあげるのではなく、本人の気持ちを尊重しながら一緒に考えることが支援である（同ページの「ゲートキーパーの心得」）。","誤り。相手のこれまでの苦労をねぎらい、心配していることを伝えることは、ゲートキーパーの心得とされている（同）。原因の分析を急ぐと、問い詰められているように感じさせるおそれがある。"],"ref":[],"src":["https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/hukushi_kaigo/seikatsuhogo/gatekeeper1.html","https://kokoro.mhlw.go.jp/attentive/atv005/"]},
{"id":"SD-046","cat":"shidou","sub":"面接の方法","kubun":null,"stem":"面接で相手の話を深めるための応答の仕方として、適当なものはどれか。","choices":["相手の言葉と表情や声の調子が食い違っていても、話された言葉の内容だけを手掛かりに理解する。","相手が話している話題よりも、聴く側が気になった点があれば、すぐにその話題に切り替えて尋ねる。","開かれた質問は話を広げるのに役立つので、相手が答え終わるたびに、間を置かずに次々と重ねる。","相手の話を繰り返したり言い換えたりすると、理解していないと思われるので、避ける。","相手の話から感じ取った気持ちを、「それは悔しかったのですね」のように言葉にして返す。"],"answer":4,"notes":["誤り。話を聴く際は、言葉で表された内容と、身振りや声の調子など言葉以外で表されたものの両方に目を配り、その変化や矛盾に気付くことが重要とされている（厚生労働省「カウンセリングのスキル」）。","誤り。相手が話そうとする話題を安易に変えずについて行くことは、聴き手が積極的に聴いていることを示す行動の一つとされている（同資料）。聴く側の関心で話題を変えると、相手は本当に話したいことを話せなくなる。","誤り。開かれた質問は話が展開しやすいが、連発すると問われた側に負担を感じさせることもあるとされ、閉じられた質問と上手に使い分ける（同資料）。","誤り。相手の言葉を繰り返したり、別の表現に言い換えたりすることは、話を聴いて理解していることを示し、話の焦点をはっきりさせる働きがある（同資料、出入国在留管理庁・文化庁「在留支援のためのやさしい日本語ガイドライン～話し言葉のポイント～」）。","正しい。相手がいま感じている気持ちをとらえて言葉にして返すこと（感情の反映）は、相手が自分の心の底にある感情に気付き、自己理解を深めることに役立つとされている（同資料）。"],"ref":[],"src":["https://www.mhlw.go.jp/file/06-Seisakujouhou-11800000-Shokugyounouryokukaihatsukyoku/h24text-15.pdf","https://www.moj.go.jp/isa/content/001388854.pdf"]},
{"id":"SD-047","cat":"shidou","sub":"業務指導と身上指導","kubun":null,"stem":"報告・連絡・相談がしやすい職場をつくるための対応として、適当でないものはどれか。","choices":["全員に知らせる連絡事項は、詰所の掲示板に貼り出せば、全員に伝わったものとして扱ってよい。","指示を出すときは、いつ、どのような方法で報告するかも併せて伝えておく。","ミスの報告を受けたときは、まず報告したことを受け止め、事実を確かめた上で対応を考える。","報告や提案を受けた事項は、その後の対応や結果を、報告した警備員にも伝える。","悪い知らせほど早く報告するよう日頃から伝え、早く報告した者をきちんと評価する。"],"answer":0,"notes":["誤り。掲示しただけでは、見ていない者や読み違えた者がいても分からない。重要な連絡は、受け取ったことを確かめたり、内容を復唱させたりして、確実に伝わったことを確かめる。","正しい。報告の時期や方法をあらかじめ決めておくと、警備員は迷わずに報告でき、報告の遅れや漏れを防げる。","正しい。ミスを報告した者を頭ごなしに叱ると、その後は報告がためらわれ、問題が隠されるおそれがある。怒りにまかせて怒鳴るのではなく、なぜミスが起きたのかを一緒に確かめる。","正しい。報告や提案がどう扱われたかが分からないと、報告や提案をする意欲がそがれる。提案を採用しなかったときも、その理由を説明する。","正しい。事故や苦情などの悪い知らせは、報告が遅れるほど対応が難しくなる。早く報告することを評価する姿勢を示すと、報告しやすい雰囲気ができる。"],"ref":[],"src":["https://www.mhlw.go.jp/content/11300000/001388287.pdf"]},
{"id":"SD-048","cat":"shidou","sub":"業務指導と身上指導","kubun":null,"stem":"厚生労働省のパワーハラスメント防止指針（令和2年厚生労働省告示第5号）に関する次の記述のうち、誤っているものはどれか。","choices":["警備員が業務を行う依頼者の施設や工事現場も、パワーハラスメントの判断における「職場」に含まれる。","パワーハラスメントは、職務上の地位が上位の者から下位の者に対して行われる言動に限られる。","新たに採用した者を育成するため、短期間集中的に別室で教育を行うことは、該当しないと考えられる例とされている。","新卒で採用した者に必要な教育を行わずに到底対応できない目標を課し、達成できないと厳しく叱責するのは、該当すると考えられる例とされている。","パワーハラスメントに当たるか否か微妙な場合であっても、広く相談に対応することとされている。"],"answer":1,"notes":["正しい。「職場」とは、事業主が雇用する労働者が業務を遂行する場所を指し、通常就業している場所以外の場所であっても、業務を遂行する場所は含まれる（パワーハラスメント防止指針 2(2)）。","誤り。「優越的な関係を背景とした」言動には、職務上の地位が上位の者による言動のほか、業務上必要な知識や豊富な経験を有している同僚又は部下による言動で、その協力を得なければ業務の円滑な遂行が困難なもの、同僚又は部下からの集団による行為で抵抗又は拒絶することが困難なものも含まれる（同指針 2(4)）。","正しい。人間関係からの切り離しの類型で、パワーハラスメントに該当しないと考えられる例とされている（同指針 2(7)ハ）。","正しい。過大な要求の類型で、パワーハラスメントに該当すると考えられる例とされている（同指針 2(7)ニ）。一方、労働者を育成するために現状よりも少し高いレベルの業務を任せることは、該当しないと考えられる例とされている。","正しい。相談窓口では、パワーハラスメントが現実に生じている場合だけでなく、その発生のおそれがある場合や、該当するか否か微妙な場合であっても、広く相談に対応し、適切な対応を行うようにすることとされている（同指針 4(2)ロ）。"],"ref":["事業主が職場における優越的な関係を背景とした言動に起因する問題に関して雇用管理上講ずべき措置等についての指針（令和2年厚生労働省告示第5号）"],"src":["https://www.mhlw.go.jp/web/t_doc?dataId=00011660&dataType=0&pageNo=1"]},
{"id":"SD-049","cat":"shidou","sub":"業務指導と身上指導","kubun":null,"stem":"心の健康問題で休業した警備員の職場復帰を支援する際の対応として、適当なものはどれか。","choices":["休業中も職場の様子が分かるよう、現場の状況や業務の連絡をこまめに入れる。","産業医のいない小規模な事業場では、外部の支援は受けられないので、自社だけで対応する。","同僚の理解を得るため、復帰する警備員の病名と休業中の様子を、あらかじめ同僚に説明しておく。","主治医が復帰可能と判断した後も、業務を遂行できる状態かを確かめて、復帰の時期や勤務を決める。","復帰した警備員には、再発を防ぐため、周囲の警備員からも体調や休業中の様子を詳しく尋ねさせる。"],"answer":3,"notes":["誤り。休業中は療養に専念できるよう、最小限の引継ぎの後は業務に関する連絡はとらないように心がけ、連絡は1〜2か月に1回程度とすることとされている（厚生労働省「こころの耳」）。経済的な不安を軽くするため、傷病手当金の制度や復職の手順などの情報は提供する。","誤り。産業保健スタッフがいない場合は、人事労務管理スタッフや衛生管理者などが、主治医や産業保健総合支援センター（こころの耳の記事では旧称の「都道府県産業保健推進センター」）、従業員50人未満の事業場では地域産業保健センターなどと連携をとりながら進めることとされている（同）。産業医が選任されていない小規模事業場でも、これらの事業場外資源を活用して職場復帰支援を進める（厚生労働省「心の健康問題により休業した労働者の職場復帰支援の手引き」）。","誤り。病名を同僚に伝える必要はなく、残業の制限など具体的に必要な配慮の内容を伝える。他の人に伝える場合も、原則として本人の了解を得て、伝える範囲は必要最小限とする（同）。","正しい。主治医による診断書の内容は、病状の回復程度によって職場復帰の可能性を判断していることが多く、ただちに職場で求められる業務遂行能力まで回復しているとの判断とは限らないとされている（厚生労働省「心の健康問題により休業した労働者の職場復帰支援の手引き」）。すぐに復帰を決めず、勤務時間の配慮や職場環境の調整が必要かも確かめた上で、職場復帰支援のプランを作る。","誤り。職場復帰の際、周囲の者は自然な態度で迎え、根掘り葉掘り状況を聞くようなことは慎むこととされている（厚生労働省「こころの耳」）。復帰後は、時間短縮勤務や業務の軽減などを段階的に行いながら、徐々に通常の勤務に戻す。"],"ref":[],"src":["https://kokoro.mhlw.go.jp/attentive/atv007/","https://kokoro.mhlw.go.jp/attentive/atv004/","https://www.mhlw.go.jp/content/000561013.pdf"]},
{"id":"SD-050","cat":"shidou","sub":"業務指導と身上指導","kubun":null,"stem":"警備員による犯罪や非違行為の事例を、指導及び教育に生かす際の考え方として、適当なものはどれか。","choices":["事例を取り上げると警備員の間に不信感が広がるので、事例は伏せて一般的な注意にとどめる。","事例を教材にするときは、当事者の氏名と処分の内容を示し、責任の所在をはっきりさせる。","事例の背景にあった借金や職場での不満などを分析し、身上の変化に気付く着眼点を整理する。","私物のスマートフォンで撮影した現場の写真の扱いは、私生活上のことなので本人の判断に任せる。","採用時に欠格事由の確認を徹底すれば、採用後の身上指導によって非違行為を防ぐ必要はない。"],"answer":2,"notes":["誤り。事例を伏せて一般的な注意にとどめると、警備員は自分の問題として受け止めにくい。具体的な事例を分析し、どうすれば防げたかを考えさせる。警備員指導教育責任者講習でも、「警備員による犯罪事例の分析と身上指導要領」が講習事項とされている（指導教育責任者講習の運用通達 別表第1）。","誤り。当事者の氏名や処分を示すと、個人の名誉やプライバシーを損なううえ、責任追及が目的と受け取られ、警備員が問題を隠すようになるおそれがある。教材にするときは個人が特定されないよう配慮し、原因と防止策に焦点を当てる。","正しい。警備業者は、警備員に対し、業務上だけでなく身分上の指導及び監督も行う（警備業法第21条第2項、解釈運用基準 第20の5）。事例の背景を分析し、日頃の身上の把握と指導に生かす。","誤り。業務中に撮影した現場の写真には、依頼者の施設の構造や警備の配置などの情報が含まれることがあり、私物で撮影したものであっても、SNSへの投稿などで外部に漏れると、依頼者の信頼を損ない、犯罪に悪用されるおそれもある。取扱いの決まりを定めて指導する。","誤り。採用時に欠格事由に該当しないことを確認していても（警備業法第14条、同法施行規則第66条第1項第2号）、採用後に生活や職場の事情が変わって非違行為に至ることがある。採用後も、身上の把握と指導を続ける。"],"ref":["警備業法第14条","警備業法第21条第2項","警備業法施行規則第66条第1項第2号","解釈運用基準 第20の5","指導教育責任者講習の運用通達（令和6年6月27日）別表第1"],"src":[]}
]

<script>
(function(){
'use strict';
var KEY='keibi_shidou_v1', EXAM_KEY='keibi_shidou_exam_v1';
var CATS={
  kihon:{label:'基本原則',long:'警備業務実施の基本原則',exam:1,desc:'警備業法第15条〜第17条（基本原則・服装・護身用具）の趣旨。'},
  hourei:{label:'法令',long:'警備業法その他の法令',exam:14,desc:'警備業法・施行令・施行規則と、憲法・刑法・刑事訴訟法・警察官職務執行法・遺失物法・軽犯罪法。'},
  chishiki:{label:'基本知識',long:'基本的な知識及び技能',exam:4,desc:'警察機関への連絡の方法、現場保存の方法、避難誘導の方法。'},
  senmon:{label:'専門',long:'区分ごとの専門的な知識及び技能',exam:14,desc:'受講する警備業務の区分（1号・2号）の専門知識と関係法令。'},
  shidou:{label:'指導・教育',long:'警備員の指導及び教育',exam:7,desc:'指導及び教育の重要性、効果的な面接方法、業務指導の実施要領。'}
};
var ORDER=['kihon','hourei','chishiki','senmon','shidou'];
var PLAN=[['kihon',1],['hourei',14],['chishiki',4],['senmon',14],['shidou',7]];
var KUBUN={
  '1':{label:'1号',short:'施設',long:'施設警備・空港保安・機械警備'},
  '2':{label:'2号',short:'交通・雑踏',long:'交通誘導・雑踏警備'}
};
var MINUTES=100, KEIBI_IN_HOUREI=9;
var BUILD='2026-11-26 13:15';  /* build.py が作成日時を入れる */

var $band=document.getElementById('band'), $bar=document.getElementById('bar'), $app=document.getElementById('app');
var Q=[], byId={}, AV={}, loaded=false, loadError='';
var ui={view:'home'}, sess=null, lastExam=null, lastResult=null, timer=null, notice='';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function readJSON(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function removeKey(k){try{localStorage.removeItem(k);}catch(e){}}

var store=readJSON(KEY)||{};
if(store.kubun!=='1'&&store.kubun!=='2') store.kubun='2';
store.st=store.st||{}; store.wrong=store.wrong||{}; store.hist=store.hist||[];
function save(){writeJSON(KEY,store);}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(arr,n){return shuffle(arr.slice()).slice(0,Math.max(0,n));}
function orderFor(q){var idx=[0,1,2,3,4];var short=q.choices.every(function(c){return c.length<=15;});return short?idx:shuffle(idx);}
function pad(n){return (n<10?'0':'')+n;}
function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+pad(s%60);}
function fmtMin(ms){var m=Math.round(ms/60000);return m<1?'1分未満':m+'分';}
function fmtDate(t){var d=new Date(t);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+pad(d.getMinutes());}
function passLine(total){return Math.ceil(total*0.8);}

function pool(cat,kubun){return Q.filter(function(q){return q.cat===cat&&(cat!=='senmon'||q.kubun===kubun);});}
function record(id,ok){var s=store.st[id]||(store.st[id]={n:0,c:0});s.n++;if(ok){s.c++;delete store.wrong[id];}else{store.wrong[id]=Date.now();}}
function wrongIds(){return Object.keys(store.wrong).filter(function(id){return byId[id];});}
function catAcc(qs){var n=0,c=0,seen=0;qs.forEach(function(q){var s=store.st[q.id];if(s&&s.n){seen++;n+=s.n;c+=s.c;}});return {seen:seen,n:n,c:c};}
function priority(qs){
  var fresh=[],weak=[],rest=[];
  qs.forEach(function(q){var s=store.st[q.id];if(!s||!s.n)fresh.push(q);else if(store.wrong[q.id]||s.c/s.n<.6)weak.push(q);else rest.push(q);});
  return shuffle(fresh).concat(shuffle(weak),shuffle(rest));
}

function choiceList(q,ord,opts){

  return '<ol class="choices">'+ord.map(function(o,pos){

function startPractice(qs,title){
  var ids=qs.map(function(q){return q.id;}), orders={};
  qs.forEach(function(q){orders[q.id]=orderFor(q);});
  sess={mode:'practice',title:title,ids:ids,orders:orders,ans:{},i:0};

function buildExam(k){
  var ids=[], blocked={};
  /* 同じ論点の問題（avoid）が1回の模擬試験に重ならないよう、順に選ぶ */
  function take(list,n){
    var out=[];
    shuffle(list.slice()).forEach(function(q){
      if(out.length>=n||blocked[q.id]) return;
      out.push(q);blocked[q.id]=1;(AV[q.id]||[]).forEach(function(a){blocked[a]=1;});
    });
    return out;
  }
  PLAN.forEach(function(p){
    var cat=p[0], n=p[1], got;
    if(cat==='hourei'){
      var ke=Q.filter(function(q){return q.cat==='hourei'&&q.sub==='警備業法';}), ot=Q.filter(function(q){return q.cat==='hourei'&&q.sub!=='警備業法';});
      var a=take(ke,KEIBI_IN_HOUREI), b=take(ot,n-a.length);
      if(a.length+b.length<n){a=a.concat(take(ke,n-a.length-b.length));}
      got=a.concat(b);
    }else got=take(pool(cat,k),n);
    got.forEach(function(q){ids.push(q.id);});
  });
  var orders={};ids.forEach(function(id){orders[id]=orderFor(byId[id]);});
  var now=Date.now();
  return {mode:'exam',kubun:k,ids:ids,orders:orders,ans:{},flag:{},i:0,start:now,end:now+MINUTES*60000,done:false};
}
function startExam(){
  sess=buildExam(store.kubun);
  notice=sess.ids.length<40?'問題が足りないため '+sess.ids.length+'問で出題しています。':'';
  writeJSON(EXAM_KEY,sess);startTimer();go('exam');
}
function startTimer(){
  stopTimer();
  timer=setInterval(function(){
    if(!inExam()){stopTimer();return;}
    var left=sess.end-Date.now(), el=document.getElementById('clock');
    if(el){el.textContent=fmt(left);el.classList.toggle('low',left<600000);}
    if(left<=0){finishExam(true);}
  },1000);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function grade(ex,timeout){
  var score=0, by={};
  ex.ids.forEach(function(id){
    var q=byId[id], b=by[q.cat]||(by[q.cat]={n:0,c:0}), ok=ex.ans[id]===q.answer;
    b.n++; if(ok){score++;b.c++;} record(id,ok);
  });
  var total=ex.ids.length;
  var res={date:Date.now(),kubun:ex.kubun,score:score,total:total,pass:score>=passLine(total),by:by,used:Math.min(Date.now(),ex.end)-ex.start,timeout:!!timeout};
  store.hist.unshift(res);store.hist=store.hist.slice(0,60);save();
  ex.done=true;removeKey(EXAM_KEY);
  return res;
}
function finishExam(timeout){
  stopTimer();
  lastResult=grade(sess,timeout);lastExam=sess;sess=null;notice='';
  go('result');
}
function saveExam(){if(inExam())writeJSON(EXAM_KEY,sess);}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t||t.disabled||t.getAttribute('aria-disabled')==='true') return;
  var a=t.getAttribute('data-act');
  switch(a){
    case 'home':
      if(inExam()){ui.view='home';render(true);return;} /* exam continues; resume from home */
      sess=null;notice='';go('home');break;
    case 'kubun':
      if(inExam()) return;
      store.kubun=t.getAttribute('data-k');save();render(false);break;
    case 'setup':
      ui.cat=t.getAttribute('data-c');ui.sub='';ui.cnt=10;go('setup');break;
    case 'sub': ui.sub=t.getAttribute('data-s');render(false);break;
    case 'cnt': ui.cnt=+t.getAttribute('data-n');render(false);break;
    case 'start':
      var qs=pool(ui.cat,store.kubun);if(ui.sub)qs=qs.filter(function(q){return q.sub===ui.sub;});
      qs=priority(qs);if(ui.cnt)qs=qs.slice(0,ui.cnt);
      startPractice(qs,CATS[ui.cat].long+(ui.sub?'・'+ui.sub:''));break;
    case 'pick':
      var id=sess.ids[sess.i];if(sess.ans[id]!==undefined)return;
      var o=+t.getAttribute('data-o');sess.ans[id]=o;record(id,o===byId[id].answer);save();render(false);
      var nb=document.getElementById('nextBtn');if(nb){nb.focus({preventScroll:true});}
      break;
    case 'next':
      if(sess.i+1<sess.ids.length){sess.i++;go('practice');}else go('practiceEnd');break;
    case 'quit': sess=null;go('home');break;
    case 'retry':
      var miss=sess.ids.filter(function(x){return sess.ans[x]!==byId[x].answer;}).map(function(x){return byId[x];});
      startPractice(shuffle(miss),'解き直し');break;
    case 'exam':
      if(!loaded||!Q.length) return;
      startExam();break;
    case 'resume':
      var ex=readJSON(EXAM_KEY);if(!ex)return;sess=ex;startTimer();go('exam');break;
    case 'mark':
      var mid=sess.ids[sess.i], mo=+t.getAttribute('data-o');
      if(sess.ans[mid]===mo) delete sess.ans[mid]; else sess.ans[mid]=mo;
      saveExam();render(false);break;
    case 'flag':
      var fid=sess.ids[sess.i];if(sess.flag[fid])delete sess.flag[fid];else sess.flag[fid]=true;saveExam();render(false);break;
    case 'prev': if(sess.i>0){sess.i--;saveExam();ui.grid=false;render(true);}break;
    case 'fwd': if(sess.i+1<sess.ids.length){sess.i++;saveExam();ui.grid=false;render(true);}break;
    case 'grid':
      if(ui.view!=='exam'){ui.view='exam';}
      ui.grid=!ui.grid;ui.confirm=false;render(false);if(ui.grid)window.scrollTo(0,0);break;
    case 'jump': sess.i=+t.getAttribute('data-i');ui.grid=false;saveExam();render(true);break;
    case 'submitask':
      if(ui.view!=='exam'){ui.view='exam';}
      ui.confirm=true;ui.grid=false;render(false);window.scrollTo(0,0);
      var pb=document.querySelector('[data-act="submit"]');if(pb)pb.focus({preventScroll:true});break;
    case 'cancel': ui.confirm=false;render(false);break;
    case 'submit': finishExam(false);break;
    case 'wrongs': go('wrongs');break;
    case 'wrongstart': startPractice(shuffle(wrongIds().map(function(x){return byId[x];})),'間違えた問題');break;
    case 'stats': go('stats');break;
    case 'reset': ui.reset=true;render(false);break;
    case 'resetno': ui.reset=false;render(false);break;
    case 'resetgo': store={kubun:store.kubun,st:{},wrong:{},hist:[]};save();ui.reset=false;render(false);break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey) return;
  var tag=(e.target&&e.target.tagName)||'';if(tag==='INPUT'||tag==='TEXTAREA')return;
  if((ui.view==='practice'||ui.view==='exam')&&sess&&/^[1-5]$/.test(e.key)){
    var btns=document.querySelectorAll('#qcard .choice');var b=btns[+e.key-1];if(b){b.click();e.preventDefault();}
  }else if(ui.view==='exam'&&inExam()&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!ui.confirm){
    var act=e.key==='ArrowRight'?'fwd':'prev';var el=document.querySelector('[data-act="'+act+'"]');if(el&&!el.disabled){el.click();e.preventDefault();}
  }
});

/* ---------- boot ---------- */
/* 問題データはページの中（#qdata）に埋め込んである。公開ページでは別ファイルを読みに行く通信が止められるため */
(function(){
  var data=null;
  try{data=JSON.parse(document.getElementById('qdata').textContent);}catch(e){loadError=String(e&&e.message||e);}
  if(data) boot(data); else render(false);
})();
function boot(data){
  Q=data.filter(function(q){return q&&q.id&&q.choices&&q.choices.length===5&&q.notes&&q.notes.length===5&&q.answer>=0&&q.answer<5;});
  Q.forEach(function(q){byId[q.id]=q;});
  Q.forEach(function(q){(q.avoid||[]).forEach(function(a){(AV[q.id]=AV[q.id]||[]).push(a);(AV[a]=AV[a]||[]).push(q.id);});});
  loaded=true;
  var ex=readJSON(EXAM_KEY);
  if(ex&&!ex.done&&ex.ids){
    if(!ex.ids.every(function(id){return byId[id];})){removeKey(EXAM_KEY);}
    else if(Date.now()>=ex.end){var r=grade(ex,true);lastResult=r;lastExam=ex;notice='前回の模擬試験は時間切れのため採点しました（'+r.score+' / '+r.total+'問）。記録から確認できます。';}
  }
  render(false);
}
})();
</script>
