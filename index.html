{"id":"S1-075","cat":"senmon","sub":"消防法","kubun":"1","stem":"消防法令に定める防火管理に関する次の記述のうち、誤っているものはどれか。","choices":["飲食店や物品販売店舗は、収容人員が30人以上であれば、防火管理者を定めなければならない防火対象物となる。","共同住宅や事務所などの防火対象物は、収容人員が50人以上となると、防火管理者の選任が必要となる。","百貨店や病院などの防火管理者は、消防計画に基づく消火訓練及び避難訓練を年1回実施すれば足りる。","防火管理上必要な業務の一部を警備業者などの外部の者に委託している場合は、消防計画に受託者の氏名及び住所並びに受託者の行う業務の範囲及び方法を定めなければならない。","防火管理者は、原則として、その防火対象物において防火管理上必要な業務を適切に遂行することができる管理的又は監督的な地位にある者でなければならない。"],"answer":2,"notes":["正しい。令別表第一(3)項（飲食店等）、(4)項（物品販売店舗等）などの防火対象物は、収容人員が30人以上のものが防火管理者を定めなければならない防火対象物となる（消防法施行令第1条の2第3項第1号ロ）。なお、(6)項ロの社会福祉施設等は10人以上である（同号イ）。","正しい。共同住宅（令別表第一(5)項ロ）や事務所（同(15)項）などは、収容人員が50人以上のものが防火管理者を定めなければならない防火対象物となる（消防法施行令第1条の2第3項第1号ハ）。","誤り。令別表第一(1)項から(4)項まで、(5)項イ、(6)項、(9)項イ、(16)項イ又は(16の2)項の防火対象物の防火管理者は、消火訓練及び避難訓練を年2回以上実施しなければならない（消防法施行規則第3条第10項）。実施する場合には、あらかじめ、その旨を消防機関に通報しなければならない（同条第11項）。","正しい。防火管理上必要な業務の一部が関係者及び関係者に雇用されている者以外の者に委託されている防火対象物では、防火管理者は、消防計画に、受託者の氏名及び住所並びに受託者の行う防火管理上必要な業務の範囲及び方法を定めなければならない（消防法施行規則第3条第2項）。","正しい。防火管理者は、甲種防火管理講習の課程の修了等の政令で定める資格を有する者で、防火管理上必要な業務を適切に遂行することができる管理的又は監督的な地位にあるものとされている（消防法施行令第3条第1項）。管理的又は監督的な地位にある者が遠隔の地に勤務している場合などの特例がある（同条第2項）。"],"ref":["消防法第8条","消防法施行令第1条の2","消防法施行令第3条","消防法施行規則第3条"],"src":[]},
{"id":"S1-076","cat":"senmon","sub":"消防法","kubun":"1","stem":"誘導灯及び誘導標識に関する消防法令の基準についての次の記述のうち、正しいものはどれか。","choices":["避難口誘導灯は、避難口である旨を表示した緑色の灯火とする。","避難口誘導灯及び通路誘導灯は、火災が発生したときに点灯すれば足り、常時点灯しておく必要はない。","誘導灯の非常電源は、誘導灯を有効に10分間作動できる容量であれば足りる。","誘導灯の周囲には、誘導灯をさえぎらない限り、誘導灯とまぎらわしい灯火や広告物を設けてもよい。","誘導標識は、廊下及び通路の各部分から一の誘導標識までの歩行距離が15メートル以下となるように設ければ足りる。"],"answer":0,"notes":["正しい。消防法施行令第26条第2項第1号のとおりである。通路誘導灯は避難の方向を明示した緑色の灯火とし（同項第2号）、誘導標識は避難口である旨又は避難の方向を明示した緑色の標識とする（同項第5号）。","誤り。避難口誘導灯及び通路誘導灯（階段又は傾斜路に設けるものを除く。）は、常時点灯していなければならない。消灯できるのは、防火対象物が無人である場合や、一定の場所で自動火災報知設備の感知器の作動と連動して点灯するよう措置されている場合などに限られる（消防法施行規則第28条の3第4項第2号）。","誤り。非常電源は、誘導灯を有効に20分間（消防庁長官が定める要件に該当する大規模な防火対象物の避難口等に設けるものなどは60分間）作動できる容量以上としなければならない（消防法施行規則第28条の3第4項第10号）。なお、自動火災報知設備の蓄電池設備の容量は10分間作動できる容量以上である（同規則第24条第4号ロ）。","誤り。誘導灯の周囲には、誘導灯とまぎらわしい又は誘導灯をさえぎる灯火、広告物、掲示物等を設けてはならない（消防法施行規則第28条の3第4項第8号）。","誤り。誘導標識は、避難口又は階段に設けるものを除き、各階ごとに、その廊下及び通路の各部分から一の誘導標識までの歩行距離が7.5メートル以下となる箇所及び曲り角に設ける（消防法施行規則第28条の3第5項第1号）。"],"ref":["消防法施行令第26条","消防法施行規則第24条第4号","消防法施行規則第28条の3"],"src":[]},
{"id":"S1-077","cat":"senmon","sub":"銃刀法","kubun":"1","stem":"銃砲刀剣類所持等取締法に定める、所持の許可を受けた銃砲等の取扱いに関する次の記述のうち、正しいものはどれか。","choices":["所持の許可を受けていれば、許可を受けた銃砲等を、用途や理由を問わず携帯し、又は運搬することができる。","許可を受けた銃砲等を保管設備に保管するときは、その銃砲等に適合する実包等も同じ設備に保管しなければならない。","許可を受けた銃砲等は、すぐに使用できるよう、運搬中も実包等を装塡しておくことができる。","許可を受けた銃砲等を携帯し、又は運搬するときは、発射が認められる場合を除き、覆いをかぶせ、又は容器に入れる。","許可を受けた銃砲等は、銃砲店等に保管を委託しなければならず、許可を受けた者が自ら保管することはできない。"],"answer":3,"notes":["誤り。許可を受けた者は、許可に係る用途に供する場合その他正当な理由がある場合を除いては、許可を受けた銃砲等を携帯し、又は運搬してはならない（銃砲刀剣類所持等取締法第10条第1項）。違反には罰則がある（同法第31条の18第2項第1号）。","誤り。保管設備に銃砲等を保管するときは、その銃砲等に適合する実包等を当該銃砲等と共に保管してはならない（同法第10条の4第3項）。","誤り。許可を受けた者は、狩猟や指定射撃場での射撃など発射が認められる場合を除き、銃砲等に実包、空包、金属性弾丸又は矢（実包等）を装塡しておいてはならない（同法第10条第5項）。","正しい。同法第10条第4項のとおりである。銃砲等を携帯し、又は運搬する者は、許可証を常に携帯していなければならず（同法第24条第1項）、警察官は、その提示を求めることができる（同条第2項）。","誤り。許可を受けた者は、保管の委託をする場合その他正当な理由がある場合を除き、許可に係る銃砲等を自ら保管しなければならない（同法第10条の4第1項）。保管は、内閣府令で定める基準に適合する設備及び方法により行う（同条第2項）。"],"ref":["銃砲刀剣類所持等取締法第10条","銃砲刀剣類所持等取締法第10条の4","銃砲刀剣類所持等取締法第24条","銃砲刀剣類所持等取締法第31条の18第2項"],"src":[]},
{"id":"S1-078","cat":"senmon","sub":"銃刀法","kubun":"1","stem":"銃砲刀剣類所持等取締法の拳銃等に関する規制についての次の記述のうち、誤っているものはどれか。","choices":["拳銃の銃身、機関部体、回転弾倉又はスライドは「拳銃部品」とされ、法定の場合を除き、所持が禁止されている。","拳銃等を不法に所持した者は、3年以下の拘禁刑又は50万円以下の罰金に処せられる。","拳銃に使用することができる実包として内閣府令で定めるもの（拳銃実包）は、法定の場合を除き、所持が禁止されている。","何人も、法定の場合を除き、道路、駅、劇場、百貨店など不特定若しくは多数の者の用に供される場所において、銃砲等を発射してはならない。","拳銃等を不法に所持する者が、その拳銃等を提出して自首したときは、所持の罪の刑が減軽され、又は免除される。"],"answer":1,"notes":["正しい。銃砲刀剣類所持等取締法第3条の2第1項のとおりである。","誤り。同法第3条第1項の規定に違反して拳銃等（拳銃、小銃、機関銃又は砲）を所持した者は、1年以上10年以下の拘禁刑に処せられる（同法第31条の3第1項）。3年以下の拘禁刑又は50万円以下の罰金は、刀剣類などを不法に所持した場合の法定刑である（同法第31条の16第1項第1号）。","正しい。同法第3条の3第1項のとおりである。","正しい。同法第3条の13のとおりである。これらの場所に向かって発射することも禁止されている。同条の対象は、以前は拳銃等（拳銃、小銃、機関銃又は砲）に限られていたが、現行法では猟銃、空気銃、クロスボウなどを含む銃砲等に広げられている。違反した者は、狩猟等の用途に係る一定の場合を除き、無期又は3年以上の拘禁刑に処せられる（同法第31条第1項）。","正しい。拳銃等を不法に所持する者が当該拳銃等を提出して自首したときは、所持の罪等の刑を減軽し、又は免除する（同法第31条の5）。"],"ref":["銃砲刀剣類所持等取締法第3条の2","銃砲刀剣類所持等取締法第3条の3","銃砲刀剣類所持等取締法第3条の13","銃砲刀剣類所持等取締法第31条","銃砲刀剣類所持等取締法第31条の3","銃砲刀剣類所持等取締法第31条の5","銃砲刀剣類所持等取締法第31条の16"],"src":[]},
{"id":"S1-079","cat":"senmon","sub":"銃刀法","kubun":"1","stem":"銃砲刀剣類所持等取締法第22条の刃物の携帯の禁止に関する次の記述のうち、誤っているものはどれか。","choices":["刃体の長さは、原則として、刃物の切先と柄部における切先に最も近い点とを結ぶ直線の長さで計る。","ねじがあるはさみの刃体の長さは、切先とねじの中心とを結ぶ直線の長さで計る。","刃体の長さが8センチメートル以下の折りたたみ式のナイフは、開刃した刃体をさやに固定させる装置を有するものであっても、携帯の禁止の対象から除かれる。","刃体の長さが8センチメートル以下の果物ナイフで、刃体の厚みが0.15センチメートルを超えず、かつ、先端部が丸みを帯びているものは、携帯の禁止の対象から除かれる。","刃体の長さが8センチメートル以下のはさみで、刃体の先端部が著しく鋭く、かつ、刃が鋭利なもの以外のものは、携帯の禁止の対象から除かれる。"],"answer":2,"notes":["正しい。銃砲刀剣類所持等取締法施行規則第101条第1項のとおりである。切先がない刃物又は切先が明らかでない刃物は、刃体の先端で計る。","正しい。同規則第101条第2項第2号のとおりである。","誤り。携帯の禁止の対象から除かれる折りたたみ式のナイフは、刃体の長さが8センチメートル以下で、刃体の幅が1.5センチメートル、厚みが0.25センチメートルをそれぞれ超えず、かつ、開刃した刃体をさやに固定させる装置を有しないものに限られる（同法第22条ただし書、同法施行令第43条第2号）。","正しい。同法施行令第43条第3号のとおりである。このほか、刃体の長さが7センチメートル以下の切出しで、刃体の幅が2センチメートル、厚みが0.2センチメートルをそれぞれ超えないものも除かれる（同条第4号）。","正しい。同法第22条ただし書、同法施行令第43条第1号のとおりである。なお、携帯の禁止の対象から除かれる刃物であっても、正当な理由なく隠して携帯すれば、軽犯罪法第1条第2号に当たり得る。"],"ref":["銃砲刀剣類所持等取締法第22条","銃砲刀剣類所持等取締法施行令第43条","銃砲刀剣類所持等取締法施行規則第101条","軽犯罪法第1条第2号"],"src":["https://laws.e-gov.go.jp/law/333M50000002016"]},
{"id":"S1-080","cat":"senmon","sub":"銃刀法","kubun":"1","stem":"銃砲刀剣類所持等取締法に定める登録を受けた刀剣類の取扱いに関する次の記述のうち、正しいものはどれか。","choices":["登録を受けた刀剣類を譲り渡すときは、その刀剣類の登録証とともにしなければならない。","登録を受けた刀剣類を譲り受けた者は、30日以内に、その旨を登録の事務を行った都道府県の教育委員会に届け出なければならない。","登録を受けた刀剣類を研ぎ（研ま）のために研師に預けたときも、その旨を教育委員会に届け出なければならない。","登録を受けた刀剣類を所持する者は、正当な理由がなくても、これを携帯し、又は運搬することができる。","登録証を亡失したときは、速やかに最寄りの警察署に届け出て、再交付を受けなければならない。"],"answer":0,"notes":["正しい。銃砲刀剣類所持等取締法第18条第1項のとおりである。譲り受ける者も登録証とともにしなければならず（同条第2項）、刀剣類とともにする場合を除き、登録証だけを譲り渡し、又は譲り受けてはならない（同条第3項）。","誤り。登録を受けた刀剣類を譲り受け、又は相続により取得した者は、20日以内に、登録の事務を行った都道府県の教育委員会に届け出なければならない（同法第17条第1項）。","誤り。試験、研究、研ま若しくは修理のため、又は公衆の観覧に供するため貸し付け、又は保管の委託をした場合は、届出を要しない（同法第17条第2項）。","誤り。登録を受けた刀剣類を所持する者も、正当な理由がある場合を除いては、これを携帯し、又は運搬してはならない（同法第21条で準用する第10条第1項）。違反には罰則がある（同法第31条の18第2項第1号）。","誤り。登録証を亡失し、若しくは盗み取られ、又は滅失した場合は、速やかに、登録の事務を行った都道府県の教育委員会に届け出て、再交付を受けなければならない（同法第15条第2項）。なお、刀剣類そのものを亡失し、又は盗み取られたときは、直ちに警察官に届け出なければならない（同法第23条の2）。"],"ref":["銃砲刀剣類所持等取締法第15条","銃砲刀剣類所持等取締法第17条","銃砲刀剣類所持等取締法第18条","銃砲刀剣類所持等取締法第21条","銃砲刀剣類所持等取締法第23条の2"],"src":[]},
{"id":"S2-001","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"交通誘導警備員が行う車両等の誘導の法的な性質に関する次の記述のうち、誤っているものはどれか。","choices":["警備業者及び警備員は、警備業務を行うに当たっては、警備業法により特別に権限を与えられているものでないことに留意しなければならない。","道路交通法上、手信号等により交通整理を行うことができる「警察官等」とは、警察官及び交通巡視員をいう。","道路交通法第7条により、道路を通行する歩行者等又は車両等は、信号機の表示する信号又は警察官等の手信号等に従わなければならない。","交通誘導警備員が行う停止の合図は、警察官等の手信号等と同じ効力を持つので、運転者はこれに従う法律上の義務を負う。","交通誘導警備員による誘導は、運転者や歩行者の任意の協力を得て行うものである。"],"answer":3,"notes":["正しい。警備業法第15条のとおりである。警備業務は警察業務とは本質を異にし、私人のいわゆる管理権等の範囲内で行われるものである（解釈運用基準 第14）。","正しい。道路交通法第6条第1項により、警察官又は交通巡視員（警察官等）は、手信号その他の信号（手信号等）により交通整理を行うことができる。","正しい。道路交通法第7条のとおりである。交通誘導警備員の合図は、信号機の表示する信号にも警察官等の手信号等にも当たらない。","誤り。交通誘導警備員は警察官等ではなく、その合図は道路交通法第6条の手信号等に当たらない。運転者に同法第7条の従う義務が生じるものではなく、交通誘導警備員には交通規制の権限もない（警備業法第15条）。","正しい。交通誘導警備員には交通規制の権限がないため、合図や声掛けによって運転者や歩行者の任意の協力を求めて誘導する（警備業法第15条、解釈運用基準 第14）。だからこそ、相手に確実に伝わる明確な合図が重要となる。"],"ref":["警備業法第15条","道路交通法第6条第1項","道路交通法第7条","解釈運用基準 第14"],"src":[]},
{"id":"S2-002","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"信号機のある交差点の付近で交通誘導を行う場合の措置に関する次の記述のうち、適当でないものはどれか。","choices":["信号機の表示する信号に従って誘導し、赤色の灯火の信号に対面する車両に進行を促すことはしない。","交差点の付近で歩行者を誘導しているときは、車両が進入してきても、歩行者の方を向いたまま誘導を続ける。","青色の灯火の信号に対面する車両を停止させる必要があるときは、運転者が信号を注視していて停止の合図に気付かないおそれがあることに注意する。","工事箇所の手前に案内看板を置くなどして、片側交互通行を行っていることを運転者に知らせる。","交差点の直近に作業帯や保安施設を設けるときは、交差点の見通しを妨げないように配慮する。"],"answer":1,"notes":["正しい。信号機の表示する信号と異なる意味を表示する手信号等ができるのは警察官等に限られ（道路交通法第6条第1項後段）、歩行者等及び車両等は信号機の信号に従わなければならない（同法第7条）。交通誘導警備員の合図にはこれと同じ効力がないので、赤信号の車両に進行を促せば信号無視を促すことになる。信号機に近接している場合は、赤信号で進行させないよう信号表示に従って誘導するよう示されている（警視庁交通規制課 令和7年2月号・12月号）。","誤り。歩行者の誘導に当たっては、歩行者の側を向くのを原則とするが、侵入車両があるときは車両の方向を向いて歩行者を防護する姿勢をとる（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」で紹介されている交通誘導員の事故防止の取組「安全作業10か条」）。車両の動きから目を離すと、歩行者を守ることも、自分が退避することもできない。","正しい。対面信号が青のときに停止合図をした交通誘導員に運転者が気付かず衝突した事故が報告されている（警視庁交通規制課 令和7年2月号・12月号）。案内看板による事前の周知や退避場所の確保などの対策をとる。","正しい。手前に案内看板を置くなどして片側交互通行であることを運転者に周知することが、交通誘導員と車両の接触事故の防止対策として示されている（警視庁交通規制課 令和7年2月号・10月号・12月号）。","正しい。交差点直近における作業帯や保安施設の設置により、交差点の視認性を妨げることのないようにする（警視庁交通規制課 令和7年7月号）。"],"ref":["道路交通法第6条第1項","道路交通法第7条","警視庁交通規制課 路上工事事故防止資料（令和7年2月号・7月号・10月号・12月号）"],"src":["https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2502.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2507.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2510.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2512.pdf","https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S2-003","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"交通誘導警備員が自身の安全を確保するための行動に関する次の記述のうち、適当なものはどれか。","choices":["工事用車両の運転者から見えやすいよう、ショベルカーなど工事用作業車の作業半径内に立って誘導する。","通過車両を誘導しているときは、自分の後方で作業している工事車両の動きに注意を払う必要はない。","片側交互通行で車両を停止させた後は、作業の進み具合を確認するため、停止させた車両から目を離して工事現場を注視する。","作業帯の周辺を移動するときは、通行車両から見えやすいように車道側を通行する。","バリケードの後方や歩道上など、車両が向かってきたときに退避できる場所を確保して誘導を行う。"],"answer":4,"notes":["誤り。立つ位置は、工事用作業車等の作業半径内や吊り荷の下を避け、車両の運転者の死角に入らない場所を選ぶ（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」の交通誘導警備業務の点検項目）。ショベルカーのアームを旋回させた際に、バケットが歩行者に接触した事故も報告されている（警視庁交通規制課 令和7年1月号）。","誤り。夜間の道路維持工事の作業帯内で、後退した資材搬送車が通過車両を誘導中の交通誘導員をひいた死亡事故が報告されている（警視庁交通規制課 令和7年1月号）。通過車両だけでなく、背後の工事車両の動きにも注意する。","誤り。交通誘導員が工事現場を注視して車両から目を離していたため、進行してきた車両と接触した事故が報告されている（警視庁交通規制課 令和7年10月号、令和8年1月号）。誘導中は車両から目を離さない。","誤り。作業帯の周辺を通行する際は歩道側を通行するよう示されている（警視庁交通規制課 令和8年1月号）。","正しい。交通誘導員は車両の前方には立たず、バリケードの後方や歩道上に位置するなど、退避場所を確保する（警視庁交通規制課 令和7年10月号・12月号、令和8年2月号）。車道の中央や車道上で誘導していた交通誘導員が車両と接触した事故も報告されている（同 令和7年12月号）。"],"ref":["警視庁交通規制課 路上工事事故防止資料（令和7年1月号・10月号・12月号、令和8年1月号・2月号）"],"src":["https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2501.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2510.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2512.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2601.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2602.pdf","https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S2-004","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"片側交互通行の交通誘導に関する次の記述のうち、適当でないものはどれか。","choices":["両端の交通誘導警備員は互いに連絡を取り合う必要はなく、それぞれが自分の側の交通量だけを見て車両を進行させればよい。","片側交互通行の誘導に使う無線機など電池で作動する装備品は、誘導を始める前に、正しく動作することや電池の残量を確かめておく。","交互通行の区間が長い場合や区間内に交差点がある場合は、区間の両端のほか、中間地点にも交通誘導警備員を配置する。","停止の合図に従わない車両があるときは、車両の前に出て止めようとせず、反対側の交通誘導警備員に連絡して反対方向からの車両の進入を止めるとともに、警笛で周囲に危険を知らせる。","建設工事公衆災害防止対策要綱（土木工事編）では、制限後の車線が1車線となり往復の交互交通とする場合は、制限区間をできる限り短くし、その前後で交通が渋滞しないよう、原則として交通誘導警備員を配置することとされている。"],"answer":0,"notes":["誤り。両端の交通誘導警備員が連絡を取り合わないと、両方向から車両を進入させて正面衝突や立ち往生を招くおそれがある。交互通行の誘導では、警備員相互に緊密な連携を保ち、見通しの悪い場所ではトランシーバー等を活用し、対向する車両等が停止したことを確認した後でなければ自分が誘導する車両等を発進させない（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」の交通誘導警備業務の点検項目）。","正しい。手旗・誘導灯、警笛、トランシーバーなど定められた装備品は正しく身に付け、特に電池で作動する装備品は、きちんと動作することや電池の残量を確認しておく（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。連絡用の無線装置は、2号警備業務で使用する機器の例として挙げられている（解釈運用基準 第18の2(5)）。","正しい。交互通行区間が長い場合や区間内に交差点がある場合は、中間地点にも配置するよう示されている（警視庁交通規制課 令和7年10月号）。","正しい。停止合図に従わない車両に対し、交通誘導員が車両の前に出て止めることなく、反対側の交通誘導員に連絡して逆方向からの車両の進入を止め、警笛を吹鳴して周囲に危険を知らせるよう示されている（警視庁交通規制課 令和8年7月号）。","正しい。建設工事公衆災害防止対策要綱（土木工事編）第25第1項第2号のとおりである。"],"ref":["建設工事公衆災害防止対策要綱（土木工事編）第25第1項","解釈運用基準 第18の2(5)","警視庁交通規制課 路上工事事故防止資料（令和7年10月号、令和8年7月号）"],"src":["https://www.mlit.go.jp/totikensangyo/const/content/001304729.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2510.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2607.pdf","https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S2-005","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"建設工事公衆災害防止対策要綱（土木工事編）に示されている数値に関する次の記述のうち、正しいものはどれか。","choices":["通行を制限した後の道路の車線が1車線となる場合は、その車道幅員を2メートル以上とする。","通行を制限した後の道路の車線が2車線となる場合は、その車道幅員を4.5メートル以上とする。","やむを得ず通行を制限する場合は、車道とは別に、有効高さ2.1メートル以上の歩行者用通路を確保する。","特に歩行者の多い箇所では、幅1.0メートル以上の歩行者用通路を確保する。","工事を予告する道路標識、標示板等は、工事箇所の前方5メートルから50メートルの間の路側又は中央帯のうち視認しやすい箇所に設置する。"],"answer":2,"notes":["誤り。道路管理者及び所轄警察署長の特に指示のない場合の標準として、制限後の車線が1車線となる場合の車道幅員は3メートル以上とされている（要綱第25第1項第1号）。","誤り。制限後の車線が2車線となる場合の車道幅員は5.5メートル以上とされている（要綱第25第1項第1号）。","正しい。要綱第27第1項のとおりである。歩行者用通路の幅は0.90メートル以上（高齢者や車椅子使用者等の通行が想定されない場合は0.75メートル以上）とし、特に歩行者の多い箇所では1.5メートル以上とする。","誤り。特に歩行者の多い箇所では、幅1.5メートル以上、有効高さ2.1メートル以上の歩行者用通路を確保し、交通誘導警備員を配置する等の措置を講じて、適切に歩行者を誘導する（要綱第27第1項）。","誤り。工事を予告する道路標識、標示板等は、工事箇所の前方50メートルから500メートルの間の路側又は中央帯のうち視認しやすい箇所に設置する（要綱第24第3項）。"],"ref":["建設工事公衆災害防止対策要綱（令和元年国土交通省告示第496号）土木工事編 第24・第25・第27"],"src":["https://www.mlit.go.jp/totikensangyo/const/content/001304729.pdf"]},
{"id":"S2-006","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"工事車両の作業場への出入りの誘導に関する次の記述のうち、適当でないものはどれか。","choices":["道路上に作業場を設ける場合、工事車両は、原則として交通流に対する背面から出入りさせる。","やむを得ず交通流に平行する部分から工事車両を出入りさせる場合は、原則として交通誘導警備員を配置し、一般車両の通行を優先させる。","工事車両が歩道を横断して作業場に出入りするときは、歩道に入る直前で一時停止させ、歩行者の通行を妨げないようにする。","工事車両を後退させるときは、専属の交通誘導警備員が誘導灯や警笛などを活用して明確に誘導する。","作業場から出る工事車両は作業の進行に欠かせないので、一般車両を停止させて工事車両の通行を常に優先させる。"],"answer":4,"notes":["正しい。建設工事公衆災害防止対策要綱（土木工事編）第22第1項本文のとおりである。","正しい。周囲の状況等によりやむを得ない場合は交通流に平行する部分から出入りさせることができるが、この場合は原則として交通誘導警備員を配置し、一般車両の通行を優先するとともに公衆の通行に支障がないようにする（要綱第22第1項ただし書）。","正しい。車両が道路外の施設等に出入りするためやむを得ず歩道等を横断するときは、歩道等に入る直前で一時停止し、かつ、歩行者の通行を妨げないようにしなければならない（道路交通法第17条第1項ただし書・第2項）。","正しい。車両の移動は専属の交通誘導員による誘導のもとで行い、交通誘導員は誘導灯や警笛等を活用して明確な誘導に努めるよう示されている（警視庁交通規制課 令和7年1月号）。","誤り。工事車両を出入りさせるときは、一般車両の通行を優先させる（要綱第22第1項ただし書）。要綱第24第4項も、常に交通の流れを阻害しないよう努めるとしている。"],"ref":["建設工事公衆災害防止対策要綱（土木工事編）第22・第24","道路交通法第17条第2項","警視庁交通規制課 路上工事事故防止資料（令和7年1月号）"],"src":["https://www.mlit.go.jp/totikensangyo/const/content/001304729.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2501.pdf"]},
{"id":"S2-007","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"工事現場付近における歩行者の安全確保に関する次の記述のうち、適当なものはどれか。","choices":["歩行者用通路と車両の通行部分との境は、移動さくを間隔をあけずに設置するなどして、すき間ができないように区分する。","歩行者は自ら注意して通行するものであるから、高齢者や車椅子の使用者が通行する場合でも、特別な配慮は要しない。","工事のため横断歩道を閉鎖したときは、工事現場側の一端に交通誘導警備員を配置すれば足りる。","歩行者用通路に段差が生じたときは、歩行者に注意を呼び掛ければ足り、段差や路面の凹凸をなくす措置は要しない。","歩行者を一時的に待たせるときは、通行車両から離れた作業場の中に入れて待たせる。"],"answer":0,"notes":["正しい。歩行者用通路とそれに接する車両の交通の用に供する部分との境は、必要に応じて移動さくを間隔をあけないように設置し、又は移動さくの間に安全ロープ等をはってすき間ができないよう設置する等明確に区分する（建設工事公衆災害防止対策要綱（土木工事編）第27第2項）。","誤り。歩行者用通路の幅は高齢者や車椅子使用者等の通行を想定して定められ（要綱第27第1項）、必要に応じてスロープ、手すり、視覚障害者誘導用ブロック等を設ける（同第3項）。また、道路交通法第14条第5項は、その場所に居合わせた者に、通行に支障のある歩行者が安全に横断できるよう誘導等の措置をとる努力義務を課している。","誤り。横断歩道を閉鎖した場合は、横断歩道の両端に交通誘導員を配置し、歩行者を適切に誘導するよう示されている（警視庁交通規制課 令和7年10月号）。","誤り。歩行者用通路は、歩行に危険のないよう段差や路面の凹凸をなくすとともに、滑りにくい状態を保たなければならない（要綱第27第3項）。","誤り。作業場は周囲から明確に区分し、公衆が誤って立ち入ることのないよう固定さく等を設ける区域であり（要綱第15）、歩行者を入れる場所ではない。"],"ref":["建設工事公衆災害防止対策要綱（土木工事編）第15・第27","道路交通法第14条第5項","警視庁交通規制課 路上工事事故防止資料（令和7年10月号）"],"src":["https://www.mlit.go.jp/totikensangyo/const/content/001304729.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2510.pdf"]},
{"id":"S2-008","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"夜間の交通誘導及び保安施設に関する次の記述のうち、適当でないものはどれか。","choices":["夜間に道路上又は道路に接して工事を施工する場合は、さく等に沿って、高さ1メートル程度で夜間150メートル前方から視認できる光度を有する保安灯を設置する。","交通誘導警備員は、夜間は点滅型のチョッキを着用し、赤色の合図灯を使用するなど、夜間用の装備を活用する。","道路上に杭打機など高さの高い工事用建設機械を置いておく場合は、白色照明灯で照明し、その所在が容易に確認できるようにする。","夜間は運転者の目がくらむのを避けるため、工事箇所の手前には予告の標示板や照明を設けないようにする。","歩行者用通路には必要な標識等を掲げ、夜間には適切な照明等を設ける。"],"answer":3,"notes":["正しい。建設工事公衆災害防止対策要綱（土木工事編）第24第1項のとおりである。","正しい。夜間は点滅型チョッキを着用し、赤色合図灯を使用する等、夜間装備資器材を活用するよう示されている（警視庁交通規制課 令和7年10月号ほか）。","正しい。要綱第24第2項のとおりである。","誤り。工事を予告する道路標識、標示板等を工事箇所の手前に設置し（要綱第24第3項）、夜間は照明を設置するなどして、工事中であることを運転者に周知する（警視庁交通規制課 令和8年7月号）。","正しい。要綱第27第3項のとおりである。"],"ref":["建設工事公衆災害防止対策要綱（土木工事編）第24・第27","警視庁交通規制課 路上工事事故防止資料（令和7年10月号、令和8年7月号）"],"src":["https://www.mlit.go.jp/totikensangyo/const/content/001304729.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2510.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2607.pdf"]},
{"id":"S2-009","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"交通誘導警備員の合図に関する次の記述のうち、適当でないものはどれか。","choices":["停止の合図は、車両の制動距離に留意し、雨天時や路面が凍結しているときは特に、ゆとりを持って早めに行う。","合図は、運転者に威圧感を与えないよう、小さな動作で控えめに行う。","停止の合図の際には、警笛も活用して運転者の注意を促す。","手旗や合図灯による合図は、停止と進行の区別が運転者に明確に分かるように行う。","工事車両を誘導するときは、運転者が誘導だけに頼らず自らの目でも安全を確認するよう、運転者と意思疎通を図る。"],"answer":1,"notes":["正しい。停止の合図はゆとりを持って行い、その制動距離に十分留意する。雨天などの悪天候時や路面が凍結する冬季は停止距離が長くなるので、特にゆとりを持って早めに合図を行う（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。","誤り。交通誘導警備員の合図は運転者の任意の協力を求めるものであり、運転者が確実に認識できるよう、運転者とアイコンタクトを取り、大きな動作で明確に行う（警視庁交通規制課 令和8年2月号）。小さく控えめな合図は見落とされ、事故の原因となる。","正しい。停止合図の際は警笛を活用するよう示されている（警視庁交通規制課 令和8年7月号）。","正しい。手旗（夜間は赤色合図灯）により、明確な停止、進行の合図を行うよう示されている（警視庁交通規制課 令和8年7月号）。","正しい。運転者は誘導のみに頼ることなく自身の目でも安全確認を行い、周辺の作業者とも意思疎通を図るよう示されている（警視庁交通規制課 令和7年1月号）。"],"ref":["警備業法施行規則第38条第3項の表（法第2条第1項第2号の警備業務）ロ","警視庁交通規制課 路上工事事故防止資料（令和7年1月号、令和8年2月号・7月号）"],"src":["https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2501.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2602.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2607.pdf","https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S2-010","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"交通誘導警備員の配置に関する次の記述のうち、適当なものはどれか。","choices":["作業帯の設置・撤収作業の人手が足りないときは、交通誘導警備員が誘導を中断してその作業を手伝う。","作業帯の設置・撤収作業は短時間で終わるので、その間は交通誘導警備員を配置しなくてよい。","迂回路を設ける場合は、迂回地点にも交通誘導警備員を配置して案内・誘導を行う。","交通誘導警備員がトイレなどで持ち場を離れるときでも、交代の要員を置く必要はない。","作業帯の撤収は、原則として交通流の上流側から下流側に向けて行う。"],"answer":2,"notes":["誤り。作業帯の設置・撤収時は必ず交通誘導員を配置し、交通誘導員が自ら設置・撤収作業を行わないよう示されている（警視庁交通規制課 令和8年1月号）。","誤り。作業帯の設置・撤収時は必ず交通誘導員を配置する（警視庁交通規制課 令和8年1月号）。夜間の作業帯の撤収作業中に、進行してきたバイクが交通誘導員に衝突した死亡事故も報告されている（同 令和7年1月号）。","正しい。迂回路を設ける場合は迂回地点にも交通誘導員を配置し、案内・誘導を行うよう示されている（警視庁交通規制課 令和7年10月号）。建設工事公衆災害防止対策要綱（土木工事編）第25第2項も、まわり道の入口及び要所に案内用標示板等を設置するとしている。","誤り。交通誘導員が用便のため不在となった間に、マンホールの開口部から視覚障害のある歩行者が落下した事故が報告されている（警視庁交通規制課 令和7年1月号）。持ち場を離れるときは交代要員を置き、誘導や監視が途切れないようにする。","誤り。作業帯の撤収は、原則として交通流の下流から上流に向けて行うよう示されている（警視庁交通規制課 令和8年1月号）。"],"ref":["建設工事公衆災害防止対策要綱（土木工事編）第25第2項","警視庁交通規制課 路上工事事故防止資料（令和7年1月号・10月号、令和8年1月号）"],"src":["https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2501.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2510.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2601.pdf","https://www.mlit.go.jp/totikensangyo/const/content/001304729.pdf"]},
{"id":"S2-011","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"交通誘導の現場で交通事故が発生した場合の交通誘導警備員の措置等に関する次の記述のうち、適当でないものはどれか。","choices":["事故の当事者でない交通誘導警備員は、後続車両による二次事故の防止よりも、当事者双方から事情を聴いて過失の有無を判断することを優先する。","負傷者がいるときは、119番通報をするなど、負傷者の救護のための措置をとる。","警察機関に速やかに連絡する。","後続の車両に事故の発生を知らせるなどして、二次事故を防止する。","警備業法施行規則は、2号警備業務の業務別教育の教育事項として、人若しくは車両の雑踏する場所又はこれらの通行に危険のある場所における負傷等の事故の発生に際してとるべき措置を定めている。"],"answer":0,"notes":["誤り。事故の過失の有無を判断する権限は交通誘導警備員にはない（警備業法第15条）。負傷者の救護、警察機関への連絡、二次事故の防止を優先する。","正しい。負傷者の救護は最優先の措置である。交通誘導警備業務の検定でも、事故の発生時における負傷者の救護を行うため必要な知識が求められている（警備員等の検定等に関する規則別表第二）。","正しい。事故の発生時における警察機関への連絡は、警備員教育の教育事項とされている（警備業法施行規則第38条第2項の表）。","正しい。交通誘導警備業務の検定では、事故の発生時における負傷者の救護及び道路における危険の防止のための措置に関する知識が求められている（警備員等の検定等に関する規則別表第二）。","正しい。警備業法施行規則第38条第3項の表の法第2条第1項第2号の警備業務の項ホのとおりである。"],"ref":["警備業法第15条","警備業法施行規則第38条第2項・第3項","警備員等の検定等に関する規則別表第二"],"src":[]},
{"id":"S2-012","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"交通誘導警備業務の管理に関する次の記述のうち、適当なものはどれか。","choices":["工事で使う車両系建設機械の作業計画は元請事業者が管理するものであるから、警備業者がその提供を求めて警備員に周知する必要はない。","道路使用許可に付された条件は工事の施工者に対するものであり、交通誘導警備員の配置とは関係がない。","交通誘導警備業務は工事車両の通行を円滑にすることが目的であるから、一般交通の妨げとなってもやむを得ない。","現場の道路及び交通の状況、周辺の交通規制の状況などを事前に調査し、その結果を警備員の配置や誘導の方法に反映させる。","道路使用許可を受けた作業帯図と現場の状況が合わないときは、許可証の記載事項を変更する手続を経ずに、現場の判断で作業帯や交通誘導警備員の配置を変えてよい。"],"answer":3,"notes":["誤り。建設工事現場で交通誘導業務を行わせる場合は、あらかじめ元請事業場に対し、車両系建設機械、荷役運搬機械等での作業に関する作業計画の提供を求め、警備計画書、警備指令書等で交通誘導業務の実施者に業務内容を周知する（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。","誤り。道路使用許可には交通の安全と円滑を図るため必要な条件が付されることがあり（道路交通法第77条第3項）、作業帯や交通誘導員は許可条件（協議書の作業帯図）のとおり配置するよう示されている（警視庁交通規制課 令和7年11月号）。","誤り。交通誘導警備業務の管理では、業務を実施することが交通の妨害とならないようにすることが求められる（警備員等の検定等に関する規則別表第一）。建設工事公衆災害防止対策要綱（土木工事編）第24第4項も、常に交通の流れを阻害しないよう努めるとしている。","正しい。事前調査の結果を踏まえて配置や誘導の方法を決めることは、業務を能率的かつ安全に実施するための管理の基本である（警備員等の検定等に関する規則別表第一）。","誤り。許可証の交付を受けた者は、記載事項に変更を生じたときは所轄警察署長に届け出て変更の記載を受けなければならない（道路交通法第78条第4項）。作業帯や交通誘導員の配置等の変更は、許可証の記載事項変更手続を経て実施する（警視庁交通規制課 令和7年7月号）。"],"ref":["警備員等の検定等に関する規則別表第一","道路交通法第77条第3項","道路交通法第78条第4項","建設工事公衆災害防止対策要綱（土木工事編）第24第4項","警視庁交通規制課 路上工事事故防止資料（令和7年7月号・11月号）"],"src":["https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2507.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2511.pdf","https://www.mlit.go.jp/totikensangyo/const/content/001304729.pdf","https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S2-013","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法に定める用語の意義に関する次の記述のうち、正しいものはどれか。","choices":["「歩道」とは、歩行者の通行の用に供するため、道路標示によって区画された道路の部分をいう。","「路側帯」とは、歩道の設けられていない道路又は道路の歩道の設けられていない側の路端寄りに設けられた帯状の道路の部分で、縁石線又は柵によって区画されたものをいう。","「車両」とは、自動車、原動機付自転車及びトロリーバスをいい、自転車などの軽車両は含まない。","「交差点」とは、二以上の道路が交わる場合における当該二以上の道路の交わる部分をいい、歩道と車道の区別のある道路においては、歩道の部分を含む。","「徐行」とは、車両等が直ちに停止することができるような速度で進行することをいう。"],"answer":4,"notes":["誤り。「歩道」は、縁石線又は柵その他これに類する工作物によって区画された道路の部分をいう（道路交通法第2条第1項第2号）。歩道の設けられていない道路などの路端寄りに設けられ、道路標示によって区画された帯状の部分は「路側帯」である（同項第3号の4）。なお、車道は工作物又は道路標示によって区画される（同項第3号）。","誤り。「路側帯」は、道路標示によって区画されたものをいう（道路交通法第2条第1項第3号の4）。","誤り。「車両」とは、自動車、原動機付自転車、軽車両及びトロリーバスをいう（道路交通法第2条第1項第8号）。自転車は軽車両に含まれる。","誤り。歩道と車道の区別のある道路においては、車道の交わる部分をいう（道路交通法第2条第1項第5号）。","正しい。道路交通法第2条第1項第20号のとおりである。具体的な速度の数値は定められていない。"],"ref":["道路交通法第2条第1項"],"src":[]},
{"id":"S2-014","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法施行令に定める信号機の信号の意味に関する次の記述のうち、誤っているものはどれか。","choices":["黄色の灯火の信号に対面する車両等は、停止位置を越えて進行してはならないが、黄色の灯火の信号が表示された時において停止位置に近接しているため安全に停止することができない場合は、この限りでない。","赤色の灯火の点滅の信号に対面する車両等は、他の交通に注意して進行することができる。","赤色の灯火の信号に対面する車両等のうち、交差点において既に左折している車両等は、そのまま進行することができる。","人の形の記号を有する青色の灯火の点滅の信号に対面する歩行者は、道路の横断を始めてはならず、横断している歩行者は、速やかに横断を終わるか、又は横断をやめて引き返さなければならない。","青色の灯火の矢印の信号に対面する車両は、黄色の灯火又は赤色の灯火の信号にかかわらず、矢印の方向に進行することができる。"],"answer":1,"notes":["正しい。道路交通法施行令第2条第1項の表（黄色の灯火）のとおりである。","誤り。赤色の灯火の点滅の信号に対面する車両等は、停止位置において一時停止しなければならない（道路交通法施行令第2条第1項の表）。車両等が他の交通に注意して進行することができるのは、黄色の灯火の点滅の場合である。なお、赤色の灯火の点滅の信号に対面する歩行者等は、他の交通に注意して進行することができる。","正しい。道路交通法施行令第2条第1項の表（赤色の灯火）のとおりである。","正しい。道路交通法施行令第2条第1項の表（人の形の記号を有する青色の灯火の点滅）のとおりである。","正しい。道路交通法施行令第2条第1項の表（青色の灯火の矢印）のとおりである。"],"ref":["道路交通法施行令第2条第1項"],"src":[]},
{"id":"S2-015","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"警察官等の手信号等に関する次の記述のうち、正しいものはどれか。","choices":["警察官等の手信号等に従わなければならないのは車両等であり、歩行者は従う必要がない。","警察官等は、信号機が作動している場所では、信号機の表示する信号と異なる意味を表示する手信号等をすることはできない。","警察官等が腕を横に水平に上げているとき、その腕に平行する交通については、青色の灯火の信号と同じ意味である。","交差点以外の場所で横断歩道、自転車横断帯及び踏切がない場所において、警察官等の手信号により停止する場合の停止位置は、手信号を行っている警察官等の5メートル手前の場所である。","警察官等が灯火を横に振っているとき、灯火が振られている方向に進行する交通については、赤色の灯火の信号と同じ意味である。"],"answer":2,"notes":["誤り。道路を通行する歩行者等又は車両等は、信号機の表示する信号又は警察官等の手信号等に従わなければならない（道路交通法第7条）。","誤り。警察官等は、道路における危険を防止し、その他交通の安全と円滑を図るため特に必要があると認めるときは、信号機の表示する信号にかかわらず、これと異なる意味を表示する手信号等をすることができる（道路交通法第6条第1項後段）。","正しい。道路交通法施行令第4条第1項の表のとおりである。水平に上げた腕に対面する交通については、赤色の灯火の信号と同じ意味である。","誤り。この場合の停止位置は、手信号を行っている警察官等の1メートル手前の場所である（道路交通法施行令第4条第1項の表の備考）。","誤り。灯火が振られている方向に進行する交通については青色の灯火の信号と同じ意味であり、これと交差する交通については赤色の灯火の信号と同じ意味である（道路交通法施行令第5条第1項）。"],"ref":["道路交通法第6条第1項","道路交通法第7条","道路交通法施行令第4条","道路交通法施行令第5条"],"src":[]},
{"id":"S2-016","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路における交通の規制に関する次の記述のうち、誤っているものはどれか。","choices":["警察官は、道路の損壊、火災の発生その他の事情により道路において交通の危険が生ずるおそれがある場合であっても、歩行者等又は車両等の通行を禁止し、又は制限することはできない。","都道府県公安委員会は、信号機又は道路標識等を設置し、及び管理して、交通整理、歩行者等又は車両等の通行の禁止その他の道路における交通の規制をすることができる。","都道府県公安委員会は、歩行者等又は車両等の通行の禁止その他の交通の規制のうち、適用期間の短いものを警察署長に行わせることができる。","警察官は、車両等の通行が著しく停滞したことにより道路（高速自動車国道及び自動車専用道路を除く。）における交通が著しく混雑するおそれがある場合において、やむを得ないと認めるときは、混雑を緩和するため必要な限度において、その現場に進行してくる車両等の通行を禁止し、又は制限することができる。","都道府県公安委員会は、緊急を要するため道路標識等を設置するいとまがないときは、警察官の現場における指示により、道路標識等による交通の規制に相当する交通の規制をすることができる。"],"answer":0,"notes":["誤り。警察官は、この場合において、道路における危険を防止するため緊急の必要があると認めるときは、必要な限度において、当該道路につき、一時、歩行者等又は車両等の通行を禁止し、又は制限することができる（道路交通法第6条第4項）。","正しい。道路交通法第4条第1項前段のとおりである。","正しい。道路交通法第5条第1項のとおりである。","正しい。道路交通法第6条第2項のとおりである。","正しい。道路交通法第4条第1項後段のとおりである。"],"ref":["道路交通法第4条第1項","道路交通法第5条第1項","道路交通法第6条第2項・第4項"],"src":[]},
{"id":"S2-017","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法に定める歩行者等の通行方法に関する次の記述のうち、正しいものはどれか。","choices":["歩行者等は、歩道等と車道の区別のない道路においては、原則として道路の左側端に寄って通行しなければならない。","歩行者等は、歩道等と車道の区別のある道路においては、道路工事等のため歩道等を通行することができないときであっても、車道を通行してはならない。","歩行者等は、横断歩道がある場所の付近においても、横断歩道によらずに道路を横断することができる。","歩行者等は、横断歩道によって横断するとき、又は信号機の表示する信号若しくは警察官等の手信号等に従って横断するときを除き、車両等の直前又は直後で道路を横断してはならない。","歩行者等は、道路標識等による指定がなくても、交差点において斜めに道路を横断することができる。"],"answer":3,"notes":["誤り。歩道等と車道の区別のない道路においては、道路の右側端に寄って通行しなければならない。ただし、右側端を通行することが危険であるときその他やむを得ないときは、左側端に寄って通行することができる（道路交通法第10条第1項）。","誤り。道路工事等のため歩道等を通行することができないとき、その他やむを得ないときは、歩道等以外の部分を通行することができる（道路交通法第10条第2項第2号）。","誤り。横断歩道がある場所の付近においては、その横断歩道によって道路を横断しなければならない（道路交通法第12条第1項）。","正しい。道路交通法第13条第1項のとおりである。","誤り。交差点において道路標識等により斜めに横断することができるとされている場合を除き、斜めに道路を横断してはならない（道路交通法第12条第2項）。"],"ref":["道路交通法第10条","道路交通法第12条","道路交通法第13条第1項"],"src":[]},
{"id":"S2-018","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法に定める車両の通行方法に関する次の記述のうち、誤っているものはどれか。","choices":["車両は、歩道又は路側帯と車道の区別のある道路においては、原則として車道を通行しなければならない。","車両は、安全地帯や、道路標識等により車両の通行の用に供しない部分であることが表示されている道路の部分であっても、徐行すれば入ることができる。","車両は、道路工事その他の障害のため道路の左側部分を通行することができないときは、道路の右側部分にはみ出して通行することができるが、はみ出し方をできるだけ少なくしなければならない。","車両は、歩行者又は他の車両等の正常な交通を妨害するおそれがあるときは、後退してはならない。","車両は、歩道と車道の区別のない道路を通行する場合などにおいて、歩行者の側方を通過するときは、これとの間に安全な間隔を保ち、又は徐行しなければならない。"],"answer":1,"notes":["正しい。道路交通法第17条第1項のとおりである。道路外の施設等に出入りするためやむを得ず歩道等を横断するときなどは例外とされている（同項ただし書）。","誤り。車両は、安全地帯又は道路標識等により車両の通行の用に供しない部分であることが表示されているその他の道路の部分に入ってはならない（道路交通法第17条第6項）。徐行しても入ることはできない。","正しい。道路交通法第17条第5項第3号及び同項後段のとおりである。","正しい。道路交通法第25条の2第1項のとおりである。","正しい。道路交通法第18条第2項のとおりである。"],"ref":["道路交通法第17条","道路交通法第18条第2項","道路交通法第25条の2第1項"],"src":[]},
{"id":"S2-019","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"緊急自動車に関する次の記述のうち、正しいものはどれか。","choices":["緊急自動車は、法令の規定により停止しなければならない場合においても停止することを要せず、その場合に徐行する必要もない。","交差点又はその付近において緊急自動車が接近してきたときは、車両は、交差点内であってもその場で直ちに一時停止しなければならない。","交差点又はその付近以外の場所において緊急自動車が接近してきたときは、車両は、道路の右側に寄ってこれに進路を譲らなければならない。","緊急自動車として指定を受けている自動車は、緊急用務のため運転中でないときも、道路交通法上の緊急自動車として扱われる。","緊急自動車は、緊急の用務のため運転するときは、原則として、サイレンを鳴らし、かつ、赤色の警光灯をつけなければならない。"],"answer":4,"notes":["誤り。緊急自動車は、法令の規定により停止しなければならない場合においても停止することを要しないが、この場合においては、他の交通に注意して徐行しなければならない（道路交通法第39条第2項）。","誤り。車両は、交差点を避け、かつ、道路の左側（一方通行の道路で左側に寄ると緊急自動車の通行を妨げる場合は右側）に寄って一時停止しなければならない（道路交通法第40条第1項）。","誤り。交差点又はその附近以外の場所では、車両は、道路の左側（一方通行の道路で左側に寄ると緊急自動車の通行を妨げる場合は右側）に寄って進路を譲らなければならない（道路交通法第40条第2項）。","誤り。緊急自動車とは、消防用自動車、救急用自動車その他の政令で定める自動車で、当該緊急用務のため、政令で定めるところにより運転中のものをいう（道路交通法第39条第1項）。","正しい。道路交通法施行令第14条のとおりである。警察用自動車が速度違反車両等を取り締まる場合で特に必要があると認めるときは、サイレンを鳴らすことを要しない（同条ただし書）。"],"ref":["道路交通法第39条","道路交通法第40条","道路交通法施行令第14条"],"src":[]},
{"id":"S2-020","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"横断歩道等における歩行者等の優先に関する次の記述のうち、誤っているものはどれか。","choices":["車両等は、横断歩道等に接近する場合には、横断しようとする歩行者等がないことが明らかな場合を除き、その直前で停止することができるような速度で進行しなければならない。","車両等は、横断歩道等によりその進路の前方を横断し、又は横断しようとする歩行者等があるときは、横断歩道等の直前で一時停止し、かつ、その通行を妨げないようにしなければならない。","車両等は、横断歩道等又はその手前の直前で停止している車両等がある場合において、その側方を通過してその前方に出ようとするときは、徐行すれば一時停止する必要はない。","車両等は、横断歩道等及びその手前の側端から前に30メートル以内の道路の部分においては、その前方を進行している他の車両等（特定小型原動機付自転車等を除く。）の側方を通過してその前方に出てはならない。","車両等は、交差点又はその直近で横断歩道の設けられていない場所において歩行者が道路を横断しているときは、その歩行者の通行を妨げてはならない。"],"answer":2,"notes":["正しい。道路交通法第38条第1項前段のとおりである。","正しい。道路交通法第38条第1項後段のとおりである。","誤り。その前方に出る前に一時停止しなければならない（道路交通法第38条第2項）。徐行では足りない。","正しい。道路交通法第38条第3項のとおりである。","正しい。道路交通法第38条の2のとおりである。"],"ref":["道路交通法第38条","道路交通法第38条の2"],"src":[]},
{"id":"S2-021","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法に定める停車及び駐車の禁止場所に関する次の記述のうち、正しいものはどれか。","choices":["交差点の側端又は道路の曲がり角から10メートル以内の部分は、停車及び駐車が禁止されている。","道路工事が行われている場合における当該工事区域の側端から5メートル以内の部分は、駐車が禁止されている。","消火栓が設けられている位置から10メートル以内の部分は、駐車が禁止されている。","火災報知機から3メートル以内の部分は、駐車が禁止されている。","踏切の前後の側端からそれぞれ前後に10メートル以内の部分は、駐車は禁止されているが、停車は禁止されていない。"],"answer":1,"notes":["誤り。交差点の側端又は道路の曲がり角から5メートル以内の部分である（道路交通法第44条第1項第2号）。","正しい。道路交通法第45条第1項第2号のとおりである（公安委員会の定めるところにより警察署長の許可を受けたときを除く。）。","誤り。消火栓、指定消防水利の標識が設けられている位置又は消防用防火水槽の吸水口若しくは吸管投入孔から5メートル以内の部分である（道路交通法第45条第1項第4号）。","誤り。火災報知機から1メートル以内の部分である（道路交通法第45条第1項第5号）。","誤り。踏切の前後の側端からそれぞれ前後に10メートル以内の部分は、駐車だけでなく停車も禁止されている（道路交通法第44条第1項第6号）。停車及び駐車が禁止されるのは第44条第1項各号の場所であり、第45条第1項各号の場所（道路工事の工事区域の側端から5メートル以内の部分など）は駐車だけが禁止される。"],"ref":["道路交通法第44条第1項","道路交通法第45条第1項"],"src":[]},
{"id":"S2-022","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法の道路使用許可及び道路法の道路占用許可に関する次の記述のうち、誤っているものはどれか。","choices":["道路において工事若しくは作業をしようとする者又は当該工事若しくは作業の請負人は、所轄警察署長の許可を受けなければならない。","道路に水管、ガス管その他これらに類する物件を設け、継続して道路を使用しようとする場合は、道路管理者の許可を受けなければならない。","道路使用許可に係る行為が道路法の道路占用許可を要するものであるときは、道路使用許可の申請書の提出は、当該道路の管理者を経由して行うことができる。","道路法による道路の管理者が道路の維持、修繕その他の管理のため工事を行おうとするときも、所轄警察署長の道路使用許可を受けなければならない。","所轄警察署長は、道路使用許可をする場合において必要があると認めるときは、道路における危険を防止し、その他交通の安全と円滑を図るため必要な条件を付することができる。"],"answer":3,"notes":["正しい。道路交通法第77条第1項第1号のとおりである。","正しい。道路法第32条第1項第2号のとおりである。道路の占用許可は道路管理者が行い、道路使用許可は所轄警察署長が行う。","正しい。道路交通法第78条第2項のとおりである。逆に、道路占用許可の申請書も所轄警察署長を経由して提出することができる（道路法第32条第4項）。","誤り。道路法による道路の管理者が道路の維持、修繕その他の管理のため工事又は作業を行おうとするときは、所轄警察署長に協議すれば足りる（道路交通法第80条第1項）。","正しい。道路交通法第77条第3項のとおりである。"],"ref":["道路交通法第77条","道路交通法第78条第2項","道路交通法第80条第1項","道路法第32条"],"src":[]},
{"id":"S2-023","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路における禁止行為等に関する次の記述のうち、正しいものはどれか。","choices":["何人も、交通の妨害となるような方法で物件をみだりに道路に置いてはならない。","信号機や道路標識等に類似する工作物は、交通の安全に役立つものであれば、何人も自由に道路に設置することができる。","道路使用許可を受けた者は、許可の期間が満了しても、次の工事に備えて工作物をそのまま道路に残しておくことができる。","警察署長は、道路使用許可を受けずに道路で工事を行った者に対して、工事の中止その他必要な措置をとることを命ずることはできない。","道路法には、道路に土石、竹木等の物件をみだりにたい積することを禁止する規定はない。"],"answer":0,"notes":["正しい。道路交通法第76条第3項のとおりである。工事の資材等を道路上に放置することは、自転車の転倒などの事故の原因ともなる。","誤り。何人も、信号機若しくは道路標識等又はこれらに類似する工作物若しくは物件をみだりに設置してはならない（道路交通法第76条第1項）。","誤り。許可の期間が満了したときは、すみやかに当該工作物の除去その他道路を原状に回復する措置を講じなければならない（道路交通法第77条第7項）。","誤り。警察署長は、第77条第1項の規定に違反して工作物等を設置し、又は工事等を行った者に対し、工事等の中止その他必要な措置をとることを命ずることができる（道路交通法第81条第1項第3号）。","誤り。何人も、みだりに道路に土石、竹木等の物件をたい積し、その他道路の構造又は交通に支障を及ぼすおそれのある行為をしてはならない（道路法第43条第2号）。"],"ref":["道路交通法第76条","道路交通法第77条第7項","道路交通法第81条第1項","道路法第43条"],"src":[]},
{"id":"S2-024","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法令に関する次の記述のうち、正しいものはどれか。","choices":["道路交通法上の「夜間」とは、午後6時から翌日の午前6時までの時間をいう。","道路交通法上の「児童」とは6歳以上15歳未満の者をいい、「幼児」とは6歳未満の者をいう。","交通事故があったときは、当該交通事故に係る車両等の運転者等は、警察官に報告した後でなければ、負傷者を救護してはならない。","道路標識等による中央線も車両通行帯も設けられておらず、往復の方向別に分離もされていない一般道路（高速自動車国道及び自動車専用道路を除く。）における自動車の法定の最高速度は、60キロメートル毎時である。","高齢の歩行者や身体の障害のある歩行者等が道路を横断しようとしている場合において必要があると認められるときは、その場所に居合わせた者は、誘導、合図その他適当な措置をとることにより、その歩行者が安全に横断できるように努めなければならない。"],"answer":4,"notes":["誤り。「夜間」とは、日没時から日出時までの時間をいう（道路交通法第52条第1項）。","誤り。「児童」とは6歳以上13歳未満の者をいい、「幼児」とは6歳未満の者をいう（道路交通法第14条第3項）。","誤り。運転者等は、直ちに車両等の運転を停止して、負傷者を救護し、道路における危険を防止する等必要な措置を講じなければならず、あわせて運転者は警察官に事故の日時・場所、死傷者の数等を報告しなければならない（道路交通法第72条第1項）。救護は報告を待たずに行う。","誤り。令和8年9月1日施行の道路交通法施行令の改正により、このような一般道路（いわゆる生活道路）における自動車の法定の最高速度は30キロメートル毎時となった（道路交通法施行令第11条第2号）。中央線又は車両通行帯が設けられている一般道路などは60キロメートル毎時である（同条第1号）。","正しい。道路交通法第14条第5項のとおりである。「警察官等その他その場所に居合わせた者」の努力義務であり、現場の交通誘導警備員もその場所に居合わせた者に当たる。"],"ref":["道路交通法第14条","道路交通法第52条第1項","道路交通法第72条第1項","道路交通法施行令第11条"],"src":["https://www8.cao.go.jp/koutu/taisaku/r07kou_haku/zenbun/genkyo/topics/topic_1.html"]},
{"id":"S2-025","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"雑踏事故の防止における主催者等の責任と役割に関する次の記述のうち、適当なものはどれか。","choices":["主催者が選任する自主警備責任者は名目上の者でよく、自主警備員を統括して指揮する実質的な権限や知識、経験を有している必要はない。","主催者が雑踏事故の防止対策を講じる範囲は会場の敷地内に限られ、会場外の公道における対策は警察だけが行う。","主催者は、行事等の開催により雑踏を生じさせる原因者として、まず自主警備体制を確立し、雑踏事故の防止対策を講じるべきものとされている。","主催者側の警備員は、配置された現場で警察官から緊急の指示があっても、主催者の指示がない限り従う必要はない。","毎年同じ場所で開催される行事で前回が無事に終わっていれば、前回と同じ警備計画を用いれば足り、改めて現地を調査する必要はない。"],"answer":2,"notes":["誤り。主催者には、実質的な権限、知識、経験及び能力を有する自主警備責任者を選任させ、自主警備責任者が自主警備員を組織的に統括指揮できる体制を構築させることとされている（栃木県警察雑踏警備実施要領 第5の3(1)イ）。","誤り。主催者は、雑踏の影響が及ぶと認められる範囲については、会場内だけでなく会場外においても、また、そこが公道であるか否かを問わず、必要な事故防止対策を講じるべきものとされている（栃木県警察雑踏警備実施要領 第3の1）。","正しい。栃木県警察雑踏警備実施要領 第3の1、群馬県警察雑踏事故防止対策要綱 第2の2の考え方である。警察は主催者と連携して指導・助言を行い、必要な場合に警察部隊を運用する。","誤り。主催者には、配置現場において警察官から緊急の指示があった場合はこれに従うよう、自主警備員に指示を徹底させることとされている（栃木県警察雑踏警備実施要領 第5の3(4)）。","誤り。年中行事であっても、年ごとに条件や事情に変化が生じていることを前提として、その都度実地調査を行い、前例を踏襲せずに新たな観点から計画を見直すべきものとされている（栃木県警察雑踏警備実施要領 第5の2(2)・第6の3(1)イ）。"],"ref":["栃木県警察雑踏警備実施要領 第3・第5・第6","群馬県警察雑踏事故防止対策要綱 第2・第5"],"src":["https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf","https://www.pref.gunma.jp/uploaded/attachment/54099.pdf"]},
{"id":"S2-026","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"主催者の自主警備計画及び自主警備体制に関する次の記述のうち、適当でないものはどれか。","choices":["会場の安全許容人数は当日の入場状況を見て判断すればよいので、計画の段階で把握しておく必要はない。","迂回路、避難場所及び立入りや停滞等の禁止区域の設定、警備員の配置、広報手段等を計画に定める。","当日の天候等により行事の内容等が変更となる場合に備えて、変更となった場合に応じた計画も別に作成しておく。","雑踏事故の防止上重要な場所には、専門的な知識を有し、組織的に行動できる警備員を配置する。","自主警備責任者が迅速かつ的確に指揮できるよう、無線機等の通信手段を準備する。"],"answer":0,"notes":["誤り。主催者は、予想される人出数及び会場等の安全許容人数を把握の上で自主警備計画を策定すべきものとされている（栃木県警察雑踏警備実施要領 第5の3(2)、群馬県警察雑踏事故防止対策要綱 第5の1(5)）。収容の限界を超えてから対応したのでは事故を防げない。","正しい。栃木県警察雑踏警備実施要領 第5の3(2)のとおりである。","正しい。栃木県警察雑踏警備実施要領 第5の3(2)なお書のとおりである。","正しい。雑踏事故防止上重要な場所には、ガードマン等専門知識を有し、組織的に行動できる要員を配置させるとされている（栃木県警察雑踏警備実施要領 第5の3(3)）。","正しい。栃木県警察雑踏警備実施要領 第5の3(3)のとおりである。"],"ref":["栃木県警察雑踏警備実施要領 第5の3","群馬県警察雑踏事故防止対策要綱 第5の1"],"src":["https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf","https://www.pref.gunma.jp/uploaded/attachment/54099.pdf"]},
{"id":"S2-027","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"雑踏警備において警戒を要する場所等に関する次の記述のうち、適当なものはどれか。","choices":["階段や坂道では人の流れが自然に分散するので、滞留が生じるおそれは小さい。","夜間に及ぶ行事であっても、照明の確保は主催者の判断に任せればよく、雑踏事故の防止とは関係がない。","露店は来場者の利便に役立つので、通路の中央や出入口付近など人の集まりやすい場所に出店させるのがよい。","会場周辺に放置された自転車やバイクは、参集者が避けて通るので、撤去する必要はない。","階段、歩道橋、会場出入口など雑踏による危険が予想される箇所をあらかじめ見極め、警備員の配置に反映させる。"],"answer":4,"notes":["誤り。階段、坂道、通路が急に狭くなるボトルネック部等は、滞留が生じやすく雑踏事故の発生が予想される場所である（栃木県警察雑踏警備実施要領 第6の3(2)イ）。","誤り。夜間における十分な照明の確保は、会場及びその周辺について主催者に講じさせる施設・環境の整備の一つとされている（栃木県警察雑踏警備実施要領 第5の3(8)オ）。","誤り。露店は参集者の円滑な通行を妨げ、滞留発生の原因となるので、出店させる場合は通行等の障害にならない場所を選定させる（栃木県警察雑踏警備実施要領 第5の3(9)）。","誤り。放置バイク、自転車等の滞留の原因となる障害物は撤去させる（栃木県警察雑踏警備実施要領 第5の3(8)イ）。","正しい。階段、歩道橋、橋梁、会場出入口等雑踏による危険が予想される箇所をあらかじめ見極め、計画に反映させるとされている（群馬県警察雑踏事故防止対策要綱 第4の1）。"],"ref":["栃木県警察雑踏警備実施要領 第5の3・第6の3","群馬県警察雑踏事故防止対策要綱 第4の1"],"src":["https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf","https://www.pref.gunma.jp/uploaded/attachment/54099.pdf"]},
{"id":"S2-028","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"雑踏の整理の方法に関する次の記述のうち、適当でないものはどれか。","choices":["参集者が同じ空間を自由な方向に無秩序に通行することによる滞留を防ぐため、ロープ等による一方通行の措置をとる。","参集者が過密になったときは、後続の参集者を止めずに混雑した場所へ進ませ、人の流れの勢いで混雑を解消させる。","入場・退場時に多数の参集者が出入口や通路に殺到するおそれがあるときは、参集者を物理的に分断して整然と入退場させる。","階段やボトルネック部には、許容限度以上の参集者を進入させないよう、ロープ規制などを行う。","道路上を移動する参集者が路面の収容限界を超えて混雑するときは、迂回させるなどして歩行距離を延ばし、収容能力の増大を図る。"],"answer":1,"notes":["正しい。栃木県警察雑踏警備実施要領 第6の3(2)ウのとおりである。","誤り。過密になった場所にさらに人を進ませると群集の圧力が高まり、転倒や将棋倒しなどの雑踏事故を招く。参集者の分断、進入規制、迂回等の措置により圧力を緩和させる（群馬県警察雑踏事故防止対策要綱 第5の1(7)、栃木県警察雑踏警備実施要領 第7の3）。","正しい。栃木県警察雑踏警備実施要領 第6の3(2)ウのとおりである。","正しい。栃木県警察雑踏警備実施要領 第6の3(2)ウのとおりである。","正しい。栃木県警察雑踏警備実施要領 第6の3(2)アのとおりである。"],"ref":["栃木県警察雑踏警備実施要領 第6の3(2)・第7の3","群馬県警察雑踏事故防止対策要綱 第5の1(7)","警備業法施行規則第38条第3項の表（法第2条第1項第2号の警備業務）ハ"],"src":["https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf","https://www.pref.gunma.jp/uploaded/attachment/54099.pdf"]},
{"id":"S2-029","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"雑踏警備における広報に関する次の記述のうち、適当なものはどれか。","choices":["通行規制や入場規制の理由を参集者に説明するとかえって混乱を招くので、規制の内容だけを伝える。","雑踏事故が発生したときは、参集者に危険を強く印象付けるため、緊迫した口調で繰り返し広報する。","危険な事態が発生するおそれがあるときの広報は、早く伝えることを優先し、主催者の本部と調整せずに、各警備員がそれぞれの判断で異なる内容を呼びかける。","情報不足から生じる不穏な群集心理を防ぐため、拡声器、場内放送、案内看板等を活用して、参集者の立場に立った分かりやすい広報を行う。","事前に広報すると当日の混雑を招くので、交通規制の内容は当日になってから現場で知らせる。"],"answer":3,"notes":["誤り。臨時に実施する通行規制や入場規制等については、その内容と理由を広報して無用な混乱やトラブルを防止する（栃木県警察雑踏警備実施要領 第7の4）。","誤り。広報は落ち着いた口調で明確に伝え、いたずらに参集者の不安をあおらないよう留意する（栃木県警察雑踏警備実施要領 第8の4）。","誤り。会場及びその周辺における広報は、特に危険な事態が発生し、又は発生するおそれがある場合には、主催者と協力して実施し、不穏な群集心理の発現を未然に防止するとともに事故防止上の注意を促す（群馬県警察雑踏事故防止対策要綱 第6の3(2)）。警備員がそれぞれ異なる内容を呼びかけると、参集者が混乱するおそれがある。","正しい。群馬県警察雑踏事故防止対策要綱 第6の3、栃木県警察雑踏警備実施要領 第7の4のとおりである。","誤り。主催者には、交通規制の内容等についてマスメディアを活用した事前広報を十分に行わせる（栃木県警察雑踏警備実施要領 第6の3(2)エ）。"],"ref":["栃木県警察雑踏警備実施要領 第6の3(2)エ・第7の4・第8の4","群馬県警察雑踏事故防止対策要綱 第6の3"],"src":["https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf","https://www.pref.gunma.jp/uploaded/attachment/54099.pdf"]},
{"id":"S2-030","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"雑踏警備の実施中の措置に関する次の記述のうち、適当でないものはどれか。","choices":["参集者の動向と群集密度を常に把握し、雑踏事故の前触れとなる状況が生じたときに直ちに必要な措置がとれるようにしておく。","警備員が雑踏事故の前触れとなる状況を認めたときは、軽微な状況であっても直ちに本部に報告する。","群集の圧力が高まっても、警察官が到着するまでは、警備員は参集者の分断や進入規制などの措置をとってはならない。","警察と協同で警備を実施しているときは、主催者側が把握した参集者の動向等の情報を警察と共有する。","雑踏の中では、すり、ひったくり、痴漢等の犯罪が発生しやすいことにも注意する。"],"answer":2,"notes":["正しい。栃木県警察雑踏警備実施要領 第7の2、群馬県警察雑踏事故防止対策要綱 第6の1(2)のとおりである。","正しい。雑踏事故予兆事案を認知した際は、軽微な状況であっても直ちに報告するよう指示を徹底するとされている（栃木県警察雑踏警備実施要領 第7の2）。","誤り。主催者は、参集者が過密となった場合には、警備員をして参集者の分断、進入規制、迂回等適切な措置を講じ、参集者の圧力を緩和させて雑踏事故の発生を未然に防止すべきものとされている（群馬県警察雑踏事故防止対策要綱 第5の1(7)）。","正しい。栃木県警察雑踏警備実施要領 第5の3(6)のとおりである。","正しい。雑踏において発生しやすい犯罪として、すり、ひったくり、痴漢等が挙げられている（栃木県警察雑踏警備実施要領 第7の5）。"],"ref":["栃木県警察雑踏警備実施要領 第5の3(6)・第7","群馬県警察雑踏事故防止対策要綱 第5の1(7)・第6の1"],"src":["https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf","https://www.pref.gunma.jp/uploaded/attachment/54099.pdf"]},
{"id":"S2-031","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"雑踏の中で転倒や将棋倒しなどの事故が発生した場合の措置に関する次の記述のうち、適当なものはどれか。","choices":["事故の状況を多くの人に確認してもらうため、周囲の参集者を事故現場の近くに集める。","現場の警備員は、事態が落ち着いてから、本部にまとめて報告すればよい。","負傷者を救護する間も、人の流れを止めないよう、後続の参集者を事故現場の方向へ進ませる。","参集者の動揺を防ぐため、事故が発生したことは一切知らせない。","負傷者の救護と併せて、危険な場所にいる参集者を安全な場所へ避難誘導し、被害の拡大を防止する。"],"answer":4,"notes":["誤り。事故現場に人を集めると群集の圧力が高まり、被害が拡大するおそれがある。参集者の分断、誘導、進入禁止等の措置により圧力を緩和させる（栃木県警察雑踏警備実施要領 第7の3・第8の3）。","誤り。事故現場からは、負傷者の有無、事態の概要、参集者の動向等の必要な情報を速やかに報告させ、状況を正確に把握する（栃木県警察雑踏警備実施要領 第8の2）。","誤り。後続の参集者を事故現場の方向へ進ませると被害が拡大する。危険地域への進入を止め、参集者を避難誘導する（栃木県警察雑踏警備実施要領 第8の3）。","誤り。混乱の制止と人心の安定を図るため、主催者と連携して速やかに状況を周知し、事故の拡大防止に対する協力を得るよう努める（栃木県警察雑踏警備実施要領 第8の4）。","正しい。負傷者の救護と併せて危険地域にいる参集者の避難誘導を行い、被害の拡大防止を図るとされている（栃木県警察雑踏警備実施要領 第8の3）。事故現場への後続の参集者の進入を止めるなど、参集者の分断、誘導、進入禁止等の措置も併せて行う（同 第7の3）。人の雑踏する場所における負傷等の事故の発生に際してとるべき措置は、2号警備業務の業務別教育の教育事項でもある（警備業法施行規則第38条第3項の表）。"],"ref":["栃木県警察雑踏警備実施要領 第7の3・第8","警備業法施行規則第38条第3項の表（法第2条第1項第2号の警備業務）ホ"],"src":["https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf"]},
{"id":"S2-032","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"雑踏警備における警察官と警備員の関係に関する次の記述のうち、適当なものはどれか。","choices":["雑踏警備では、主催者側の自主警備を基本とし、警察官としての職務権限がなければできない任務は警察官が担うなど、警察と主催者側が役割を分担して当たる。","警備員は、雑踏の整理のためであれば、指示に従わない参集者を強制的に排除する権限を警備業法により与えられている。","警備員は、雑踏警備の場では、参集者の手荷物を本人の承諾がなくても強制的に検査することができる。","警察官が配置されている場所には、主催者側の警備員を補助として配置することはできない。","警察と協同で雑踏警備を実施している場合でも、行事の開始後に突発的な事情で自主警備計画を変更するときは、主催者側の判断だけで変更してよい。"],"answer":0,"notes":["正しい。雑踏事故の防止は主催者側の自主警備が基本であり、警察は、警察官としての職務権限がなければできない任務のある重要な場所に警察官を配置し、それ以外の場所には主として主催者側の警備員を配置させるなど、主催者側と役割を分担して雑踏警備に当たる（例：栃木県警察雑踏警備実施要領 第3の3・第6の3(1)ウ）。","誤り。警備業者及び警備員は、警備業法により特別に権限を与えられているものではない（警備業法第15条）。雑踏の整理は参集者の協力を得て行う。","誤り。警備員に強制的に検査する権限はなく、他人の権利及び自由を侵害してはならない（警備業法第15条）。疑うべき具体的な理由がないのに携帯品の提出を求めることは、同条違反の例として挙げられている（解釈運用基準 第14）。","誤り。警察部隊の配置箇所に補助要員として自主警備員を配置することを妨げるものではないとされている（栃木県警察雑踏警備実施要領 第6の3(1)ウただし書）。","誤り。主催者には、行事の開始後、突発的な事情により自主警備計画を変更する場合には雑踏事故防止を最優先とさせ、警察部隊と協同で雑踏警備を実施している場合は、警察と協議の上で変更させることとされている（栃木県警察雑踏警備実施要領 第5の3(7)）。"],"ref":["警備業法第15条","解釈運用基準 第14","栃木県警察雑踏警備実施要領 第3の3・第5の3(7)・第6の3"],"src":["https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf"]},
{"id":"S2-033","cat":"senmon","sub":"検定と配置基準","kubun":"2","stem":"交通誘導警備業務に係る特定の種別の警備業務の実施基準に関する次の記述のうち、正しいものはどれか。","choices":["高速自動車国道又は自動車専用道路において交通誘導警備業務を行うときは、交通誘導警備業務に係る一級検定合格警備員を、交通誘導警備業務を行う場所ごとに一人以上配置しなければならない。","道路又は交通の状況により都道府県公安委員会が道路における危険を防止するため必要と認める交通誘導警備業務を行うときは、交通誘導警備業務を行う場所ごとに、検定合格警備員を二人以上配置しなければならない。","交通誘導警備業務に従事する検定合格警備員が業務上の必要のため短時間その場所を離れても、社会通念上当該警備業務を継続して実施しているといえる場合は、差し支えないとされている。","検定合格警備員の配置が必要な交通誘導警備業務を行う場所では、そこで交通誘導に従事する警備員の全員が、交通誘導警備業務に係る検定合格警備員でなければならない。","同じ場所で複数の警備業者が交通誘導警備業務を行う場合は、いずれか一つの警備業者が実施基準を満たせば足りる。"],"answer":2,"notes":["誤り。交通誘導警備業務に係る一級検定合格警備員又は二級検定合格警備員を、交通誘導警備業務を行う場所ごとに一人以上配置する（警備員等の検定等に関する規則第2条の表の五の項）。一級に限られない。","誤り。交通誘導警備業務に係る一級又は二級の検定合格警備員を、交通誘導警備業務を行う場所ごとに一人以上配置する（同表の六の項）。","正しい。検定合格警備員に当該種別に係る警備業務を実施させるときは、当該警備業務を行っている間は常時、検定合格警備員が当該警備業務を実施していなければならないが、業務上の必要のため短時間当該警備業務を実施している場所を離れるなど社会通念上当該警備業務を継続して実施しているといえる場合は、この限りでないとされている（解釈運用基準 第17の2(1)）。","誤り。交通誘導警備業務に係る一級検定合格警備員又は二級検定合格警備員を、交通誘導警備業務を行う場所ごとに一人以上配置すればよく（警備員等の検定等に関する規則第2条の表の五の項・六の項）、従事する警備員の全員が検定合格警備員である必要はない。","誤り。複数の警備業者が当該特定の種別の警備業務を実施する場合には、各警備業者ごとに実施基準を満たさなければならない（解釈運用基準 第17の2(3)）。"],"ref":["警備業法第18条","警備員等の検定等に関する規則第2条","解釈運用基準 第17"],"src":[]},
{"id":"S2-034","cat":"senmon","sub":"検定と配置基準","kubun":"2","stem":"雑踏警備業務に係る特定の種別の警備業務の実施基準等に関する次の記述のうち、誤っているものはどれか。","choices":["雑踏警備業務とは、法第2条第1項第2号に規定する警備業務のうち、人の雑踏する場所における負傷等の事故の発生を警戒し、防止する業務であって、雑踏の整理に係るものをいう。","雑踏警備業務を行うときは、雑踏警備業務を行う場所ごと（当該場所が二以上の区域に区分される場合には、それらの区域ごと）に、雑踏警備業務に係る一級又は二級の検定合格警備員を一人以上配置しなければならない。","雑踏警備業務を行う場所が二以上の区域に区分される場合は、当該場所ごとに、雑踏警備業務に係る一級検定合格警備員を一人配置しなければならない。","一級検定合格警備員と、一級又は二級の検定合格警備員の両方の配置が必要な場合でも、一人の一級検定合格警備員が両者を兼ねることができる。","区域を特定するに当たっては、雑踏警備業務を行う場所の広さ、予想される雑踏の状況、警備員の人数及び配置の状況、情報通信技術の利用の状況その他の事情を勘案する。"],"answer":3,"notes":["正しい。警備員等の検定等に関する規則第1条第3号のとおりである。","正しい。同規則第2条の表の四の項の2のとおりである。","正しい。同規則第2条の表の四の項の1のとおりである。","誤り。「一級検定合格警備員」と「一級検定合格警備員又は二級検定合格警備員」が掲げられている場合には、一人の一級検定合格警備員が両者を兼ねることはできない（解釈運用基準 第17の2(2)）。","正しい。同規則第2条の表の備考第2号のとおりである。情報通信技術には、遠隔地の現場の状況を把握するためのカメラ、センサー及び小型無人機などが含まれる（解釈運用基準 第17の2(10)）。"],"ref":["警備員等の検定等に関する規則第1条・第2条","解釈運用基準 第17"],"src":[]},
{"id":"S2-035","cat":"senmon","sub":"検定と配置基準","kubun":"2","stem":"交通誘導警備業務又は雑踏警備業務に係る検定に関する次の記述のうち、正しいものはどれか。","choices":["検定は国家公安委員会が行い、合格した者には国家公安委員会が合格証明書を交付する。","一級の検定を受けることができるのは、原則として、その種別の二級の検定に係る合格証明書の交付を受けた後、その種別の警備業務に従事した期間が通算して1年以上である者であり、この期間は同一の警備業者の下での従事に限られない。","検定の学科試験の合格基準は、80パーセント以上の成績である。","登録講習機関が行う講習会の課程を修了した者であっても、検定の学科試験は免除されない。","合格証明書は、20歳未満の者には交付されない。"],"answer":1,"notes":["誤り。検定は都道府県公安委員会が行い（警備業法第23条第1項）、合格した者に対し警備業務の種別ごとに合格証明書を交付するのも都道府県公安委員会である（同条第4項）。","正しい。警備員等の検定等に関する規則第8条第1号のとおりである。従事期間は通算して1年以上あればよく、同一の警備業者の下でなくても足りる（警備員等の検定の運用について（令和7年12月9日））。このほか、公安委員会が同等以上の知識及び能力を有すると認める者も受検できる（同条第2号）。","誤り。学科試験の合格基準は90パーセント以上の成績である（警備員等の検定等に関する規則第6条第2項）。実技試験も90パーセント以上である（同条第4項）。","誤り。講習会の課程を修了した者については、当該講習会に係る種別の学科試験及び実技試験の全部が免除され、検定に合格した者とみなされる（警備員等の検定等に関する規則第5条）。","誤り。合格証明書は18歳未満の者には交付されない（警備業法第23条第5項において読み替えて準用する第22条第4項第1号）。"],"ref":["警備業法第23条","警備員等の検定等に関する規則第5条・第6条・第8条","警備員等の検定の運用について（令和7年12月9日）"],"src":[]},
{"id":"S2-036","cat":"senmon","sub":"民法","kubun":"2","stem":"交通誘導警備員が業務中の過失により第三者に損害を与えた場合の民法上の責任に関する次の記述のうち、誤っているものはどれか。","choices":["警備員を雇用する警備業者は、警備員の選任及びその事業の監督について相当の注意をしたかどうかにかかわらず、例外なく損害賠償責任を負う。","故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。","使用者に代わって事業を監督する者も、被用者がその事業の執行について第三者に加えた損害を賠償する責任を負う。","使用者が被害者に損害を賠償したときは、被用者に対して求償権を行使することができる。","被害者に過失があったときは、裁判所は、これを考慮して損害賠償の額を定めることができる。"],"answer":0,"notes":["誤り。使用者が被用者の選任及びその事業の監督について相当の注意をしたとき、又は相当の注意をしても損害が生ずべきであったときは、責任を負わない（民法第715条第1項ただし書）。","正しい。民法第709条のとおりである。警備員本人も不法行為による損害賠償責任を負う。","正しい。民法第715条第2項のとおりである。","正しい。民法第715条第3項のとおりである。","正しい。民法第722条第2項（過失相殺）のとおりである。"],"ref":["民法第709条","民法第715条","民法第722条第2項"],"src":[]},
{"id":"S2-037","cat":"senmon","sub":"民法","kubun":"2","stem":"民法に定める正当防衛及び緊急避難に関する次の記述のうち、正しいものはどれか。","choices":["民法上の正当防衛は、自己の権利又は法律上保護される利益を防衛する場合に限られ、第三者の権利を防衛するための行為は含まれない。","他人の不法行為に対し正当防衛として加害行為をした者は損害賠償の責任を負わず、その加害行為による被害者は、元の不法行為をした者に対しても損害賠償を請求することができない。","民法上の緊急避難は、他人の物から生じた急迫の危難を避けるため、その物とは別の第三者の物を損傷した場合に適用される。","民法上の正当防衛が成立するためには、加害行為がやむを得ずにしたものであることを要しない。","他人の物から生じた急迫の危難を避けるためその物を損傷した者は、損害賠償の責任を負わない。"],"answer":4,"notes":["誤り。他人の不法行為に対し、自己又は第三者の権利又は法律上保護される利益を防衛するため、やむを得ず加害行為をした者は、損害賠償の責任を負わない（民法第720条第1項本文）。","誤り。被害者から不法行為をした者に対する損害賠償の請求は妨げられない（民法第720条第1項ただし書）。","誤り。民法上の緊急避難は、他人の物から生じた急迫の危難を避けるため「その物」を損傷した場合に適用される（民法第720条第2項）。刑法の緊急避難（刑法第37条）とは要件が異なる。","誤り。「やむを得ず」加害行為をしたことが要件である（民法第720条第1項）。","正しい。民法第720条第2項により同条第1項が準用され、損害賠償の責任を負わない。"],"ref":["民法第720条"],"src":[]},
{"id":"S2-038","cat":"senmon","sub":"民法","kubun":"2","stem":"民法の事務管理及び不法行為に関する次の記述のうち、誤っているものはどれか。","choices":["義務なく他人のために事務の管理を始めた者が、本人の身体、名誉又は財産に対する急迫の危害を免れさせるために事務管理をしたときは、悪意又は重大な過失があるのでなければ、これによって生じた損害を賠償する責任を負わない。","数人が共同の不法行為によって他人に損害を加えたときは、各自が連帯してその損害を賠償する責任を負う。","土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じた場合、その工作物の占有者は、損害の発生を防止するのに必要な注意をしていたときでも、損害を賠償する責任を免れない。","不法行為による損害賠償請求権は、不法行為の時から20年間行使しないときも、時効によって消滅する。","注文者は、注文又は指図について過失があったときを除き、請負人がその仕事について第三者に加えた損害を賠償する責任を負わない。"],"answer":2,"notes":["正しい。民法第698条（緊急事務管理）のとおりである。","正しい。民法第719条第1項のとおりである。","誤り。土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じたときは、その工作物の占有者が被害者に対して損害を賠償する責任を負うが、占有者が損害の発生を防止するのに必要な注意をしたときは、所有者がその損害を賠償しなければならない（民法第717条第1項）。","正しい。民法第724条第2号のとおりである。","正しい。民法第716条のとおりである。"],"ref":["民法第698条","民法第716条","民法第717条第1項","民法第719条","民法第724条"],"src":[]},
{"id":"S2-039","cat":"senmon","sub":"消防法","kubun":"2","stem":"消防法に定める火災の発生時の義務等に関する次の記述のうち、誤っているものはどれか。","choices":["火災を発見した者は、遅滞なくこれを消防署又は市町村長の指定した場所に通報しなければならない。","火災の現場付近に在る者は、消防対象物の関係者等が行う消火若しくは延焼の防止又は人命の救助に協力する義務を負わない。","消防車が火災の現場に赴くときは、車馬及び歩行者はこれに道路を譲らなければならない。","消防隊は、火災の現場に到着するために緊急の必要があるときは、一般交通の用に供しない通路若しくは公共の用に供しない空地及び水面を通行することができる。","消防吏員又は消防団員は、緊急の必要があるときは、火災の現場付近に在る者を消火若しくは延焼の防止又は人命の救助その他の消防作業に従事させることができる。"],"answer":1,"notes":["正しい。消防法第24条第1項のとおりである。すべての人は、この通報が最も迅速に到達するように協力しなければならない（同条第2項）。","誤り。火災の現場附近に在る者は、消防対象物の関係者等の行う消火若しくは延焼の防止又は人命の救助に協力しなければならない（消防法第25条第2項）。","正しい。消防法第26条第1項のとおりである。消防車の優先通行については、道路交通法第40条等の定めるところによる（同条第2項）。","正しい。消防法第27条のとおりである。","正しい。消防法第29条第5項のとおりである。"],"ref":["消防法第24条","消防法第25条","消防法第26条","消防法第27条","消防法第29条第5項"],"src":[]},
{"id":"S2-040","cat":"senmon","sub":"消防法","kubun":"2","stem":"消防法に定める警戒区域等に関する次の記述のうち、正しいものはどれか。","choices":["火災の現場において消防警戒区域を設定することができるのは、消防長に限られる。","消防吏員又は消防団員が火災の現場にいないときであっても、警察官は、消防警戒区域を設定する職権を行うことはできない。","ガス漏れ等の事故により火災警戒区域が設定されたときは、区域内における火気の使用を禁止することはできるが、区域からの退去を命ずることはできない。","消防長、消防署長その他の消防吏員は、屋外において火災の予防に危険であると認める行為者に対して、たき火や喫煙等の禁止、停止若しくは制限又はこれらの行為を行う場合の消火準備を命ずることができる。","火災現場の上席消防員の指揮により消防警戒区域を設定する場合でも、現場に在る警察官は、これに援助を与える義務を負わない。"],"answer":3,"notes":["誤り。火災の現場においては、消防吏員又は消防団員が消防警戒区域を設定して、総務省令で定める者以外の者に対してその区域からの退去を命じ、又はその区域への出入を禁止し若しくは制限することができる（消防法第28条第1項）。","誤り。消防吏員又は消防団員が火災の現場にいないとき又は消防吏員若しくは消防団員の要求があったときは、警察官は、消防警戒区域の設定等の職権を行うことができる（消防法第28条第2項）。","誤り。火災警戒区域では、消防長又は消防署長は、区域内における火気の使用を禁止し、又は総務省令で定める者以外の者に対してその区域からの退去を命じ、若しくはその区域への出入を禁止し、若しくは制限することができる（消防法第23条の2第1項）。","正しい。消防法第3条第1項第1号のとおりである。祭礼や花火大会などの屋外の催しで火気を使用する場合にも関係する。","誤り。現場に在る警察官は、これに援助を与える義務がある（消防法第28条第3項）。"],"ref":["消防法第3条第1項","消防法第23条の2","消防法第28条"],"src":[]},
{"id":"S2-041","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"工事車両を後退させるときの交通誘導警備員の誘導に関する次の記述のうち、適当なものはどれか。","choices":["車両の真後ろに立ち、後ずさりしながら誘導すると、運転者から警備員の位置がよく分かるので安全である。","後退する車両と電柱や塀との間に立ち、車両と障害物との間隔を確かめながら誘導する。","車両の後方に立つときは、運転者からバックミラーで見える位置に立ち、声や警笛を使って誘導する。","後退を始めた車両の後方に歩行者が近づいてきても、途中で止めると危険なので、そのまま後退を続けさせる。","後退しながら曲がる車両を誘導するときは、運転者に見えやすいよう、車体のすぐ側方に立って誘導する。"],"answer":2,"notes":["誤り。車両の真後ろは運転者の死角になりやすい。車両の後方に立つときは、死角にならないよう、バックミラーで運転手が見える位置に立つとともに運転手に声掛けを行う（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。後ずさりしながら誘導すると、足元の障害物に気付かず転倒するおそれもある。","誤り。後進してきたトラックと電信柱の間にはさまれそうになった事例が紹介されており、車両は思いがけない動きや操作ミスが生じるおそれがあるため、安全な場所を確保してから誘導するよう示されている（同マニュアル）。後進車両の誘導では、誘導する車両等によって挟まれるおそれがある場所に立ち入らない（同マニュアルの交通誘導警備自己点検表の例）。","正しい。同マニュアルのとおりである。後進車両の誘導時には、誘導前に運転者と打合せをし、音声又は警笛を使用する（同マニュアルの交通誘導警備自己点検表の例。例：東京労働局「交通誘導警備業務の労働災害防止チェック項目」も、運転者の死角に入らないようにし、音声又は警笛を使用して誘導するとしている）。建設機械の後退時等には、交通誘導警備員を配置し、その者に誘導させることとされている（建設工事公衆災害防止対策要綱（土木工事編）第34第4項）。","誤り。車両は、歩行者又は他の車両等の正常な交通を妨害するおそれがあるときは、後退してはならない（道路交通法第25条の2第1項）。後方に歩行者などが近づいたときは、直ちに後退を止めてもらう。","誤り。車両の側面に立つときは、内輪差・外輪差を考慮して車両から離れ、適切な安全距離を保つ（厚生労働省マニュアル）。"],"ref":["建設工事公衆災害防止対策要綱（土木工事編）第34第4項","道路交通法第25条の2第1項","厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」","東京労働局「交通誘導警備業務の労働災害防止チェック項目」"],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://jsite.mhlw.go.jp/tokyo-roudoukyoku/content/contents/002811649.pdf","https://www.mlit.go.jp/totikensangyo/const/content/001304729.pdf"]},
{"id":"S2-042","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"工事の作業場の出入口における交通誘導警備員の業務に関する次の記述のうち、適当でないものはどれか。","choices":["車両の出入りが頻繁な出入口では、出入りする車両を誘導するとともに、公衆が作業場に立ち入らないよう監視する。","予定より早く着いた工事車両は、出入口付近の車道上に止めて待たせておき、作業場に入れる準備ができ次第誘導する。","交通量の多い道路に面した出入口では、工事車両の誘導と一般車両・歩行者の誘導を一人で兼ねず、それぞれに警備員を配置する。","出入りする車両が縁石やガードレールなどに接触したときは、軽微なものであっても現場の責任者に報告する。","出入口付近に置く看板や資材は、出入りする車両の運転者と歩道の通行者が互いに見通せるように配置する。"],"answer":1,"notes":["正しい。作業場の出入口は、車両の出入りが頻繁な場合、原則として交通誘導警備員を配置し、公衆の出入りを防止するとともに、出入りする車両の誘導に当たらせることとされている（建設工事公衆災害防止対策要綱（土木工事編）第16第1項ただし書）。","誤り。工事車両の路上待機は、後続の車両に衝突されるおそれがあるうえ、安全・円滑な交通の支障となる。工事現場側で到着時刻を具体的に指示し、交通事情による到着時刻の前後も考慮した受入れ態勢を整えるよう示されている（例：警視庁交通規制課 令和7年8月号）。土木工事の車両が交通に支障を起こすおそれがある場合には、関係機関と協議を行い、必要な措置を講じることとされている（要綱第25第3項）。","正しい。工事車両の誘導と一般交通や歩行者の誘導は兼務できず、交通頻繁な道路では、安全・円滑な出入りのために複数の誘導員が欠かせないとされている（例：警視庁交通規制課 令和7年8月号。同10月号も、作業帯内に工事車両が出入りする箇所には専従の誘導員を配置するとしている）。交通誘導員が別方向を誘導している間に、歩道をまたいで伸ばしたコンクリートポンプ車のブームに歩行者が接触した事故も報告されている（同 令和7年6月号）。","正しい。施工者は、作業場に出入りする車両等が道路構造物及び交通安全施設等に損傷を与えることのないよう注意し、損傷させた場合は、直ちに当該管理者に報告し、その指示により復旧しなければならない（要綱第22第2項）。その前提として、現場の警備員は接触の事実を責任者に確実に報告する。","正しい。施工者は、工事用の諸施設を設置する場合、周囲の地盤面から高さ0.8メートル以上2メートル以下の部分について、通行者の視界を妨げることのないよう必要な措置を講じなければならない（要綱第23第2項）。"],"ref":["建設工事公衆災害防止対策要綱（土木工事編）第16第1項・第22第2項・第23第2項・第25第3項","警視庁交通規制課 路上工事事故防止資料（令和7年6月号・8月号・10月号）"],"src":["https://www.mlit.go.jp/totikensangyo/const/content/001304729.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2506.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2508.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2510.pdf"]},
{"id":"S2-043","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"工事現場付近で歩行者や自転車を誘導する場合に関する次の記述のうち、適当でないものはどれか。","choices":["通学・通園の時間帯には、通学・通園する児童や幼児が安全に道路を通行できるよう、誘導や合図などの措置をとるよう努める。","目の不自由な歩行者には、驚かせないよう声をかけ、工事中であることや通路の状況を具体的に伝えて、本人の意向を確かめてから誘導する。","自転車は車両であるから、車線規制で車道が狭くなる区間では、後方から来る自動車と自転車との接触にも注意する。","歩行者を車道側の通路に通すため車両に止まってもらうときは、車両が確実に停止したことを確かめてから歩行者を通す。","自転車を押して歩いている者は、道路交通法上の歩行者に当たらないので、歩行者用通路に入れず、車道を通行させる。"],"answer":4,"notes":["正しい。児童又は幼児が小学校、幼稚園等に通うため道路を通行している場合に、誘導、合図その他適当な措置をとることが必要と認められる場所では、警察官等その他その場所に居合わせた者は、これらの措置をとることにより、児童又は幼児が安全に道路を通行することができるように努めなければならない（道路交通法第14条第4項）。","正しい。目が見えない者は、道路を通行するときは、政令で定めるつえ（白色又は黄色のつえ）を携え、又は政令で定める盲導犬を連れていなければならない（道路交通法第14条第1項、同法施行令第8条）。視覚障害のある人には、驚かせないよう正面から「何かお手伝いしましょうか」と声をかけ、位置関係を具体的に伝え、本人の意思を確認しながら支援することが例示されている（内閣府「合理的配慮等具体例データ集（視覚障害）」）。","正しい。自転車は軽車両として車両に含まれ（道路交通法第2条第1項第8号・第11号）、歩道等と車道の区別のある道路では原則として車道を通行する（同法第17条第1項）。自動車は、同一の方向に進行している自転車等の右側を通過する場合に十分な間隔がないときは、その間隔に応じた安全な速度で進行しなければならない（同法第18条第3項）。","正しい。停止の合図をしたときは、当該車両及び後続車両が確実に停止したことを確認するまで注視を継続する（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」の交通誘導警備自己点検表の例）。交通誘導警備員の合図は運転者の任意の協力を求めるものであり（警備業法第15条）、合図に気付かない運転者もいるので、停止を確かめずに歩行者を通すと、歩行者が車両と接触するおそれがある。","誤り。二輪又は三輪の自転車（側車付きのもの及び他の車両を牽引しているものを除く。）を押して歩いている者は、道路交通法の規定の適用については歩行者とされる（道路交通法第2条第3項第2号）。歩行者用通路へ案内する。"],"ref":["道路交通法第2条","道路交通法第14条第1項・第4項","道路交通法第17条第1項","道路交通法第18条第3項","道路交通法施行令第8条","警備業法第15条","厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」"],"src":["https://www8.cao.go.jp/shougai/suishin/jirei/index_shikaku.html","https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S2-044","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"夜間や悪天候時などの交通誘導に関する次の記述のうち、適当でないものはどれか。","choices":["深夜で交通量が少ないときは、運転者も注意して走行しているので、停止の合図は車両が十分に近づいてから行えば足りる。","警備員の後方に太陽などの明るい光源がある逆光の位置では、運転者から警備員が見えにくいので、その位置に立つことを避ける。","雨天や路面の凍結時は、車両の停止距離が長くなるうえ、警備員自身も転倒しやすいので、車両との安全距離を十分にとる。","交通量の特に多い道路では、工事中を示す標示板の近くに、必要に応じて夜間200メートル前方から視認できる黄色又は赤色の注意灯を設ける。","強風の日は、標示板やバリケードが風や通行車両の風圧で倒れて車道に出ないよう、設置の状態を確かめる。"],"answer":0,"notes":["誤り。夜間の片側交互通行の誘導で、勤務の疲れから車両に気付くのが遅れ、停止の合図が遅れて急ブレーキを踏ませた事例が紹介されている（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。夜間は運転者から警備員が見えにくく、重大事故の発生も多いことに留意し、停止の合図はゆとりをもって行う（同マニュアルの交通誘導警備自己点検表の例）。","正しい。見通しが良い道路であっても、夜間だけでなく、警備員の後方に太陽など明るい光源があるような逆光時は、運転手から警備員が見えづらいとされている（厚生労働省マニュアル）。誘導位置は、警備員の後方に明るい光源があるような場所を避けて選定する（例：東京労働局「交通誘導警備業務の労働災害防止チェック項目」）。","正しい。雨天などにより道路がぬかるんでいる、あるいは凍結している場合は、警備員自身が転倒するおそれや車両の停車距離が長くなるおそれがあるため、適切な安全距離を保つ（厚生労働省マニュアル）。","正しい。建設工事公衆災害防止対策要綱（土木工事編）第24第3項のとおりである。交通量の特に多い道路上では、作業場の交通流に対面する場所に工事中であることを示す標示板（原則として内部照明式）を設置し、必要に応じて回転式か点滅式の黄色又は赤色の注意灯を、標示板に近接した位置に設置する。","正しい。標示板等は、強風や通行車両の風圧に耐えられるように設置するよう示されている（厚生労働省マニュアル）。保安用資器材は、設置の際に飛散、転倒しないよう安全措置を講じる（同マニュアルの交通誘導警備自己点検表の例）。"],"ref":["建設工事公衆災害防止対策要綱（土木工事編）第24第3項","厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」","東京労働局「交通誘導警備業務の労働災害防止チェック項目」"],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://jsite.mhlw.go.jp/tokyo-roudoukyoku/content/contents/002811649.pdf","https://www.mlit.go.jp/totikensangyo/const/content/001304729.pdf"]},
{"id":"S2-045","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"交通誘導警備員の交代、休憩及び配置に関する次の記述のうち、適当なものはどれか。","choices":["休憩から戻ったときは、休憩前と同じ位置に就けばよく、休憩中の作業の進み具合や規制の変化を確かめる必要はない。","その現場に初めて配置された警備員であっても、立ち位置や移動してよい範囲は本人の判断に任せる。","体調が優れなくても、交代の要員がいない現場では誘導を続け、勤務が終わってから報告すれば足りる。","人員の配置を計画するときは、勤務の時間帯や環境を考えて、警備員が適宜休憩をとれるようにする。","交代の際の引継ぎでは、警備指令書に書かれていない、その日に生じた作業や規制の変更点までは伝えなくてよい。"],"answer":3,"notes":["誤り。道路工事では作業箇所が刻々と変化するので、一日の作業開始前だけでなく、午後の作業開始前など状況の変化に応じて、作業手順や安全対策について確認を含めた打合せを行うよう示されている（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。休憩から戻ったときも、作業や規制の変化を確かめてから誘導に就く。","誤り。一般車両の通行を一部制限して道路工事を行う場合は、交通誘導員の位置、移動の範囲について明確な指示を行い、当日に配置された誘導員の経験等を確認して、誘導内容、危険度に応じた配置を行うよう示されている（同マニュアル。一般車両を誘導しようとして所定の位置から重機の作業箇所に移動したと推定される入社2年目の警備員が、ドラグ・ショベルにひかれて死亡した災害の対策として示されたもの）。","誤り。気分が悪い、体がだるいなど体調に変化があった場合は、無理をせず速やかに仲間や責任者に報告するよう示されている（同マニュアル）。体調不良のまま誘導を続けると、合図の遅れなどにより事故を招くおそれがある。","正しい。夜間勤務の疲れから停止の合図が遅れた事例の対策として、人員配置を考える際は、勤務環境や勤務時間を考慮し、適宜休憩が取れるように計画するよう示されている（同マニュアル）。工事の計画段階から交代要員を含めた人員の確保に努めるよう示されている例もある（例：警視庁交通規制課 令和7年8月号）。","誤り。同マニュアルは、交通誘導警備では分からないことをそのままにせず必ず責任者や前任者に確認すること、施設警備では前任者から業務を引き継ぐ際に安全面の注意点などを聞いておくことを示している。指令書にない当日の変更点こそ、確実に引き継ぐ必要がある。"],"ref":["厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」","警視庁交通規制課 路上工事事故防止資料（令和7年8月号）"],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2508.pdf"]},
{"id":"S2-046","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"作業帯の設置・撤収及び保安用資器材の取扱いに関する次の記述のうち、適当でないものはどれか。","choices":["標示板などの保安用資器材の設置作業は、原則として、交通の流れの上流から下流に向けて行う。","工事の進み具合に合わせて、標示板が運転者や通行者から見やすい位置・高さ・角度になっているか確かめ、必要に応じて移す。","作業帯の保安用資器材は一般交通を誘導するためのものであるから、交通量が少ない時間帯は、その一部を省略してもよい。","作業帯の撤収を終えたときは、保安用資器材や工事の資材が道路上に置き残されていないことを確かめる。","撤収作業中は、規制帯の中であっても、後退してくる工事車両や規制に従わず進入してくる車両に注意する。"],"answer":2,"notes":["正しい。標示板等の設置作業は、原則として、交通の流れの上流から下流に向けて行う（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。保安用資器材の設置は車両の進行方向から始め、撤去は進行方向の逆の地点から始めることとされている（同マニュアルの交通誘導警備自己点検表の例）。","正しい。同マニュアルのとおりである。","誤り。作業帯の保安資器材は、一般交通の整理誘導だけでなく作業員の身を守る役割もあり、設置を省略することはできないとされている（例：警視庁交通規制課 令和7年8月号）。作業帯は道路使用許可を受けた図面のとおりに設置する（同号）。許可に付された条件に違反すると、許可の取消し等や警察署長の措置命令の対象となる（道路交通法第77条第5項、第81条第1項第4号）。","正しい。道路使用許可を受けた者は、許可の期間が満了したときは、すみやかに工作物の除去その他道路を原状に回復する措置を講じなければならない（道路交通法第77条第7項）。作業帯を設置せずに取り外した排水ますの蓋を路上に放置し、自転車が衝突して転倒した事故も報告されており、工事資材等を道路上に放置しないよう示されている（例：警視庁交通規制課 令和7年11月号）。","正しい。車両規制帯の撤去作業中に規制帯内を後進してきたトラックにひかれた事例や、作業と片付けがほぼ終わり、規制帯内を歩いて移動していた警備員が、車両誘導に従わずに侵入してきたバイクに後方から追突された事例が報告されている（例：東京労働局「交通誘導警備業務の労働災害防止チェック項目」の死亡災害事例）。保安用資器材を設置する際だけでなく撤去時も車両に注意する（厚生労働省マニュアル）。"],"ref":["道路交通法第77条第5項・第7項","道路交通法第81条第1項第4号","厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」","警視庁交通規制課 路上工事事故防止資料（令和7年8月号・11月号）","東京労働局「交通誘導警備業務の労働災害防止チェック項目」"],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2508.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2511.pdf","https://jsite.mhlw.go.jp/tokyo-roudoukyoku/content/contents/002811649.pdf"]},
{"id":"S2-047","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"交通誘導警備業務における事故やヒヤリ・ハットの報告と再発防止に関する次の記述のうち、適当なものはどれか。","choices":["報告されたヒヤリ・ハットの情報は、同じような業務を行う警備員にも早く知らせ、同種の事故の防止に役立てる。","ヒヤリ・ハットは事故に至らなかったものであるから、報告させる必要はなく、各警備員の反省に任せる。","不安全な行動が原因のヒヤリ・ハットを報告した警備員には、再発を防ぐため、報告の内容に応じて責任を追及する。","工事に起因して通行人が負傷したときでも、工事の工程を守るため、作業を続けながら救護と関係機関への連絡を行う。","事故の後で警備計画や警備指令書に不備が見つかっても、その現場の工事が終わるまでは見直さず、次の現場から改める。"],"answer":0,"notes":["正しい。報告されたヒヤリ・ハット情報は、同じような業務を行っている警備員や同じ職場の仲間などにも早期に知らせ、同じようなことが繰り返されないようにする（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。警備会社は、収集したヒヤリ・ハット事例を分析し、特に重要な事例は新任教育、現任教育などでフィードバックするよう示されている（同）。","誤り。ヒヤリ・ハットを放置すると、その後大きな労働災害につながるおそれがある。終業時など適宜所定の用紙などで報告させ、警備会社は報告しやすい体制を構築するよう示されている（同マニュアル）。","誤り。不安全な行動でヒヤリ・ハットが発生しても、報告者の責任を追及せず、安全衛生活動への活用を徹底することで、活発な報告につながるとされている（同マニュアル）。","誤り。発注者及び施工者は、土木工事の施工により公衆災害が発生した場合には、施工を中止した上で、直ちに被害状況を把握し、速やかに関係機関へ連絡するとともに、応急措置、二次災害の防止措置を行わなければならない（建設工事公衆災害防止対策要綱（土木工事編）第13第2項）。工事の再開に当たっては、類似の事故が再発しないよう措置を講じる（同第3項）。","誤り。報告・連絡・相談を徹底することで警備指令書の不備などが明確になることもあり、その場合は、より安全かつ円滑な警備となるよう適宜警備指令書を見直すことが大切とされている（同マニュアル）。"],"ref":["建設工事公衆災害防止対策要綱（土木工事編）第13","厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」"],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://www.mlit.go.jp/totikensangyo/const/content/001304729.pdf"]},
{"id":"S2-048","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"片側交互通行の交通誘導に関する次の記述のうち、適当でないものはどれか。","choices":["二人以上で誘導するときは、停止や進行の合図の方法を事前に確かめ合っておく。","区間の前後で渋滞が長くならないよう、交通量に応じて交互に通す時間を調整する。","区間の途中に接続する道路があるときは、対向車両の誘導中も、その道路から出てくる車両に注意する。","緊急自動車が接近してきたときは、反対側の警備員と連絡を取り合い、対向車両に止まってもらうなどして進路を確保する。","反対側から進行させた車両の通過を確かめにくいときは、一定の時間がたったら、自分の側の車両を進行させてよい。"],"answer":4,"notes":["正しい。複数人で誘導を行う場合は、事前に十分に合図の方法を確認することでスムーズな誘導につながるとされている（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。","正しい。制限後の車線が1車線となり往復の交互交通とする場合は、制限区間をできる限り短くし、その前後で交通が渋滞することのないよう、原則として交通誘導警備員を配置することとされている（建設工事公衆災害防止対策要綱（土木工事編）第25第1項第2号）。","正しい。片側交互通行の現場で、対向車両の誘導に従事していた交通誘導員が接続路から進入してきた車両と衝突した事故（例：警視庁交通規制課 令和7年1月号）や、待機車を発進させて持ち場を移動中の警備員が枝道から出てきた軽トラックと接触した死亡災害（例：東京労働局「交通誘導警備業務の労働災害防止チェック項目」の死亡災害事例）が報告されている。","正しい。緊急自動車が接近してきたときは、車両は道路の左側に寄って一時停止し、又は進路を譲らなければならない（道路交通法第40条）。交互通行の区間では行き違いができないので、両端の警備員が連絡を取り合い、運転者の協力を得て緊急自動車の進路を確保する。","誤り。交互通行の誘導では、警備員相互に緊密な連携を保ち、対向する車両等が停止したことを確認した後でなければ自己の誘導する車両等を発進させない（厚生労働省マニュアルの交通誘導警備自己点検表の例）。反対側から進行させた車両が区間内に残ったまま自分の側の車両を進行させると、区間内での正面衝突や立ち往生を招くおそれがある。時間で判断せず、反対側の警備員と連絡を取り合って車両の通過を確かめる。"],"ref":["建設工事公衆災害防止対策要綱（土木工事編）第25第1項第2号","道路交通法第40条","厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」","警視庁交通規制課 路上工事事故防止資料（令和7年1月号）","東京労働局「交通誘導警備業務の労働災害防止チェック項目」"],"src":["https://www.mhlw.go.jp/content/000611912.pdf","https://www.mlit.go.jp/totikensangyo/const/content/001304729.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2501.pdf","https://jsite.mhlw.go.jp/tokyo-roudoukyoku/content/contents/002811649.pdf"]},
{"id":"S2-049","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"交通誘導警備員の立ち位置及び現場での動き方に関する次の記述のうち、適当でないものはどれか。","choices":["立つ位置は、車両の運転者や歩行者からよく見え、かつ、警備員自身の視界も良好な場所を選ぶ。","工事車両の移動の際に誘導の合図を要するかどうかは、その都度運転者が決めればよく、事前に取り決める必要はない。","段差や側溝のふたの上、雨でぬかるんだ路肩など、転倒しやすい場所を避け、足元の安定した位置に立つ。","警備員自身が通行車両の障害となるような場所に位置しないよう、規制の状況に合わせて立つ位置を選ぶ。","持ち場を移るため道路を横断するときは、原則として、信号機の信号に従い、又は横断歩道によって横断する。"],"answer":1,"notes":["正しい。立哨及び動哨位置は、車両の運転者、歩行者からよく見え、警備員自身の視界も良好な位置を選定する（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」の交通誘導警備自己点検表の例）。","誤り。建設工事現場で工事関係車両等を移動させる場合は、工事開始前に必ず、誘導合図を必要とする場合と必要としない場合について打合せを行い、双方がこれを遵守するよう示されている（同マニュアル）。合図の方法・動作や誘導位置（立ち位置）についても、元請事業場等と事前に打ち合わせる（同）。","正しい。転倒事故が生じやすい場所を避けた位置を選定する（同自己点検表の例）。","正しい。警備員自身が通行車両の障害となるような場所に位置しない（同自己点検表の例）。やむを得ず車道で誘導する場合は、車道の左側端や設置された保安用資器材の内側に立つ（同マニュアル）。","正しい。道路の横断時は、原則として、信号機の信号又は横断歩道によって横断し、やむを得ずこれらによらずに横断するときは、通行車両等による危険がないことを確認した後、速やかに横断する（同自己点検表の例）。"],"ref":["厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」（交通誘導警備自己点検表の例を含む）"],"src":["https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S2-050","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"交通誘導警備業務における熱中症の予防及び対応に関する次の記述のうち、適当なものはどれか。","choices":["水分と塩分の補給は、作業中にのどの渇きを感じてから行えば足り、作業開始前に補給しておく必要はない。","気温がそれほど高くない日は、湿度が高くても熱中症のおそれはないので、暑さ指数（WBGT値）を気にする必要はない。","熱中症の疑いがある警備員は、他の警備員の業務の妨げにならないよう、離れた場所で一人で休ませる。","業務開始前に、体調に異変があったときの報告先や医療機関等の連絡先、休憩場所などを確かめておく。","熱中症を生ずるおそれのある作業での報告体制の整備と作業従事者への周知は、事業者の努力義務とされている。"],"answer":3,"notes":["誤り。汗で失われた水分と塩分は定期的に摂取し、作業開始前からおよそ20分ごとに150mL摂取することが目安とされている（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」）。","誤り。気温が高くなくても、湿度が高い場合は熱中症が発生しやすいことが知られている。気温だけでなく風速や輻射熱も関係しており、それらを統合して熱中症発生リスクを評価する指標として暑さ指数（WBGT）が用いられている（同マニュアル）。","誤り。仲間に熱中症の疑いがあるときは、すぐに声をかけて涼しい場所に移動させ、水分と塩分を補給させて休憩をとらせ、その他の仲間や責任者にも声をかけて、回復するまで一人にしないようにする（同マニュアル）。","正しい。スムーズな緊急対応のため、業務開始前に「誰に報告するのか」、「医療機関等の連絡先」、「休憩場所やスポーツドリンクの保管場所」などを確認しておくよう示されている（同マニュアル）。","誤り。事業者は、暑熱な場所において連続して行われる作業等熱中症を生ずるおそれのある作業を行うときは、あらかじめ、作業従事者が熱中症の自覚症状を有する場合や、熱中症が生じた疑いのある作業従事者を他の作業従事者が発見した場合にその旨の報告をさせる体制を整備し、作業従事者に周知させなければならない（労働安全衛生規則第612条の2第1項）。努力義務ではない。症状の悪化を防止するために必要な措置の内容と実施手順をあらかじめ定めて周知することも義務付けられている（同条第2項）。"],"ref":["労働安全衛生規則第612条の2","厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」"],"src":["https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S2-051","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"交通誘導警備員が道路交通法の規定を踏まえて誘導を行う場合に関する次の記述のうち、適当でないものはどれか。","choices":["道路工事のため歩道を通行できないときは、歩行者は歩道以外の部分を通行できるので、安全な通路を確保した上で誘導する。","工事車両を作業場に入れるまでの間、横断歩道の上やその前後5メートル以内の場所で待機させることはしない。","一方通行の道路で工事を行うときは、交通誘導警備員が誘導すれば、車両を一方通行の出口側から逆向きに進入させることができる。","進路変更禁止の道路標示で区画された車両通行帯が工事で通行できないときは、車両がその道路標示を越えて進路を変更することは認められている。","工事の看板や資材は、信号機や道路標識の効用を妨げるような場所に置かない。"],"answer":2,"notes":["正しい。歩行者等は、歩道等と車道の区別のある道路では歩道等を通行しなければならないが、道路工事等のため歩道等を通行することができないときは、歩道等以外の部分を通行することができる（道路交通法第10条第2項第2号）。","正しい。横断歩道では停車及び駐車が禁止され（道路交通法第44条第1項第1号）、横断歩道の前後の側端からそれぞれ前後に5メートル以内の部分も同様である（同項第3号）。","誤り。歩行者等又は車両等は、道路標識等によりその通行を禁止されている道路又はその部分を通行してはならない（道路交通法第8条第1項）。交通誘導警備員の合図に交通規制を変える効力はなく（警備業法第15条）、逆向きの進入を促せば、運転者に違反をさせ、事故を招くことになる。","正しい。進路の変更の禁止を表示する道路標示によって区画された車両通行帯を通行している車両でも、道路工事その他の障害のためその車両通行帯を通行することができないときは、その道路標示を越えて進路を変更することができる（道路交通法第26条の2第3項第1号）。","正しい。何人も、信号機又は道路標識等の効用を妨げるような工作物又は物件を設置してはならない（道路交通法第76条第2項）。"],"ref":["道路交通法第8条第1項","道路交通法第10条第2項第2号","道路交通法第26条の2第3項","道路交通法第44条第1項","道路交通法第76条第2項","警備業法第15条"],"src":[]},
{"id":"S2-052","cat":"senmon","sub":"交通誘導","kubun":"2","stem":"道路上やその上空で建設機械等を使用する作業における公衆の安全確保に関する次の記述のうち、適当なものはどれか。","choices":["クレーンで吊り荷を移動させる間は、歩行者等に一時止まってもらい、吊り荷の下やその周辺に入らないようにする。","道路に面した地上4メートル以上の場所で、落下の危険を伴う資材の搬出入を行うときでも、作業場の周囲を板材で覆ってあれば、交通誘導警備員を配置する必要はない。","歩道をまたいでコンクリートポンプ車のブームを伸ばすときは、交通誘導警備員がブームの下で歩行者を誘導し、そのまま通行させる。","建設機械のアームが作業場の外に出る場合でも、運転者が注意して操作していれば、作業範囲への立入りを制限する措置は要しない。","足場の組立てや解体で材料や工具を上げ下ろしするときは、作業を早く終えるため、作業場の外の歩道上で行ってよい。"],"answer":0,"notes":["正しい。クレーン作業時は、吊り荷を移動させる際は歩行者等を一旦止めるなど一般交通の安全を確保し、道路上での懸吊作業中は歩行者等の通行を一時停止させるよう、道路使用許可を受けて工事を行う側に示されている（例：警視庁交通規制課 令和8年5月号）。交通誘導警備員には通行を強制的に止める権限はないので（警備業法第15条）、歩行者等に事情を伝えて協力を求め、一時止まってもらう。交通誘導警備員自身も、工事用作業車等の作業半径内や吊り荷の下に立ち入らない（厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」の交通誘導警備自己点検表の例）。","誤り。地上4メートル以上の場所で作業する場合に、作業する場所からふ角75度以上のところに一般の交通その他の用に供せられている場所があるときは、作業する場所の周囲等を板材等で覆うことに加え、資材の搬出入など落下の危険を伴う場合においては、原則として交通誘導警備員を配置し一般交通等の規制を行う等の措置をとることとされている（建設工事公衆災害防止対策要綱（土木工事編）第31第1項）。","誤り。やむを得ず歩道をまたぐ形でブームを伸ばす場合は、案内看板や誘導員を配置した上で歩行者の迂回措置をとる等し、歩行者の上空を作業機械等が通過することのないようにするよう示されている（例：警視庁交通規制課 令和7年6月号。歩道をまたいで展張したコンクリートポンプ車のブームに歩行者が接触し、頭部を負傷した事故の対策）。","誤り。施工者は、建設機械を作動する範囲を原則として作業場内とし、やむを得ず作業場外で使用する場合には、作業範囲内への立入りを制限する等の措置を講じなければならない（要綱第34第2項）。","誤り。足場等の組立て、解体時の材料、器具、工具等の上げ下ろしは、原則として、一般の交通その他の用に供せられている場所を避け、作業場内で行わなければならない（要綱第19第2項）。"],"ref":["建設工事公衆災害防止対策要綱（土木工事編）第19第2項・第31第1項・第34第2項","警視庁交通規制課 路上工事事故防止資料（令和7年6月号、令和8年5月号）","厚生労働省「未熟練労働者の安全衛生教育マニュアル（警備業編）」","警備業法第15条"],"src":["https://www.mlit.go.jp/totikensangyo/const/content/001304729.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2506.pdf","https://www.keishicho.metro.tokyo.lg.jp/kotsu/jikoboshi/torikumi/kotsu_joho/road_construction.files/2605.pdf","https://www.mhlw.go.jp/content/000611912.pdf"]},
{"id":"S2-053","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法に定める用語の意義等に関する次の記述のうち、誤っているものはどれか。","choices":["「道路」には、道路法に規定する道路や道路運送法に規定する自動車道のほか、一般交通の用に供するその他の場所も含まれる。","「信号機」とは、電気により操作され、かつ、道路の交通に関し、灯火により交通整理等のための信号を表示する装置をいう。","「道路標示」とは、道路の交通に関し、規制又は指示を表示する標示で、路面に描かれた道路鋲、ペイント、石等による線、記号又は文字をいう。","「安全地帯」とは、路面電車に乗降する者又は横断している歩行者の安全を図るため道路に設けられた島状の施設に限られる。","身体障害者用の車を通行させている者は、道路交通法の規定の適用については、歩行者とされる。"],"answer":3,"notes":["正しい。道路交通法第2条第1項第1号のとおりである。","正しい。道路交通法第2条第1項第14号のとおりである。","正しい。道路交通法第2条第1項第16号のとおりである。「道路標識」は、道路の交通に関し、規制又は指示を表示する標示板をいう（同項第15号）。","誤り。「安全地帯」には、路面電車に乗降する者若しくは横断している歩行者の安全を図るため道路に設けられた島状の施設のほか、道路標識及び道路標示により安全地帯であることが示されている道路の部分も含まれる（道路交通法第2条第1項第6号）。","正しい。道路交通法第2条第3項第1号のとおりである。歩行補助車等や小児用の車を通行させている者、二輪の自転車などを押して歩いている者も歩行者とされる（同項）。"],"ref":["道路交通法第2条"],"src":[]},
{"id":"S2-054","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法令に定める目が見えない者、児童、幼児等の保護に関する次の記述のうち、正しいものはどれか。","choices":["目が見えない者が道路を通行するときに携える政令で定めるつえは、白色のつえに限られ、黄色のつえは認められていない。","車両等の運転者は、監護者が付き添わない児童又は幼児が歩行しているときは、一時停止し、又は徐行して、その歩行を妨げないようにしなければならない。","目が見えない者以外の者は、耳が聞こえない者であっても、政令で定めるつえを携えて道路を通行してはならない。","幼児を保護する責任のある者は、交通のひんぱんな道路であっても、自ら又はこれに代わる監護者が付き添わずに幼児を歩行させることができる。","盲導犬の訓練を目的とする法人で国家公安委員会が指定したものが訓練した犬であれば、白色又は黄色の用具を付けていなくても、政令で定める盲導犬に当たる。"],"answer":1,"notes":["誤り。政令で定めるつえは、白色又は黄色のつえとされている（道路交通法施行令第8条第1項）。","正しい。道路交通法第71条第2号のとおりである。身体障害者用の車が通行しているとき、目が見えない者が政令で定めるつえを携え、若しくは盲導犬を連れて通行しているときなども同様である（同号）。","誤り。目が見えない者以外の者は政令で定めるつえを携えて道路を通行してはならないが、耳が聞こえない者及び政令で定める程度の身体の障害のある者は除かれている（道路交通法第14条第2項、同法施行令第8条第4項）。","誤り。児童若しくは幼児を保護する責任のある者は、交通のひんぱんな道路又は踏切若しくはその附近の道路において、児童若しくは幼児に遊戯をさせ、又は自ら若しくはこれに代わる監護者が付き添わないで幼児を歩行させてはならない（道路交通法第14条第3項）。","誤り。政令で定める盲導犬は、国家公安委員会が指定した法人が盲導犬として必要な訓練をした犬等で、内閣府令で定める白色又は黄色の用具を付けたものとされている（道路交通法施行令第8条第2項）。"],"ref":["道路交通法第14条","道路交通法第71条第2号","道路交通法施行令第8条"],"src":[]},
{"id":"S2-055","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法に定める車両の通行方法に関する次の記述のうち、誤っているものはどれか。","choices":["車両通行帯の設けられた道路を通行する場合を除き、自動車は道路の左側に寄って、自転車などの軽車両は道路の左側端に寄って通行するのが原則である。","自動車は、車道を同一の方向に進行している自転車の右側を追い越さずに通過する場合において、自転車との間に十分な間隔がないときは、その間隔に応じた安全な速度で進行しなければならない。","車両は、進路を変更した場合にその変更した後の進路と同一の進路を後方から進行してくる車両等の速度又は方向を急に変更させることとなるおそれがあるときは、進路を変更してはならない。","車両通行帯の設けられた道路においては、車両は、原則として、道路の左側端から数えて1番目の車両通行帯を通行しなければならない。","車両は、道路外に出るため左折するときは、あらかじめその前からできる限り道路の中央に寄り、かつ、徐行しなければならない。"],"answer":4,"notes":["正しい。道路交通法第18条第1項本文のとおりである。追越しをするとき、道路の状況その他の事情によりやむを得ないときなどは例外とされている（同項ただし書）。","正しい。道路交通法第18条第3項のとおりである（令和8年4月1日施行。歩道又は自転車道を通行している自転車等は対象外）。この場合において、自転車等は、できる限り道路の左側端に寄って通行しなければならない（同条第4項）。","正しい。道路交通法第26条の2第2項のとおりである。車両は、みだりにその進路を変更してはならない（同条第1項）。","正しい。道路交通法第20条第1項本文のとおりである。","誤り。車両は、道路外に出るため左折するときは、あらかじめその前からできる限り道路の左側端に寄り、かつ、徐行しなければならない（道路交通法第25条第1項）。道路の中央に寄るのは、道路外に出るため右折するときである（同条第2項）。"],"ref":["道路交通法第18条","道路交通法第20条第1項","道路交通法第25条","道路交通法第26条の2"],"src":["https://www.police.pref.osaka.lg.jp/kotsu/kaisei/23662.html"]},
{"id":"S2-056","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法に定める交差点における通行方法等に関する次の記述のうち、正しいものはどれか。","choices":["交通整理の行われていない交差点で、優先道路も幅員の差もないときは、車両は、交差道路を右方から進行してくる車両の進行妨害をしてはならない。","交通整理の行われていない交差点に入ろうとする車両等は、交差道路が優先道路であるときは、道路標識等による指定がなくても、交差点の直前で一時停止しなければならない。","車両等は、交差点で右折する場合において、当該交差点で直進し、又は左折しようとする車両等があるときは、その進行妨害をしてはならない。","車両等は、交差点に入ろうとし、及び交差点内を通行するときは、交差道路を通行する車両等に注意すれば足り、交差点の直近で道路を横断する歩行者に特に注意する必要はない。","左折しようとして合図をした車両の後方にある車両は、速度又は方向を急に変更しなければならないこととなる場合であっても、その車両の進路の変更を妨げてはならない。"],"answer":2,"notes":["誤り。交通整理の行われていない交差点では、優先道路等に関する規定が適用される場合を除き、車両は、交差道路を左方から進行してくる車両及び交差道路を通行する路面電車の進行妨害をしてはならない（道路交通法第36条第1項第1号）。","誤り。交通整理の行われていない交差点に入ろうとする場合において、交差道路が優先道路であるとき、又は交差道路の幅員が明らかに広いときは、優先道路を通行している場合を除き、徐行しなければならない（道路交通法第36条第3項）。一時停止が義務付けられるのは、道路標識等により一時停止すべきことが指定されているときなどである（同法第43条）。","正しい。道路交通法第37条のとおりである。","誤り。車両等は、交差点に入ろうとし、及び交差点内を通行するときは、当該交差点の状況に応じ、交差道路を通行する車両等、反対方向から進行してきて右折する車両等及び当該交差点又はその直近で道路を横断する歩行者に特に注意し、かつ、できる限り安全な速度と方法で進行しなければならない（道路交通法第36条第4項）。交差点付近で交通誘導を行う際も、右左折する車両と横断歩行者との関係に注意する。","誤り。後方にある車両は、その速度又は方向を急に変更しなければならないこととなる場合を除き、合図をした車両の進路の変更を妨げてはならない（道路交通法第34条第6項）。"],"ref":["道路交通法第34条","道路交通法第36条","道路交通法第37条","道路交通法第43条"],"src":[]},
{"id":"S2-057","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法に定める徐行及び一時停止に関する次の記述のうち、誤っているものはどれか。","choices":["車両等は、踏切を通過しようとするときは、信号機の表示する信号に従うときであっても、踏切の直前で停止しなければならない。","車両等は、道路のまがりかど附近、上り坂の頂上附近又は勾配の急な下り坂を通行するときは、徐行しなければならない。","車両等は、交通整理が行われていない交差点又はその手前の直近において、道路標識等により一時停止すべきことが指定されているときは、停止線の直前（停止線がないときは交差点の直前）で一時停止しなければならない。","車両は、歩行者用道路を通行することが認められている場合でも、特に歩行者に注意して徐行しなければならない。","車両等は、左右の見とおしがきかない交差点に入ろうとするときは、交通整理が行われている場合や優先道路を通行している場合を除き、徐行しなければならない。"],"answer":0,"notes":["誤り。車両等は、踏切を通過しようとするときは、踏切の直前で停止し、かつ、安全であることを確認した後でなければ進行してはならないが、信号機の表示する信号に従うときは、踏切の直前で停止しないで進行することができる（道路交通法第33条第1項）。なお、遮断機が閉じようとし、若しくは閉じている間又は警報機が警報している間は、踏切に入ってはならない（同条第2項）。","正しい。道路交通法第42条第2号のとおりである。","正しい。道路交通法第43条前段のとおりである。","正しい。道路交通法第9条のとおりである。歩行者用道路を通行できるのは、警察署長の許可を受け、又は禁止の対象から除外されている車両である。","正しい。道路交通法第42条第1号のとおりである。"],"ref":["道路交通法第9条","道路交通法第33条","道路交通法第42条","道路交通法第43条"],"src":[]},
{"id":"S2-058","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法に定める交通事故の場合の措置に関する次の記述のうち、正しいものはどれか。","choices":["交通事故の警察官への報告は、人の死傷があった場合に限り必要であり、物の損壊だけの事故では報告を要しない。","交通事故の現場にある警察官が運転者等に対してすることができる指示は、負傷者の救護に関するものに限られる。","緊急自動車の運転者は、緊急の業務のため引き続き運転する必要があるときでも、交通事故を起こした以上、他の乗務員に任せることなく、自ら運転を停止して負傷者を救護しなければならない。","報告を受けた最寄りの警察署の警察官は、負傷者の救護等のため必要があると認めるときは、報告をした運転者に、警察官が現場に到着するまで現場を去らないよう命ずることができる。","警察官が現場にいないときは、交通事故を起こした運転者は、その日のうちに最寄りの警察署に出向いて報告すれば足りる。"],"answer":3,"notes":["誤り。道路交通法の「交通事故」は、車両等の交通による人の死傷若しくは物の損壊をいい（道路交通法第67条第2項）、物の損壊だけの事故も報告の対象である。運転者は、交通事故が発生した日時及び場所、死傷者の数及び負傷者の負傷の程度、損壊した物及びその損壊の程度、当該車両等の積載物並びに講じた措置を報告しなければならない（同法第72条第1項後段）。","誤り。現場にある警察官は、当該車両等の運転者等に対し、負傷者を救護し、又は道路における危険を防止し、その他交通の安全と円滑を図るため必要な指示をすることができる（道路交通法第72条第3項）。","誤り。緊急自動車若しくは傷病者を運搬中の車両又は乗合自動車等で当該業務に従事中のものの運転者は、当該業務のため引き続き当該車両等を運転する必要があるときは、その他の乗務員に負傷者の救護等の措置を講じさせ、又は報告をさせて、運転を継続することができる（道路交通法第72条第4項）。","正しい。道路交通法第72条第2項のとおりである。","誤り。運転者は、警察官が現場にいるときは当該警察官に、警察官が現場にいないときは直ちに最寄りの警察署（派出所又は駐在所を含む。）の警察官に報告しなければならない（道路交通法第72条第1項後段）。"],"ref":["道路交通法第67条第2項","道路交通法第72条"],"src":[]},
{"id":"S2-059","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法に定める道路の使用の許可に関する次の記述のうち、誤っているものはどれか。","choices":["申請に係る行為が許可に付された条件に従って行われることにより交通の妨害となるおそれがなくなると認められるときは、所轄警察署長は、許可をしなければならない。","所轄警察署長は、許可を受けた者が許可に付された条件に違反したときでも、許可を取り消すことはできず、許可の効力を停止することができるにとどまる。","所轄警察署長は、道路における危険を防止し、その他交通の安全と円滑を図るため特別の必要が生じたときは、許可に付した条件を変更し、又は新たに条件を付することができる。","許可に係る行為が道路法の道路占用許可の規定の適用を受けるものであるときは、所轄警察署長は、許可をしようとする場合、あらかじめ当該道路の管理者に協議しなければならない。","許可に係る場所が同一の公安委員会の管理に属する二以上の警察署長の管轄にわたるときは、そのいずれかの所轄警察署長の許可を受ければよい。"],"answer":1,"notes":["正しい。道路交通法第77条第2項第2号のとおりである。申請に係る行為が現に交通の妨害となるおそれがないと認められるとき、及び現に交通の妨害となるおそれはあるが公益上又は社会の慣習上やむを得ないものであると認められるときも、許可をしなければならない（同項第1号・第3号）。","誤り。所轄警察署長は、許可を受けた者が付された条件に違反したとき、又は道路における危険を防止し、その他交通の安全と円滑を図るため特別の必要が生じたときは、その許可を取り消し、又はその許可の効力を停止することができる（道路交通法第77条第5項）。条件違反を理由とする処分をしようとするときは、緊急やむを得ないときを除き、あらかじめ弁明及び有利な証拠の提出の機会を与えなければならない（同条第6項）。","正しい。道路交通法第77条第4項のとおりである。","正しい。道路交通法第79条のとおりである。","正しい。道路交通法第77条第1項のとおりである。"],"ref":["道路交通法第77条","道路交通法第79条"],"src":[]},
{"id":"S2-060","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法に定める道路における禁止行為等に関する次の記述のうち、正しいものはどれか。","choices":["道路において進行中の自動車に外からつかまることは、その自動車の運転者の承諾があれば禁止されていない。","道路において、交通の妨害となるような方法で寝そべり、すわり、しゃがみ、又は立ちどまっていることは、酒に酔っている場合に限り禁止されている。","警察官は、道路に設置された工作物等が著しく交通の危険を生じさせるおそれがあり、急を要すると認めるときでも、警察署長の命令がなければ、その除去などの応急の措置をとることはできない。","道路において進行中の車両等から物件を投げることは、その物件が人や車両等を損傷するおそれのある物である場合に限り禁止されている。","車両等の運転者は、積載している物が道路に転落し、又は飛散したときは、速やかにその物を除去する等、道路における危険を防止するため必要な措置を講じなければならない。"],"answer":4,"notes":["誤り。何人も、道路において進行中の自動車、トロリーバス又は路面電車に飛び乗り、若しくはこれらから飛び降り、又はこれらに外からつかまってはならない（道路交通法第76条第4項第6号）。運転者の承諾による例外はない。","誤り。道路において、交通の妨害となるような方法で寝そべり、すわり、しゃがみ、又は立ちどまっていることは、酒に酔っているかどうかにかかわらず禁止されている（道路交通法第76条第4項第2号）。酒に酔って交通の妨害となるような程度にふらつくことは、別に禁止されている（同項第1号）。","誤り。警察官は、道路又は沿道の土地に設置されている工作物等又は転落積載物等が著しく道路における交通の危険を生じさせ、又は交通の妨害となるおそれがあり、かつ、急を要すると認めるときは、必要な限度において、その除去、移転その他応急の措置をとることができる（道路交通法第83条第1項）。","誤り。石、ガラスびん、金属片その他道路上の人若しくは車両等を損傷するおそれのある物件を投げ、又は発射することが禁止される（道路交通法第76条第4項第4号）ほか、道路において進行中の車両等から物件を投げることは、物件の種類を問わず禁止されている（同項第5号）。","正しい。道路交通法第71条第4号の2のとおりである。工事車両の積荷が道路に落ちたときも、運転者はこれを除去する等の措置を講じなければならない。"],"ref":["道路交通法第71条第4号の2","道路交通法第76条第4項","道路交通法第83条第1項"],"src":[]},
{"id":"S2-061","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法令に定める自転車及び特定小型原動機付自転車の通行等に関する次の記述のうち、誤っているものはどれか。","choices":["普通自転車が歩道を通行するときは、歩道の中央から建物寄りの部分を徐行しなければならない。","普通自転車は、道路標識等により普通自転車が歩道を通行することができることとされているときは、歩道を通行することができる。","普通自転車の運転者が70歳以上の者であるときは、道路標識等による指定がなくても、歩道を通行することができる。","16歳未満の者は、特定小型原動機付自転車を運転してはならない。","自転車の運転者は、乗車用ヘルメットをかぶるよう努めなければならない。"],"answer":0,"notes":["誤り。普通自転車が歩道を通行する場合は、歩道の中央から車道寄りの部分（普通自転車通行指定部分があるときは、当該部分）を徐行しなければならず、普通自転車の進行が歩行者の通行を妨げることとなるときは、一時停止しなければならない（道路交通法第63条の4第2項）。","正しい。道路交通法第63条の4第1項第1号のとおりである。ただし、警察官等が歩行者の安全を確保するため必要があると認めて当該歩道を通行してはならない旨を指示したときは、この限りでない（同項ただし書）。","正しい。普通自転車の運転者が、児童、幼児、70歳以上の者又は内閣府令で定める身体の障害を有する者であるときは、歩道を通行することができる（道路交通法第63条の4第1項第2号、同法施行令第26条）。","正しい。道路交通法第64条の2第1項のとおりである。16歳未満の者に特定小型原動機付自転車を提供することも禁止されている（同条第2項）。","正しい。道路交通法第63条の11第1項のとおりである。特定小型原動機付自転車の運転者も、乗車用ヘルメットをかぶるよう努めなければならない（同法第71条の4第3項）。"],"ref":["道路交通法第63条の4","道路交通法第63条の11","道路交通法第64条の2","道路交通法第71条の4第3項","道路交通法施行令第26条"],"src":[]},
{"id":"S2-062","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法に定める警察官等の権限等に関する次の記述のうち、正しいものはどれか。","choices":["道路標識等により通行が禁止されている道路を車両が通行することについての許可は、現場の警察官が口頭で与え、許可証は交付されない。","警察官は、政令で定める行列の指揮者に対し、区間を定めて、当該行列が道路又は車道の右側端に寄って通行すべきことを命ずることができる。","警察官は、車両等の通行の禁止などの措置だけでは現場の交通の混雑を緩和できないと認めるときは、その現場にある関係者に対し必要な指示をすることができる。","警察官は、内閣府令で定める基準に適合する制動装置を備えていないため交通の危険を生じさせるおそれがあると認められる自転車が運転されていても、これを停止させて制動装置を検査することはできない。","交通巡視員は、警察官のうちから、政令で定める要件を備える者を警察本部長が命ずる。"],"answer":2,"notes":["誤り。車両は、警察署長が政令で定めるやむを得ない理由があると認めて許可をしたときは、道路標識等によりその通行を禁止されている道路又はその部分を通行することができる（道路交通法第8条第2項）。警察署長は、この許可をしたときは許可証を交付しなければならず（同条第3項）、許可証の交付を受けた車両の運転者は、当該許可に係る通行中、許可証を携帯していなければならない（同条第4項）。","誤り。警察官は、行列の指揮者に対し、区間を定めて当該行列が道路又は車道の左側端に寄って通行すべきことを命ずることができる（道路交通法第11条第3項）。政令で定める行列（銃砲（拳銃を除く。）を携帯した100人以上の自衛隊の行列、旗、のぼり等を携帯し、かつ、これらによって気勢を張る100人以上の行列など）は、歩道等と車道の区別のある道路においては、車道をその右側端に寄って通行しなければならないのが原則である（同条第1項、同法施行令第7条）。","正しい。道路交通法第6条第3項のとおりである。同条第2項は、車両等の通行が著しく停滞したことにより交通が著しく混雑するおそれがある場合に、警察官が、その現場に進行してくる車両等の通行を禁止し、又は制限することなどができるとしている。","誤り。警察官は、内閣府令で定める基準に適合する制動装置を備えていないため交通の危険を生じさせるおそれがあると認められる自転車が運転されているときは、当該自転車を停止させ、及び当該自転車の制動装置について検査をすることができる（道路交通法第63条の10第1項）。この場合、運転者に応急の措置を命じ、応急の措置では必要な整備ができない自転車については運転を継続してはならない旨を命ずることができる（同条第2項）。","誤り。交通巡視員は、警察法第55条第1項に規定する職員（警察官を除く。）で政令で定める要件を備えるもののうちから、警察本部長が命ずる（道路交通法第114条の4第3項）。交通巡視員は、歩行者又は自転車の通行の安全の確保、停車又は駐車の規制の励行等に関する事務を行い（同条第1項）、警察官とともに「警察官等」として手信号等による交通整理を行うことができる（同法第6条第1項）。"],"ref":["道路交通法第6条","道路交通法第8条","道路交通法第11条","道路交通法第63条の10","道路交通法第114条の4","道路交通法施行令第7条"],"src":[]},
{"id":"S2-063","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法に定める車両等の運転者の遵守事項に関する次の記述のうち、誤っているものはどれか。","choices":["ぬかるみ又は水たまりを通行するときは、泥よけ器を付け、又は徐行する等して、泥土、汚水等を飛散させて他人に迷惑を及ぼすことがないようにしなければならない。","安全を確認しないで、ドアを開き、又は車両等から降りないようにしなければならない。","自転車を運転する場合も、停止しているときを除き、原則として、携帯電話を手で保持して通話のために使用してはならない。","児童、幼児等の乗降のため停車している通学通園バスの側方を通過するときは、一時停止して安全を確認しなければならない。","道路の左側部分に設けられた安全地帯の側方を通過する場合において、安全地帯に歩行者がいるときは、徐行しなければならない。"],"answer":3,"notes":["正しい。道路交通法第71条第1号のとおりである。","正しい。道路交通法第71条第4号の3のとおりである。乗車している他の者がこれらの行為により交通の危険を生じさせないようにするため必要な措置も講じなければならない（同号）。","正しい。自動車、原動機付自転車又は自転車を運転する場合においては、停止しているときを除き、手で保持しなければ送受信できない携帯電話等を通話（傷病者の救護等のため緊急やむを得ず行うものを除く。）のために使用し、又は画像表示用装置に表示された画像を注視してはならない（道路交通法第71条第5号の5）。自転車は、令和6年11月1日施行の改正で罰則の対象となった。","誤り。児童、幼児等の乗降のため政令で定めるところにより停車している通学通園バスの側方を通過するときは、徐行して安全を確認しなければならない（道路交通法第71条第2号の3）。","正しい。道路交通法第71条第3号のとおりである。"],"ref":["道路交通法第71条"],"src":["https://www.city.sendai.jp/jitensha/kotuanzen-doukouhou-kaisei.html"]},
{"id":"S2-064","cat":"senmon","sub":"道路交通法","kubun":"2","stem":"道路交通法に定める追越しに関する次の記述のうち、正しいものはどれか。","choices":["追越しをしようとする車両は、前車の前方の交通に注意すれば足り、反対の方向や後方からの交通に注意する必要はない。","車両は、他の車両を追い越そうとする場合において、前車が右折するため道路の中央に寄って通行しているときは、その左側を通行しなければならない。","車両は、交差点、踏切、横断歩道又は自転車横断帯及びこれらの手前の側端から前に50メートル以内の部分では、他の車両を追い越すため進路を変更してはならない。","後車は、前車が他の自動車を追い越そうとしているときでも、安全を確認すれば追越しを始めることができる。","トンネルの中では、車両通行帯が設けられているかどうかにかかわらず、他の車両を追い越すため進路を変更してはならない。"],"answer":1,"notes":["誤り。追越しをしようとする車両は、反対の方向又は後方からの交通及び前車の前方の交通にも十分に注意し、かつ、前車の速度及び進路並びに道路の状況に応じて、できる限り安全な速度と方法で進行しなければならない（道路交通法第28条第4項）。","正しい。道路交通法第28条第2項のとおりである。車両は、他の車両を追い越そうとするときは、前車の右側を通行するのが原則であるが（同条第1項）、前車が道路外に出るため又は交差点で右折するため道路の中央（一方通行の道路では右側端）に寄って通行しているときは、その左側を通行しなければならない。","誤り。追越しのための進路変更等が禁止されるのは、交差点（優先道路を通行している場合の当該優先道路にある交差点を除く。）、踏切、横断歩道又は自転車横断帯及びこれらの手前の側端から前に30メートル以内の部分である（道路交通法第30条第3号）。道路標識等により追越しが禁止されている部分や、道路の曲がり角付近、上り坂の頂上付近又は勾配の急な下り坂なども同様である（同条）。","誤り。後車は、前車が他の自動車又はトロリーバスを追い越そうとしているときは、追越しを始めてはならない（道路交通法第29条）。","誤り。追越しのための進路変更等が禁止されるトンネルは、車両通行帯の設けられた道路以外の道路の部分に限られる（道路交通法第30条第2号）。"],"ref":["道路交通法第28条","道路交通法第29条","道路交通法第30条"],"src":[]},
{"id":"S2-065","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"雑踏警備の計画を立てるために行う事前の実地調査（実地踏査）に関する次の記述のうち、適当なものはどれか。","choices":["実地調査は、警備員の配置場所を決めた後に、その配置場所の周辺だけを確認すれば足りる。","人出は開催される曜日や時間帯によって大きく異なるので、過去の開催時の人出は、曜日や時間帯と併せて確認する。","会場の状況は主催者が作成した会場図面で分かるので、実地調査は現地に行かずに図面の上で行えば足りる。","降雨などの気象条件が参集者に与える影響は当日にならないと分からないので、実地調査では検討の対象としない。","警備本部は、無線の交信や指揮を落ち着いて行えるよう、会場全体を見渡せない、離れた静かな場所に設けるのがよい。"],"answer":1,"notes":["誤り。実地調査は、会場及びその周辺の地形・地物、交通機関、交通量、道路の幅員、照明、施設の構造や収容能力、非常口、退避路などを綿密に調べて危険箇所を把握し、その結果を警備員の配置箇所や人数の選定に反映させるために行う（例：栃木県警察雑踏警備実施要領 第5の2(3)）。配置場所の周辺だけでは足りない。","正しい。毎年定例の行事であっても現場周辺の環境はその都度変化することを前提に実地調査を行い、特に、開催される曜日や時間帯によって人出が大きく異なることに留意するとされている（例：高知県警察「適切な雑踏警備の実施について」第3の5(1)）。","誤り。実地調査は、会場及びその周辺を綿密に調べ、事件・事故等の原因となる事象の発見と危険の除去に努めるものである（例：栃木県警察雑踏警備実施要領 第5の2(3)）。図面だけでは、段差や照明の状況、人の流れのボトルネックとなる箇所などは分からないので、現地で確かめる。","誤り。降雨等の気象条件が参集者に与える影響と予想される事案の検討は、実地調査の着眼点の一つとされている（例：栃木県警察雑踏警備実施要領 第5の2(3)ウ、高知県警察「適切な雑踏警備の実施について」第3の5(3)ア）。","誤り。警備本部は、会場全体が把握でき、主催者や関係機関の詰所等と容易に連絡が取れる場所を選定するとされている（例：栃木県警察雑踏警備実施要領 第5の2(3)オ）。"],"ref":["警備業法施行規則第38条第3項の表（法第2条第1項第2号の警備業務）ハ","栃木県警察雑踏警備実施要領 第5の2","高知県警察「適切な雑踏警備の実施について」（令和6年4月1日）第3の5"],"src":["https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf","https://www.police.pref.kochi.lg.jp/docs/2023121400069/file_contents/20250129_bini_83.pdf"]},
{"id":"S2-066","cat":"senmon","sub":"雑踏警備","kubun":"2","stem":"雑踏警備における会場の収容力と参集者の動線に関する次の記述のうち、適当なものはどれか。","choices":["会場が安全に収容できる人数を超えそうなときでも、入場を待つ参集者の不満を避けるため、入場規制はせずに通路にも観覧者を入れる。","参集者の総数が会場の収容能力の範囲内であれば、会場内の一部に人が集中していても、雑踏事故のおそれはない。","出入口の数は、配置する警備員を少なくするため、参集者の数にかかわらず、できるだけ一か所にまとめる。","観覧場所以外に花火などがよく見える場所があると、立ち止まる参集者で人の流れが滞るので、目隠しの措置などを検討する。","会場内の通路に観覧者が座り込んでいても、人が一人通れるすき間があれば、そのままにしておいてよい。"],"answer":3,"notes":["誤り。主催者には、会場規模に応じた適正な収容人員を厳守させ、参集者の円滑な通行と滞留防止のための通路等の幅員を確保させるとされている（例：栃木県警察雑踏警備実施要領 第5の3(8)ウ・エ）。安全に収容できる人数を超えそうなときは、入場規制や迂回路への誘導などにより群衆密度の上昇を抑える。","誤り。群衆密度と雑踏事故が発生する危険性との間には正の相関関係があるとされ（例：高知県警察「適切な雑踏警備の実施について」第4の3(3)）、総数が収容能力の範囲内でも、出入口、階段、ボトルネック部など一部に人が集中すれば事故のおそれがある。場所ごとの群衆密度を把握する。","誤り。入場・退場時には多数の参集者が出入口や通路に殺到して滞留が生じやすい（例：栃木県警察雑踏警備実施要領 第6の3(2)ウ）。出入口は参集者の数に応じて確保する。環境省「夏季のイベントにおける熱中症対策ガイドライン2020」でも、ゲートの数を増やすことが対策の例として示されている。","正しい。観覧場所として指定した場所以外にも花火がよく見える場所があると、参集者が立ち止まって人の流れが滞るおそれがあるので、背の高いパネルや幕等による目隠しの措置を講じる例が示されている（例：高知県警察「適切な雑踏警備の実施について」第3の6(1)ウ）。","誤り。通路等の幅員は、参集者の円滑な通行と滞留防止のために確保させるものである（例：栃木県警察雑踏警備実施要領 第5の3(8)ウ）。通路への座り込みは通行の妨げとなり、混雑時や避難時の危険も大きいので、移動を求める。"],"ref":["警備業法施行規則第38条第3項の表（法第2条第1項第2号の警備業務）ハ","栃木県警察雑踏警備実施要領 第5の3(8)・第6の3(2)","高知県警察「適切な雑踏警備の実施について」（令和6年4月1日）第3の6・第4の3"],"src":["https://www.pref.tochigi.lg.jp/keisatu/n15/jourei/documents/14.pdf","https://www.police.pref.kochi.lg.jp/docs/2023121400069/file_contents/20250129_bini_83.pdf","https://www.wbgt.env.go.jp/heatillness_gline.php"]},
